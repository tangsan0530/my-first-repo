name: Build law study Android and web
on:
  push:
    branches: [main]
    paths: ['law-study/**', '.github/workflows/law-study.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build bundled APK
        working-directory: law-study/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Check packaged resources and APK signature
        run: |
          test -s law-study/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l law-study/android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/bank.json'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs law-study/android/app/build/outputs/apk/debug/app-debug.apk
          cp law-study/android/app/build/outputs/apk/debug/app-debug.apk FakaoTongxing-Beta.apk
          sha256sum FakaoTongxing-Beta.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FakaoTongxing-Android-Beta
          path: |
            FakaoTongxing-Beta.apk
            SHA256SUMS.txt
          retention-days: 30
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: law-study/web
      - name: Publish web
        id: deployment
        uses: actions/deploy-pages@v4
