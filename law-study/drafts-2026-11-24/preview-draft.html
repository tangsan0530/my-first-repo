<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法考同行 · 内容草稿</title><style>body{font:16px/1.75 system-ui,sans-serif;color:#19323a;background:#f3f7f6;margin:0}header{background:#163238;color:#cff18e;padding:18px}main{max-width:900px;margin:auto;padding:20px 16px 80px}.card{background:white;border:1px solid #dce8e5;border-radius:16px;padding:20px;margin:16px 0}button{font:inherit;padding:10px;border-radius:10px;border:1px solid #c9d8d3;background:#1c6d58;color:white;cursor:pointer;margin:3px}button.alt,button.opt{background:#eef5f2;color:#1b5546}button.selected{border:2px solid #1c6d58;background:#d8f2e2}.notice{background:#fff2d9;padding:14px;border-radius:12px}.small{font-size:14px;color:#667}.opts{display:grid;gap:8px}.opt{text-align:left}.text{white-space:pre-wrap;line-height:1.9}a{color:#1c6d58;overflow-wrap:anywhere}li{margin-bottom:8px}</style><header><strong>法考同行 · 内容草稿预览</strong></header><main id="app"></main><script>const DATA={"subjects":[{"id":9,"title":"民法","chapters":[{"id":"CIV-01","title":"民法的适用顺序与请求权分析","objectives":["理解民法的适用顺序与请求权分析的制度功能","能够识别成立条件、例外及请求权后果","能按事实适用规则并排除干扰选项"],"sections":[{"title":"制度功能与问题定位","body":"民法调整平等主体之间的人身关系和财产关系。行政机关采购办公设备时可以作为民事主体，行政机关作出处罚时则不是平等主体关系。不能只看一方身份，也不能把所有涉及财产的争议都归入合同。分析题应先确定权利人希望取得什么结果，再寻找支持该结果的请求权规范。"},{"title":"规则与构成要件","body":"基本原则包括平等、自愿、公平、诚信、守法与公序良俗、绿色原则。具体规则能够解决争议时先适用具体规则，不能用抽象公平直接推翻明确的风险分配。没有法律规定时可以适用习惯，但习惯不得违背公序良俗。特别法有特别规定的优先适用。"},{"title":"例外与适用边界","body":"同一事实可能同时满足违约与侵权条件，例如客运经营者违约导致乘客受伤。此时应识别请求权竞合并依法选择责任路径，而不是对同一损失重复受偿。合同无效也不意味着所有请求都消失，还可能发生返还、折价补偿和过错赔偿。"},{"title":"易混制度对比","body":"把法律关系拆为主体、客体、内容、发生原因和变动事实。区分权利成立、权利受侵害、权利能否行使及责任范围四个层次。特别注意物权请求权不当然等于侵权损害赔偿请求权，前者通常不以对方过错为要件。"}],"pitfalls":["把身份不平等误认为任何交易都不平等","直接援引公平原则跳过具体法条","将法律关系客体与合同标的物混为同一概念"],"caseStudy":{"facts":"区教育局向家具公司购买办公桌，逾期不支付价款，并称自己是行政机关，家具公司只能申请行政复议。","analysis":"采购合同中双方地位平等，家具公司原则上可依买卖合同主张价款。教育局在其他场合作出行政决定不改变本案法律关系性质。答题应先定性，再审查合同效力、履行、抗辩和责任。"},"method":"按“事实定性—请求权基础—构成要件—抗辩—法律后果”书写。","sourceRefs":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第2至11、186条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":[]},{"id":"CIV-02","title":"自然人的权利能力与行为能力","objectives":["理解自然人的权利能力与行为能力的制度功能","能够识别成立条件、例外及请求权后果","能按事实适用规则并排除干扰选项"],"sections":[{"title":"制度功能与问题定位","body":"权利能力回答能否享有权利承担义务，始于出生、终于死亡；行为能力回答能否独立以意思表示发生民事法律效果。胎儿利益保护是特定事项中的特别拟制，不能据此认为胎儿可以亲自订立合同。出生、死亡时间先看法定证明，其他证据足以推翻时依证据认定。"},{"title":"规则与构成要件","body":"成年人通常具有完全行为能力；十六周岁以上未成年人以自己的劳动收入为主要生活来源，也视为完全行为能力人。八周岁以上未成年人通常为限制行为能力人，不满八周岁为无行为能力人。成年人不能辨认行为的无行为能力，不能完全辨认行为的限制行为能力。"},{"title":"例外与适用边界","body":"限制行为能力人可以独立实施纯获利益或与年龄、智力、精神健康状况相适应的行为。其他行为原则上须法定代理人同意或追认。不能把“家长不同意”作为否定一切未成年人行为的理由。无行为能力人实施的民事法律行为原则上无效，法定代理制度另行解决其生活交易需求。"},{"title":"易混制度对比","body":"赠与是否纯获利益，应看是否附带法律上的义务或负担，而不是只看经济价格是否便宜。限制行为能力人的成年人标准应结合其精神健康状况。不能以“自己签了字”反推具有完全行为能力。"}],"pitfalls":["把权利能力与行为能力混同","误把胎儿拟制扩大至所有民事活动","仅以交易金额单因素判断年龄智力适应性"],"caseStudy":{"facts":"十五岁学生无附加负担地接受外祖父赠送的奖学金，同时独自购买明显超出其生活水平的高价收藏品。","analysis":"接受奖学金属于纯获利益，可以独立有效实施。高价收藏品购买应另行审查年龄智力适应性，不能因为同一天接受赠与有效就认定购买也有效；依法需要追认而未追认的，不发生相应效力。"},"method":"先定年龄与辨认能力，再判断行为类型和代理同意。","sourceRefs":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第13至24、144、145条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":["CIV-0001","CIV-0002","CIV-0003","CIV-0004","CIV-0005","CIV-0006"]},{"id":"CIV-03","title":"监护、失踪与死亡宣告","objectives":["理解监护、失踪与死亡宣告的制度功能","能够识别成立条件、例外及请求权后果","能按事实适用规则并排除干扰选项"],"sections":[{"title":"制度功能与问题定位","body":"监护是保护无民事行为能力人和限制行为能力人人身、财产等合法权益的制度。监护人应按最有利于被监护人的原则履职，尊重其真实意愿，不得为了自己的利益处分被监护人财产。父母仍有抚养义务，不能用委托他人照看当然免除监护责任。"},{"title":"规则与构成要件","body":"未成年人监护通常由父母承担；父母死亡或没有监护能力时按法定范围确定其他监护人。监护争议可以依法指定，必要时设置临时监护。成年人可以在具有完全行为能力时书面确定未来监护人，待丧失或部分丧失行为能力时发挥作用。"},{"title":"例外与适用边界","body":"自然人下落不明满二年，可以依法申请宣告失踪；通常下落不明满四年，或因意外事件下落不明满二年，可以依法申请宣告死亡。有关机关证明因意外事件不可能生存的，申请宣告死亡不受二年限制。两类制度的功能不同，不能把失踪宣告作为死亡宣告的必经程序。"},{"title":"易混制度对比","body":"失踪人的财产由财产代管人依法管理，失踪宣告不消灭其主体资格。死亡宣告涉及婚姻、继承等效果，但本人实际存活实施的行为并不因死亡宣告当然无效。死亡宣告被撤销后的婚姻恢复、财产返还应分别适用特别规则，不能机械认为一切回到原状。"}],"pitfalls":["宣告失踪不等于宣告死亡","误认为代管人取得财产所有权","忽略意定监护的书面与生效条件"],"caseStudy":{"facts":"甲长期失联，妻申请宣告失踪后由乙代管甲的财产。乙将甲的房屋赠与自己的孩子，声称失踪人已经没有民事权利。","analysis":"失踪人没有因宣告失踪丧失权利能力。财产代管的目的在于维护失踪人财产，不使代管人成为所有权人。乙为自己家庭无偿处分代管财产缺乏正当依据，应结合处分效力及损害结果承担相应责任。"},"method":"按监护关系、申请条件、法律效果、撤销后的恢复四个层次分析。","sourceRefs":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第26至56条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":["CIV-0007","CIV-0008","CIV-0009","CIV-0010","CIV-0011"]},{"id":"CIV-04","title":"法人、非法人组织与职务行为","objectives":["理解法人、非法人组织与职务行为的制度功能","能够识别成立条件、例外及请求权后果","能按事实适用规则并排除干扰选项"],"sections":[{"title":"制度功能与问题定位","body":"法人依法独立享有民事权利和承担民事义务，以其全部财产独立承担民事责任。法人的分支机构不具有法人资格，但可以自己的名义从事民事活动，其民事责任依法由法人承担。非法人组织不能取得法人地位，但法律允许其以自己的名义从事民事活动。"},{"title":"规则与构成要件","body":"法定代表人以法人名义从事民事活动，法律后果由法人承受；法人章程或者法人权力机构对法定代表人代表权的限制，不得对抗善意相对人。执行法人工作任务的人员就职权范围内事项以法人名义实施行为，适用职务行为规则，不能简单按个人交易处理。"},{"title":"例外与适用边界","body":"代表与代理的权限来源不同。特别法对公司担保、关联担保、决议权限等有专门要求时，必须结合特别规则，不能用一般代表规则一句话覆盖。营利法人的出资人滥用法人独立地位和有限责任，严重损害债权人利益的，可能承担法定连带责任。"},{"title":"易混制度对比","body":"法人解散不当然等于法人终止。依法需要清算的，应先清算，再办理注销等手续。清算期间法人存续，但不得从事与清算无关的活动。区分撤销设立登记、营业执照吊销与法人资格终止，不能把行政处罚直接当成主体消灭。"}],"pitfalls":["把分支机构等同独立法人","误以为吊销执照立即终止主体资格","忽略特别法对代表行为效力的限制"],"caseStudy":{"facts":"某公司的销售负责人在日常职权范围内以公司名义签订设备销售合同，公司后以负责人不是法定代表人为由拒绝履行。","analysis":"应审查该销售负责人是否执行公司工作任务、是否在职权范围内及相对人是否善意，不能仅因其并非法定代表人就否定公司责任。若职务行为规则成立，合同后果归公司。"},"method":"先确认组织地位，再分别审查代表、职务代理与清算。","sourceRefs":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第57至108、170条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":["CIV-0012","CIV-0013"]},{"id":"CIV-05","title":"意思表示与民事法律行为效力","objectives":["理解意思表示与民事法律行为效力的制度功能","能够识别成立条件、例外及请求权后果","能按事实适用规则并排除干扰选项"],"sections":[{"title":"制度功能与问题定位","body":"民事法律行为以意思表示为核心，但成立与生效不是同一判断。先确定表示何时生效、内容是什么，再判断行为人能力、意思真实性、强制性规定及公序良俗等效力要件。不能从合同有签字、有盖章直接推出合同有效。"},{"title":"规则与构成要件","body":"对有相对人的意思表示，通常按到达规则确定生效；对话方式通常在相对人知道其内容时生效。意思表示可以明示也可以默示，但沉默只有在法律规定、当事人约定或者交易习惯允许时才可视为表示。解释表示应结合文字、行为性质、目的、习惯及诚信原则。"},{"title":"例外与适用边界","body":"通谋虚假表示无效，隐藏行为的效力按有关法律规定处理。重大误解、欺诈、胁迫、显失公平等通常引起撤销权问题，不能统称无效。第三人欺诈与相对人欺诈条件不完全相同。违反强制性规定的行为也不能忽视该规定是否导致行为无效的具体判断。"},{"title":"易混制度对比","body":"无效、被撤销和确定不发生效力的行为，涉及返还财产、不能返还或没有必要返还时的折价补偿，以及过错损失分担。部分无效不影响其他部分效力的，其他部分仍然有效。争议解决条款具有独立判断空间，合同无效不当然使其无效。"}],"pitfalls":["混淆无效与可撤销","把沉默一概视为承诺","认为隐藏行为必然与虚假表示同效力"],"caseStudy":{"facts":"甲乙签订表面上的低价买卖合同以掩盖赠与，之后甲以买卖合同无效为由要求法院认定赠与也当然无效。","analysis":"应分两层判断：双方通谋的虚假买卖表示无效；隐藏的赠与应根据能力、意思、公序良俗等规则独立审查。外表行为无效不能直接推出隐藏行为无效。"},"method":"先解释表示，再分成立、生效、可撤销与效力后果。","sourceRefs":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第133至160条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":["CIV-0014","CIV-0015","CIV-0016","CIV-0017","CIV-0018","CIV-0029"]},{"id":"CIV-06","title":"代理与无权代理","objectives":["理解代理与无权代理的制度功能","能够识别成立条件、例外及请求权后果","能按事实适用规则并排除干扰选项"],"sections":[{"title":"制度功能与问题定位","body":"代理人以被代理人名义，在权限内实施民事法律行为，后果直接归被代理人。应由本人亲自实施的行为不得代理。区分委托合同这一内部关系与代理权这一对外权限，内部合同有效不等于对外任何行为都在代理权限之内。"},{"title":"规则与构成要件","body":"代理权可以来自委托、法定规定等。代理人原则上不得以被代理人名义与自己实施行为，也不得同时代理双方，但经法定同意或者追认的例外应审查。代理人需要转委托时，应取得被代理人同意或追认，紧急情形为维护被代理人利益的规则另论。"},{"title":"例外与适用边界","body":"无权代理包括没有代理权、超越权限、代理权终止后继续代理。未经被代理人追认，原则上对被代理人不发生效力。相对人可以依法催告，善意相对人在追认前还可能享有撤销权。不能把无权代理合同直接归为绝对无效。"},{"title":"易混制度对比","body":"表见代理要求存在足以使相对人相信有代理权的外观，且相对人善意并符合合理信赖标准。仅有一张伪造公章或代理人自称有权，不当然成立表见代理。成立时后果由被代理人承受，被代理人与行为人之间再处理内部责任。"}],"pitfalls":["无权代理不等于当然无效","将代理内部限制一律对抗善意相对人","只凭公章认定表见代理"],"caseStudy":{"facts":"甲的采购代理权已被终止，但公司仍让其使用原办公室、企业邮箱与对外采购资料。乙不知且无过失，依据完整交易外观与甲订约。","analysis":"应审查公司形成的代理权外观和乙的合理注意。若足以构成表见代理，公司不能仅凭内部已终止授权对抗乙；若乙明知终止或明显怠于审查，则不能取得表见代理保护。"},"method":"依次审查名义、权限、追认、外观与善意。","sourceRefs":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第161至175条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":["CIV-0019","CIV-0020","CIV-0021","CIV-0022","CIV-0030"]},{"id":"CIV-07","title":"诉讼时效与期间计算","objectives":["理解诉讼时效与期间计算的制度功能","能够识别成立条件、例外及请求权后果","能按事实适用规则并排除干扰选项"],"sections":[{"title":"制度功能与问题定位","body":"诉讼时效主要限制特定请求权获得强制保护的可能性，不因期间届满使实体债权当然消灭。一般诉讼时效为三年，原则上自权利人知道或者应当知道权利受到损害以及义务人之日起计算；特别规定及最长保护期间应另行审查。"},{"title":"规则与构成要件","body":"先判断请求权是否适用时效。停止侵害、排除妨碍、消除危险等请求，依法登记的不动产物权和登记动产物权权利人请求返还财产等法定请求不适用时效。请求支付抚养费、赡养费、扶养费也应适用特别规定，不能一概按三年。"},{"title":"例外与适用边界","body":"中断与中止有不同后果。权利人依法提出履行请求、义务人同意履行、提起诉讼或申请仲裁等，可以导致中断并重新计算。中止发生于时效最后六个月内存在法定障碍的情形，障碍消除后依法保留剩余保护时间，并非重新计算整个三年。"},{"title":"易混制度对比","body":"人民法院不得主动适用诉讼时效规定。义务人时效届满后自愿履行的，不得请求返还；届满后同意履行的，不得再以届满为由抗辩。分期履行同一债务、法定代理关系中的请求、未成年人性侵赔偿等存在特别起算规则。"}],"pitfalls":["时效届满不是债权消灭","混淆中断重算与中止续算","忽略法院不得主动适用"],"caseStudy":{"facts":"甲借款到期后超过普通时效期间，乙未提出时效抗辩。法院认为甲可能已经丧失胜诉保护，主动以时效届满驳回甲请求。","analysis":"法院不得主动适用诉讼时效。应由依法享有抗辩权的义务人提出。甲的债权未因时效经过当然消灭，乙自愿履行也不能仅以时效经过要求返还。"},"method":"先查适用对象，再定起算，最后查中断、中止和抗辩。","sourceRefs":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第188至205条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":["CIV-0023","CIV-0024","CIV-0025","CIV-0026"]},{"id":"CIV-08","title":"物权变动与物权保护","objectives":["理解物权变动与物权保护的制度功能","能够识别成立条件、例外及请求权后果","能按事实适用规则并排除干扰选项"],"sections":[{"title":"制度功能与问题定位","body":"物权法定要求物权的种类和内容由法律规定。合同当事人可以约定债权义务，但不能任意创造一种可对抗所有人的新物权。物权的设立、变更、转让和消灭与作为原因的合同要分别判断。"},{"title":"规则与构成要件","body":"不动产物权变动原则上依法登记发生效力，法律另有规定的除外；动产物权变动通常以交付为公示。船舶、航空器、机动车等适用登记对抗规则，不能误写成所有权转移一律必须登记。简易交付、指示交付和占有改定各有适用前提。"},{"title":"例外与适用边界","body":"因人民法院、仲裁机构法律文书或人民政府征收决定等导致的物权变动，依照特别规定发生效力。继承取得及合法建造、拆除等事实行为也存在非登记生效情形。非登记取得后再处分，法律要求登记的，应依法办理。"},{"title":"易混制度对比","body":"物权保护包括确认权利、返还原物、排除妨害、消除危险、修理重作更换或恢复原状、损害赔偿等，是否需过错及是否适用时效要逐项判断。返还原物应审查原告物权、被告占有和是否具有占有本权。"}],"pitfalls":["把合同效力和物权变动绑在一起","把登记对抗误认成登记生效","任何返还请求都一概适用三年时效"],"caseStudy":{"facts":"甲已付款并取得房屋钥匙，但买卖双方尚未登记。乙随后要求确认甲已取得房屋所有权。","analysis":"在无特别例外的普通房屋买卖中，合同债权与物权转移分离。买卖合同可依法有效，付款和交钥匙不取代不动产登记。甲可以依合同主张协助办理登记，但不能仅据交付确认已完成所有权转移。"},"method":"画出合同成立、履行、交付、登记时间轴，再逐项确定权利。","sourceRefs":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第116、209至238条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":["CIV-0027","CIV-0028"]},{"id":"CIV-09","title":"共有、区分所有与相邻关系","objectives":["理解共有、区分所有与相邻关系的制度功能","能够识别成立条件、例外及请求权后果","能按事实适用规则并排除干扰选项"],"sections":[{"title":"制度功能与问题定位","body":"共有包括按份共有和共同共有。确定份额与处分权限之前，先识别共有类型以及是否存在有效约定；不能把夫妻共同共有财产机械视为双方各有一半可自由处分的份额。按份共有人的份额转让与共有物整体处分不是同一行为。"},{"title":"规则与构成要件","body":"处分共有的不动产、动产及对共有物作重大修缮、变更性质或用途，法律设定相应同意门槛，另有约定的按约定。按份共有人转让其份额时，其他共有人在同等条件下享有优先购买权，但该权利不等于否决任何转让。"},{"title":"例外与适用边界","body":"建筑物区分所有包括专有部分所有权、共有部分共有和共同管理权。业主不能以放弃共有权利为由不履行义务。共有部分产生的收入，扣除合理成本后，属于业主共有。业主共同决定事项有参与表决与同意表决的不同门槛，不可混用。"},{"title":"易混制度对比","body":"相邻关系是对不动产所有权行使的法定协调，遵循有利生产、方便生活、团结互助、公平合理原则；地役权则由合同等依法设立的用益物权。相邻排水、通行、采光通风与危险防免不能以绝对所有权为由一概拒绝。"}],"pitfalls":["份额转让与整体处分混淆","忽略共同表决两个分母","将物业管理权等同共有收益所有权"],"caseStudy":{"facts":"物业公司出租业主共有的外墙广告位，扣除合理成本后将全部广告收益留作自身利润，并称业主没有参加经营。","analysis":"共有外墙产生的收入依法扣除合理成本后属于业主共有，不能因物业具体管理经营就变为其自有收益。还应审查使用共有部分经营是否经过法定共同决定程序。"},"method":"依共有类型、处分对象、程序门槛和收益归属分层判断。","sourceRefs":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第271至322条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":[]},{"id":"CIV-10","title":"善意取得、遗失物与占有","objectives":["理解善意取得、遗失物与占有的制度功能","能够识别成立条件、例外及请求权后果","能按事实适用规则并排除干扰选项"],"sections":[{"title":"制度功能与问题定位","body":"善意取得是无权处分情形中为保护交易安全设置的法定制度。先有无权处分，再审查受让人善意、合理价格、有权利变动公示等条件。不能因为合同有效就跳过物权取得条件，也不能因转让人不是所有人就一律否定受让人的物权。"},{"title":"规则与构成要件","body":"普通动产善意取得通常要求完成交付；不动产要求依法登记。受让人的善意应在法定取得时点判断。合理价格不是最低价格或任意约定价，明显背离市场且缺乏合理说明的价格会影响善意与合理对价判断。"},{"title":"例外与适用边界","body":"遗失物不是可以无条件适用普通善意取得的物。权利人依法享有向占有人请求返还的期间；通过拍卖或向具有经营资格的经营者购得的，法律对受让人支出费用保护有特别规定。遗失物无人认领归属也须经过法定招领期间。"},{"title":"易混制度对比","body":"占有保护与所有权保护不完全相同。占有人在法定条件下可对侵夺占有、妨害占有请求救济，即使最终物权归属仍有争议。善意占有人和恶意占有人对孳息、费用及毁损灭失的责任有区别。"}],"pitfalls":["遗失物与委托占有物混淆","把不知情等同完整善意取得要件","占有保护不等于确认最终所有权"],"caseStudy":{"facts":"甲拾得乙遗失的相机后在街边转卖给不知情的丙，丙提出自己已经付款，要求直接适用普通善意取得排除乙的返还请求。","analysis":"应优先适用遗失物返还的特别规则，不可仅凭丙主观不知情和支付价款便认定乙丧失返还保护。若属于拍卖或有资格经营者交易，再依法处理费用补偿；本案街边购买不当然具备该特别条件。"},"method":"先区分委托物、遗失物等来源，再审查取得与返还特别规则。","sourceRefs":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第311至319、458至462条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":[]},{"id":"CIV-11","title":"用益物权与土地权利","objectives":["掌握用益物权与土地权利的构成要件","区分原则、例外和竞合","能以请求权结构处理原创案例"],"sections":[{"title":"制度功能与问题定位","body":"用益物权使非所有权人依法对他人的物享有占有、使用、收益权能。土地承包经营权、建设用地使用权、宅基地使用权、居住权、地役权各有不同客体和设立方式，不能把任何长期租赁都称为用益物权。"},{"title":"规则与构成要件","body":"建设用地使用权通常自登记时设立，建设用地使用权人依法对土地享有占有、使用、收益并建造建筑物等权利。住宅建设用地使用权期限届满自动续期，续期费用缴纳或者减免依法律、行政法规处理，不能由此推论其他用途土地一律自动无偿续期。"},{"title":"例外与适用边界","body":"居住权原则上依书面合同并登记设立，通常无偿，不能转让或继承；设立居住权的住宅原则上不得出租，但当事人另有约定的除外。地役权依合同设立，未经登记不得对抗善意第三人，并具有从属性，不能脱离需役地任意单独转让。"},{"title":"易混制度对比","body":"土地承包经营权与土地经营权要区分。长期流转中经营者取得的权利，并不使其取得土地所有权；地役权也不等同法定相邻关系。答题遇到农业土地，还应结合农村土地承包法等特别法审查主体、用途和流转限制。"}],"pitfalls":["住宅用地续期不等于所有建设用地无偿续期","租赁债权不能当然对抗一切第三人","居住权与房屋所有权继承混淆"],"caseStudy":{"facts":"甲为母亲在自己的住宅设立并登记居住权。母亲死亡后，甲的弟弟主张将居住权作为遗产继承。","analysis":"登记使居住权依法设立，但它具有较强人身属性，不得继承。居住权人死亡，居住权依法消灭，再办理注销登记，不按普通财产继承规则继续由继承人占有使用。"},"method":"按权利种类分别记客体、设立、公示、处分和消灭。","sourceRefs":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第323至385条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":[]},{"id":"CIV-12","title":"抵押权与动产担保竞合","objectives":["掌握抵押权与动产担保竞合的构成要件","区分原则、例外和竞合","能以请求权结构处理原创案例"],"sections":[{"title":"制度功能与问题定位","body":"抵押不转移担保财产占有，使债权人在债务人不履行到期债务或发生约定实现情形时依法就财产优先受偿。先审查主债权和担保合同效力，再审查抵押权是否设立、公示及顺位，最后判断实现方式，不能把每一层都写成合同有效性。"},{"title":"规则与构成要件","body":"不动产抵押一般须登记才设立；动产抵押通常自抵押合同生效时设立，未经登记不得对抗善意第三人。主债权消灭、担保物权实现、债权人放弃担保物权等会使担保物权消灭。禁止流押并非抵押合同当然全部无效，而是依法优先受偿而非预先约定自动归债权人所有。"},{"title":"例外与适用边界","body":"同一财产上多个抵押权，区分均已登记、登记与未登记、均未登记等情形确定顺位。同一动产上抵押、质押并存，通常按登记、交付时间先后确定。留置权与其他担保权竞合、正常经营买受人保护、价款担保超级优先等有特别规则。"},{"title":"易混制度对比","body":"正常经营活动买受人规则不意味着任何购买抵押物的人都受保护。须审查买受活动和价款支付、取得财产等法定条件；购买生产设备等超出通常交易背景的案件，还要结合担保司法解释审查。浮动抵押财产确定前后，担保客体的变化也有不同。"}],"pitfalls":["抵押合同有效不等于不动产抵押权已设立","禁止流押不等于担保合同全无效","任何购买行为不等于正常经营买受人"],"caseStudy":{"facts":"甲将生产设备抵押给银行但继续使用，后又将同一设备交付给乙设立质押。双方争议受偿顺位。","analysis":"不能因为质权转移占有就一律优先。应比较抵押登记与质物交付的时间，并审查是否存在价款担保、留置等特别优先规则。若抵押未登记而质物已交付，依法确定乙的优先顺位。"},"method":"制作主债权、担保合同、登记、交付、实现的五段时间轴。","sourceRefs":[{"title":"最高人民法院关于适用《中华人民共和国民法典》有关担保制度的解释","url":"https://www.court.gov.cn/fabu/xiangqing/282721.html","effectiveDate":"2021-01-01","article":"第386至426条；担保制度解释","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":[]},{"id":"CIV-13","title":"质权、留置与权利担保","objectives":["掌握质权、留置与权利担保的构成要件","区分原则、例外和竞合","能以请求权结构处理原创案例"],"sections":[{"title":"制度功能与问题定位","body":"动产质权以移转占有为重要公示方式。质押合同与质权设立不同：只有合同未交付质物，通常尚未设立动产质权。质权人负有妥善保管义务，不得未经出质人同意擅自使用、处分质物。"},{"title":"规则与构成要件","body":"权利质押依不同权利适用交付权利凭证或登记规则，不能统一按动产实物交付处理。依法可转让的股权、应收账款等可以作为质押客体，须核查对应的登记要求与基础权利真实性。"},{"title":"例外与适用边界","body":"留置权为法定担保物权，通常要求债权人合法占有债务人的动产、债权已届清偿期，并与占有动产属于同一法律关系；企业之间留置的同一法律关系要求有法定例外。非法取得占有不能因债权存在就形成留置权。"},{"title":"易混制度对比","body":"留置与同时履行抗辩不同，前者是物权优先受偿，后者主要是合同履行抗辩。留置权人与债务人应依法约定债务履行期限，不能未经法定步骤直接把留置物据为己有。留置权人丧失占有、接受另行提供担保等会影响权利存续。"}],"pitfalls":["质押合同成立不等于质权成立","把自助扣押等同合法留置","忽略企业留置的特别规定"],"caseStudy":{"facts":"修理厂合法占有客户送修的汽车，修理费到期客户拒付，修理厂拟依法留置。另一个债权人偷偷把客户自行车搬来，要求也行使留置。","analysis":"送修汽车与修理费在同一修理法律关系中，符合其他条件时可依法留置；偷偷搬来的自行车不满足合法占有前提。留置不是一般债权人可以自行扣押他人物品的授权。"},"method":"分别审查占有来源、债权到期、牵连关系和法定禁留范围。","sourceRefs":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第425至457条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":[]},{"id":"CIV-14","title":"合同订立、预约与缔约过失","objectives":["掌握合同订立、预约与缔约过失的构成要件","区分原则、例外和竞合","能以请求权结构处理原创案例"],"sections":[{"title":"制度功能与问题定位","body":"合同成立审查应围绕当事人、标的、数量等是否可确定，以及意思表示是否合致。合同欠缺价格、质量等内容并不必然不能成立，法律允许补充解释。承诺对价款、数量、质量、履行期限等作实质性变更，通常构成新要约。"},{"title":"规则与构成要件","body":"要约应内容具体确定并表明经承诺即受拘束；商业广告通常是要约邀请，符合要约条件的例外。承诺到达、生效规则及电子合同的成立时点应结合交易方式判断。合同书形式中，一方先履行主要义务且对方接受，可能在签章前成立。"},{"title":"例外与适用边界","body":"预约是约定未来一定期限内订立本约的合同，不是所有意向书均属于预约。能确定将来主体、标的等且存在订约义务时，认购书等可能成立预约；只有合作意向而无订约义务的，不能仅凭标题推定预约。"},{"title":"易混制度对比","body":"缔约过失保护合理的缔约信赖，不以合同最终有效成立为前提。假借订立合同恶意磋商、故意隐瞒重要事实、泄露不当使用商业秘密等，可引起责任。赔偿范围应结合信赖利益、过错和因果关系判断，不能直接等同全部履行利益。"}],"pitfalls":["合同名称不能代替实质审查","要约邀请与要约混淆","缔约过失与违约损害范围混同"],"caseStudy":{"facts":"甲向乙发出设备采购要约，乙回复同意购买但将付款方式从现款改为一年后付款。甲未再表示同意，乙主张合同已按其回复成立。","analysis":"付款方式变化通常属于实质性变更，乙的回复为新要约。应继续审查甲是否以明示或履行行为承诺，不能把回复中出现“同意”二字作为成立依据。"},"method":"按要约、承诺、形式、实际履行，再检查预约与信赖损失。","sourceRefs":[{"title":"最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释","url":"https://www.court.gov.cn/zixun/xiangqing/419382.html","effectiveDate":"2023-12-05","article":"第469至501条；合同编通则解释第3至8条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":[]},{"id":"CIV-15","title":"格式条款与合同解释","objectives":["掌握格式条款与合同解释的构成要件","区分原则、例外和竞合","能以请求权结构处理原创案例"],"sections":[{"title":"制度功能与问题定位","body":"格式条款是为重复使用而预先拟定且订约时未与对方协商的条款。是否属于格式条款要看形成过程，不取决于纸张是否印刷。格式条款提供方对免除、减轻其责任等与相对人有重大利害关系的条款，应以合理方式提示，并按要求说明。"},{"title":"规则与构成要件","body":"提供方未履行提示或说明义务，使对方没有注意或理解重大利害条款的，对方可依法主张该条款不成为合同内容。条款是否纳入合同与条款纳入后是否无效，应分开判断。不能把所有未加粗条款一律认定无效。"},{"title":"例外与适用边界","body":"提供方不合理免除或减轻自己责任、加重对方责任、限制或排除对方主要权利等，可能导致条款无效。合同中造成对方人身损害的免责条款，以及因故意或重大过失造成对方财产损失的免责条款，依法无效。"},{"title":"易混制度对比","body":"对格式条款通常含义仍有两种以上解释时，依法作不利于提供方的解释；格式条款与非格式条款不一致的，采用非格式条款。一般合同解释以词句通常含义为基础，并结合目的、习惯、诚信、磋商和履行过程；当事人真实共同理解优于孤立字面。"}],"pitfalls":["未纳入合同与条款无效混为一谈","把签字视为当然已充分说明","不利解释不得跳过通常含义与体系解释"],"caseStudy":{"facts":"健身房在小字格式合同中约定任何原因造成顾客受伤均不负责，销售人员未提示，顾客后因设施维护过失受伤。","analysis":"先审查重大利害免责条款是否履行提示说明义务；即使已被纳入，造成人身损害的免责条款也依法无效。不能因消费者签名就排除经营者依法应承担的责任。"},"method":"依格式性质、纳入、效力、解释四步分析。","sourceRefs":[{"title":"最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释","url":"https://www.court.gov.cn/zixun/xiangqing/419382.html","effectiveDate":"2023-12-05","article":"第496至498、506条；合同编通则解释第1、9、10条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":[]},{"id":"CIV-16","title":"合同履行与抗辩权","objectives":["掌握合同履行与抗辩权的构成要件","区分原则、例外和竞合","能以请求权结构处理原创案例"],"sections":[{"title":"制度功能与问题定位","body":"合同履行以约定为基础，并应遵循诚信原则，根据性质、目的、交易习惯履行通知、协助、保密等义务。质量、价款、地点、期限、方式、费用等不明时，先协议补充，再依条款和交易习惯，仍不能确定时适用法定补充规则。"},{"title":"规则与构成要件","body":"同时履行抗辩适用于互负债务且没有先后履行顺序的情形，具有对待给付关系；先履行抗辩针对有履行顺序且先履行方未履行或履行不合约定。抗辩一般使对方请求暂时不能获得支持，不当然消灭债权或解除合同。"},{"title":"例外与适用边界","body":"不安抗辩由应先履行方在有确切证据证明对方经营状况严重恶化、转移财产逃避债务等法定情形时行使，并应及时通知。仅凭道听途说不能任意停供。对方恢复履行能力或者提供适当担保的，应恢复履行；未在合理期限内处理时，再依法主张解除和责任。"},{"title":"易混制度对比","body":"第三人履行、向第三人履行和真正利益第三人合同的请求权结构不同，必须问第三人是否依法取得直接请求履行的权利。债务人委托第三人履行而第三人不履行，原则上仍由债务人向债权人承担违约责任。"}],"pitfalls":["所有双务合同都可主张同时履行抗辩","不安抗辩不需要确切证据的错误","将暂时抗辩误写为债务消灭"],"caseStudy":{"facts":"供货合同约定买方先付款。卖方尚未交货，买方仅以双方互负债务为由要求卖方必须先交货。","analysis":"有明确履行顺序时，买方不能直接主张同时履行抗辩。应先履行方只有在具备法定不安抗辩等条件时才可依法中止，不能以另一方尚未到期履行当然拒绝先履行义务。"},"method":"先识别对待关系与履行顺序，再找对应抗辩和通知义务。","sourceRefs":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第509至534条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":[]},{"id":"CIV-17","title":"债权人代位与撤销权","objectives":["掌握债权人代位与撤销权的构成要件","区分原则、例外和竞合","能以请求权结构处理原创案例"],"sections":[{"title":"制度功能与问题定位","body":"债权保全旨在避免债务人的行为或不作为危及债权实现。代位权针对债务人怠于行使相关权利，撤销权针对债务人不当处分财产等行为。两者都不是债权人直接取得债务人全部财产或经营管理权。"},{"title":"规则与构成要件","body":"债务人怠于行使其债权或者与该债权有关的从权利，影响债权人到期债权实现，符合法定条件时，债权人可依法以自己的名义代位行使；专属于债务人自身的权利不得代位。特殊保全情形还须审查未到期债权的法定保护路径。"},{"title":"例外与适用边界","body":"撤销权须区分无偿处分与不合理有偿处分。放弃债权、放弃债权担保、无偿转让财产等影响债权实现的行为，有对应法定条件；明显不合理低价转让或高价受让等，还要审查相对人知道或应当知道。不能对任何低价交易都予以撤销。"},{"title":"易混制度对比","body":"撤销权有法定行使期间，不能套用普通三年诉讼时效。撤销范围以债权人债权为限，行使必要费用依法由债务人负担。代位权成立后的清偿和执行效果依现行规则判断，避免仍沿用过时的笼统“入库”结论。"}],"pitfalls":["无偿和有偿处分的主观要件混淆","代位标的包括一切人身权的错误","撤销权除斥期间与诉讼时效混同"],"caseStudy":{"facts":"甲欠乙到期借款，甲却无偿把主要财产赠与亲友，剩余财产不足清偿。亲友以自己不知道甲欠债为由反对撤销。","analysis":"无偿处分影响债权实现时，不以受赠人知道债务人的损害债权目的为统一前提。乙应按无偿处分撤销规则举证，不能被“受赠人善意”这一有偿交易常见干扰项阻断。"},"method":"先选代位或撤销，再逐一核对到期、危害、怠于或处分、相对人状态及期间。","sourceRefs":[{"title":"最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释","url":"https://www.court.gov.cn/zixun/xiangqing/419382.html","effectiveDate":"2023-12-05","article":"第535至542条；合同编通则解释","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":[]},{"id":"CIV-18","title":"债权转让、债务转移与债务加入","objectives":["掌握债权转让、债务转移与债务加入的构成要件","区分原则、例外和竞合","能以请求权结构处理原创案例"],"sections":[{"title":"制度功能与问题定位","body":"债权转让原则上是债权人把债权移转给第三人，不当然需要债务人同意，但应审查依性质、约定或法律是否不得转让，以及约定禁止转让对第三人的效力。未通知债务人时，该转让对债务人不发生效力。"},{"title":"规则与构成要件","body":"受让人取得与债权有关的从权利，但专属于原债权人的除外；从权利未转移占有或未办理登记，不影响依法取得。债务人对原债权人的抗辩通常可向受让人主张，法定抵销条件也要独立审查。债权转让不能使债务人的负担无依据加重。"},{"title":"例外与适用边界","body":"债务转移需债权人同意。仅债务人与第三人内部约定承担债务，而债权人未同意的，不当然免除原债务人。债务加入通常是不使原债务人退出，由加入人在约定范围内与原债务人承担相应债务，具体应辨别表示内容与通知、拒绝等规则。"},{"title":"易混制度对比","body":"合同权利义务一并转让与单纯债权转让不同，原则上需要对方同意。保证人与主债权转让、债务转移的关系还有特别保护规则，不能只套用一般转让条款。应将主债务变化与担保责任变化分别作答。"}],"pitfalls":["债权转让一律须债务人同意的错误","通知被误认为转让合同成立要件","债务转移与债务加入混淆"],"caseStudy":{"facts":"甲通知债务人乙将货款债权转让给丙。乙提出自己原本对甲享有质量瑕疵抗辩，丙称换了债权人就不能再抗辩。","analysis":"债权转让原则上不应使债务人丧失原有抗辩。乙依法可以向丙主张原来对甲享有的相关抗辩，丙应受其所取得债权原有瑕疵的约束。"},"method":"先判断谁退出、谁加入，再分别审查同意、通知和抗辩延续。","sourceRefs":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第545至556条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":[]},{"id":"CIV-19","title":"合同解除、清偿、抵销与提存","objectives":["掌握合同解除、清偿、抵销与提存的构成要件","区分原则、例外和竞合","能以请求权结构处理原创案例"],"sections":[{"title":"制度功能与问题定位","body":"合同解除改变合同约束状态，但与合同无效、撤销不同。约定解除和法定解除各有依据，达到不可抗力致不能实现合同目的、履行迟延符合催告等条件、预期违约或根本违约等情形时，可依法主张法定解除。"},{"title":"规则与构成要件","body":"解除权通常通过通知行使，通知到达及附期限通知的效果应结合规则判断；直接依法起诉主张解除的，也有相应程序与生效时点规则。解除权的行使期间与普通诉讼时效不同。无解除权的一方发通知，不因对方一时沉默就当然取得解除效果。"},{"title":"例外与适用边界","body":"解除后尚未履行的终止履行；已经履行的，根据履行情况和合同性质，可以请求恢复原状或采取其他补救措施，并可依法请求赔偿损失。因违约解除时，解除与违约责任可以依法并存，不能认为选择解除便自动丧失赔偿。"},{"title":"易混制度对比","body":"清偿、抵销、提存、免除、混同等均可能使债权债务终止，但条件不同。法定抵销通常要求双方互负到期且标的种类品质相同的债务，并受债务性质、约定、法律限制。不得以侵权人对受害人的不当抵销损害人身权益。"}],"pitfalls":["解除不等于无效","把解除通知当作任意退出权","抵销不审查到期和法定禁止"],"caseStudy":{"facts":"定制设备合同中买方的根本违约使卖方依法解除合同，买方主张解除后合同已不存在，故自己无须承担任何损失赔偿。","analysis":"解除终止履行关系不等于抹去此前违约。应审查违约事实、可归责性、损失、因果关系和可预见范围，依法处理返还、补救与赔偿。两类后果可在不重复赔偿的前提下并存。"},"method":"先定解除权来源和行使，再计算终止、返还、赔偿等后果。","sourceRefs":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第557至580条","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":[]},{"id":"CIV-20","title":"违约责任、定金与损失计算","objectives":["掌握违约责任、定金与损失计算的构成要件","区分原则、例外和竞合","能以请求权结构处理原创案例"],"sections":[{"title":"制度功能与问题定位","body":"违约责任以违反合同义务为基础，包括继续履行、补救措施、赔偿损失等。应审查责任请求是否具备法定条件，以及不可抗力等免责事由是否真正造成履行障碍。不可抗力发生后仍应依法履行通知和证明义务。"},{"title":"规则与构成要件","body":"损失赔偿通常以履行利益为基础，受因果关系、可预见性、减损义务、过失相抵等规则限制。可预见性以订约时为重要判断点，不能把违约后得知的所有特殊损失都无条件转嫁。守约方未采取合理措施导致损失扩大的，对扩大部分依法不得请求赔偿。"},{"title":"例外与适用边界","body":"约定违约金低于造成损失的，可以依法请求增加；过分高于造成损失的，可以依法请求适当减少。不能把违约金约定一律当作不可调整的最终金额。违约金调整应结合现行司法解释的因素判断。"},{"title":"易混制度对比","body":"定金以实际交付为成立要件，定金数额不得超过主合同标的额百分之二十，超过部分不产生定金效力。收受定金一方根本违约，依法可能双倍返还；给付方根本违约，可能无权请求返还。同时约定违约金和定金时，守约方可依法选择适用，不能对同一违约机械叠加。"}],"pitfalls":["定金与订金混淆","超额定金并非导致全部定金无效","违约金与定金罚则不能任意叠加"],"caseStudy":{"facts":"合同标的额为十万元，买方交付三万元并约定为定金。卖方发生法定定金罚则适用的违约，买方要求六万元全部作为双倍定金。","analysis":"只有不超过标的额百分之二十的部分产生定金效力，超额一万元不能自动参加定金罚则。需分别计算有效定金双倍返还与超额款项返还，再检查是否另有可赔偿损失，避免把全部款项机械翻倍。"},"method":"先分责任方式，再确定损失边界和定金、违约金选择。","sourceRefs":[{"title":"最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释","url":"https://www.court.gov.cn/zixun/xiangqing/419382.html","effectiveDate":"2023-12-05","article":"第577至594条；合同编通则解释","checkedAt":"2026-11-24","status":"opened-primary-source; editorial review pending"}],"quizIds":[]}]},{"id":6,"title":"刑法","chapters":[{"id":"CRI-01","title":"刑法解释、基本原则与时间效力","objectives":["建立本章的构成要件审查顺序","区分原则、例外与法定从宽用语","将规则用于完整事实而不是仅记术语"],"sections":[{"title":"基本规则与判断入口","body":"刑法不是一般道德评价。判断一件事能否定罪，首先要找到行为发生时已有的、明确涵盖该行为的刑罚规范，再依构成要件逐项论证。罪刑法定既限制把未规定行为类推为犯罪，也要求处罚种类、幅度具有法律根据。允许解释不意味着可以任意扩张：文义可能范围、体系关联和规范保护目的必须共同检验。"},{"title":"构成要件与关键区分","body":"罪责刑相适应要求刑罚与犯罪事实、性质、情节及社会危害程度相适应。法律面前人人平等不等于所有案件机械判相同刑期；相同因素同等对待，不同责任因素作合理区分。题目出现身份、舆论或地方习惯时，不能让这些因素代替法定评价。"},{"title":"例外、边界与综合应用","body":"时间效力通常遵循从旧兼从轻。先确定行为时间和新旧法生效节点，再判断旧法是否认为是犯罪、法定刑怎样比较。新法不认为犯罪或处刑较轻时有适用新法的可能；生效裁判的既判力问题不能与尚未处理案件混为一谈。"}],"pitfalls":["把可以从宽写成必须从宽，或把减免处罚写成不成立犯罪。","只依据结果、身份或一处关键词作结论，省略其他法定条件。"],"caseStudy":{"facts":"甲在某行为尚无刑罚规定时实施该行为。两年后新增条款将其入罪，办案人员拟直接适用新条款。","analysis":"不能因为新条款体现最新治理需要，就追溯处罚此前不构成犯罪的行为。先核实旧法是否已有其他真实涵盖该行为的罪名，若没有，应受罪刑法定和从旧兼从轻约束。"},"method":"先锁定行为时间，再列新旧法律，最后比较罪与刑；不要把司法解释发布时间一律当作新刑法生效时间。","sourceRefs":[{"title":"中华人民共和国刑法（依修正案十二合并文本）","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第3、4、5、12条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CRI-0001","CRI-0002","CRI-0025"]},{"id":"CRI-02","title":"刑法空间效力与管辖连接点","objectives":["建立本章的构成要件审查顺序","区分原则、例外与法定从宽用语","将规则用于完整事实而不是仅记术语"],"sections":[{"title":"基本规则与判断入口","body":"属地管辖首先看犯罪地，而不是仅看行为人国籍。行为或结果有一项发生在我国领域内，即可能属于在我国领域内犯罪；我国船舶、航空器内犯罪也有专门规定。题干中跨境转账、远程操控、境外投递、境内结果，要把行为链和结果地分开标注。"},{"title":"构成要件与关键区分","body":"属人管辖关注我国公民在境外犯罪，并区分一般公民和国家工作人员、军人。法定最高刑三年以下的例外是可以不予追究，不是行为当然合法。保护管辖针对外国人在境外侵害我国国家或公民的犯罪，需要法定最低刑和犯罪地法律条件，不能只凭被害人中国国籍即肯定。"},{"title":"例外、边界与综合应用","body":"普遍管辖依据我国缔结或参加的国际条约，在所承担条约义务范围内行使。外国裁判的处理与我国再次追究是另一层问题；已经在外国受过刑罚的，可以免除或减轻处罚。外交特权和豁免人员的刑事责任通过外交途径解决，不等于没有实体违法性。"}],"pitfalls":["把可以从宽写成必须从宽，或把减免处罚写成不成立犯罪。","只依据结果、身份或一处关键词作结论，省略其他法定条件。"],"caseStudy":{"facts":"境外甲向我国境内乙发送骗取转款的信息，乙在境内处分财产，诈骗结果发生在境内。","analysis":"即使甲始终没有入境，犯罪结果的境内连接点仍使我国属地管辖成为首先应检验的依据。不能把‘人在境外’误写为‘我国绝无刑事管辖’。"},"method":"画出国籍、行为地、结果地、载体、条约五个连接点，按属地优先的检验顺序逐项审查。","sourceRefs":[{"title":"中华人民共和国刑法（依修正案十二合并文本）","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第6—11条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CRI-0003","CRI-0004","CRI-0016"]},{"id":"CRI-03","title":"犯罪构成、行为与因果关系","objectives":["建立本章的构成要件审查顺序","区分原则、例外与法定从宽用语","将规则用于完整事实而不是仅记术语"],"sections":[{"title":"基本规则与判断入口","body":"构成要件分析要把客观事实与主观责任分开。先确认行为、对象、结果及因果联系，再讨论故意过失和责任能力。不能因为结果严重就倒推行为人有罪，也不能因行为人动机可谅解就跳过违法性审查。危害显著轻微与情节轻微不是同一层次概念。"},{"title":"构成要件与关键区分","body":"不作为犯的重点是作为义务、履行可能性以及不履行与结果的联系。义务可能来自法律、职务业务、合法行为引起的保护关系或先行行为，但仅有一般伦理上的帮助期待不当然足够。还要核实在当时条件下是否能够作为，不能要求不可能完成的救助。"},{"title":"例外、边界与综合应用","body":"因果关系题要分析异常介入因素：是谁创造何种危险，危险是否在结果中实现，后续行为是否足以独立改变归责。被害人正常求救、通常医疗行为一般不能仅因发生在后来就机械切断因果链；极端异常、独立支配结果的事件需要进一步论证。"}],"pitfalls":["把可以从宽写成必须从宽，或把减免处罚写成不成立犯罪。","只依据结果、身份或一处关键词作结论，省略其他法定条件。"],"caseStudy":{"facts":"甲故意将不会游泳的乙推入深水，随后明知乙挣扎仍拒绝伸手可及的救援，乙死亡。","analysis":"甲的积极推人行为首先需要作为犯罪评价；先行危险行为又形成救助义务。不能把全过程简化成‘未救助’以逃避对先前故意行为的审查，也不能因甲保持沉默就否认客观贡献。"},"method":"客观行为—法定义务—履行可能性—因果联系—主观罪过，按层次列要件，不用结果替代论证。","sourceRefs":[{"title":"中华人民共和国刑法（依修正案十二合并文本）","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第13—16条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CRI-0005","CRI-0026"]},{"id":"CRI-04","title":"刑事责任年龄、能力与身份","objectives":["建立本章的构成要件审查顺序","区分原则、例外与法定从宽用语","将规则用于完整事实而不是仅记术语"],"sections":[{"title":"基本规则与判断入口","body":"年龄以实施行为时为基准，分档考查。已满十六周岁原则上对犯罪承担刑事责任。十四至十六周岁是法定严重犯罪范围内承担责任。十二至十四周岁不是一般下调，而是罪名、结果或手段、情节恶劣以及最高人民检察院核准追诉等严格条件的组合。"},{"title":"构成要件与关键区分","body":"精神障碍不能仅凭诊断名称认定免责。关键在于行为时辨认或控制能力是否具备，并经法定程序鉴定。间歇性精神病人在精神正常时犯罪应当负责；尚未完全丧失辨认或控制能力的人可以从轻或减轻处罚。醉酒不属于当然免责事由。"},{"title":"例外、边界与综合应用","body":"特殊身份可能是成立特定罪名的要素，也可能只影响处罚。共同犯罪中应区分身份的构成意义与量刑意义。对未满十八周岁犯罪人依法应当从轻或减轻处罚，死刑适用另有禁止规定；不能因接近成年就省略保护规则。"}],"pitfalls":["把可以从宽写成必须从宽，或把减免处罚写成不成立犯罪。","只依据结果、身份或一处关键词作结论，省略其他法定条件。"],"caseStudy":{"facts":"十三岁甲实施故意杀人行为致人死亡，情节恶劣。侦查机关认为事实严重，拟不经其他程序直接追诉。","analysis":"该年龄段的追责仍须符合刑法第十七条所规定的特殊条件，并经最高人民检察院核准追诉。严重结果并不能自动替代核准这一法定条件。"},"method":"先查行为时年龄，再查罪名与特殊门槛；精神能力、身份、量刑保护分别判断。","sourceRefs":[{"title":"中华人民共和国刑法（依修正案十二合并文本）","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第17—19条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CRI-0006","CRI-0007","CRI-0008","CRI-0017","CRI-0018"]},{"id":"CRI-05","title":"故意、过失与事实认识错误","objectives":["建立本章的构成要件审查顺序","区分原则、例外与法定从宽用语","将规则用于完整事实而不是仅记术语"],"sections":[{"title":"基本规则与判断入口","body":"故意包含认识和意志因素。直接故意通常希望危害结果发生；间接故意是在认识结果可能发生的基础上予以放任。单纯知道有风险，不当然等于放任，必须结合采取措施、风险程度、行为目标和事后表现综合判断。犯罪动机与故意不是一个概念。"},{"title":"构成要件与关键区分","body":"过失分为应当预见却因疏忽未预见，以及已经预见但轻信能够避免。轻信避免必须具有某种现实根据，不能把毫无根据的赌博心态一律归为过失。过失行为只有法律明确规定为犯罪时才负刑事责任，不能把一般生活疏忽一律刑事化。"},{"title":"例外、边界与综合应用","body":"事实认识错误要定位错误层次：对象、打击、因果进程以及构成要件事实认识各有不同问题。学理有争议时应在题目中说明评价口径，不能把某一理论的结论当作一切案件唯一答案。对违法性的不了解与对事实的误认也应分别审查。"}],"pitfalls":["把可以从宽写成必须从宽，或把减免处罚写成不成立犯罪。","只依据结果、身份或一处关键词作结论，省略其他法定条件。"],"caseStudy":{"facts":"司机甲发现制动异常，仍因相信身边已检验有效的备用制动装置可避免事故而继续低速转移，最后装置失灵致重大事故。","analysis":"判断罪过要审查其轻信根据是否真实、合理，以及是否违反注意义务。题目不能只因‘已预见’就直接断定间接故意；还要判断其究竟相信避免还是接受结果。"},"method":"分别写出‘知道什么’与‘希望、放任或轻信什么’，再核对过失犯罪是否有明文规定。","sourceRefs":[{"title":"中华人民共和国刑法（依修正案十二合并文本）","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第14—16条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CRI-0009","CRI-0027"]},{"id":"CRI-06","title":"正当防卫与防卫过当","objectives":["建立本章的构成要件审查顺序","区分原则、例外与法定从宽用语","将规则用于完整事实而不是仅记术语"],"sections":[{"title":"基本规则与判断入口","body":"防卫分析至少包括起因、时间、意图、对象和限度。不法侵害不限于已经构成犯罪的侵害；但单纯想象的侵害不能成为真实的防卫起因。侵害是否正在进行，应立足当时紧迫情境判断，不能只依事后静态画面或要求防卫者作精密计算。"},{"title":"构成要件与关键区分","body":"普通防卫过当并非‘造成重伤即成立’。必须同时讨论明显超过必要限度和造成重大损害。特殊防卫针对正在进行的行凶、杀人、抢劫、强奸、绑架以及其他严重危及人身安全的暴力犯罪，符合条件时造成侵害人伤亡不属于防卫过当。"},{"title":"例外、边界与综合应用","body":"事前准备工具不当然否定防卫意图；互殴也不能只凭双方都有攻击动作认定。应核实冲突起因、是否寻求冲突、是否退出、强度是否突然升级以及反击目的。侵害结束后的报复与为制止持续侵害的行为应分段评价。"}],"pitfalls":["把可以从宽写成必须从宽，或把减免处罚写成不成立犯罪。","只依据结果、身份或一处关键词作结论，省略其他法定条件。"],"caseStudy":{"facts":"乙持刀持续追刺甲的胸腹，甲在退避无效后夺棍反击，造成乙死亡。","analysis":"先审查是否存在正在进行、严重危及人身安全的暴力侵害。符合特殊防卫条件时，不能仅以死亡结果认定过当；若乙已被彻底制服后甲另行加害，则须另行评价后段行为。"},"method":"把每一阶段的侵害状态和反击目的写清，再分别适用普通限度或特殊防卫规则。","sourceRefs":[{"title":"中华人民共和国刑法（依修正案十二合并文本）","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第20条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CRI-0010","CRI-0019","CRI-0029"]},{"id":"CRI-07","title":"紧急避险与其他排除事由","objectives":["建立本章的构成要件审查顺序","区分原则、例外与法定从宽用语","将规则用于完整事实而不是仅记术语"],"sections":[{"title":"基本规则与判断入口","body":"紧急避险针对正在发生的危险，危险来源可以是自然事件、动物或人的行为。它常以损害第三人的较小利益保护较大利益，因此‘不得已’与利益衡量尤其重要。存在现实可行且损害更小的替代方法时，通常不能直接认定避险正当。"},{"title":"构成要件与关键区分","body":"避险行为不得超过必要限度造成不应有损害。超限并不自动等于一般故意犯罪的完整处罚，仍需主观罪过与法定责任分析；依法应当减轻或者免除处罚。具有职务、业务上特定责任的人，对避免本人危险的规定受到限制，但仍应区别其保护他人利益的情形。"},{"title":"例外、边界与综合应用","body":"被害人承诺、依法执行职务等排除事由，应在法益可处分性、承诺真实与时间、行为权限和程序等条件下讨论。不能用‘对方同意’正当化任何侵害，生命法益与重大身体损害尤其不能任意处分；也不能用一般工作指令替代法律授权。"}],"pitfalls":["把可以从宽写成必须从宽，或把减免处罚写成不成立犯罪。","只依据结果、身份或一处关键词作结论，省略其他法定条件。"],"caseStudy":{"facts":"山洪逼近，甲为救被困儿童，别无可行办法时砸开丙无人居住的仓房门取得救生设备，造成小额损失。","analysis":"先核实危险现实性、救助必要性和替代方案，再比较所保全的人身利益与造成的财产损害。若存在安全可用的自备设备而故意毁损他人财物，就不能省略不得已审查。"},"method":"危险—不得已—所保全利益—造成损害—特殊职责，五项逐一列出。","sourceRefs":[{"title":"中华人民共和国刑法（依修正案十二合并文本）","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第21条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CRI-0011","CRI-0020"]},{"id":"CRI-08","title":"犯罪预备、未遂、中止与既遂","objectives":["建立本章的构成要件审查顺序","区分原则、例外与法定从宽用语","将规则用于完整事实而不是仅记术语"],"sections":[{"title":"基本规则与判断入口","body":"预备与实行的边界取决于具体罪名的构成要件和对法益的紧迫危险，不以是否走出家门、是否购买工具统一判断。未遂要求已经着手实行犯罪，因意志以外原因未得逞；没有着手的受阻行为，应先考虑是否仍属预备。"},{"title":"构成要件与关键区分","body":"中止要求自动性和有效性。自动放弃发生于犯罪过程中，不能把已经既遂后的悔罪退赃等同于中止。行为已足以导致结果时，仅口头反悔还不够，须自动有效防止犯罪结果发生。因警察到场、工具失效等被迫停手，通常不具备自动性。"},{"title":"例外、边界与综合应用","body":"预备犯可以比照既遂从轻、减轻或免除；未遂犯可以比照既遂从轻或减轻；中止犯没有造成损害的应当免除，造成损害的应当减轻。注意可以与应当、免除与不构成犯罪的区别，不能把阶段性从宽写成一律无罪。"}],"pitfalls":["把可以从宽写成必须从宽，或把减免处罚写成不成立犯罪。","只依据结果、身份或一处关键词作结论，省略其他法定条件。"],"caseStudy":{"facts":"甲给乙投毒后真诚悔悟，及时送医并告知毒物，使乙得救但仍造成轻伤。","analysis":"在因果进程已经启动时，自动性之外还须有效阻止死亡结果。满足条件可能成立故意杀人中止；由于已造成损害，处罚规则是应当减轻，而非一概免除。"},"method":"先定具体罪名的既遂标准，再判着手、未得逞原因与自动有效防止结果。","sourceRefs":[{"title":"中华人民共和国刑法（依修正案十二合并文本）","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第22—24条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CRI-0012","CRI-0013","CRI-0021","CRI-0028"]},{"id":"CRI-09","title":"共同犯罪中的参与与责任","objectives":["建立本章的构成要件审查顺序","区分原则、例外与法定从宽用语","将规则用于完整事实而不是仅记术语"],"sections":[{"title":"基本规则与判断入口","body":"共同犯罪以共同故意为基础，不要求每个人都亲手完成全部构成行为。组织、实行、帮助、教唆均须结合行为贡献与故意范围评价。仅仅同处现场、存在亲属关系或事后知道犯罪，不能直接推出共同犯罪。共同过失不是刑法意义上的共同犯罪。"},{"title":"构成要件与关键区分","body":"主从犯区分关注在共同犯罪中起主要、次要或辅助作用，不简单按分赃多少、地位头衔或谁最后动手认定。对从犯应当从轻、减轻或者免除处罚。胁从犯应结合被胁迫情况减轻或免除；有压力不当然达到胁迫程度。"},{"title":"例外、边界与综合应用","body":"教唆犯按所起作用处罚，教唆不满十八周岁者犯罪应当从重。被教唆人没有犯被教唆之罪的，教唆犯可以从轻或者减轻。部分共犯实施超出共同故意范围的加害，应具体审查其他人的认识和接受程度，不能只因结伙就全部归责。"}],"pitfalls":["把可以从宽写成必须从宽，或把减免处罚写成不成立犯罪。","只依据结果、身份或一处关键词作结论，省略其他法定条件。"],"caseStudy":{"facts":"甲乙商量盗窃，乙入户后突然决定强奸被害人，甲在外放风且对此毫不知情、没有提供针对该行为的帮助。","analysis":"共同盗窃范围内的责任与乙另行性侵行为的责任应分开。不能仅凭甲参加最初犯罪就当然将一切后续个人犯罪归责于甲；仍需查明是否另有故意联络或帮助。"},"method":"先画共同计划，再标各人行为和主观范围，最后分别定罪及划分主从作用。","sourceRefs":[{"title":"中华人民共和国刑法（依修正案十二合并文本）","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第25—29条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CRI-0014","CRI-0022","CRI-0023"]},{"id":"CRI-10","title":"单位犯罪与罪数判断","objectives":["建立本章的构成要件审查顺序","区分原则、例外与法定从宽用语","将规则用于完整事实而不是仅记术语"],"sections":[{"title":"基本规则与判断入口","body":"单位犯罪必须有法律明文规定，通常还需单位意志和为单位利益实施等条件。不能仅因使用公司账户或办公场所就认定单位犯罪；也不能因为企业是民营企业就绝对排除。单位犯罪的责任通常包括单位罚金及对直接负责人员的处罚。"},{"title":"构成要件与关键区分","body":"罪数首先分析行为数量与构成要件实现情况，再适用法条竞合、想象竞合或明确的数罪并罚规定。不能用‘一次行为’机械推出一罪，也不能用‘侵害两个法益’就当然并罚。特别规定优先与处罚较重规则各有适用条件。"},{"title":"例外、边界与综合应用","body":"连续犯、继续犯和集合性规定不能只凭文字近似判断。行为完成后不法状态持续与犯罪行为本身持续不同。包容评价与禁止重复评价要求把同一事实分别用于定罪和量刑时核查规范依据，避免同一加重因素被无根据重复计算。"}],"pitfalls":["把可以从宽写成必须从宽，或把减免处罚写成不成立犯罪。","只依据结果、身份或一处关键词作结论，省略其他法定条件。"],"caseStudy":{"facts":"公司负责人假借公司名义诈骗，所得均由个人挥霍，公司并不知情且没有获利。","analysis":"单位名义只是线索，不能取代单位意志、利益归属与法定罪名审查。应审查是否属于个人犯罪以及具体财产犯罪构成，而不是一律对公司判罚金。"},"method":"先定每个行为对应的罪名，再查单位犯罪明文和罪数特别条款，不从‘公司’二字倒推结论。","sourceRefs":[{"title":"中华人民共和国刑法（依修正案十二合并文本）","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第30、31、69条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CRI-0015","CRI-0024","CRI-0030"]}]},{"id":7,"title":"刑事诉讼法","chapters":[{"id":"CRP-01","title":"刑事诉讼的任务与基本原则","objectives":["能够区分刑事程序职权、无罪推定式保障与两审终审","识别法定不追诉情形。"],"sections":[{"title":"程序为什么不能被结果替代","body":"刑事诉讼以查明事实、正确适用刑法为任务，同时必须尊重和保障人权。公安机关侦查、拘留并执行逮捕；检察机关履行检察、批准逮捕、公诉和法定自行侦查职能；法院行使审判权。侦查机关认为证据充分、当事人认罪、媒体已经报道，都不能取代法院依法判决。程序违法的后果应依具体制度处理，不能笼统认为只要有罪即可忽略，也不能笼统认为任何程序瑕疵都使全案无罪。"},{"title":"独立行使职权与分工制约","body":"法院依法独立行使审判权，检察院依法独立行使检察权，不受行政机关、社会团体和个人干涉；此处的独立是机关依法行使职权，不是法官、检察官可以脱离法定组织程序个人决定。公检法分工负责、相互配合、相互制约；相互配合不能解释为检察机关必须认可公安移送的结论。检察院对刑事诉讼实行法律监督。"},{"title":"不追究责任与程序出口","body":"刑诉法第16条将显著轻微不认为犯罪、超过追诉时效、特赦、告诉才处理而未告诉或撤回告诉、死亡及其他法定情形列为不追诉事由。程序出口与发现阶段有关：侦查阶段可能撤案，审查起诉阶段可能不起诉，审判阶段可能终止审理或依法宣告无罪。不能把所有不追诉情形都写成无罪判决，死亡案件还须注意违法所得没收程序等独立制度。"}],"pitfalls":["把未经法院判决不得定罪误读成办案机关不能使用犯罪嫌疑人称谓。","将所有刑诉不追究情形统一归为无罪判决。","以认罪或退赔替代证据和法定程序。"],"caseStudy":{"facts":"公安机关发布消息称甲已被逮捕，因此甲已经被正式判定有罪。随后检察院发现案件行为显著轻微、不认为犯罪，决定依法不追诉。","analysis":"逮捕是诉讼强制措施而非定罪判决，公安消息不能产生有罪裁判效力。检察机关应独立审查事实与法律；显著轻微不认为犯罪符合第16条第一项，应结合所处的审查起诉阶段作出法定不起诉等处理，而不能为维持前期对外表态继续起诉。"},"method":"先标记机关和阶段，再判断是否有法院生效裁判；遇不追诉题先选法律事由，再匹配程序出口。","sourceRefs":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第3—16条","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["CRP-0001","CRP-0002","CRP-0003","CRP-0004","CRP-0005","CRP-0006"]},{"id":"CRP-02","title":"诉讼参与人与认罪认罚","objectives":["识别当事人、其他诉讼参与人与值班律师的不同功能","理解认罪认罚的自愿、明知与证据要求。"],"sections":[{"title":"当事人身份与权利不完全相同","body":"犯罪嫌疑人、被告人处于被追诉地位；被害人、自诉人以及附带民事诉讼原被告属于法定当事人范围。法定代理人、诉讼代理人、辩护人、证人、鉴定人、翻译人员等有各自的诉讼角色，不能因都能出庭就等同当事人。判断诉讼地位，应看其与诉讼结果的利害关系及法律明定的身份，而非看是否在场。"},{"title":"认罪认罚不是免除证明","body":"认罪认罚的核心是自愿如实供述、承认指控事实并愿意接受处罚，可以依法从宽。它不能降低定罪证明标准，不能使刑讯取得的供述合法，也不等于法院必须机械照抄量刑建议。办案机关应告知权利，听取意见并审查自愿性、具结等条件；具结例外和量刑建议调整应依对应条文处理。"},{"title":"值班律师与辩护人的位置","body":"没有辩护人的犯罪嫌疑人、被告人可依法获得值班律师法律帮助，包括法律咨询、程序选择建议、申请变更强制措施和对案件处理提出意见等。值班律师并不因提供值班法律帮助就自动成为受委托辩护人；受委托或指派后，身份与权利再按辩护制度判断。认罪认罚具结应注意法定代理人、辩护人或值班律师的在场及法律规定的例外。"}],"pitfalls":["把值班律师等同于一切场合下的辩护人。","认罪认罚案件仍应证据确实充分。","不能将从宽理解为必然免刑或必然缓刑。"],"caseStudy":{"facts":"乙没有委托律师，值班律师向其解释量刑建议。乙认罪后，侦查机关认为无需再查证唯一供述，并拒绝收集能够证明乙不在现场的证据。","analysis":"值班帮助并不免除办案机关全面客观收集证据的义务。认罪认罚是处理情节，不能替代犯罪事实证明；唯一供述不足以单独定案，对无罪、罪轻证据同样应依法收集、审查。律师身份应根据实际委托、指派手续判断。"},"method":"把主体身份、认罪自愿性、证明标准分成三层分别审查，避免因程序从简推导证据从简。","sourceRefs":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第15、34—36、52、55、173—174条","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["CRP-0007","CRP-0008","CRP-0009","CRP-0010"]},{"id":"CRP-03","title":"立案管辖与审判管辖","objectives":["区分侦查职权配置和法院分工","掌握级别、地域、指定及移送管辖的审查次序。"],"sections":[{"title":"先分立案管辖与审判管辖","body":"立案管辖解决案件最初由哪个机关依法受理、侦查；审判管辖解决由哪一级、哪一地法院审理。公安机关侦查一般刑事案件；检察机关可对诉讼监督中发现的司法工作人员利用职权实施、侵犯公民权利且损害司法公正的法定犯罪立案侦查，另有法定重大案件需履行决定手续。自诉案件由法院直接受理，国家安全机关、军队保卫部门、监狱等依特别规定履职。不能把所有职务犯罪都划给检察院。"},{"title":"级别与地域需要分别判断","body":"基层法院管辖第一审普通刑事案件，依法由上级法院管辖的除外。危害国家安全、恐怖活动及可能判处无期徒刑、死刑案件等依法由中级法院管辖，涉外因素本身不再一律决定中院管辖。地域原则是犯罪地，若由被告人居住地法院审判更适宜，可以由该地法院管辖；数个有管辖权法院通常由最初受理者审判，必要时可移送主要犯罪地法院。"},{"title":"提级、指定与争议处理","body":"上级法院在必要时可审判下级法院管辖的第一审案件；下级法院认为重大复杂需上级审判，应请求移送。管辖不明、特殊原因不宜管辖等可依法指定。不能由两家法院用被告人意愿私下选择，也不能以内部协商替代必须履行的报请程序。题目同时给出多个连接点时，应先排查专门管辖和级别管辖，再比较地域联系。"}],"pitfalls":["涉外案件不当然全部由中院一审。","被告人居住地是更适宜时的选择，不是与犯罪地毫无条件地任意选择。","监察调查、检察侦查、公安侦查不能混为同一制度。"],"caseStudy":{"facts":"甲在A市实施犯罪后到B市长期居住。案件可能判处死刑，B市基层法院以甲现居本辖区为由直接一审。","analysis":"先按可能刑罚识别级别管辖，该案依法应由中级法院管辖，基层法院不能仅凭居住地连接点突破级别规则。至于A、B两地中院如何分工，再判断犯罪地原则及由居住地审理是否更适宜，不能倒置审查顺序。"},"method":"机关职权→专门管辖→级别→地域→移送或指定。对可能刑罚等决定管辖的事实，按题干明确内容判断。","sourceRefs":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第19—28条","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["CRP-0011","CRP-0012","CRP-0013","CRP-0014","CRP-0015","CRP-0016"]},{"id":"CRP-04","title":"回避与程序中立","objectives":["识别法定回避原因、决定主体与复议","区分侦查继续进行和审判公正保障。"],"sections":[{"title":"回避防止利益冲突而非等同惩戒","body":"审判人员、检察人员、侦查人员有本案当事人或其近亲属身份，与案件有利害关系，曾担任本案证人、鉴定人、辩护人、诉讼代理人，或与当事人有可能影响公正处理的其他关系，应依法回避。违反规定会见、接受请客送礼等也可能构成回避事由。是否已经实际作出偏袒行为，不是所有回避事由成立的必要条件。"},{"title":"谁申请、谁决定要分开","body":"当事人及其法定代理人依法享有申请回避权，辩护人、诉讼代理人可以依照法律规定提出要求。审判人员、检察人员、侦查人员的回避原则上分别由院长、检察长、公安机关负责人决定；院长的回避由审判委员会决定，检察长和公安机关负责人的回避依法律由相应检察委员会决定。书记员、翻译人员和鉴定人适用有关回避规定，不能因为不是办案主官就排除回避。"},{"title":"申请后的程序与救济","body":"对驳回申请回避的决定可以申请复议一次。侦查人员回避决定作出前，不能因此停止对案件侦查；这并不表示被申请人员可任意实施所有可能影响公正的行为，已实施诉讼行为的效力还要依具体规定审查。申请权保障也不意味着当事人只要不满意就可无限次用同一理由拖延。"}],"pitfalls":["曾任本案证人与单纯认识证人不同。","不能把院长与普通审判人员的决定主体混同。","回避复议一次不同于对实体判决上诉。"],"caseStudy":{"facts":"侦查员丙是被害人的哥哥，辩护人得知后提出回避。公安机关称尚无证据证明丙徇私，因此无需处理该申请。","analysis":"近亲属关系本身已落入法定利益冲突范围，不以证明实际徇私为前提。有关机关应依回避程序处理，并由有权主体作出决定。侦查不中断规则只解决办案连续性，不能否认提出申请及依法决定的义务。"},"method":"先找人与案件的关系，后查申请主体和决定主体，最后判断是否有复议及前期行为效力问题。","sourceRefs":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第29—32、108条","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["CRP-0017","CRP-0018","CRP-0019","CRP-0020","CRP-0021","CRP-0022"]},{"id":"CRP-05","title":"辩护与诉讼代理","objectives":["掌握辩护介入时间、律师会见阅卷、法律援助与代理身份的边界。"],"sections":[{"title":"委托时间和人员限制","body":"犯罪嫌疑人自侦查机关第一次讯问或者采取强制措施之日起有权委托辩护人；侦查期间只能委托律师。被告人可随时委托辩护人。辩护人数依法为一至二人，人员资格、禁止担任情形需依法律核查。被害人等委托的是诉讼代理人，不因代理人也是律师就成为辩护人。"},{"title":"会见、通信、阅卷是不同权利","body":"辩护律师凭法定证件可依法会见在押嫌疑人、被告人，看守所应依法及时安排，至迟不得超过法定时间。危害国家安全、恐怖活动案件侦查期间有法定会见许可要求，不能扩张到一切重大案件。会见不被监听。阅卷通常从审查起诉起开始，可查阅、摘抄、复制案卷材料；侦查期间律师了解案情、提供帮助不等于全面阅卷。其他辩护人行使会见、阅卷等权利还受许可规则约束。"},{"title":"援助、调查和保密","body":"符合法定应通知辩护的情形，如盲聋哑、尚未完全丧失辨认或控制能力的精神病人，可能被判处无期徒刑或死刑而未委托辩护人等，应通知法律援助机构指派律师；未成年人还有特别保障。辩护律师可依法申请收集调取无罪罪轻证据，并可在符合法定条件下调查取证。保密义务不是掩盖一切未来严重犯罪的绝对规则，法定报告例外应单独识别。"}],"pitfalls":["侦查阶段只能委托律师，不是任何近亲属都可作为受托辩护人。","阅卷起点与可委托辩护人的起点不同。","会见许可例外不得泛化到所有经济犯罪或贪污案件。"],"caseStudy":{"facts":"丁因普通盗窃被刑拘，其家属委托律师。看守所要求先取得侦查机关许可，并准备安排民警全程监听会见。","analysis":"普通盗窃不属于刑诉法规定的侦查阶段会见许可例外。律师提交法定证件后应依法安排会见，辩护律师会见依法不被监听。现处侦查阶段并不赋予律师全面阅卷权，但不影响其会见、提供法律帮助和申请变更强制措施等职能。"},"method":"时间点决定可行使何种权利；身份决定是否需要许可；案件类型决定是否落入法定特别限制。","sourceRefs":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第34—49条","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["CRP-0023","CRP-0024","CRP-0025","CRP-0026","CRP-0027","CRP-0028","CRP-0029","CRP-0030"]},{"id":"CRP-06","title":"证据体系、举证责任与证明标准","objectives":["区分证据种类、证明力和合法性","掌握公诉举证责任及排除合理怀疑。"],"sections":[{"title":"证据种类不是证据充分程度","body":"物证、书证、证人证言、被害人陈述、犯罪嫌疑人被告人供述和辩解、鉴定意见、勘验检查辨认侦查实验等笔录、视听资料电子数据等是法定证据种类。载体相同也可能反映不同证据内容，例如手机本体可作为物证，手机中信息可能构成电子数据。属于法定种类，并不当然具备真实性、关联性、合法性，更不当然具有决定性证明力。"},{"title":"举证责任与全面收集","body":"公诉案件证明被告人有罪的责任由检察院承担；自诉案件由自诉人承担相应举证责任，不能一概要求被告人证明自己无罪。侦查、检察、审判人员应依法收集有罪和无罪、罪重和罪轻证据，不得强迫任何人证实自己有罪。行政机关在执法中依法收集的物证、书证、视听资料、电子数据等，可在刑事诉讼中作为证据使用，但仍须审查，不能直接把行政处罚结论当成刑事定罪。"},{"title":"确实充分与口供限制","body":"定罪量刑事实都有证据证明，据以定案证据经法定程序查证属实，综合全案证据对所认定事实已排除合理怀疑，是法定证明要求。只有供述而无其他证据不能认定有罪；没有供述而其他证据确实充分，可以认定有罪。排除合理怀疑不等于排除所有想象可能，也不允许将疑点无限转嫁给被告人。"}],"pitfalls":["以是否有口供作为能否定罪的唯一尺度。","行政证据可转用不等于任何行政笔录一律直接采信。","证据种类、证据能力、证明力、证明标准要分层。"],"caseStudy":{"facts":"戊始终否认盗窃，但监控原始文件、指纹、赃物去向、可靠证言相互印证，来源合法且排除合理怀疑。辩护人主张没有口供就不能定罪。","analysis":"刑诉法重证据不轻信口供。没有供述并不当然阻却定罪，仍须审查其他证据是否满足确实充分标准；若全案证据经过法定程序查证属实并排除合理怀疑，法院可依法认定。相反，有供述而缺少其他证据时不得只凭口供定罪。"},"method":"先问证据能否进入法庭，再评真实性关联性及相互印证，最终按全案而非单个证据判断证明标准。","sourceRefs":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第50—55条","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":[]},{"id":"CRP-07","title":"非法证据排除与证据调查","objectives":["辨别言词证据与实物证据排除条件","掌握线索材料、调查与证明责任。"],"sections":[{"title":"排除规则具有类型差异","body":"采用刑讯逼供等非法方法收集的犯罪嫌疑人、被告人供述，以及采用暴力、威胁等非法方法收集的证人证言、被害人陈述，应依法排除。物证、书证收集程序不符合法定程序且可能严重影响司法公正时，应补正或合理解释；不能补正或作出合理解释的，应排除。不能将一切程序瑕疵都等同刑讯，也不能把言词证据的绝对排除条件套用给所有证据载体。"},{"title":"启动调查与证明收集合法性","body":"当事人及其辩护人、诉讼代理人申请排除非法证据，应提供相关线索或者材料；这不是要求其完整证明侦查机关确实实施违法。法院认为可能存在法定非法取证情形时，应依法调查。对证据收集合法性的调查中，检察院承担证明责任，可以出示讯问笔录、录音录像、相关人员说明等；依法应出庭的侦查人员、其他人员应履行相应义务。"},{"title":"疑问未排除时的处理","body":"经法庭审理确认或者不能排除存在法定非法方法取证情形的，对有关证据应予排除。排除一份证据并不当然意味着全案无罪；应在剩余合法证据上重新审查证明是否充分。相反，也不能因为案件其他事实可能真实，就保留法律要求排除的证据。重复供述的处理、同步录音录像及审查规则须结合相关解释具体适用。"}],"pitfalls":["申请人提出线索材料与检察机关证明合法性不是同一举证责任。","实物证据补正、解释规则不能用来治愈刑讯供述。","排除后的定罪问题须重新评价全案。"],"caseStudy":{"facts":"己称供述在刑讯下作出并提交伤情照片。检察院无法解释同步录像中断，法院审查后仍不能排除刑讯可能，却以己未证明刑讯人员姓名为由采纳供述。","analysis":"申请排除者只须提供相关线索材料启动法定审查，不必完成对非法取证的全部证明。取证合法性由检察院证明；审查后不能排除存在刑讯情形，应依法排除供述，再以剩余证据判断案件能否定罪。"},"method":"证据类型→违法方式与强度→启动线索→合法性证明→是否排除→剩余证据是否达标。","sourceRefs":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第56—60条","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":[]},{"id":"CRP-08","title":"强制措施与羁押审查","objectives":["理解拘传、取保、监居、拘留、逮捕的目的和条件","区分决定机关、执行机关与期限。"],"sections":[{"title":"强制措施不以惩罚为目的","body":"强制措施服务于诉讼进行和社会危险控制，不是提前执行刑罚。取保候审适用于法定条件，可采用保证人或保证金方式，不能对同一被取保人同时适用两种保证方式。适用条件、保证人的资格与义务、被取保人遵守的法定义务要分别判断。因身体情况等被取保也不等于不构成犯罪或已经不起诉。"},{"title":"取保监居及指定居所","body":"取保候审最长不得超过十二个月，监视居住最长不得超过六个月；不能以措施到期为由停止依法办理案件，应及时解除或变更。监视居住原则上在住处执行，无固定住处的可在指定居所执行；危害国家安全、恐怖活动等案件还应满足指定居所的特殊法定条件和批准程序，且不得在羁押场所、专门办案场所执行。指定居所监居折抵刑期与普通住处监居不同。"},{"title":"拘留、逮捕与继续羁押","body":"公安拘留是针对现行犯或重大嫌疑分子的法定紧急措施；逮捕要求证据条件、可能刑罚及社会危险性等相应条件。检察院批准或法院决定逮捕通常由公安机关执行，不能把执行权当成最终批准权。拘留后、逮捕后应依法讯问并履行通知、送看守所等程序；检察院还应依法审查羁押必要性。不符合继续羁押条件的，应依法提出释放或变更建议。"}],"pitfalls":["取保候审与无罪、缓刑不能画等号。","保证人和保证金不能对同一被取保人同时适用。","逮捕批准、决定与执行应拆分。"],"caseStudy":{"facts":"庚被决定取保候审，办案机关既要求其哥哥担任保证人，又要求交保证金，并称只要案件未结可无限续办取保。","analysis":"同一被取保人不得同时使用两种保证方式。取保最长十二个月的法定限制不能被案件未结无限突破，期满应依法解除或变更措施，同时继续依法办案。是否构成犯罪仍由实体证据和后续程序判断。"},"method":"每遇强制措施，列出条件、决定机关、执行机关、期限、义务、违反后果六项，再核对特别规定。","sourceRefs":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第66—99条","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":[]},{"id":"CRP-09","title":"立案、报案与立案监督","objectives":["掌握受理、审查、立案标准与不立案救济","分清报案材料和定案证据。"],"sections":[{"title":"受理不等于必须立案","body":"任何单位和个人发现犯罪事实或嫌疑人，有权利也有义务向公安、检察、法院报案或者举报；被害人有权报案或控告。有关机关应接受，非本机关管辖的依法移送，必要紧急措施应先依法采取。接受材料只是启动审查，立案需认为有犯罪事实、需要追究刑事责任并符合管辖等条件，不能因为报案人情绪强烈就当然立案。"},{"title":"不立案理由与救济路径","body":"决定不予立案时，应依法说明理由并通知控告人。控告人不服可依法申请复议；对公安不立案，还可依法寻求检察机关立案监督。检察院认为公安对应立案侦查案件未立案，或者被害人提出此类意见，应要求公安说明不立案理由；认为理由不能成立的，应通知立案，公安接到通知后应依法立案。"},{"title":"立案监督与审判权边界","body":"检察立案监督不等于检察机关替公安完成所有一般案件侦查，也不等于直接判决嫌疑人有罪。立案后发现不应追究责任，应依法撤销案件等。立案材料中的陈述、线索仍须依法查证转化为可供定案的证据，不能仅因材料盖有报案受理章就认为事实已经证实。"}],"pitfalls":["受理、立案、批准逮捕、提起公诉、定罪是不同门槛。","检察立案监督是法律监督，不是法院一审。","有犯罪线索并不意味着必然满足逮捕条件。"],"caseStudy":{"facts":"辛被诈骗后报案，公安登记接受材料但未立案。辛向检察院申诉，检察院审查认为公安不立案理由不能成立，依法通知立案。公安称只有法院判定有罪后才能立案。","analysis":"立案是刑事追诉起点，不以法院事先定罪为条件。检察院履行法定立案监督，公安对其通知应依法立案。此时也不意味着辛的全部陈述已经证实，侦查仍须依法收集、审查证据。"},"method":"材料受理→立案审查→理由告知→申请复议或检察监督；不要把追诉起点与定罪终点混淆。","sourceRefs":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第109—113条","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":[]},{"id":"CRP-10","title":"侦查行为与侦查终结","objectives":["掌握讯问、询问、搜查扣押、鉴定和技术侦查的法定边界","识别侦查终结后的处理。"],"sections":[{"title":"讯问与询问不能混用","body":"讯问对象为犯罪嫌疑人，询问对象包括证人、被害人等。讯问应由侦查人员依法进行，人数、地点、时间与笔录确认均有法定要求。在押嫌疑人应在看守所内讯问；传唤、拘传持续时间有法定上限，重大复杂需采取拘留逮捕措施的案件有特别限制，不得以连续传唤、拘传变相拘禁。询问证人应个别进行，不能让证人围坐商量后统一口径。"},{"title":"搜查、扣押与鉴定","body":"搜查通常须出示搜查证，执行逮捕、拘留时遇紧急情况可依法例外；不能将例外扩张为所有侦查均无需证件。搜查妇女身体应由女工作人员进行。查封、扣押应与案件相关，制作清单并依法保管，确与案件无关的应在查明后依法解除、退还。鉴定意见须告知有关人员，补充或重新鉴定的申请依条件处理，不等于每次申请均须准许。"},{"title":"技术侦查与侦查终结","body":"技术侦查须限于法定案件和必要条件，经过严格批准，不能因为调查方便就采用。侦查终结应制作起诉意见书，连同案卷材料和证据移送检察院审查决定；移送并不使检察院失去补充侦查、不起诉等独立判断权。发现不应追究刑责，应依法撤案并及时处理强制措施、涉案财物。"}],"pitfalls":["秘密侦查并非一切案件都可以启动。","搜查证例外有法定紧急条件。","鉴定意见可供审查质证，不具有预先当然证明力。"],"caseStudy":{"facts":"侦查人员为普通轻微盗窃案件长期监听嫌疑人全部通信，理由是技术侦查省力；同时把与案件无关的家属电脑长期扣押。","analysis":"技术侦查应受法定案件范围、必要性和批准程序限制，办案便利不能替代条件。扣押应限于能证明有罪或无罪的财物、文件等，查明与案件无关的应依法处理，不得以家属关系推导无限扣押权。"},"method":"分别审查对象、权限、批准、实施方式、记录保管、救济及终结处理。程序措施各自审查，不能用案件整体需要一语带过。","sourceRefs":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第115—166条","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":[]},{"id":"CRP-11","title":"审查起诉与不起诉","objectives":["区分审查内容、补充侦查、法定不起诉、酌定不起诉与证据不足不起诉。"],"sections":[{"title":"审查起诉是独立过滤程序","body":"检察院应审查犯罪事实、情节、证据，性质和罪名认定，有无遗漏罪行或其他应追诉者，是否有不应追刑责情形，侦查活动是否合法，以及附带民事等依法应审事项。应依法讯问嫌疑人，听取辩护人或值班律师、被害人等意见，并依规定记录。侦查起诉意见是审查对象，不是必须接受的裁判指令。"},{"title":"补充侦查与证据不足","body":"需要补充侦查的，可退回公安补查，也可自行侦查；每次补查依法以一个月为限，退回补查以二次为限，补查完毕重新移送后重新计算审查起诉期限。经二次补查仍认为证据不足、不符合起诉条件的，应作不起诉决定。不是任何案件都必须退查二次后才能不起诉，也不能用无限退查规避法定限制。"},{"title":"三类不起诉的条件和效果","body":"没有犯罪事实或存在法定不追诉情形，应依法不起诉；犯罪情节轻微，依刑法不需要判处刑罚或者免除刑罚的，可以酌定不起诉；证据不足不符合起诉条件的，依相应规则不起诉。酌定不起诉与显著轻微不认为犯罪不同，前者不等于宣告无罪，后者属于法定不追诉。被害人、公安及被不起诉人对不同决定有各自法定救济渠道。"}],"pitfalls":["酌定不起诉要求法定轻微条件，不是检察院任意息事宁人。","退回补查次数和自行补充侦查需分别辨析。","不起诉不是法院作出的无罪判决。"],"caseStudy":{"facts":"案件两次退回公安补查后仍缺乏证明关键行为的证据，检察人员提议第三次退查以等待被害人提供新线索。","analysis":"退回补充侦查以二次为限，不能以等待线索突破次数限制。二次补查后仍证据不足、不符合起诉条件，应依法作证据不足不起诉。以后发现新证据的处理应依相应法定程序，不能用无限退查维持追诉状态。"},"method":"先问不起诉依据是无犯罪、法定不追诉、轻微免罚还是证明不足，再匹配应当或可以及各方救济。","sourceRefs":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第170—181条","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":[]},{"id":"CRP-12","title":"第一审普通程序与附带民事","objectives":["掌握审判组织、庭前准备、法庭调查辩论、公开审理及裁判出口。"],"sections":[{"title":"庭前准备和审判组织","body":"法院对提起公诉案件依法审查，符合条件的应决定开庭。开庭前依法送达起诉书副本、告知权利、通知出庭等；法定情形可召开庭前会议了解证据争议、非法证据排除、回避等意见。庭前会议不是代替法庭调查的秘密定罪程序。普通程序合议庭组成及人民陪审员参加应依组织法、陪审员法和刑诉法相应规则判断。"},{"title":"法庭审理与公开原则","body":"法庭调查围绕证据展开，控辩双方依法出示证据、质证、申请通知新证人、调取新证据或重新鉴定勘验等，是否准许由法庭依法决定。法庭辩论后，被告人有最后陈述权，不能因已有律师辩论就取消。涉及国家秘密、个人隐私依法不公开审理；涉及商业秘密可依申请决定不公开。审理不公开不等于宣告判决也不公开。"},{"title":"裁判与附带民事边界","body":"事实清楚、证据确实充分并依法认定有罪的，作有罪判决；依法认定无罪的，作无罪判决；证据不足不能认定有罪，应作证据不足、指控不能成立的无罪判决。附带民事通常解决犯罪行为造成的法定物质损失范围，不宜把一切精神损害或所有违法所得追缴请求都直接塞入附带民事；符合条件的被害人等可依法提起，必要时检察院可依法提起保护国有、集体财产的请求。"}],"pitfalls":["不公开审理与不公开宣判不同。","被告人最后陈述不是辩护人辩论的重复替代。","存疑应依法判决无罪，不能长期无限拖延等待口供。"],"caseStudy":{"facts":"法院以案件涉及个人隐私为由不公开审理。庭审中证据不足，法院又称不公开案件可以直接内部归档，不必公开宣判。","analysis":"个人隐私可以构成不公开审理依据，但判决宣告应依公开宣判规则进行。证据不足不能认定被告人有罪时，应依法作证据不足、指控不能成立的无罪判决，而不是以内部归档替代裁判。庭审权利和裁判公开应分别审查。"},"method":"庭前合法准备→法庭调查→辩论→最后陈述→依证据与法律选裁判；公开审理例外只解决旁听范围。","sourceRefs":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第101—104、183—207条","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":[]}]},{"id":8,"title":"行政法与行政诉讼法","chapters":[]},{"id":17,"title":"民事诉讼法（含仲裁制度）","chapters":[{"id":"CIP-01","title":"民事诉讼基本原则与在线诉讼","objectives":["识别民事诉讼基本原则与在线诉讼的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"民事诉讼解决平等主体之间的人身和财产争议，程序问题原则上适用法院地法。平等原则保障双方享有同等诉讼机会，并不要求双方在每个环节承担相同义务。辩论原则要求当事人有机会就事实、证据和法律发表意见；处分原则允许当事人在法律范围内决定是否起诉、增加或放弃请求、和解及上诉，但不得借此损害国家、社会公共利益或他人合法权益。诚信原则贯穿起诉、举证、保全和执行，虚构债务与恶意串通不受处分原则保护。"},{"title":"制度比较与审题重点","body":"先区分法院调解与当事人自行和解：前者需要法院主持并依法形成调解结果，后者只是当事人的实体协议，不因签订就当然获得强制执行力。在线诉讼以当事人同意为前提，依法进行的在线活动与线下同等有效；不能因为一方拒绝在线审理就剥夺其线下诉权。法律监督由检察院依法实施，支持起诉者并不因此自动成为原告。"}],"pitfalls":["自愿不等于必然合法","支持起诉不等于代替被害人取得诉讼地位","在线诉讼不是法院可以无条件强制选择的方式"],"caseStudy":{"facts":"甲乙共同虚构借条，要求法院快速调解以排除真正债权人的执行。乙称双方自愿，法院无权过问。","analysis":"处分权只在法律范围内存在。法官应审查虚假诉讼迹象，不能将双方一致陈述视为当然真实，更不能用调解书帮助转移资产。真正债权人依法另循救济，不因未参加该虚假诉讼而当然丧失权利。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第3—16条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CIP-0001","CIP-0002","CIP-0003","CIP-0004","CIP-0005","CIP-0006"]},{"id":"CIP-02","title":"级别地域协议与专属管辖","objectives":["识别级别地域协议与专属管辖的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"管辖先解决哪一级法院，再解决哪个地域法院。基层法院原则上受理一审民事案件，中级法院受理重大涉外、本辖区重大影响及最高法确定的案件，不能把所有涉外案件都交给中院。一般地域规则是原告就被告；自然人住所与经常居住地不一致时，通常看经常居住地。合同诉讼可选择被告住所地或履行地，侵权可选择侵权行为地或被告住所地。"},{"title":"制度比较与审题重点","body":"专属管辖优先于一般、特别地域管辖及协议管辖：不动产、港口作业、继承遗产各有法定连接点。书面管辖协议适用于合同或其他财产权益纠纷，选定地点应与争议有实际联系，不得突破级别和专属管辖。多个有管辖权法院出现重复起诉时，比较最先立案而非最先寄出起诉状。受移送法院有异议应报请指定，不得自行再移送。"}],"pitfalls":["重大涉外不等于全部涉外","合同涉及房屋不当然都是专属管辖，先识别纠纷性质","最先立案规则以各法院本来都有管辖权为前提"],"caseStudy":{"facts":"甲乙就A市房屋所有权确认纠纷约定由与争议有关的B市法院管辖，甲又先到B市起诉。","analysis":"房屋所有权确认是不动产纠纷，受专属管辖约束。实际联系不能使违反专属管辖的协议有效，先立案也不能创造本来不存在的管辖权。应由不动产所在地法院处理。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第18—39条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CIP-0007","CIP-0008","CIP-0009","CIP-0010","CIP-0011","CIP-0012","CIP-0013","CIP-0014"]},{"id":"CIP-03","title":"审判组织与回避","objectives":["识别审判组织与回避的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"一审可依法由审判员、人民陪审员组成合议庭，也可由审判员组成；合议庭人数须为单数。简易程序独任审理，基层法院基本事实清楚、权利义务明确的一审普通程序案件也可依法独任。二审原则上由审判员组成合议庭，符合法定简易审结或裁定上诉案件且当事人同意时，可以依法独任。不能反推凡普通程序都必须合议。"},{"title":"制度比较与审题重点","body":"依法不得独任的案件及当事人对违法独任提出的异议须分别审查。回避针对审判人员等与案件或当事人存在法定关系，保障程序中立；不是只要一方不满意审判风格就能撤换法官。回避申请通常应在案件开始审理时提出，后来知道事由的可在法庭辩论终结前提出。回避复议与实体上诉是不同救济。"}],"pitfalls":["人民陪审员不参加二审合议庭","人数为单数不等于固定三人","回避申请有法定事由与时间要求"],"caseStudy":{"facts":"甲发现法官配偶是乙公司该案诉讼代理人，法官称自己不参与配偶工作所以不用回避。","analysis":"存在法定近亲属关系且其担任本案代理人，足以适用回避制度，不能用主观自称公正替代法定程序。应由有权主体依法作出回避决定。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第40—50条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CIP-0015","CIP-0016","CIP-0017","CIP-0018"]},{"id":"CIP-04","title":"诉讼主体与共同诉讼","objectives":["识别诉讼主体与共同诉讼的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"当事人须有诉讼权利能力，并按行为能力规则自行或由法定代理人诉讼。法人由法定代表人、其他组织由主要负责人参加，名称或代表人变化不当然导致实体权利义务消灭。共同诉讼需要区分诉讼标的共同与同一种类：必要共同诉讼有合一确定的要求，普通共同诉讼通常还要求法院认为可以合并且当事人同意。"},{"title":"制度比较与审题重点","body":"必要共同诉讼中，部分人的程序行为是否对其他人发生效力，应审查法律关系与共同诉讼规则；不能概括为一人承认便约束所有人。人数众多时可依法推选代表人，代表人的变更放弃请求、承认对方请求或和解涉及特别同意，不能只凭代表身份任意处分全部权利。"}],"pitfalls":["多个原告不当然是必要共同诉讼","法定代表人不是法人之外的另一个原告","代表诉讼不是无限处分授权"],"caseStudy":{"facts":"数名债权人对同一债务人分别享有互不关联的普通借款债权，要求所有案件必须作为必要共同诉讼处理。","analysis":"债权分别产生且可各自判决，不存在当然合一确定的关系。是否可合并审理与是否必须合并是两个问题，不能用同一被告取代必要共同诉讼的实体关联条件。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第51—57条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CIP-0019","CIP-0020","CIP-0021"]},{"id":"CIP-05","title":"第三人与诉讼参加","objectives":["识别第三人与诉讼参加的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"有独立请求权第三人对原被告争议的标的提出自己的独立请求，以起诉方式参加，诉讼地位具有独立性。无独立请求权第三人对标的没有独立请求，但案件处理与其有法律上的利害关系，可以申请或由法院通知参加。一般经济利益、证言关系或亲属关系，不当然达到法律上利害关系。"},{"title":"制度比较与审题重点","body":"第三人是否承担民事责任会影响其当事人诉讼权利与上诉权，不能将所有无独立请求权第三人均视为旁听者。第三人撤销之诉有未参加诉讼并非本人原因、原裁判内容错误且损害其民事权益等法定条件，不是任何案外人不满意判决均可使用。"}],"pitfalls":["独立请求须针对原诉争议标的","一般事实关联不足以当然产生第三人资格","第三人撤销之诉不是普通上诉替代品"],"caseStudy":{"facts":"甲乙争夺一幅画的所有权，丙主张画为其所有并要求返还；运输公司只担心案件拖延影响商誉。","analysis":"丙对争议画提出独立实体请求，可依法以有独立请求权第三人起诉参加。运输公司的商誉担忧不是本案裁判必然决定的法律利益，不能仅据此认定第三人资格。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第59条及相关第三人制度","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CIP-0022","CIP-0023"]},{"id":"CIP-06","title":"诉讼代理与特别授权","objectives":["识别诉讼代理与特别授权的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"无诉讼行为能力人由监护人作为法定代理人参加诉讼；法定代理与委托代理的权源不同。委托代理通常为一至二人，可由律师、基层法律服务工作者，或符合法定条件的近亲属、工作人员及经推荐的公民担任。委托手续应载明代理事项与权限，并依法提交授权委托书。"},{"title":"制度比较与审题重点","body":"代为承认、放弃、变更诉讼请求，和解，提起反诉或上诉等行为需要特别授权。仅写全权代理而无具体授权通常不能当然涵盖这些处分事项。特别授权也不能使代理人取得本来不属于当事人的权利。离婚案件即使有代理人，除不能表达意思者外，本人原则上仍应出庭；确有特殊情况不能出庭的，应提交书面意见。"}],"pitfalls":["全权代理不等于列明法定特别授权","代理人存在不当然免除离婚本人出庭要求","工作人员资格须有真实劳动人事关联"],"caseStudy":{"facts":"甲授权律师代收文书、参加庭审，委托书未载和解权限。律师庭外与乙约定放弃一半请求，甲拒绝认可。","analysis":"参加庭审和代收文书属于一般代理内容，放弃请求与和解涉及特别处分，须特别授权。不能仅因律师受聘就认定其有权处分实体请求，是否追认应另作判断。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第60—65条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CIP-0024","CIP-0025","CIP-0026"]},{"id":"CIP-07","title":"证据种类与证明责任","objectives":["识别证据种类与证明责任的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"证据包括当事人陈述、书证、物证、视听资料、电子数据、证人证言、鉴定意见、勘验笔录。证据种类取决于形成方式与证明机理，微信记录不是一律归书证，实物载体也不妨碍其中信息构成电子数据。任何证据都需查证属实，证明力通常不能仅按名称机械排序。"},{"title":"制度比较与审题重点","body":"行为意义上的举证责任是提供证据的诉讼负担；结果意义上的证明责任是在关键事实真伪不明时决定不利后果。谁主张谁举证是一般分配规则，但法律及司法解释对具体构成事实另有特别分配。法院调查取证并不当然改变证明责任归属，律师不能收集不等于法院应无条件替其寻找一切有利材料。"}],"pitfalls":["证据资格与证明力不同","法院调查证据不等于承担一方全部举证责任","真伪不明才适用结果责任"],"caseStudy":{"facts":"甲主张已向乙交付借款，乙否认收款。甲只有自己制作的记账表，无其他证据，案件审理后交付事实仍真伪不明。","analysis":"借款交付是请求返还的基础事实，原则上由甲承担证明责任。法院不能仅因乙无法证明未收款就倒置责任；甲自制账本的真实性、关联性和证明力还需综合判断。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第66—74条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CIP-0027","CIP-0028","CIP-0029"]},{"id":"CIP-08","title":"质证证人鉴定与证据保全","objectives":["识别质证证人鉴定与证据保全的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"证据原则上应经法庭出示和质证，秘密、商业秘密、隐私材料要保密，必要出示也不能公开展示其敏感内容。公证证明的事实和文书具有较强法定证明效力，但有足够相反证据推翻时并非绝对不可否定。书证原则上提交原件，客观困难时可依法用复制件等并结合全案核实。"},{"title":"制度比较与审题重点","body":"知悉案件情况者原则上负作证义务，不能正确表达意思者不能作证；是否为未成年人不是唯一判断条件。鉴定解决专门性问题，不能将法律适用交给鉴定人。对鉴定意见有异议或法院认为鉴定人有必要出庭的，应依法通知；拒不出庭的法定后果须与一般证人区别。证据可能灭失或以后难以取得时，可申请证据保全，诉前条件与财产保全不能混用。"}],"pitfalls":["公证不是不可反驳","鉴定人不是裁判者","保全证据和保全财产的目的不同"],"caseStudy":{"facts":"甲提交经公证的网页证据，乙拿出足够证据证明公证时网页被临时篡改。甲称公证文书不可推翻。","analysis":"公证效力允许被足以推翻的相反证据否定，法院仍应审查证据链。对网页与电子数据还要分析形成、保存、提取过程，不能将公证外观等同于待证事实绝对真实。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第71—84条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["CIP-0030"]},{"id":"CIP-09","title":"期间计算与送达","objectives":["识别期间计算与送达的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"法定期间与指定期间的来源不同，起算通常不计算开始的时和日。期间届满最后一日遇法定休假日的，以休假日后首个工作日为届满日；在途时间依法处理，不能把邮寄在途时间任意扣进当事人的法定答辩或上诉期间。因不可抗拒事由或其他正当理由耽误期间，可依法申请顺延，由法院决定。"},{"title":"制度比较与审题重点","body":"送达方式包括直接、留置、委托、邮寄、电子、转交、公告等，须依各自法定条件。电子送达以受送达人同意且能确认收悉为前提，可依法适用于判决书等文书；受送达人要求纸质文书时应提供。公告是法定替代方式，不能为了方便跳过其他可行方式。区分拒收与送达不能，拒收符合条件时可留置。"}],"pitfalls":["开始日通常不计入","公告不等于法院可随意选择","电子送达与电子诉讼同意要分别审查"],"caseStudy":{"facts":"乙已同意电子送达，法院以可确认其收悉的系统送达判决。乙以没有纸质件为由主张上诉期永不开始。","analysis":"依法电子送达与线下送达具有法定效力，纸质提供义务不当然否定已完成电子送达。必须核实同意、送达地址与收悉确认等条件，不能把普通聊天消息等同于合规送达。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第85—95条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"CIP-10","title":"诉讼调解和解与司法确认","objectives":["识别诉讼调解和解与司法确认的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"法院调解贯彻自愿、合法，双方对事实无争议也不能省略合法性审查。调解通常由审判人员主持，协议可由当事人自愿达成，但不能强迫接受特定金额。依法需要调解书的，调解书经双方签收发生法律效力；调解书送达前反悔的，法院应及时判决，另有无需制作调解书情形的按笔录签名等规则处理。"},{"title":"制度比较与审题重点","body":"当事人自行和解协议不当然等于生效调解书，撤诉之后请求强制执行和解协议一般缺少直接执行依据。司法确认属于特别程序，须当事人共同在法定期限内向有管辖权法院申请，确认有效后方可依法申请执行。调解书的法定再审事由与判决再审事由应区分。"}],"pitfalls":["调解签字与调解书签收不是同一生效规则","自行和解不当然可强制执行","司法确认需共同申请并满足法定期限"],"caseStudy":{"facts":"甲乙自行和解后甲撤诉，乙未按和解协议付款。甲持和解协议直接请求法院按生效判决强制执行。","analysis":"需要区分普通和解协议与具有执行力的法律文书。单纯撤诉加和解通常不能产生执行依据，甲可依法通过诉讼等方式主张权利，不能将法院准许撤诉视为法院审查并确认全部和解内容。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第96—102条、第205—206条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"CIP-11","title":"诉前诉中保全与先予执行","objectives":["识别诉前诉中保全与先予执行的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"保全旨在防止将来裁判难以执行或避免其他损害，可针对财产或行为。诉中保全通常依申请，必要时法院可依职权；法院可以责令担保，拒不提供则驳回。诉前保全以情况紧急和难以弥补损害为要件，应提供担保，可向财产所在地、被申请人住所地或对案件有管辖权法院申请。"},{"title":"制度比较与审题重点","body":"诉前保全后应在采取措施后三十日内依法起诉或申请仲裁，否则应解除。紧急保全有四十八小时裁定要求，作出保全裁定应立即执行。保全限于请求范围或与案件有关财物，错误申请可能负赔偿责任。先予执行着眼生活或经营急需，须符合法定案件类型及权利义务明确等条件，不以案件尚未判决为由一概禁止。"}],"pitfalls":["诉前担保原则上必须，诉中担保是可以责令","三十日起点是采取措施后","保全不等于债权已获最终确认"],"caseStudy":{"facts":"劳动者追索欠薪且生活困难，企业又准备转移可供执行资产，劳动者同时询问先予执行和财产保全。","analysis":"先判断各制度目的：保全是保住可执行财产，先予执行是提前实现特定急迫给付。两者可分别审查法定要件，不能把查封直接当作给付，也不能仅因欠薪就不审查先予执行条件。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第103—111条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"CIP-12","title":"起诉条件受理与管辖异议","objectives":["识别起诉条件受理与管辖异议的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"起诉应有与本案直接利害关系的原告、明确被告、具体请求及事实理由，并属于民事受诉范围与受诉法院管辖。立案受理重在程序入口，不等于实体请求已被证明。对依法符合条件的起诉应登记立案，欠缺法定条件的处理要区分补正、不予受理和受理后驳回起诉。"},{"title":"制度比较与审题重点","body":"被告在提交答辩状期间可提出管辖异议，法院依法审查并作裁定；对不服管辖异议裁定的救济应依法律。没有提出管辖异议而应诉答辩，符合条件时可能构成应诉管辖，但不得违反级别和专属管辖。有效仲裁协议排除法院受理有特定规则，不能在诉讼全过程任意保留仲裁抗辩。"}],"pitfalls":["胜诉条件不等于起诉条件","驳回起诉与驳回诉讼请求不同","应诉不能补正专属管辖违法"],"caseStudy":{"facts":"甲向有管辖权法院起诉要求归还借款，法院以甲目前证据不够充分为由拒绝立案。","analysis":"起诉所需事实理由和实体胜诉证明程度不是同一标准。只要符合起诉条件，不能因对实体举证预先判断而拒绝诉权，交付事实是否被证明应在审理中判断。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第122—130条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"CIP-13","title":"普通程序庭审判决与诉讼障碍","objectives":["识别普通程序庭审判决与诉讼障碍的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"普通程序以庭前准备、法庭调查、法庭辩论、最后陈述和裁判等环节保障充分审理。合法传唤后原告无正当理由不到庭，通常按撤诉处理；被告无正当理由不到庭可依法缺席判决，但缺席不等于原告当然胜诉。法院仍须审查证据和请求是否合法。"},{"title":"制度比较与审题重点","body":"中止是暂时停止程序，障碍消除后恢复；终结是因法定原因无继续程序必要而结束。判决主要处理实体争议，裁定主要解决法定程序事项，不能仅看文书名称猜测能否上诉。普通程序一审通常有六个月审限及法定延长机制，不应与简易、小额或涉外特别期限混用。"}],"pitfalls":["缺席不是自动认输","中止与终结的可恢复性不同","文书救济依法定种类而不是所有裁定均可上诉"],"caseStudy":{"facts":"被告乙收到合法传票后无故不出庭，原告甲请求法院不审查欠款证据直接判其全胜。","analysis":"可以缺席审理并依法判决，但法院不能把乙缺席等同承认全部事实。应审查甲的诉讼请求、证据真实性和法律依据，违法利息等请求仍须依法处理。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第131—157条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"CIP-14","title":"简易程序与小额诉讼","objectives":["识别简易程序与小额诉讼的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"简易程序适用于基层及派出法庭审理的事实清楚、权利义务明确、争议不大的简单案件；当事人也可在法定范围内约定适用。简便不代表可以省略辩论、回避或合法送达。发现不宜适用简易的，应依法转为普通程序。"},{"title":"制度比较与审题重点","body":"小额诉讼是特定简单金钱给付案件的一审终审程序，依法以本省、自治区、直辖市上年度就业人员年平均工资等标准确定适用范围，并存在依法约定适用及法定排除情形。不是所有标的额低的案件都可适用，身份、涉外、需评估鉴定、当事人提出反诉等要特别辨别。小额与简易一般程序的上诉权、审限不同。"}],"pitfalls":["简单案件不等于小额案件","一审终审仅适用于法定小额等制度","程序转换不能任意剥夺应有上诉权"],"caseStudy":{"facts":"甲要求解除婚姻关系并分割少量存款，法院仅因争议金额很低便拟适用小额诉讼一审终审。","analysis":"须先识别争议性质，婚姻身份关系不属于可仅按金额纳入小额的简单金钱给付案件。应按适用程序条件处理，不能用标的额取代案件类型审查。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第160—170条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"CIP-15","title":"第二审程序与禁止遗漏救济","objectives":["识别第二审程序与禁止遗漏救济的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"地方一审判决的通常上诉期为送达之日起十五日，依法可上诉裁定为十日，起算与送达须结合期间规则。上诉通常经原审提出，直接向二审法院提出不当然无效，二审应依法移交。二审围绕上诉请求相关事实和法律进行审查，法定例外和涉及公共利益事项另论。"},{"title":"制度比较与审题重点","body":"二审原则上开庭，满足法定条件时可不开庭，不等于所有没有新证据案件必然书面审理。事实清楚适法正确则维持；错误则依法改判、撤销或变更；基本事实不清可发回或查清后处理；严重程序违法应依法撤销发回。发回后重新作判又上诉的处理有限制，不能无限循环发回。"}],"pitfalls":["判决十五日与裁定十日区分","直接递交二审不当然无效","二审不开庭是有条件的可以而不是一律"],"caseStudy":{"facts":"乙在判决送达后第十四日向二审法院直接交上诉状，一审法院称未经过自己所以无效。","analysis":"乙在法定上诉期内提出上诉，直接向二审递交不当然剥夺上诉权。二审应按法定期间将上诉状移交原审，后续送达、答辩及卷宗报送按法定程序进行。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第171—183条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"CIP-16","title":"再审程序与检察监督","objectives":["识别再审程序与检察监督的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"再审针对已生效裁判等的法定错误救济，不是当事人无条件享有的第三审。申请再审应依管辖、期限和法定事由提出，一般申请再审不停止原裁判执行。新的证据必须足以推翻原裁判等达到相应法定标准，不能把迟交任何材料都称为新证据再审。"},{"title":"制度比较与审题重点","body":"法院依职权再审、当事人申请再审、检察机关抗诉或检察建议的发动主体和条件不同。调解书再审须注意违反自愿原则或协议内容违法等针对性条件。向检察院申请监督有适用条件，不能绕过法定的法院再审程序要求直接要求检察院改判；检察院依法监督而不直接替法院作实体终局裁判。"}],"pitfalls":["再审不是延长上诉期","申请再审不自动停止执行","判决和调解书再审条件不同"],"caseStudy":{"facts":"甲仅因对已经生效的一审判决不满意，在上诉期满后申请再审，并要求法院自动停止执行。","analysis":"再审应审查是否具有法定事由及其他条件，单纯不满意不是独立事由。申请再审通常不停止执行，是否依法中止执行取决于法定程序决定，不能由申请行为自动产生。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第209—224条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"CIP-17","title":"特别程序督促与公示催告","objectives":["识别特别程序督促与公示催告的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"特别程序多处理非讼事项，依法一审终审；审理中发现存在民事权益争议，应终结特别程序并告知另诉。宣告失踪、死亡、指定遗产管理人、认定行为能力、财产无主、司法确认及担保物权实现各有特定主体、法院与公告要求，不能混用普通两造对抗程序。"},{"title":"制度比较与审题重点","body":"督促程序适用于金钱或有价证券给付的法定条件，支付令异议与普通答辩不同；及时有效书面异议可依法导致督促终结并按规定转诉。公示催告针对可依法背书转让票据等法定事项，丧失票据不等于债权当然消灭，除权判决与票据实体权利争议诉讼也不同。"}],"pitfalls":["非讼发现争议的处理不是当然驳回实体请求","支付令须满足法定给付范围和条件","除权判决不消灭善意持票人的一切实体救济"],"caseStudy":{"facts":"甲申请实现抵押权，乙提出确有证据支持的主债权数额实质争议。甲要求法院仍必须在非讼程序中最终确定全部实体责任。","analysis":"担保物权实现程序有自己的审查边界，存在不符合法定条件的争议应依法驳回申请并允许另诉，不应把简便非讼程序变成剥夺当事人充分对抗权的普通实体审判。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第184—208条、第225—239条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"CIP-18","title":"执行依据异议与执行措施","objectives":["识别执行依据异议与执行措施的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"强制执行必须有生效且具有给付等可执行内容的法律文书，并符合法定申请或移送条件。申请执行期间通常为二年，法定中止、中断依规定处理。执行法院可以依法查询、冻结、划拨、扣留、拍卖等，但范围、比例和被执行人及扶养家属生活必需品保护都受法律约束。"},{"title":"制度比较与审题重点","body":"区分当事人或利害关系人针对执行行为提出异议，与案外人基于实体权利请求排除对特定标的执行的异议：前者通常衔接复议，后者还要区分与原裁判是否有关而进入审判监督或执行异议之诉。执行和解、终结本次执行、终结执行和中止执行不是同一制度，发现财产能否恢复须看具体法律状态。"}],"pitfalls":["执行不能重做实体审判","行为异议与案外人异议不同","终本不当然消灭债务"],"caseStudy":{"facts":"法院冻结丙名下设备用于清偿乙债务，丙主张设备归自己所有，并非仅认为冻结方式不规范。","analysis":"丙主张实体权利排除标的执行，应走案外人异议等相应路径，而不是简单套用对执行行为的复议。须进一步分析其主张是否与执行依据原裁判有关，避免救济路径混淆。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第240—269条及相关执行规定","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"CIP-19","title":"涉外诉讼管辖送达与外国裁判","objectives":["识别涉外诉讼管辖送达与外国裁判的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"涉外性并不把案件自动排除出我国法院，需按特别连接点、书面选择、应诉、专属管辖等审查。2023修法对与中国有适当联系的涉外纠纷、平行诉讼、法院不方便及外国判决承认执行进行了扩展和细化，不能继续只背旧法少数连接点。"},{"title":"制度比较与审题重点","body":"涉外送达、调查取证、答辩上诉期间及审限另有规则，不能直接把境内十五日上诉期套用于在我国境内无住所的当事人。承认外国判决应区分条约、互惠、拒绝承认事由及管辖审查；承认判决并不当然等于已完成财产执行。外交渠道、国际条约渠道和电子送达均有法定条件，不得违反外国法限制。"}],"pitfalls":["无住所涉外当事人期间有特别规定","涉外不等于都由中院管辖","承认与执行是相互联系但不同环节"],"caseStudy":{"facts":"外国公司在我国境内无住所，被法院按境内普通民事判决十五日上诉期认定其上诉过期。","analysis":"应先核实涉外特别期间规则及合法送达，不能机械套用境内一般期限。对在中国境内无住所当事人的法定三十日上诉期等应正确适用，延长期限申请还需依法审查。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第270—305条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"CIP-20","title":"仲裁范围与仲裁协议","objectives":["识别仲裁范围与仲裁协议的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"2025年修订仲裁法自2026年3月1日起施行。平等主体自然人、法人、非法人组织的合同和其他财产权益纠纷可仲裁，婚姻、收养、监护、扶养、继承及依法由行政机关处理的行政争议不适用本法仲裁。劳动、农村土地承包、体育仲裁有特别法律，不应混作商事仲裁。"},{"title":"制度比较与审题重点","body":"商事仲裁以自愿的仲裁协议为基础，协议须依法满足形式和内容要求，并注意新法对协议成立、仲裁地等的规定。仲裁条款独立性意味着主合同变更、解除、终止或无效不当然使仲裁协议失效，但不能据此推导任何含糊条款均有效。仲裁不实行级别、地域管辖，不等于法院保全与司法审查没有管辖规则。"}],"pitfalls":["新法已生效，不能继续引用旧法条号","身份纠纷与其附带财产问题不能不加区分一概仲裁","主合同无效不当然否定仲裁条款"],"caseStudy":{"facts":"甲乙在货物合同中约定有效仲裁条款，后来甲主张主合同因违法无效，并要求法院只因主合同无效就否定仲裁条款。","analysis":"应独立审查仲裁协议效力。主合同效力争议本身通常可落入仲裁范围，独立性不等于预断主合同有效，也不排除仲裁协议本身因法定事由无效。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国仲裁法（2025修订）","url":"https://legalinfo.moj.gov.cn/pub/sfbzhfx/zt/2025nzt0120/xcgvxxddzcf/202509/t20250915_525094.html","article":"第3—11条、第三章","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"CIP-21","title":"仲裁申请组庭开庭与裁决","objectives":["识别仲裁申请组庭开庭与裁决的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"仲裁申请、受理、答辩和反请求依法律及依法选定机构规则进行，未答辩不当然阻碍仲裁。仲裁庭的组成和仲裁员选定须尊重当事人约定及法定程序；仲裁员有法定回避事由应依法回避。仲裁可以依法通过信息网络在线进行，但当事人明确不同意的除外，与民诉在线程序的同意表达规则不可简单画等号。"},{"title":"制度比较与审题重点","body":"仲裁一般不公开，当事人协议公开时也不能违反国家秘密等限制。和解可依法请求仲裁庭根据协议作裁决，也可撤回申请；仲裁调解应自愿，依法成立调解书的效力需依新法。裁决一裁终局，不能把机构内部复核或纠错理解为普通二审上诉。缺席裁决也要保障通知与陈述机会，不能不通知即裁。"}],"pitfalls":["未答辩不等于自动胜负","在线仲裁与在线民诉的表述有差异","终局性不排除法定司法监督"],"caseStudy":{"facts":"乙已收到合规仲裁通知但无正当理由缺席，甲认为仲裁庭可以完全不审查证据，直接照其申请作裁决。","analysis":"依法缺席仲裁不排除审查证据与实体规则。仲裁庭仍须依事实和法律公平合理解决纠纷，保障法定通知、组庭和回避程序，不能把缺席当成全部事实自认。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国仲裁法（2025修订）","url":"https://legalinfo.moj.gov.cn/pub/sfbzhfx/zt/2025nzt0120/xcgvxxddzcf/202509/t20250915_525094.html","article":"第四章、第五章","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"CIP-22","title":"仲裁撤销执行与涉外特别规则","objectives":["识别仲裁撤销执行与涉外特别规则的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"裁决终局不意味着法院可以任意重审实体结论，也不意味着完全没有司法救济。申请撤销与申请不予执行的发动阶段、主体、法定事由、期限和法律后果应按2025修订仲裁法及相关程序法逐项判断，不能直接套用旧法六个月撤销期间等记忆。"},{"title":"制度比较与审题重点","body":"法院对无仲裁协议、超出协议范围、仲裁程序违法、仲裁员违法以及社会公共利益等法定事项依法审查。撤销或不予执行后，当事人可依法根据重新达成的仲裁协议仲裁或起诉，不能拿原裁决已失去效力作为对方永远无请求权的理由。涉外仲裁新增或调整的仲裁地、境外机构及特定范围临时仲裁等规则应结合新法适用要件，不能泛化为一切国内纠纷都可任意临时仲裁。"}],"pitfalls":["撤销与不予执行路径不同","不得沿用旧法撤销期限","临时仲裁的主体地域及涉外条件不能省略"],"caseStudy":{"facts":"甲不服仲裁对证据证明力的普通评价，要求法院按第二审方式重新判断，并直接改判仲裁金额。","analysis":"应核对是否落入法定撤销或不予执行事由。普通实体评价分歧不当然赋予法院二审改判仲裁的权力；若确有法定事由，应依法作相应裁定而非将仲裁变成普通两审诉讼。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国仲裁法（2025修订）","url":"https://legalinfo.moj.gov.cn/pub/sfbzhfx/zt/2025nzt0120/xcgvxxddzcf/202509/t20250915_525094.html","article":"第五—七章","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]}]},{"id":11,"title":"商法","chapters":[{"id":"BUS-01","title":"公司人格登记与责任隔离","objectives":["识别公司人格登记与责任隔离的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"公司是企业法人，以自己的全部财产对外承担责任；有限责任公司股东以认缴额为限、股份公司股东以认购股份为限对公司承担责任。必须分清公司的责任财产与股东的出资义务，有限责任并非公司只以注册资本现金对外清偿。公司名称、住所、章程、登记与法定代表人的产生均有法定要求，登记具有公示功能但不能为虚假出资或滥用人格提供保护。"},{"title":"制度比较与审题重点","body":"分公司不具有法人资格，民事责任原则上由公司承担；子公司具有法人资格并独立承担责任。法定代表人以公司名义从事职务活动，法律后果由公司承受，内部职权限制通常不得对抗善意相对人。股东滥用法人独立地位逃债、严重损害债权人利益时，可触发人格否认，须证明法定要件，不能只因母子关系或关联交易便一概连带。"}],"pitfalls":["公司全部财产责任不等于股东无限责任","分公司与子公司不同","关联关系本身不能代替人格否认要件"],"caseStudy":{"facts":"甲全资控制乙公司，长期把乙货款直接汇入个人账户，用乙名义逃避到期债务。甲主张自己只需承担已经认缴的出资。","analysis":"应先审查财产混同、逃债及债权人严重受损等人格否认要件。有限责任是基本制度，但不能成为滥用公司独立地位的保护。独资或全资控制本身不自动导致连带责任，题中具体混同行为才是分析重点。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国公司法","url":"https://www.samr.gov.cn/djzcj/zcfg/fl/art/2026/art_9b4263a169cf43c2aba950cfc9ac1af2.html","article":"第3—15条、第23条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"BUS-02","title":"公司资本出资催缴与失权","objectives":["识别公司资本出资催缴与失权的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"现行公司法对新设有限责任公司规定股东原则上自成立起五年内缴足认缴资本，特殊法定规定从其规定，存量公司须另看过渡安排。非货币财产出资须可货币估价并依法转让，核实评估和财产权转移不可省略。董事会应核查出资，发现未按期足额缴纳，应由公司发出书面催缴，怠于履职造成损失的责任董事可能承担赔偿。"},{"title":"制度比较与审题重点","body":"出资失权并非逾期次日自动发生。书面催缴可设置宽限期，依法不得少于六十日，期满仍不履行，须经董事会决议并书面发出失权通知，涉及未缴出资对应股权。公司不能清偿到期债务时，公司或已到期债权人可依法要求未届期限股东提前缴纳，不能把期限利益理解为永不受债权人挑战。抽逃出资与未履行出资形式不同，责任结构也要分别审查。"}],"pitfalls":["五年制注意设立时间与过渡规定","失权须催缴宽限期及董事会程序","加速到期不等于任意债权都可无条件穿透"],"caseStudy":{"facts":"公司欠付到期工程款且已无力清偿，股东尚有两年出资期限，债权人请求提前履行。股东称只要章程期限未到，法院绝不能支持。","analysis":"现行法已经规定到期债务不能清偿时的出资加速到期规则。应核对债权已到期、公司不能清偿及未缴认缴出资等事实，不能无视法条仅维护章程约定期限。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国公司法","url":"https://www.samr.gov.cn/djzcj/zcfg/fl/art/2026/art_9b4263a169cf43c2aba950cfc9ac1af2.html","article":"第47—54条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"BUS-03","title":"股权转让股东资格与知情权","objectives":["识别股权转让股东资格与知情权的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"有限责任公司股权转让应区分股东之间与向股东以外转让，现行法对外转让重点是书面通知及同等条件优先购买权，不宜再套旧法其他股东过半数同意的旧式概括。取得股权与向公司主张股东权利存在名册规则，转让后公司应依法变更名册、出资证明和相关章程记载。"},{"title":"制度比较与审题重点","body":"未届期股权转让由受让人承担缴纳义务，受让人未按期缴纳时转让人依法承担补充责任；已届期未缴或非货币出资显著不足的转让另有连带责任及受让人善意例外，不能混为一种结构。知情权中查阅复制一般材料与查阅账簿凭证的条件不同，后者需书面说明目的，并存在不正当目的抗辩和司法救济。"}],"pitfalls":["未届期与已届期瑕疵转让责任不同","登记名册与合同效力不同","知情权并非毫无限制也不是公司可随意拒绝"],"caseStudy":{"facts":"甲将未届期认缴股权转让给乙，乙到期不缴。公司请求甲承担责任，甲以已退出公司抗辩。","analysis":"新法不允许转让人当然完全脱责，应先确认转让发生时是否未届期，再判断受让人到期未缴事实。该类情形转让人承担补充责任，而不是一概套用已届期瑕疵出资的连带结构。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国公司法","url":"https://www.samr.gov.cn/djzcj/zcfg/fl/art/2026/art_9b4263a169cf43c2aba950cfc9ac1af2.html","article":"第57条、第84—90条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"BUS-04","title":"股东会决议组织机关与忠实勤勉","objectives":["识别股东会决议组织机关与忠实勤勉的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"公司治理应分清股东会、董事会、经理与监事或法定替代监督结构的权限。股东会负责法定重大事项，董事会负责经营管理等法定职权，经理依章程或授权履职，不能用实际控制人的口头意见代替应有机关决议。不同公司类型、规模及法定条件影响组织设置，不应照搬单一旧模板。"},{"title":"制度比较与审题重点","body":"决议内容违法与程序或表决方式瑕疵可能引出无效、可撤销、不成立等不同救济，轻微程序瑕疵不影响决议时须结合规定判断。董事监事高管应履行忠实和勤勉义务，利益冲突交易、公司机会、同业竞争等事项须依法报告和决议；存在批准程序也不能当然免除所有实质违法责任。担保涉及股东或实际控制人时有特殊表决回避要求。"}],"pitfalls":["机关权限与对外合同效力不可混同","无效、撤销、不成立不是同义词","忠实义务不能仅以股东多数赞成为免责理由"],"caseStudy":{"facts":"控制股东要求公司为其个人借款提供担保，未经股东会决议，又亲自代表该股东参与相关表决。","analysis":"须分层判断公司担保决议机关、关联股东表决回避及对外担保合同效力，不能只看法定代表人是否签字。公司法明确的内部程序与相对人是否善意等对外规则应结合适用。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国公司法","url":"https://www.samr.gov.cn/djzcj/zcfg/fl/art/2026/art_9b4263a169cf43c2aba950cfc9ac1af2.html","article":"第15条、第25—28条、第58条以下、第180条以下","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"BUS-05","title":"公司合并减资解散与清算","objectives":["识别公司合并减资解散与清算的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"合并、分立、增资、减资改变公司资本和责任基础，须依法作决议、编制相应材料并保障债权人通知公告及救济。不能认为股东会一致同意就可以不通知债权人。减资返还财产尤其涉及资本维持，违法减资可能引起股东返还及责任人员赔偿等后果。"},{"title":"制度比较与审题重点","body":"公司解散、清算、注销是不同阶段。现行法董事为清算义务人，应在法定十五日内组织清算，清算组原则上由董事组成但有章程或股东会另选例外。清算期间公司存续，仅开展与清算有关活动；未依法清偿前不能先分剩余财产给股东。发现资不抵债应转向依法申请破产清算，不得继续以自行清算损害债权人。"}],"pitfalls":["解散不等于法人立即消灭","董事清算义务规则注意新法","股东先分钱不能对抗债权清偿顺序"],"caseStudy":{"facts":"公司营业期限届满，董事迟迟不组成清算组，股东已经分走公司现金，外部债务仍未清偿。","analysis":"应分别分析董事怠于履行清算义务、违法分配财产及股东返还等责任，不能将注销当成当然债务消灭方式。2023修订后的清算义务人规则已经改变，旧教材概括不能机械照用。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国公司法","url":"https://www.samr.gov.cn/djzcj/zcfg/fl/art/2026/art_9b4263a169cf43c2aba950cfc9ac1af2.html","article":"第218—240条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"BUS-06","title":"合伙与个人独资企业","objectives":["识别合伙与个人独资企业的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"普通合伙与有限合伙最重要的差别在合伙人类型、债务责任和事务执行资格。普通合伙人原则上对企业债务负无限连带责任；有限合伙人原则上以认缴额为限承担责任，但须注意其不得执行合伙事务及越权对外行为可能产生的特别责任。企业可以先以自有财产清偿，不足部分责任不因内部份额约定而消灭。"},{"title":"制度比较与审题重点","body":"内部损益分配、追偿与对外债务承担是不同层次。普通合伙的内部按份约定通常不能对抗外部债权人；某合伙人清偿超过内部应负份额后，可依法向其他合伙人追偿。个人独资企业不是公司，投资人承担无限责任，不能因营业执照上出现企业名称就误认有限责任。合伙协议、入退伙及份额转让存在多项特别规则，具体题目需依现行法条核验。"}],"pitfalls":["合伙企业不是所有合伙人均有限责任","内部约定不能代替对外法定责任","个人独资与一人公司不同"],"caseStudy":{"facts":"普通合伙人甲乙约定甲仅承担百分之十债务，企业财产不足清偿第三人债权。甲以内部约定拒绝对外连带责任。","analysis":"应先确认对外无限连带责任，再处理甲乙内部承担与追偿。内部约定不当然限制善意外部债权人的请求，有限合伙人的有限责任也不能倒置适用于普通合伙人。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国合伙企业法","url":"https://flk.npc.gov.cn/","article":"合伙企业法、个人独资企业法相关规定","checkedAt":"2026-11-24","status":"pending-review"}],"quizIds":[]},{"id":"BUS-07","title":"破产原因申请与受理效力","objectives":["识别破产原因申请与受理效力的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"企业法人不能清偿到期债务，且资产不足清偿全部债务或明显缺乏清偿能力，构成法定破产原因。不能清偿到期是现金履行状态，资产不足是账面或评估问题，明显缺乏清偿能力还需综合事实，三者关系不能误读成必须同时满足所有状态。重整还可适用于明显丧失清偿能力可能等法定情形。"},{"title":"制度比较与审题重点","body":"债务人、债权人及法定清算责任人申请范围不完全相同：债权人一般可请求重整或清算，不能代替债务人任意申请和解。受理而非简单提交申请引起一系列程序效力，包括管理人指定、个别清偿限制、有关执行中止及诉讼集中等。申请撤回与受理后的程序终结也要分别判断，不能在集体程序启动后由一人任意处置全体债权人利益。"}],"pitfalls":["破产申请不等于破产受理","资产不足与明显缺乏清偿能力为选择条件","债权人申请和解不是一般法定路径"],"caseStudy":{"facts":"债务人拖欠到期货款，虽持有账面价值较高但难以变现的资产，债权人请求破产清算。债务人称账面资产大于债务便永远不可能破产。","analysis":"资产大于债务不必然排除明显缺乏清偿能力。应结合到期债务未清偿及资产变现、执行等实际状态判断，不能只凭单一资产负债表数字下结论。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国企业破产法","url":"https://www.audit.gov.cn/n7/n34/n58/c109660/content.html","article":"第2—21条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"BUS-08","title":"管理人债务人财产与债权申报","objectives":["识别管理人债务人财产与债权申报的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"管理人由法院指定，依法接管、调查、管理处分债务人财产并履行其他职责，受法院和债权人会议等监督；不能把管理人简单视为债务人老板的受托私人代理。受理时属于债务人及受理后至终结前取得的依法财产，通常进入统一财产范围，设保财产仍可属于债务人财产但有优先受偿规则。"},{"title":"制度比较与审题重点","body":"债权申报使债权进入集体程序核查，不等于管理人对债权最终实体争议拥有终局审判权。未到期债权依法视为到期、附息债权依法停止计息等规则需注意受理节点；附条件、未决诉讼、担保和连带债务等申报亦有特别处理。劳动债权等依法无需一般申报但须调查公示核实，不能由此推出无需保障职工异议权。"}],"pitfalls":["设担保财产不必然脱离债务人财产","申报与债权确认不同","职工债权免申报不等于免核实"],"caseStudy":{"facts":
