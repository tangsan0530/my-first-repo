申请实现抵押权，乙提出确有证据支持的主债权数额实质争议。甲要求法院仍必须在非讼程序中最终确定全部实体责任。","analysis":"担保物权实现程序有自己的审查边界，存在不符合法定条件的争议应依法驳回申请并允许另诉，不应把简便非讼程序变成剥夺当事人充分对抗权的普通实体审判。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第184—208条、第225—239条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"民事诉讼法（含仲裁制度）"},{"id":"CIP-18","title":"执行依据异议与执行措施","objectives":["识别执行依据异议与执行措施的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"强制执行必须有生效且具有给付等可执行内容的法律文书，并符合法定申请或移送条件。申请执行期间通常为二年，法定中止、中断依规定处理。执行法院可以依法查询、冻结、划拨、扣留、拍卖等，但范围、比例和被执行人及扶养家属生活必需品保护都受法律约束。"},{"title":"制度比较与审题重点","body":"区分当事人或利害关系人针对执行行为提出异议，与案外人基于实体权利请求排除对特定标的执行的异议：前者通常衔接复议，后者还要区分与原裁判是否有关而进入审判监督或执行异议之诉。执行和解、终结本次执行、终结执行和中止执行不是同一制度，发现财产能否恢复须看具体法律状态。"}],"pitfalls":["执行不能重做实体审判","行为异议与案外人异议不同","终本不当然消灭债务"],"caseStudy":{"facts":"法院冻结丙名下设备用于清偿乙债务，丙主张设备归自己所有，并非仅认为冻结方式不规范。","analysis":"丙主张实体权利排除标的执行，应走案外人异议等相应路径，而不是简单套用对执行行为的复议。须进一步分析其主张是否与执行依据原裁判有关，避免救济路径混淆。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第240—269条及相关执行规定","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"民事诉讼法（含仲裁制度）"},{"id":"CIP-19","title":"涉外诉讼管辖送达与外国裁判","objectives":["识别涉外诉讼管辖送达与外国裁判的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"涉外性并不把案件自动排除出我国法院，需按特别连接点、书面选择、应诉、专属管辖等审查。2023修法对与中国有适当联系的涉外纠纷、平行诉讼、法院不方便及外国判决承认执行进行了扩展和细化，不能继续只背旧法少数连接点。"},{"title":"制度比较与审题重点","body":"涉外送达、调查取证、答辩上诉期间及审限另有规则，不能直接把境内十五日上诉期套用于在我国境内无住所的当事人。承认外国判决应区分条约、互惠、拒绝承认事由及管辖审查；承认判决并不当然等于已完成财产执行。外交渠道、国际条约渠道和电子送达均有法定条件，不得违反外国法限制。"}],"pitfalls":["无住所涉外当事人期间有特别规定","涉外不等于都由中院管辖","承认与执行是相互联系但不同环节"],"caseStudy":{"facts":"外国公司在我国境内无住所，被法院按境内普通民事判决十五日上诉期认定其上诉过期。","analysis":"应先核实涉外特别期间规则及合法送达，不能机械套用境内一般期限。对在中国境内无住所当事人的法定三十日上诉期等应正确适用，延长期限申请还需依法审查。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第270—305条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"民事诉讼法（含仲裁制度）"},{"id":"CIP-20","title":"仲裁范围与仲裁协议","objectives":["识别仲裁范围与仲裁协议的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"2025年修订仲裁法自2026年3月1日起施行。平等主体自然人、法人、非法人组织的合同和其他财产权益纠纷可仲裁，婚姻、收养、监护、扶养、继承及依法由行政机关处理的行政争议不适用本法仲裁。劳动、农村土地承包、体育仲裁有特别法律，不应混作商事仲裁。"},{"title":"制度比较与审题重点","body":"商事仲裁以自愿的仲裁协议为基础，协议须依法满足形式和内容要求，并注意新法对协议成立、仲裁地等的规定。仲裁条款独立性意味着主合同变更、解除、终止或无效不当然使仲裁协议失效，但不能据此推导任何含糊条款均有效。仲裁不实行级别、地域管辖，不等于法院保全与司法审查没有管辖规则。"}],"pitfalls":["新法已生效，不能继续引用旧法条号","身份纠纷与其附带财产问题不能不加区分一概仲裁","主合同无效不当然否定仲裁条款"],"caseStudy":{"facts":"甲乙在货物合同中约定有效仲裁条款，后来甲主张主合同因违法无效，并要求法院只因主合同无效就否定仲裁条款。","analysis":"应独立审查仲裁协议效力。主合同效力争议本身通常可落入仲裁范围，独立性不等于预断主合同有效，也不排除仲裁协议本身因法定事由无效。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国仲裁法（2025修订）","url":"https://legalinfo.moj.gov.cn/pub/sfbzhfx/zt/2025nzt0120/xcgvxxddzcf/202509/t20250915_525094.html","article":"第3—11条、第三章","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"民事诉讼法（含仲裁制度）"},{"id":"CIP-21","title":"仲裁申请组庭开庭与裁决","objectives":["识别仲裁申请组庭开庭与裁决的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"仲裁申请、受理、答辩和反请求依法律及依法选定机构规则进行，未答辩不当然阻碍仲裁。仲裁庭的组成和仲裁员选定须尊重当事人约定及法定程序；仲裁员有法定回避事由应依法回避。仲裁可以依法通过信息网络在线进行，但当事人明确不同意的除外，与民诉在线程序的同意表达规则不可简单画等号。"},{"title":"制度比较与审题重点","body":"仲裁一般不公开，当事人协议公开时也不能违反国家秘密等限制。和解可依法请求仲裁庭根据协议作裁决，也可撤回申请；仲裁调解应自愿，依法成立调解书的效力需依新法。裁决一裁终局，不能把机构内部复核或纠错理解为普通二审上诉。缺席裁决也要保障通知与陈述机会，不能不通知即裁。"}],"pitfalls":["未答辩不等于自动胜负","在线仲裁与在线民诉的表述有差异","终局性不排除法定司法监督"],"caseStudy":{"facts":"乙已收到合规仲裁通知但无正当理由缺席，甲认为仲裁庭可以完全不审查证据，直接照其申请作裁决。","analysis":"依法缺席仲裁不排除审查证据与实体规则。仲裁庭仍须依事实和法律公平合理解决纠纷，保障法定通知、组庭和回避程序，不能把缺席当成全部事实自认。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国仲裁法（2025修订）","url":"https://legalinfo.moj.gov.cn/pub/sfbzhfx/zt/2025nzt0120/xcgvxxddzcf/202509/t20250915_525094.html","article":"第四章、第五章","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"民事诉讼法（含仲裁制度）"},{"id":"CIP-22","title":"仲裁撤销执行与涉外特别规则","objectives":["识别仲裁撤销执行与涉外特别规则的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"裁决终局不意味着法院可以任意重审实体结论，也不意味着完全没有司法救济。申请撤销与申请不予执行的发动阶段、主体、法定事由、期限和法律后果应按2025修订仲裁法及相关程序法逐项判断，不能直接套用旧法六个月撤销期间等记忆。"},{"title":"制度比较与审题重点","body":"法院对无仲裁协议、超出协议范围、仲裁程序违法、仲裁员违法以及社会公共利益等法定事项依法审查。撤销或不予执行后，当事人可依法根据重新达成的仲裁协议仲裁或起诉，不能拿原裁决已失去效力作为对方永远无请求权的理由。涉外仲裁新增或调整的仲裁地、境外机构及特定范围临时仲裁等规则应结合新法适用要件，不能泛化为一切国内纠纷都可任意临时仲裁。"}],"pitfalls":["撤销与不予执行路径不同","不得沿用旧法撤销期限","临时仲裁的主体地域及涉外条件不能省略"],"caseStudy":{"facts":"甲不服仲裁对证据证明力的普通评价，要求法院按第二审方式重新判断，并直接改判仲裁金额。","analysis":"应核对是否落入法定撤销或不予执行事由。普通实体评价分歧不当然赋予法院二审改判仲裁的权力；若确有法定事由，应依法作相应裁定而非将仲裁变成普通两审诉讼。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国仲裁法（2025修订）","url":"https://legalinfo.moj.gov.cn/pub/sfbzhfx/zt/2025nzt0120/xcgvxxddzcf/202509/t20250915_525094.html","article":"第五—七章","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"民事诉讼法（含仲裁制度）"},{"id":"BUS-01","title":"公司人格登记与责任隔离","objectives":["识别公司人格登记与责任隔离的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"公司是企业法人，以自己的全部财产对外承担责任；有限责任公司股东以认缴额为限、股份公司股东以认购股份为限对公司承担责任。必须分清公司的责任财产与股东的出资义务，有限责任并非公司只以注册资本现金对外清偿。公司名称、住所、章程、登记与法定代表人的产生均有法定要求，登记具有公示功能但不能为虚假出资或滥用人格提供保护。"},{"title":"制度比较与审题重点","body":"分公司不具有法人资格，民事责任原则上由公司承担；子公司具有法人资格并独立承担责任。法定代表人以公司名义从事职务活动，法律后果由公司承受，内部职权限制通常不得对抗善意相对人。股东滥用法人独立地位逃债、严重损害债权人利益时，可触发人格否认，须证明法定要件，不能只因母子关系或关联交易便一概连带。"}],"pitfalls":["公司全部财产责任不等于股东无限责任","分公司与子公司不同","关联关系本身不能代替人格否认要件"],"caseStudy":{"facts":"甲全资控制乙公司，长期把乙货款直接汇入个人账户，用乙名义逃避到期债务。甲主张自己只需承担已经认缴的出资。","analysis":"应先审查财产混同、逃债及债权人严重受损等人格否认要件。有限责任是基本制度，但不能成为滥用公司独立地位的保护。独资或全资控制本身不自动导致连带责任，题中具体混同行为才是分析重点。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国公司法","url":"https://www.samr.gov.cn/djzcj/zcfg/fl/art/2026/art_9b4263a169cf43c2aba950cfc9ac1af2.html","article":"第3—15条、第23条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"商法"},{"id":"BUS-02","title":"公司资本出资催缴与失权","objectives":["识别公司资本出资催缴与失权的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"现行公司法对新设有限责任公司规定股东原则上自成立起五年内缴足认缴资本，特殊法定规定从其规定，存量公司须另看过渡安排。非货币财产出资须可货币估价并依法转让，核实评估和财产权转移不可省略。董事会应核查出资，发现未按期足额缴纳，应由公司发出书面催缴，怠于履职造成损失的责任董事可能承担赔偿。"},{"title":"制度比较与审题重点","body":"出资失权并非逾期次日自动发生。书面催缴可设置宽限期，依法不得少于六十日，期满仍不履行，须经董事会决议并书面发出失权通知，涉及未缴出资对应股权。公司不能清偿到期债务时，公司或已到期债权人可依法要求未届期限股东提前缴纳，不能把期限利益理解为永不受债权人挑战。抽逃出资与未履行出资形式不同，责任结构也要分别审查。"}],"pitfalls":["五年制注意设立时间与过渡规定","失权须催缴宽限期及董事会程序","加速到期不等于任意债权都可无条件穿透"],"caseStudy":{"facts":"公司欠付到期工程款且已无力清偿，股东尚有两年出资期限，债权人请求提前履行。股东称只要章程期限未到，法院绝不能支持。","analysis":"现行法已经规定到期债务不能清偿时的出资加速到期规则。应核对债权已到期、公司不能清偿及未缴认缴出资等事实，不能无视法条仅维护章程约定期限。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国公司法","url":"https://www.samr.gov.cn/djzcj/zcfg/fl/art/2026/art_9b4263a169cf43c2aba950cfc9ac1af2.html","article":"第47—54条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"商法"},{"id":"BUS-03","title":"股权转让股东资格与知情权","objectives":["识别股权转让股东资格与知情权的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"有限责任公司股权转让应区分股东之间与向股东以外转让，现行法对外转让重点是书面通知及同等条件优先购买权，不宜再套旧法其他股东过半数同意的旧式概括。取得股权与向公司主张股东权利存在名册规则，转让后公司应依法变更名册、出资证明和相关章程记载。"},{"title":"制度比较与审题重点","body":"未届期股权转让由受让人承担缴纳义务，受让人未按期缴纳时转让人依法承担补充责任；已届期未缴或非货币出资显著不足的转让另有连带责任及受让人善意例外，不能混为一种结构。知情权中查阅复制一般材料与查阅账簿凭证的条件不同，后者需书面说明目的，并存在不正当目的抗辩和司法救济。"}],"pitfalls":["未届期与已届期瑕疵转让责任不同","登记名册与合同效力不同","知情权并非毫无限制也不是公司可随意拒绝"],"caseStudy":{"facts":"甲将未届期认缴股权转让给乙，乙到期不缴。公司请求甲承担责任，甲以已退出公司抗辩。","analysis":"新法不允许转让人当然完全脱责，应先确认转让发生时是否未届期，再判断受让人到期未缴事实。该类情形转让人承担补充责任，而不是一概套用已届期瑕疵出资的连带结构。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国公司法","url":"https://www.samr.gov.cn/djzcj/zcfg/fl/art/2026/art_9b4263a169cf43c2aba950cfc9ac1af2.html","article":"第57条、第84—90条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"商法"},{"id":"BUS-04","title":"股东会决议组织机关与忠实勤勉","objectives":["识别股东会决议组织机关与忠实勤勉的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"公司治理应分清股东会、董事会、经理与监事或法定替代监督结构的权限。股东会负责法定重大事项，董事会负责经营管理等法定职权，经理依章程或授权履职，不能用实际控制人的口头意见代替应有机关决议。不同公司类型、规模及法定条件影响组织设置，不应照搬单一旧模板。"},{"title":"制度比较与审题重点","body":"决议内容违法与程序或表决方式瑕疵可能引出无效、可撤销、不成立等不同救济，轻微程序瑕疵不影响决议时须结合规定判断。董事监事高管应履行忠实和勤勉义务，利益冲突交易、公司机会、同业竞争等事项须依法报告和决议；存在批准程序也不能当然免除所有实质违法责任。担保涉及股东或实际控制人时有特殊表决回避要求。"}],"pitfalls":["机关权限与对外合同效力不可混同","无效、撤销、不成立不是同义词","忠实义务不能仅以股东多数赞成为免责理由"],"caseStudy":{"facts":"控制股东要求公司为其个人借款提供担保，未经股东会决议，又亲自代表该股东参与相关表决。","analysis":"须分层判断公司担保决议机关、关联股东表决回避及对外担保合同效力，不能只看法定代表人是否签字。公司法明确的内部程序与相对人是否善意等对外规则应结合适用。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国公司法","url":"https://www.samr.gov.cn/djzcj/zcfg/fl/art/2026/art_9b4263a169cf43c2aba950cfc9ac1af2.html","article":"第15条、第25—28条、第58条以下、第180条以下","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"商法"},{"id":"BUS-05","title":"公司合并减资解散与清算","objectives":["识别公司合并减资解散与清算的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"合并、分立、增资、减资改变公司资本和责任基础，须依法作决议、编制相应材料并保障债权人通知公告及救济。不能认为股东会一致同意就可以不通知债权人。减资返还财产尤其涉及资本维持，违法减资可能引起股东返还及责任人员赔偿等后果。"},{"title":"制度比较与审题重点","body":"公司解散、清算、注销是不同阶段。现行法董事为清算义务人，应在法定十五日内组织清算，清算组原则上由董事组成但有章程或股东会另选例外。清算期间公司存续，仅开展与清算有关活动；未依法清偿前不能先分剩余财产给股东。发现资不抵债应转向依法申请破产清算，不得继续以自行清算损害债权人。"}],"pitfalls":["解散不等于法人立即消灭","董事清算义务规则注意新法","股东先分钱不能对抗债权清偿顺序"],"caseStudy":{"facts":"公司营业期限届满，董事迟迟不组成清算组，股东已经分走公司现金，外部债务仍未清偿。","analysis":"应分别分析董事怠于履行清算义务、违法分配财产及股东返还等责任，不能将注销当成当然债务消灭方式。2023修订后的清算义务人规则已经改变，旧教材概括不能机械照用。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国公司法","url":"https://www.samr.gov.cn/djzcj/zcfg/fl/art/2026/art_9b4263a169cf43c2aba950cfc9ac1af2.html","article":"第218—240条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"商法"},{"id":"BUS-06","title":"合伙与个人独资企业","objectives":["识别合伙与个人独资企业的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"普通合伙与有限合伙最重要的差别在合伙人类型、债务责任和事务执行资格。普通合伙人原则上对企业债务负无限连带责任；有限合伙人原则上以认缴额为限承担责任，但须注意其不得执行合伙事务及越权对外行为可能产生的特别责任。企业可以先以自有财产清偿，不足部分责任不因内部份额约定而消灭。"},{"title":"制度比较与审题重点","body":"内部损益分配、追偿与对外债务承担是不同层次。普通合伙的内部按份约定通常不能对抗外部债权人；某合伙人清偿超过内部应负份额后，可依法向其他合伙人追偿。个人独资企业不是公司，投资人承担无限责任，不能因营业执照上出现企业名称就误认有限责任。合伙协议、入退伙及份额转让存在多项特别规则，具体题目需依现行法条核验。"}],"pitfalls":["合伙企业不是所有合伙人均有限责任","内部约定不能代替对外法定责任","个人独资与一人公司不同"],"caseStudy":{"facts":"普通合伙人甲乙约定甲仅承担百分之十债务，企业财产不足清偿第三人债权。甲以内部约定拒绝对外连带责任。","analysis":"应先确认对外无限连带责任，再处理甲乙内部承担与追偿。内部约定不当然限制善意外部债权人的请求，有限合伙人的有限责任也不能倒置适用于普通合伙人。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国合伙企业法","url":"https://flk.npc.gov.cn/","article":"合伙企业法、个人独资企业法相关规定","checkedAt":"2026-11-24","status":"pending-review"}],"quizIds":[],"subjectTitle":"商法"},{"id":"BUS-07","title":"破产原因申请与受理效力","objectives":["识别破产原因申请与受理效力的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"企业法人不能清偿到期债务，且资产不足清偿全部债务或明显缺乏清偿能力，构成法定破产原因。不能清偿到期是现金履行状态，资产不足是账面或评估问题，明显缺乏清偿能力还需综合事实，三者关系不能误读成必须同时满足所有状态。重整还可适用于明显丧失清偿能力可能等法定情形。"},{"title":"制度比较与审题重点","body":"债务人、债权人及法定清算责任人申请范围不完全相同：债权人一般可请求重整或清算，不能代替债务人任意申请和解。受理而非简单提交申请引起一系列程序效力，包括管理人指定、个别清偿限制、有关执行中止及诉讼集中等。申请撤回与受理后的程序终结也要分别判断，不能在集体程序启动后由一人任意处置全体债权人利益。"}],"pitfalls":["破产申请不等于破产受理","资产不足与明显缺乏清偿能力为选择条件","债权人申请和解不是一般法定路径"],"caseStudy":{"facts":"债务人拖欠到期货款，虽持有账面价值较高但难以变现的资产，债权人请求破产清算。债务人称账面资产大于债务便永远不可能破产。","analysis":"资产大于债务不必然排除明显缺乏清偿能力。应结合到期债务未清偿及资产变现、执行等实际状态判断，不能只凭单一资产负债表数字下结论。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国企业破产法","url":"https://www.audit.gov.cn/n7/n34/n58/c109660/content.html","article":"第2—21条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"商法"},{"id":"BUS-08","title":"管理人债务人财产与债权申报","objectives":["识别管理人债务人财产与债权申报的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"管理人由法院指定，依法接管、调查、管理处分债务人财产并履行其他职责，受法院和债权人会议等监督；不能把管理人简单视为债务人老板的受托私人代理。受理时属于债务人及受理后至终结前取得的依法财产，通常进入统一财产范围，设保财产仍可属于债务人财产但有优先受偿规则。"},{"title":"制度比较与审题重点","body":"债权申报使债权进入集体程序核查，不等于管理人对债权最终实体争议拥有终局审判权。未到期债权依法视为到期、附息债权依法停止计息等规则需注意受理节点；附条件、未决诉讼、担保和连带债务等申报亦有特别处理。劳动债权等依法无需一般申报但须调查公示核实，不能由此推出无需保障职工异议权。"}],"pitfalls":["设担保财产不必然脱离债务人财产","申报与债权确认不同","职工债权免申报不等于免核实"],"caseStudy":{"facts":"甲拥有对破产企业的未到期合同债权，管理人以合同期限未到为由拒绝其参加申报。","analysis":"破产受理对未到期债权有加速到期等法定效果，甲不应仅因原合同期限未届而被排除。是否真实存在、金额及优先属性仍需依法核查，申报不自动等于全部确认。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国企业破产法","url":"https://www.audit.gov.cn/n7/n34/n58/c109660/content.html","article":"第22—59条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"商法"},{"id":"BUS-09","title":"破产撤销抵销取回与分配","objectives":["识别破产撤销抵销取回与分配的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"管理人可对受理前法定期间内的无偿转让、不合理价格交易、偏颇清偿等法定行为请求撤销，但应分别核对行为类型、期间和例外，不能把破产前全部交易一概撤销。债务人的无效财产行为另有返还规则。取回权以他人财产不应归入破产分配为基础，别除或担保优先权则仍是在特定财产价值上受偿，概念不同。"},{"title":"制度比较与审题重点","body":"破产抵销不是所有相互欠款都能抵销，须审查取得债权、负担债务的时间、明知状态等法定限制。破产费用与共益债务优先于一般分配，并存在财产不足时各自的处理规则；职工相关债权、社保税款与普通债权有法定顺序，担保优先、特定财产与不足部分另行判断。不得把所有职工请求都无条件置于一切担保债权之前。"}],"pitfalls":["取回与担保优先受偿不同","抵销有时间与恶意限制","清偿顺序须先区分费用共益和担保"],"caseStudy":{"facts":"企业破产后，仓库内一批由甲寄存且权属清楚的货物被管理人准备拍卖分配。甲持所有权证明请求取回。","analysis":"若货物确属甲并无法定障碍，应依取回权规则处理，不属于甲作为普通债权人分取货物价款的问题。识别所有权归属是第一步，不能只凭财物位于债务人仓库便纳入破产财产。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国企业破产法","url":"https://www.audit.gov.cn/n7/n34/n58/c109660/content.html","article":"第30—43条、第109—120条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"商法"},{"id":"BUS-10","title":"重整计划和解与破产清算","objectives":["识别重整计划和解与破产清算的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"重整以企业经营价值与债务调整为核心，须依申请资格、法院裁定、经营管理方式、债权分组表决和计划批准执行等阶段判断。重整期间担保权行使可依法受限制，但担保物有损坏或价值明显减少等情况时有法定保护，不能把暂停执行误作担保权消灭。"},{"title":"制度比较与审题重点","body":"重整计划经依法批准具有约束力，但对债务人保证人和其他连带债务人的权利不能未经法定依据一并免除。和解主要由债务人依法申请，和解协议与重整计划的通过条件及担保债权地位不同。计划执行失败或和解违反法定条件时，依法可能进入清算，不能将一次计划批准理解为债务无条件永久豁免。"}],"pitfalls":["重整不是直接注销企业","表决通过与法院批准不同","对债务人减免不当然免除保证人"],"caseStudy":{"facts":"甲公司重整计划削减普通债权，保证人乙据此主张其保证责任自动同步全部免除。","analysis":"应核查重整计划对债务人及债权人的约束范围，以及法律对保证人、其他连带债务人责任的特别规定。债务人重整获减免不当然使第三人担保完全消失，不能混同主体。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国企业破产法","url":"https://www.audit.gov.cn/n7/n34/n58/c109660/content.html","article":"第70—106条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"商法"},{"id":"BUS-11","title":"票据行为票据权利与抗辩","objectives":["识别票据行为票据权利与抗辩的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"票据具有要式性、文义性和一定程度的无因性，须识别汇票、本票、支票及出票、背书、承兑、保证等不同票据行为。票据债务通常依签章和文义发生，票据基础关系与票据关系相对独立，但不意味着任何违法取得都能享有票据权利。签章伪造与其他真实签章的效力应依法区分。"},{"title":"制度比较与审题重点","body":"票据抗辩包括对物与对人等分析路径，直接当事人之间的基础关系抗辩与对合法后手的抗辩限制不同。不能将票据无因性说成一切抗辩均无效，也不能仅因原交易存在争议就对任何持票人拒付。真实交易、善意取得、恶意或重大过失取得、禁止转让等问题须与法条及相关解释核查。"}],"pitfalls":["文义性不保护恶意取得","伪造签章与其他真实签章效力需分开","直接基础关系抗辩不能无条件对抗后手"],"caseStudy":{"facts":"乙为支付货款签发汇票给甲，甲背书给善意丙。乙因与甲之间发生质量争议，拟不分条件拒绝向丙承担票据责任。","analysis":"应分开基础合同争议与对后手的票据抗辩。对直接相对人的特定抗辩不当然可对抗善意后手，同时须审查票据是否有效、丙取得是否符合条件，不能只背抽象无因性。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国票据法","url":"https://www.nfra.gov.cn/cn/view/pages/ItemDetail.html?docId=879935","article":"票据法总则及背书、付款规则","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"商法"},{"id":"BUS-12","title":"票据追索保全与权利救济","objectives":["识别票据追索保全与权利救济的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"票据持有人请求付款、提示承兑、追索和再追索处于不同阶段，其主体、法定期间与证明手续不同。追索通常在法定拒绝承兑、拒绝付款或其他提前追索事由发生后行使，不能将尚未出现条件的基础合同催收等同于票据追索。票据债务人之间依法可能承担连带责任，持票人选择请求与最终内部清偿顺序仍需区分。"},{"title":"制度比较与审题重点","body":"票据丧失可通过挂失止付、公示催告或普通诉讼等法定路径救济，各自适用范围、主体和条件不同。挂失止付不是最终确权裁判，也不使权利期限当然无限延长。票据权利因法定原因消灭后是否存在利益返还请求须另行审查，不可把所有实体权利与程序救济一并认定消灭。"}],"pitfalls":["挂失止付不是除权判决","追索与基础债权请求不同","权利消灭与利益返还请求区分"],"caseStudy":{"facts":"甲遗失可背书转让汇票，办理挂失止付后认为无需再通过任何法定程序，银行必须永久替其保留款项。","analysis":"挂失止付是临时止付措施，不能代替公示催告除权或实体诉讼等最终救济。应依票据种类和法定期间继续办理，避免把临时措施理解为永久权利确认。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国票据法","url":"https://www.nfra.gov.cn/cn/view/pages/ItemDetail.html?docId=879935","article":"票据法第15条及追索权章节","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"商法"},{"id":"BUS-13","title":"保险利益告知义务与代位求偿","objectives":["识别保险利益告知义务与代位求偿的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"人身保险利益原则上在订约时审查，财产保险被保险人的保险利益在事故发生时审查，不能把两个时间点混用。投保人对保险人的询问承担依法如实告知义务，故意或重大过失、足以影响承保或费率等决定解除及事故责任后果；保险人解除权还有知悉后三十日和成立后二年的限制，知道未告知仍承保等情形另论。"},{"title":"制度比较与审题重点","body":"保险合同成立、生效、责任开始并非在任何题目都同一时间；免责条款应履行提示说明等法定义务。财产保险的损失填补、重复保险、保险标的转让及代位求偿要注意适用条件；人身保险通常不能套用财产保险代位规则。投保、被保险、受益三类主体可以重叠但不是同义词，死亡保险还有本人同意等特别要求。"}],"pitfalls":["人身与财产保险利益时间点不同","故意和重大过失的退费后果不同","财产保险代位不能随意用于人身保险"],"caseStudy":{"facts":"保险人明确询问健康情况，投保人故意隐瞒足以影响承保的病史；保险人在合同成立三年后首次主张按一般告知规则解除。","analysis":"应先判断违反告知的主客观要件，再审查解除权法定时间限制。不能看到故意隐瞒就跳过成立后二年的限制，也要分辨其他依法可能存在的独立规则，避免把解除权、诈骗及合同效力混同。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国保险法","url":"https://xzfy.moj.gov.cn/c/2021-01-06/487603.shtml","article":"第12—19条、第31条以下、第60条以下","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"商法"},{"id":"BUS-14","title":"证券发行交易披露与投资者保护","objectives":["识别证券发行交易披露与投资者保护的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"证券公开发行须依法注册，注册不等于监管机关保证证券价值或发行人盈利。公开发行包括向不特定对象、累计超过法定人数的特定对象等情形，法定员工持股计划人数排除规则不能遗漏。非公开发行不得借广告、公开劝诱等变相公开。"},{"title":"制度比较与审题重点","body":"证券交易公平依赖信息披露和禁止内幕交易、操纵市场等规则。重大信息的内幕性、知情人或非法获取信息者身份、交易与泄露等行为应逐项分析，不能仅凭交易赚钱认定内幕交易。信息披露应真实、准确、完整、及时、公平，虚假陈述责任涉及重大性、因果关系、过错及责任主体等法定和解释规则，不能把股价下跌一律归责于发行人。"}],"pitfalls":["注册不是投资收益背书","公开发行不只看人数","交易盈利不是内幕交易全部构成条件"],"caseStudy":{"facts":"某公司以非公开发行名义在公共网站向社会广泛发布认购广告，并声称只要控制最终认购人数就不受公开发行监管。","analysis":"公开方式和对象范围本身具有法律意义，不能仅靠最后人数包装规避监管。应同时审查向不特定对象发行及公开劝诱等事实，非公开称谓不决定法律性质。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国证券法","url":"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202111/t20211124_2544351.html","article":"第2—12条及交易、信息披露、投资者保护章节","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"商法"},{"id":"BUS-15","title":"海商法新旧衔接与商事综合审题","objectives":["识别海商法新旧衔接与商事综合审题的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"2025修订海商法自2026年5月1日起施行，章节覆盖船舶物权、海上货物及旅客运输、租船、拖航、碰撞、救助、共同海损、责任限制、保险、时效及涉外法律适用。学习时必须先确定法律事实时间及履行跨越新旧法等衔接，不能继续无差别引用1992年旧条号或把生效后公布页面误认为立法日期。"},{"title":"制度比较与审题重点","body":"最高法时间效力规定对一般不溯及既往与特定衔接情形作规定。船舶抵押、运输单证含电子记录、承运人责任、海事赔偿责任限制各有严格条件，不宜用一般民法口号代替海商特别法；反之，特别法未规定且可适用一般法时也不能凭海事性质拒绝一切补充规则。商事综合题还要区分主体组织、合同基础、担保财产、程序管辖及破产集体清偿层次。"}],"pitfalls":["施行时间与公布时间不同","新旧法不能按诉讼日期一刀切","专业特别法问题需逐项识别，不凭行业名称泛化"],"caseStudy":{"facts":"海上运输合同在新法施行前订立，部分履行及相关法律事实发生于施行后。承运人主张所有问题一律适用旧法，托运人主张一律适用新法。","analysis":"应先梳理每个法律事实和争议事项发生时间，再依新法及最高法时间效力规定逐项判断，不能仅以签约日或起诉日一个日期包办全部问题。具体责任限额等变化须查现行条文后再计算。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国海商法","url":"https://cj.msa.gov.cn/xxgk/zc/zcfg/202607/t20260707_3571861.shtml","article":"海商法第310条及最高法法释〔2026〕8号","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"商法"},{"id":"IPR-01","title":"著作权客体与权利层次","objectives":["识别表达和思想","区分著作权与物权","定位不同利用行为"],"sections":[{"title":"先判断是不是作品","body":"作品保护不是对一切劳动成果授予垄断。审题先找文学、艺术、科学领域内能够以一定形式表现的独创性智力成果；创作不要求达到艺术大奖水平，但机械复制、单纯事实和抽象方法不能仅因耗费人力就成为作品。历史事件、数学公式和做菜思路可以被他人利用，具体写成的独创文章、照片和插画却可能受保护。法律法规及其官方正式译文另被排除，不能把官方法律文本收费发行后声称拥有文本著作权。"},{"title":"从使用方式定位财产权","body":"复制关注制作一份或多份；发行关注向公众出售或赠与有形原件、复制件；网络传播关注公众能在各自选择的时间地点取得作品。现场演唱、投影放映、电视播出不是同一权利。相同视频被下载保存、上传点播、在商场播放，可能分别触及不同权利。题目问的是哪项权利时，要把行为拆开，不要把一切网络行为都概括成复制或发行。"},{"title":"人身权与载体所有权","body":"作者署名与作品不受歪曲篡改，不能因画作出售而当然转让。买受人取得的是原件物权，著作权是否许可或转让需要另找法律或合同依据；美术、摄影原件的展览权依法由原件所有人享有，故不能反过来认为买画人完全没有任何展示权。改编已有作品创作新表达，新增独创部分可产生权利，但利用改编作品通常仍须处理原作品权利。"},{"title":"独创性审查的证据与论证","body":"当两个创作者都描绘同一座古桥时，桥的形状和客观比例不是某一画家的私有题材。甲的构图角度、明暗安排、线条组织和色彩搭配可以形成表达。乙从同一地点独立观察后完成不同画面，不应因题材相同就被推定侵权。若乙直接临摹甲的特殊构图并只改动少量颜色，分析对象便是受保护表达的实质使用。作答时应指出哪些元素属于公有领域、哪些元素体现个性化选择；单说“两幅画很像”缺乏法律归类，单说“题材不能垄断”又可能漏掉具体表达的复制。"},{"title":"层次化训练与反例","body":"一种常见复合题是：甲写出旅行线路构思，乙据此独立写作游记，丙复制乙的游记并署甲的名字。甲不能仅凭最初构思成为乙文章的作者；乙独立形成的文字表达可受保护；丙即便标了某个人名，也不能消除复制、发行或署名错误的问题。另一种反例是新闻稿中的事实与评论分离：赛事比分属于事实，记者对比赛节奏的独创评论和摄影作品仍须分别判断。考场上先把事实信息从作品表达剥离，再逐个主体、逐项行为匹配权利，可避免把“可以引用事实”误写成“可以整篇照搬报道”。"},{"title":"应当形成的答题结论","body":"完整结论至少包含客体、权利人、行为、规范与结果五个环节。例如应写“油画为受保护的美术作品，乙为作者；甲购得原件后依法享有原件展览权，但未取得复制发行许可，所以公开展出与制作画册应作不同评价；署名权仍由乙保有”。这样的表述说明了为何一部分合法、一部分越界，而非依赖一个总标签。遇到题干没有交代授权时，应只在题目已给事实与通常法定规则内推理，不凭空补出一份概括许可合同。"}],"pitfalls":["将勤奋劳动等同独创性","把买下原稿理解成买下全部著作权","混同点播、直播和有形复制品销售"],"caseStudy":{"facts":"甲买下乙创作的油画原件，在自家展厅展出，并把画面扫描后印成收费画册，封面删除作者姓名。","analysis":"应拆成三个行为：合法原件所有人的展览具有法定依据；批量印刷画册涉及复制、发行，不能由买画的物权当然推出授权；删除署名还涉及作者署名权。答案不能以“甲是所有人”一概肯定全部行为，也不能以“乙保留著作权”一概否定展览。"},"method":"先客体，再权属，再逐行为定位权利，最后查许可或法定限制。","sourceRefs":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第3、5、10、20条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["IPR-0001","IPR-0002","IPR-0003","IPR-0004","IPR-0005","IPR-0016","IPR-0017","IPR-0018","IPR-0026","IPR-0028"],"subjectTitle":"知识产权法"},{"id":"IPR-02","title":"著作权归属、合作与职务成果","objectives":["区分合作与汇编","判断职务作品和委托作品","理解视听作品权属"],"sections":[{"title":"作者识别与合作作品","body":"自然人作者通常是直接创作作品者，提供资金、场地、修改意见不当然成为共同作者。合作作品要求共同创作意思与实质创作贡献；能够分割使用的，各自创作部分可以独立享有著作权，但行使不得侵犯整体。若只是按照编辑取舍编成选集，独创选择编排可能形成汇编作品，原作品权利与汇编新增权利并存。"},{"title":"职务不等于单位包揽","body":"受雇完成工作任务构成职务作品后，还须区分一般职务作品与法律列明的特殊职务作品。一般情形下作者享有著作权、单位在业务范围内有优先使用权；工程设计图、产品设计图、地图、示意图、计算机软件等在主要利用单位物质技术条件并由单位承担责任等法定条件下，作者一般只享有署名权，其他著作权由单位享有。不能只因使用一台单位电脑就机械套用特殊规则。"},{"title":"合同约定与法律默认","body":"委托作品先查合同权属约定，约定不明时原则上由受托创作者享有著作权，付款不等于全部权利转移。电影、电视剧作品与其他视听作品须分别适用法律规则，导演、编剧等作者的署名和报酬权，与制作者享有的著作权可以并存。审题必须先识别作品种类，再找约定，不能统一套用“出钱者所有”。"},{"title":"共同作品的行使与保护","body":"合作作者之间不能因为无法达成一致就任由一方剥夺另一方作者身份。对不可分割的合作作品，法律对行使方式有专门安排，任何一方无正当理由不得阻止他方依法行使相应权利，收益也须合理分配；但转让、专有许可、出质等涉及重大处分的事项与一般使用不能混同。能够分割使用的章节、乐曲等，则需审查单独行使是否影响整体合作作品。若甲只是校正错别字、提供资料或作行政管理，不能把此种辅助劳动等同于独创创作贡献，考点是作者身份而不是劳动量大小。"},{"title":"职务与委托关系的交叉","body":"同一个项目可能同时存在公司与员工的劳动关系，以及公司与客户的委托关系。应先判断员工完成的成果在内部归谁，再判断公司向客户承诺转让了哪些权利。客户支付设计费，不会自动改变员工与公司之间的法定署名安排；公司也不能转让自己并未取得的权利。题干若明确成果在单位主持、代表单位意志创作并由单位承担责任，还要与法人作品制度作区分，不能直接把“单位组织创作”和“员工职务作品”当成完全同义。"},{"title":"合同审查的落点","body":"实务式题目常以“全案交付”“买断设计”“可用于宣传”等模糊表述作为干扰。需要区分作品载体交付、特定目的使用许可、专有许可和著作权财产权转让。许可范围未明确的部分不能当然认定已经授予；作者人身权也不能简单用买断字样排除。答题不是让考生替当事人补全合同，而是先说明条款存在什么归属或使用范围争点，再依据默认规则与已给目的作有限判断。"}],"pitfalls":["把出资、组织劳动直接算共同创作","把全部职务作品都认定单位享有","委托合同沉默时默认委托人所有"],"caseStudy":{"facts":"广告公司付费委托自由插画师制作海报，合同只写交付时间和价格，未约定著作权。公司后来将海报授权其他商户印刷。","analysis":"委托费用解决履行报酬，不当然解决著作权归属。未明确约定权属时，应按受托人享有规则判断，再审查委托目的范围内的使用及另行授权是否越界；不能仅因公司付款就认定可以任意转授权。"},"method":"列清贡献者、雇佣或委托关系、作品类型、合同条款，分别归属。","sourceRefs":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第11至19条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["IPR-0006","IPR-0007","IPR-0008","IPR-0009","IPR-0010","IPR-0019","IPR-0020","IPR-0021","IPR-0022","IPR-0027","IPR-0029"],"subjectTitle":"知识产权法"},{"id":"IPR-03","title":"著作权限制、期限与救济","objectives":["区分合理使用与法定许可","掌握期限起算","分析侵权责任条件"],"sections":[{"title":"限制规则需要逐项对应","body":"合理使用不是“公益”标签。应落到个人学习、适当引用、课堂教学等具体类型，还须满足署名等一般要求，不影响作品正常使用、不不合理损害权利人合法利益。学校把整本畅销教材扫描给全校长期免费下载，不能仅因不收费就认定课堂教学合理使用。法定许可则常允许免许可但须支付报酬，不能与免费使用混淆。"},{"title":"期限按权利和主体分别计算","body":"自然人作品财产权及发表权通常以作者终生及死亡后五十年为基本结构，合作作品关注最后死亡作者。署名、修改和保护完整等权利保护不受通常财产权期限限制。法人或非法人组织作品、视听作品等另有起算规则，不可统一按创作日加五十年。著作权法修订对摄影作品等还有过渡规定，跨期题应先确定时间点。"},{"title":"责任与免责要分层","body":"判断侵权先看权利和利用行为，再审查授权与限制。停止侵害与赔偿的条件不能混为一谈。发行者主张合法来源、网络平台主张技术服务免责，都应核实其承担的证明义务、知道或应当知道状况及收到通知后的措施，不能认为凡是平台或购买者就当然免责。恶意且情节严重等条件可能影响惩罚性赔偿，不能把所有侵权都按倍数赔偿。"},{"title":"合理使用的三层审查","body":"第一层是法定类型：主体、用途、作品发表状态、数量或范围是否符合条文；第二层是署名、作品名称等一般义务；第三层是不得影响作品正常使用并不得不合理损害权利人的合法利益。任何一层不符都不能只靠“公益”补正。课堂播放的范围、供多少人使用、是否上传到公众平台，是会改变结论的关键事实。适当引用也要服务于介绍、评论或说明问题，若引用部分成为作品主体，或以引用名义替代购买原作，应进一步否定其适当性。"},{"title":"保护期限与继受取得","body":"买受人、继承人或受让人取得财产权，不意味着产生一轮新的保护期间。作者死亡后，继承财产权的家属只能在剩余法定期间内行使，而不是自继承日起重新计算五十年。不同权利分别讨论也十分必要：财产权届满不意味着可以伪称自己是作者，保护作品完整等人身利益不能按同一时点全部归零。题目如同时给出生、创作、发表、转让、死亡日期，应先标注每个日期在何种权利计算中有意义，不能机械挑最大的日期往后加年限。"},{"title":"损害赔偿的答题方法","body":"一旦题目进入损害赔偿，应查清权利人实际损失、侵权人违法所得、许可使用费参考及法定赔偿等不同路径适用条件，不能跳过事实直接报最高金额。惩罚性赔偿还涉及故意与情节严重等专门要件，停止侵害、赔偿损失、消除影响、赔礼道歉也不是每案必然同时适用。对未成年人课堂使用、平台中立技术服务、善意发行合法来源等事实，需定位具体责任规则，不能将一般合同免责条款直接用来对抗不在合同内的权利人。"}],"pitfalls":["不收费必然合理使用","五十年保护期从购买日算","法定许可无需付酬","所有侵权均惩罚性赔偿"],"caseStudy":{"facts":"教师在课堂上展示数段已发表纪录片分析拍摄方法，注明作品与作者；随后出版社把整部纪录片二维码作为收费培训套餐卖点。","analysis":"前一行为应按课堂教学的具体范围和一般限制要求审查；后一行为面向社会商业传播，不能直接继承课堂教学的限制事由。使用目的、规模和市场替代效果发生变化，应分别判断，不能共享一个“教育用途”结论。"},"method":"分行为、分权利、分时间、分责任项目审查，避免将一种免责扩张到所有请求。","sourceRefs":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第22至25、52至54条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["IPR-0011","IPR-0012","IPR-0013","IPR-0014","IPR-0015","IPR-0023","IPR-0024","IPR-0025","IPR-0030"],"subjectTitle":"知识产权法"},{"id":"IPR-04","title":"专利客体、授权条件与申请","objectives":["区分三种专利","分析新颖创造实用","掌握申请与权属"],"sections":[{"title":"三种客体不是同一技术标准","body":"发明可以针对产品、方法及其改进；实用新型针对产品的形状、构造或其结合提出适于实用的新技术方案；外观设计保护富有美感并适于工业应用的整体或局部设计。纯粹经营规则、科学发现、疾病诊断和治疗方法等具有法定排除，不能把一切新想法都包装成专利。对用药制造方法与对人直接治疗的方法，要分别判断。"},{"title":"申请日与现有技术","body":"新颖性需要将每项技术方案与申请日前公开的现有技术比较。创造性还须分析区别特征及显而易见性；实用性不是市场销量保证。发明与实用新型创造性要求存在法定差别。保密内部资料不当然构成已向公众公开，但在先申请在后公开可能构成抵触申请，不能只查公开日而漏掉申请日。"},{"title":"职务发明与披露","body":"执行单位任务或主要利用单位物质技术条件完成的发明创造，申请权、专利权通常归单位，并依法保障发明人、设计人的署名及奖励报酬。利用单位物质技术条件另有约定时要审查约定。中国完成的发明或实用新型向外国申请，可能涉及事先保密审查；在境外递交不是逃避保密义务的方法。"},{"title":"公开、优先权与宽限例外","body":"申请日前公开是新颖性审查的重要分界，但并非凡申请人自己公开就没有任何补救。法律对法定展会、规定的学术会议、他人未经同意泄露等情形设置条件严格的不丧失新颖性期间，应核对公开类型、期间和证明要求；不能把任何网店发布都视为法定展会。优先权则是在法律或条约条件下援用在先申请时间，其功能与公开宽限不同。考生应分别写出最早申请、主张优先权、对外公开和后申请的顺序，而不是以“有六个月或十二个月”一语代替全部条件。"},{"title":"同日申请的特殊处理","body":"同样发明创造通常只能授予一项专利权。实务上同一申请人同日就同样成果同时申请发明与实用新型，有法定衔接安排，但不是可以长期保有两项重叠权利并重复索赔。要核对同日、同一申请人、在先获得的实用新型尚未终止，以及放弃声明等条件。两位不同申请人独立完成相同技术时，创造先后本身并不当然决定授权顺位，申请先后及相关法定规则才是重要判断基础，不能把著作权的独立创作逻辑直接搬来处理专利排他权。"},{"title":"方法与产品的例题拆解","body":"例如甲提出一种治疗流程并设计配套机器，不能以“与治病有关”为由把整项成果全部排除，也不能把直接作用于人体的诊断治疗步骤作为普通方法发明当然授权。配套装置可能属于产品技术方案，制药方法与药品也有独立审查路径。再如只描述提高经营收入的抽象规则，若没有构成符合专利法要求的技术方案，不能仅因写成软件流程图就跨过客体门槛。授权审查要先解决能否进入专利保护，再讨论是否满足新颖性等条件。"}],"pitfalls":["实用新型保护任何新方法","产品获奖等于具有新颖性","专利申请权归属与发明人署名混同"],"caseStudy":{"facts":"研发人员在公司安排的项目中完成新阀门构造，公司申请实用新型。员工认为方案由自己想出，拒绝把自己列为发明人之外的任何权利安排。","analysis":"应把创造者身份与财产权属拆开。职务发明符合条件时申请权可归公司，员工仍享有发明人署名并涉及法定奖励报酬。若争议是公司拿了成果却不署名，不能据此否认公司本来可能享有的申请权。"},"method":"先识别专利类型与排除事由，再画时间轴判断公开，最后处理申请权和保密。","sourceRefs":[{"title":"中华人民共和国专利法（2020年修正）","url":"https://www.cnipa.gov.cn/art/2020/11/23/art_524_171347.html","effectiveDate":"2021-06-01","article":"第2、6、16、19、22、25条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"知识产权法"},{"id":"IPR-05","title":"专利权范围、期限与不侵权抗辩","objectives":["从权利要求判断技术范围","分清侵权与无效","掌握法定不侵权情形"],"sections":[{"title":"范围由权利要求而非商品外观宣传决定","body":"发明与实用新型保护范围以权利要求内容为准，说明书及附图可用于解释。对方产品是否包含全部必要技术特征，应逐项比对；功能相同不必然侵权，名称不同也不必然不侵权。外观设计则以图片或照片展示的设计为准，简要说明可用于解释。不能拿专利摘要替代权利要求。"},{"title":"期限与效力路径","body":"发明二十年、实用新型十年、外观设计十五年的法定期限均从申请日起计算，但授权公告后才产生相应专利权效力，发明申请公布后的临时保护另论。部分发明可能依法获得期限补偿。被告认为专利不应授权，应走无效宣告等法定路径，不能仅因自己认为缺乏创造性就当然获得实施许可。"},{"title":"抗辩按事实精确适用","body":"权利用尽关注经专利权人或许可者合法售出的具体产品；先用权关注申请日前已制造或作好必要准备且限原有范围；实验例外不是把工业生产都叫测试。现有技术、合法来源等抗辩各有条件，合法来源一般影响赔偿责任而不当然免除停止销售等所有责任。为提供药品医疗器械审批信息而实施的法定例外，也不能扩张到无关商业销售。"},{"title":"从技术比对到行为类型","body":"即使被诉产品落入保护范围，还需确认被告实施的是制造、使用、许诺销售、销售或进口等受专利法控制的生产经营行为。个人非生产经营目的使用与商业制造的评价不能混同；外观设计专利的控制行为又与发明、实用新型存在文本区别。对专利方法直接获得的产品，也应审查方法与产品之间的联系，不可见到同类成品就推定使用相同方法。权利要求有多个技术特征时，应逐项展示对应关系，而不是拿核心零件“很接近”代替全部必要技术特征判断。"},{"title":"在先实施与既有产品流转","body":"先用权的时间要求在申请日前，且须已有制造、使用或必要准备，并受原有范围限制；在申请日后才开始模仿，即使尚未收到警告，也不是先用权。权利用尽针对获得合法授权进入流通的特定产品，不赋予购买者再制造一批相同产品的权利。经许可出售的机器可以依法继续转售，与拆解后按图批量造新机器应分开。题目常用“我已经买了”“我早就在计划”偷换依法出售与必要准备的事实，必须逐一拆穿。"},{"title":"程序、实体与赔偿抗辩的并行","body":"被告提出专利应当无效，与证明实施方案属于现有技术，处于不同论证路径。前者针对权利本身的授权合法性，后者可以在侵权争议中依法作为抗辩；合法来源则通常围绕特定主体的损害赔偿责任展开。遇到多种抗辩，不要只写“专利不稳定所以不侵权”，而应分别列出主管程序、举证对象和法律效果。案件中有诉前行为保全、证据保全或临时措施时，还应独立审查紧迫性、损害风险与担保等条件，不能由存在专利证书直接推出一切临时请求均应支持。"}],"pitfalls":["授权日才开始计算二十年","合法来源可以永远继续销售","先用权可以任意扩大产能","摘要就是保护范围"],"caseStudy":{"facts":"经销商持正规发票购入后来被认定侵权的设备，能证明不知道侵权且来源合法；收到权利人通知后仍继续销售库存。","analysis":"先审查其合法来源与善意证明是否成立。即使依法可免赔偿，也不能因此推导获得继续销售许可；停止侵害及后续明知销售责任仍需分别审查。其对上游的合同追偿与专利权人请求也属不同法律关系。"},"method":"按权利要求比对，再逐一审查不侵权、赔偿免责与无效程序，不把三条路径混用。","sourceRefs":[{"title":"中华人民共和国专利法（2020年修正）","url":"https://www.cnipa.gov.cn/art/2020/11/23/art_524_171347.html","effectiveDate":"2021-06-01","article":"第42、59、67、75、77条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"知识产权法"},{"id":"IPR-06","title":"商标、商业秘密与版本衔接","objectives":["识别显著性与禁用","区分注册使用侵权","把握商业秘密及新旧法"],"sections":[{"title":"注册与正当使用","body":"现行商标制度强调识别来源的显著性，通用名称、直接描述商品特点的标志原则上不能独占，但取得显著特征等条件需具体审查。相同商品上使用相同注册商标，与近似标志、类似商品上的混淆判断，适用条件不同。注册标志含通用或描述部分时，权利人不得禁止他人正当使用这些部分；驰名商标保护按事实需要个案认定，不是企业可以永久印在包装上的荣誉称号。"},{"title":"续展、许可与在先使用","body":"现行2019修正版下，注册商标十年有效，届满前十二个月申请续展，另有六个月宽展期。许可未经备案不得对抗善意第三人，不能简化成许可合同一律无效。具有一定影响的在先使用者在法定条件下可在原有范围继续使用，但注册人可以要求附加适当区别标识；继续使用不是任意扩张经营范围的通行证。"},{"title":"秘密保护与时间效力","body":"商业秘密要求非公知、商业价值和相应保密措施同时具备。客户名单不是自动秘密，反向工程与独立研发也不能仅因结果相似就定侵权；但以不正当手段先取得秘密后再辩称能够自行研发，不能当然免责。2025反不正当竞争法已经施行；2026商标修订虽已公布，但2027年1月1日才施行。本课程以2026年11月24日现行法为基准，未来法内容必须显著标明。"},{"title":"商标保护强度与商品联系","body":"未注册驰名商标在相同或类似商品上的保护，与已注册驰名商标跨类保护的要件不能合并。驰名状态是案件中根据保护需要认定的事实，还需关注复制、摹仿、翻译、误导公众和利益可能受损等条件。普通注册商标跨越不相类似商品时也不能仅凭注册就得到一切行业排他权。描述性使用、指示性事实与作为来源标志的使用应先区分，再审查是否落入专用权控制范围。商标制度不意味着可以把普通词汇从语言中永久拿走。"},{"title":"商业秘密案件的证明顺序","body":"权利人应先明确主张保密的信息具体内容，而不是笼统要求对方对一整座工厂保密；再说明信息未公开、具有商业价值，以及采取了与信息性质相适应的保护措施。访问权限、保密协议、加密管理、文件标识等可以成为证明线索，但一份保密协议也不使公开常识变成秘密。涉嫌侵权方的获取途径、接触机会和信息相同或实质相同，是进一步分析的事实。独立研发、从公开产品合法反向工程等合法来源，与盗取秘密后补做研发记录，不能得到相同评价。"},{"title":"新旧法学习的时间轴","body":"2026年修订商标法的公布日和施行日必须分别记忆。本批以2026年11月24日为观察点，现行实体规则仍需适用2019修正版；未来法不能用于提前否定当前行为。2025反不正当竞争法则已经进入现行规范，混淆、网络竞争、商业贿赂等条号应按新文本核对。做跨期题时先问行为何时发生、争议涉及何种法律关系、有没有特别过渡条款，再判断适用版本，不能把“最新网页上排在最前”的法条直接当成一切案件的依据。"}],"pitfalls":["把2026修订商标法当成当前已施行法","商标许可未备案必然无效","客户名单一律是商业秘密","驰名认定是永久商业荣誉"],"caseStudy":{"facts":"公司从公开行业名录整理客户电话，未做访问控制；离职员工又盗取公司加密文件中的客户独特采购偏好并用于竞争。","analysis":"公开名录中的一般信息与经营中形成、非公开且具有价值并受保护的独特交易信息要分别判断。前者不因整理成本高就变秘密，后者须结合保密措施与获取手段审查。不能以同一文件夹名叫“客户资料”一概认定或否认。"},"method":"先锁定适用日期，再区分商标注册、使用、许可及秘密保护的不同构成要件。","sourceRefs":[{"title":"中华人民共和国商标法（2019年修正，现行）","url":"https://www.cnipa.gov.cn/art/2019/6/25/art_104_67808.html","effectiveDate":"2019-11-01","article":"第11、13、14、39、40、43、57、59条","checkedAt":"2026-11-24","status":"source-checked"},{"title":"中华人民共和国商标法（2026年修订，尚未施行）","url":"https://www.cnipa.gov.cn/art/2026/6/26/art_95_206942.html","effectiveDate":"2027-01-01","article":"第87条（未来施行）","checkedAt":"2026-11-24","status":"source-checked"},{"title":"中华人民共和国反不正当竞争法（2025年修订）","url":"https://ipc.court.gov.cn/zh-cn/news/view-6249.html","effectiveDate":"2025-10-15","article":"商业秘密规则","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[],"subjectTitle":"知识产权法"},{"id":"XFT-01","title":"理论形成与现行核心要义","objectives":["把时间线与理论内涵分开记忆"],"sections":[{"title":"基本原理与制度逻辑","body":"学习这一科要先建立时间坐标。2020年中央全面依法治国工作会议正式提出习近平法治思想，并以十一个方面概括其核心要义；2025年会议又增加依法治国与依规治党有机统一，并拓展法治轨道上现代化建设的表述。2026年学习材料采用十二个坚持。"},{"title":"适用方法与边界","body":"题目如果问某次历史会议，应按当时表述判断；如果问当前核心要义，不能把旧版数量机械当成现行结论。理论发展表现为政治方向、价值立场、实践任务与制度保障的体系化，不能只背数量而忽略内在联系。"}],"pitfalls":["把历史阶段数量当永恒结论","把更新理解成过去理论完全错误"],"caseStudy":{"facts":"学习小组拿2021年教材断言当前核心要义只能有十一个，另一同学认为旧教材全部失效。","analysis":"两种说法均过度。旧教材可用来理解历史阶段，但当前表述需以2025年会议及2026权威阐释更新；应给知识卡加上适用时间，而不是抹去发展脉络。"},"method":"先找题干时间，再找问题指向，最后核对现行权威表述","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0001","XFT-0002","XFT-0003","XFT-0004"],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"习近平法治思想"},{"id":"XFT-02","title":"党的领导与依宪治国","objectives":["理解领导、法定程序与国家意志的关系"],"sections":[{"title":"基本原理与制度逻辑","body":"党的领导是全面依法治国的根本保证；依宪治国、依宪执政强调宪法作为国家根本法的最高权威。二者不是择一关系。党的主张应通过法定程序转化为国家意志，国家机关依照宪法法律行使职权。"},{"title":"适用方法与边界","body":"解题不能把党的领导等同于个别干部随意指令，更不能以贯彻政策为由跳过法定权限与程序。政策部署推动立法和治理，但具体行政强制、处罚、裁判仍需相应法律依据，涉及改革试点的，应依法取得授权。"}],"pitfalls":["领导与个人意志混同","把政策文件当成任何强制权的直接来源"],"caseStudy":{"facts":"某地负责人要求立即用内部会议纪要设立限制人身自由的处罚，理由是落实上级工作部署。","analysis":"落实部署不产生超越法律保留的权限。应先区分政策目标与实施手段，限制人身自由的处罚须有法律依据，内部纪要不能替代法律。"},"method":"目标正当性、机关权限、措施依据、程序保障四步判断","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0005","XFT-0006","XFT-0007","XFT-0008"],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"习近平法治思想"},{"id":"XFT-03","title":"以人民为中心与公平正义","objectives":["区分群众需求、程序权利与简单多数"],"sections":[{"title":"基本原理与制度逻辑","body":"以人民为中心要求法治建设为了人民、依靠人民、造福人民、保护人民。它体现于立法听取意见、执法维护合法权益、司法提供有效救济及公共法律服务。"},{"title":"适用方法与边界","body":"人民满意不能被简化为一时舆论赞成率。多数人的诉求也需在宪法法律框架中实现，少数人的合法权利与程序参与不能因社会压力而被取消。评价措施既要看是否回应真实问题，也要看是否通过合法、平等、可救济的方式解决问题。"}],"pitfalls":["把民意直接当作事实证据","用多数赞成排除少数者权利"],"caseStudy":{"facts":"小区多数业主要求行政机关不经调查就处罚少数经营者，机关以支持率高为由省去告知申辩。","analysis":"广泛意见应被听取，但事实认定、处罚依据和程序保障仍必须满足。以人民为中心同时包含保护被处理者的合法权益，不能用多数意见替代法定程序。"},"method":"分别审查公众参与、个体权利和法定程序是否落实","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0009","XFT-0010","XFT-0011","XFT-0012"],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"习近平法治思想"},{"id":"XFT-04","title":"法治体系与法律体系","objectives":["识别总抓手与五个体系的层次"],"sections":[{"title":"基本原理与制度逻辑","body":"中国特色社会主义法治体系是全面依法治国的总抓手，范围宽于由法律规范组成的法律体系。学习时应把规范供给、法律实施、监督制约、制度保障及党内法规建设放进同一结构。"},{"title":"适用方法与边界","body":"法律规范制定出来只是起点。没有执行、监督和保障，文本无法稳定转化为治理效果；反过来，强调实施也不意味着可以不补充完善立法。考题常用以其中一部分替代整体的方式设错，如把法治体系缩成单纯增加法条数量。"}],"pitfalls":["把法律体系与法治体系视为同义词","重数量轻实施"],"caseStudy":{"facts":"某市把年度法治建设考核仅设为新增规范性文件数量，不考查执行、救济和监督。","analysis":"文件数量只能反映部分规范供给，无法独立评价法治体系建设。还应检查规范质量、实施效果、权力监督、救济可及性及相应保障。"},"method":"先辨问题问规范集合还是治理体系，再检验选项是否以偏概全","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0013","XFT-0014","XFT-0015","XFT-0016"],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"习近平法治思想"},{"id":"XFT-05","title":"共同推进与一体建设","objectives":["掌握主体维度和形态维度"],"sections":[{"title":"基本原理与制度逻辑","body":"依法治国、依法执政、依法行政共同推进，分别观察国家治理总体、执政活动和行政权运行的法治化；法治国家、法治政府、法治社会一体建设，则从整体制度、行政实践及社会秩序等方面构成协同。"},{"title":"适用方法与边界","body":"共同推进不等于各环节互相替代。行政执法改进离不开立法、监督和社会守法，社会调解发展也不能成为行政机关不履职或法院拒绝依法受案的理由。考题应辨清它讨论的是谁如何活动，还是法治建设的不同组成。"}],"pitfalls":["把协同建设理解为功能互换","用社会自治免除国家职责"],"caseStudy":{"facts":"某地认为只要发展社会调解组织，就可暂停行政复议窗口，统一让居民自行协商。","analysis":"多元化纠纷解决与法定救济应衔接而非相互取消。法治社会建设不能解除行政机关受理复议等法定职责，应保留法定渠道并提供分流指引。"},"method":"先定位环节，再判断协同措施是否保留其他环节的法定功能","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0017","XFT-0018","XFT-0019","XFT-0020"],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"习近平法治思想"},{"id":"XFT-06","title":"立法执法司法守法的全过程","objectives":["理解四个环节及其质量要求"],"sections":[{"title":"基本原理与制度逻辑","body":"科学立法着重规范设计与现实需要相适应、具有可执行性；严格执法要求行政权在法定权限、依据和程序内运行；公正司法同时关注实体与程序；全民守法包含自觉守法和依法维权。"},{"title":"适用方法与边界","body":"任何一环都不能只追求形式指标。科学立法不是简单移植外地规则，严格执法不是一律从重，公正司法不是按网络热度裁判，全民守法也不排除公民依法监督公权力。各环节共同服务于公平正义与权利保障。"}],"pitfalls":["严格等于严厉","公正等于结果合意","守法等于不提出异议"],"caseStudy":{"facts":"执法机关要求轻微违法全部适用最高罚款，以此证明严格执法。","analysis":"严格执法强调依法履职和规范裁量，不等同于处罚越重越好。应适用具体法律关于不予、从轻、减轻处罚以及过罚相当的规定。"},"method":"把抽象口号转化为权限、依据、程序、裁量和救济的具体要求","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0021","XFT-0022","XFT-0023","XFT-0024"],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"习近平法治思想"},{"id":"XFT-07","title":"国内法治与涉外法治","objectives":["掌握统筹的双向要求"],"sections":[{"title":"基本原理与制度逻辑","body":"统筹国内法治和涉外法治，要求在维护国家主权、安全和发展利益的同时，依法保护各类主体合法权益，善用国内法与国际法规则。涉外法治既包括国内涉外法律制度建设，也包括国际规则参与、涉外执法司法和法律服务能力。"},{"title":"适用方法与边界","body":"统筹不是遇到涉外关系就放弃国内法，也不是不研究国际规则而一律依直觉处理。具体案件仍需审查管辖、法律适用、条约义务和程序保障，区别立场原则与操作规则。"}],"pitfalls":["涉外法治仅等于国际法","维护利益可以跳过法律程序"],"caseStudy":{"facts":"企业遭遇境外歧视性措施，负责人主张不用研究任何规则，只以商业报复应对。","analysis":"依法维护权益需要识别可用的国内反制规则、争端解决渠道和适用国际规则，同时评估证据及执行风险。原则立场与专业法律工具应结合。"},"method":"先认涉外因素和权利风险，再定位国内法、条约与争端机制","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0025","XFT-0026","XFT-0027"],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"习近平法治思想"},{"id":"XFT-08","title":"改革德治与领导干部责任","objectives":["理解依法改革及法治保障"],"sections":[{"title":"基本原理与制度逻辑","body":"改革与法治应相互促进，在法治下推进改革，在改革中完善法治。现行法律不能满足试点需要时，应依法通过修改、授权暂时调整或停止适用等方式衔接，而不是先违法再补手续。"},{"title":"适用方法与边界","body":"依法治国与以德治国相结合，意味着法律规范与道德教化各有作用、相互支持；道德评价不能直接替代定罪处罚依据。领导干部是关键少数，应带头尊法学法守法用法，把公权力受约束的要求转化为实际决策和履职习惯。"}],"pitfalls":["改革必要性代替授权","道德谴责代替法律责任"],"caseStudy":{"facts":"试点负责人认为创新项目没有旧法经验，可以先停止执行现行法律，待成功后申请授权。","analysis":"创新必要性不能自行产生暂停法律的权限。应识别具体冲突条款并通过法定授权或修法渠道解决，确保改革措施有依据、范围和期限。"},"method":"先查现行规范，再查试点授权的主体、范围、期限和监督","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0028","XFT-0029","XFT-0030"],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"习近平法治思想"},{"id":"JUR-01","title":"法的特征与规范结构","objectives":["区分规范性、国家性和社会调整功能"],"sections":[{"title":"基本原理与制度逻辑","body":"法通过一般规则调整社会关系，并由国家权力确认、实施和保障。国家强制性体现为最终保障机制，不意味着每次守法都必须警察介入。法律规范要结合条件、行为模式、法律后果理解，条文与完整规范并非一一对应。"},{"title":"适用方法与边界","body":"同一条文可能容纳多项规范，一项规范也可能分散在实体法、定义条款和责任条款中。题目给出孤立条文时，应先补齐适用条件，再判断它授权、禁止或要求什么。"}],"pitfalls":["法条数量等于规范数量","国家保障等于任何纠纷都强制执行"],"caseStudy":{"facts":"某规则规定经营者符合条件可申请许可，另一条规定骗取许可的责任，学员认为两条完全无联系。","analysis":"申请资格与法律后果可共同构成制度链条。应把主体、行为条件、行政机关权限和违法后果联系起来，而非按条数机械数规范。"},"method":"拆出主体、条件、行为模式和后果，核对各要素来源","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"法理学"},{"id":"JUR-02","title":"法律规则原则与概念","objectives":["识别规则优先和原则的补充功能"],"sections":[{"title":"基本原理与制度逻辑","body":"规则通常给出较明确的条件和后果；原则提供基础价值和解释方向；法律概念则提供制度表达工具。三者共同构成规范体系，但功能不同。"},{"title":"适用方法与边界","body":"明确规则能够适用时，不能仅因裁判者不喜欢结果就跳过规则，以抽象公平直接改判。原则适用需要说明规则解释、法律漏洞或规范冲突等理由，并提供可被讨论的论证，避免以原则之名任意裁量。"}],"pitfalls":["原则总比规则优先","概念只能按日常含义解释"],"caseStudy":{"facts":"合同纠纷存在明确的法定无效规则，裁判者只以个人认为结果公平为由宣告有效。","analysis":"公平等原则要在体系中适用，不能任意架空明确强制规则。首先解释规则的适用条件，再审查是否确有例外或规范冲突。"},"method":"先识别规范类型，再判断规则能否直接适用及原则介入理由","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"法理学"},{"id":"JUR-03","title":"法律渊源与效力层级","objectives":["区分制定主体、名称和效力"],"sections":[{"title":"基本原理与制度逻辑","body":"判断规范位阶要先看制定主体和法定形式。国家法律、行政法规、地方性法规、规章分属不同层级或权限范围，不能只凭文件名中有条例、办法就定性。"},{"title":"适用方法与边界","body":"上位法优于下位法的规则首先要求规范之间确有适用冲突。地方性法规与部门规章等关系还可能需有权机关裁决，不能一律理解为名称听起来更大者优先。规范性文件也不能自行取得法律保留事项的创设权。"}],"pitfalls":["看标题不看主体","所有冲突都能简单用特别法解决"],"caseStudy":{"facts":"某省人大常委会制定条例，某国务院部门制定同名条例，学员按标题相同判断效力相同。","analysis":"前者可属于地方性法规，后者需依主体与程序判断为部门规章等，名称相同不决定法律形式与效力。发生冲突应依立法法具体机制处理。"},"method":"主体、形式、事项、位阶、冲突解决机制依次判断","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"法理学"},{"id":"JUR-04","title":"法律关系与法律事实","objectives":["区分关系要素和变动原因"],"sections":[{"title":"基本原理与制度逻辑","body":"法律关系由主体、内容和客体构成。权利与义务是关系内容，标的物、行为等可作为关系客体；主体资格与行为能力需依具体部门法判断。法律事实是引起关系产生、变更或消灭的事实，通常区分行为和事件。"},{"title":"适用方法与边界","body":"自然灾害不因与人的经济利益有关就成为法律行为，订约也不因最终无效就当然不属于人的行为。先做事实分类，再按实体规则确定是否及如何产生法律效果。"}],"pitfalls":["法律事实必然合法","自然事件不产生法律效果"],"caseStudy":{"facts":"租赁房屋因雷击毁损，双方签订解除协议。","analysis":"雷击通常属于事件，订立解除协议属于行为；二者均可能与租赁关系消灭或责任分配有关，但法律效果需要分别依据合同和风险负担规则判断。"},"method":"列出关系主体、权利义务、客体，再为每个变化寻找法律事实","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"法理学"},{"id":"JUR-05","title":"法律责任与法律制裁","objectives":["理解归责条件及责任竞合"],"sections":[{"title":"基本原理与制度逻辑","body":"法律责任是违法、违约等事实依法引发的不利后果，责任是否成立要看该责任类型的法定构成要件。民事、行政和刑事责任可以因同一事实并存，并不因有一种责任就当然排除另一种。"},{"title":"适用方法与边界","body":"归责原则并非一律过错责任，实体法可能规定无过错责任、推定过错或特别抗辩。法律责任与道德谴责、法律制裁概念也不完全重合，应结合规范和程序分析。"}],"pitfalls":["承担刑责后当然免民责","所有责任均必须证明故意"],"caseStudy":{"facts":"企业违法排污同时造成居民损害，被行政罚款后主张不必赔偿。","analysis":"行政处罚与民事赔偿保护不同法益、承担不同功能，不能以已经罚款当然免除赔偿；是否涉嫌犯罪还需另行依刑法判断。"},"method":"先分责任类型，再逐项审查构成、抗辩、并存与承担方式","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"法理学"},{"id":"JUR-06","title":"法律解释与法律推理","objectives":["掌握文义体系目的及论证边界"],"sections":[{"title":"基本原理与制度逻辑","body":"法律解释应结合文字、上下文、制度结构、立法目的和相关材料。文义解释关注法律语言的可能含义，体系解释强调同一规范与其他规范协调，目的解释讨论制度意旨。"},{"title":"适用方法与边界","body":"解释方法可能互相支持，也可能导向不同结论，应说明取舍理由。类推、扩大解释等应区分，尤其刑事领域不能以类推方式创设犯罪和刑罚。案件结论需要大前提、事实小前提和涵摄过程支持。"}],"pitfalls":["目的解释允许完全脱离文字","类推与扩大解释无区别"],"caseStudy":{"facts":"裁判者只因某行为在道德上接近犯罪，就用相似罪名处罚，未说明是否落入法条文义。","analysis":"这是以相似性替代入罪依据的危险做法。应先确定构成要件可能文义，再结合体系和目的解释，不得通过不利类推突破罪刑法定。"},"method":"分清待解释语词、事实要素和推理步骤，检查结论是否越界","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"法理学"},{"id":"JUR-07","title":"法的制定实施与监督","objectives":["区分立法执法司法守法的制度角色"],"sections":[{"title":"基本原理与制度逻辑","body":"法的实施包括规范在社会生活中的落实，执法与司法各有法定主体和程序，守法则涉及所有受规范约束主体。法律监督既包括国家机关依法实施的监督，也包括社会依法进行的监督。"},{"title":"适用方法与边界","body":"监督的存在不意味着监督者可以绕过职权分工直接替代被监督机关决定。立法质量、实施能力和监督救济共同影响规范实效，不能只凭有法可依就认定法治目标已实现。"}],"pitfalls":["监督与替代决定混同","违法规范只能靠个人拒绝解决"],"caseStudy":{"facts":"社会组织发现行政处罚违法，主张自己的监督意见可直接撤销处罚。","analysis":"社会监督可以提出批评建议、举报并推动法定救济，但撤销处罚须由有权机关依程序作出，不能把监督权泛化成行政或司法决定权。"},"method":"辨监督主体、方式与法律效力，再定位法定纠错渠道","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"法理学"},{"id":"JUR-08","title":"法与道德政策科技","objectives":["理解规范协调与法治方法"],"sections":[{"title":"基本原理与制度逻辑","body":"法律、道德和政策共同参与社会治理，但形成方式、调整范围、实施机制不同。道德要求可以支持立法与守法，政策可以引导制度改革，却不能任意替代具体法律依据。技术工具能够辅助事实整理和风险识别，其结果仍需受到法律程序、证据规则和权利保障约束。"},{"title":"适用方法与边界","body":"法治思维要求公开说明依据、尊重权限和程序，并允许救济；不能把算法准确率当作自动免除法律审查的理由。"}],"pitfalls":["科技结果当然等同于法律结论","政策目标可排除程序"],"caseStudy":{"facts":"机关以算法标记风险为唯一依据直接处罚，不向当事人说明认定理由。","analysis":"技术提示可以成为核查线索，但不能替代违法事实认定及法定程序。应审查数据可靠性、适用规则、告知申辩及可争议机制。"},"method":"把工具输出与法律认定分开，逐项检验依据和救济","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters","subjectTitle":"法理学"}]};let subject='',chapter='',idx=0,picks=[],shown=false;const root=document.querySelector('#app');const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const qs=()=>DATA.questions.filter(q=>q.subject===Number(subject));const lesson=()=>DATA.chapters.find(c=>c.id===chapter);
function home(){root.innerHTML='<div class="notice">研究稿预览：现有 '+DATA.chapters.length+' 章初稿、'+DATA.questions.length+' 道独立题。尚未完成全部科目或1500题，内容与法条时效仍待复核。此页不保存云端成绩。</div><section class="card"><h1>分科学习</h1><p>选择科目进入章节讲义和原创题。</p>'+DATA.subjects.map(s=>'<button data-sub="'+s.id+'" '+(!s.chapters.length&&!DATA.questions.some(q=>q.subject===s.id)?'disabled':'')+'>'+esc(s.title)+' · '+s.chapters.length+'章</button>').join('')+'</section>'}
function overview(){const s=DATA.subjects.find(s=>s.id===Number(subject));root.innerHTML='<button class="alt" data-home>返回全部科目</button><button data-quiz>本科练习（'+qs().length+'题）</button><h1>'+esc(s.title)+'</h1><div class="notice">章节和题目为研究初稿，尚未完成独立审校。</div>'+s.chapters.map(c=>'<section class="card"><h2>'+esc(c.title)+'</h2><p>'+esc((c.objectives||[]).join('；'))+'</p><button data-chapter="'+esc(c.id)+'">阅读本章</button></section>').join('')}
function chapterView(){const c=lesson();root.innerHTML='<button class="alt" data-overview>返回本科学习目录</button><h1>'+esc(c.title)+'</h1><div class="notice">研究初稿 · 法条依据和时效须复核。</div>'+(c.sections||[]).map(s=>'<section class="card"><h2>'+esc(s.title)+'</h2><div class="text">'+esc(s.body)+'</div></section>').join('')+'<section class="card"><h2>案例推演</h2><p class="text">'+esc(c.caseStudy?.facts)+'</p><details><summary>展开分析</summary><p class="text">'+esc(c.caseStudy?.analysis)+'</p></details></section><section class="card"><h2>易错点和解题方法</h2><ul>'+(c.pitfalls||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p class="text">'+esc(c.method)+'</p></section><section class="card"><h2>法源</h2>'+(c.sourceRefs||[]).map(s=>'<p><a rel="noreferrer" target="_blank" href="'+esc(s.url)+'">'+esc(s.title)+'</a> '+esc(s.article)+'<br><span class="small">查阅 '+esc(s.checkedAt||'待确认')+' · 版本待复核</span></p>').join('')+'</section>'}
function quiz(){let list=qs();if(!list.length){alert('本科题目正在编写');return}let q=list[idx],ans=Array.isArray(q.answer)?q.answer:[q.answer],ok=JSON.stringify([...picks].sort())===JSON.stringify([...ans].sort());root.innerHTML='<button class="alt" data-overview>返回本科</button><span class="small">'+(idx+1)+' / '+list.length+' · '+({'single':'单选','multiple':'多选','indefinite':'不定项'}[q.type]||q.type)+'</span><section class="card"><h2>'+esc(q.prompt)+'</h2><div class="opts">'+q.options.map((x,i)=>'<button class="opt '+(picks.includes(i)?'selected':'')+'" data-pick="'+i+'" '+(shown?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+esc(x)+'</button>').join('')+'</div><button data-check '+(!picks.length||shown?'disabled':'')+'>核对答案</button><button class="alt" data-prev '+(idx===0?'disabled':'')+'>上一题</button><button class="alt" data-next '+(idx>=list.length-1?'disabled':'')+'>下一题</button>'+(shown?'<div class="card"><h3>'+(ok?'正确':'请复习')+' · 答案 '+ans.map(i=>String.fromCharCode(65+i)).join('、')+'</h3><p>'+esc(q.explanation)+'</p>'+(q.optionAnalysis||[]).map((a,i)=>'<p>'+String.fromCharCode(65+i)+'：'+esc(a)+'</p>').join('')+(q.basis||[]).map(b=>'<p><a target="_blank" rel="noreferrer" href="'+esc(b.url)+'">'+esc(b.title)+'</a> '+esc(b.article)+'</p>').join('')+'</div>':'')+'</section>'}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if('home'in d){home();return}if('sub'in d){subject=d.sub;overview();return}if('overview'in d){overview();return}if('chapter'in d){chapter=d.chapter;chapterView();return}if('quiz'in d){idx=0;picks=[];shown=false;quiz();return}if('pick'in d){let i=Number(d.pick),q=qs()[idx];picks=q.type==='single'?[i]:picks.includes(i)?picks.filter(x=>x!==i):[...picks,i];quiz();return}if('check'in d){shown=true;quiz();return}if('next'in d||'prev'in d){idx+='next'in d?1:-1;picks=[];shown=false;quiz()}});home();</script></html>
