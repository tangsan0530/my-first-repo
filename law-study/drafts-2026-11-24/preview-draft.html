.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第16条"}],"difficulty":"基础","tags":["CRP-01"],"reviewStatus":"source-checked"},{"id":"CRP-0006","subject":7,"chapter":"CRP-01","type":"multiple","prompt":"下列哪些说法体现了刑事程序中的权利保障？","options":["被告人有权获得辩护","法院有义务保证被告人获得辩护","被告人认罪后即可取消最后陈述","不通晓当地通用语言文字的诉讼参与人依法应获得翻译"],"answer":[0,1,3],"explanation":"保障辩护、翻译等权利与是否认罪无关。程序从简也必须在法定范围内进行，不能取消法律保留的核心权利。","optionAnalysis":["该项是刑诉法明确规定的诉讼保障。","保障辩护并非只由被告人自己负责。","认罪不当然取消法定庭审权利。","语言保障是刑诉法规定的程序权利。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第9、11条"}],"difficulty":"基础","tags":["CRP-01"],"reviewStatus":"source-checked"},{"id":"CRP-0007","subject":7,"chapter":"CRP-02","type":"single","prompt":"值班律师为没有辩护人的丙解释程序选择和量刑建议，但未受委托或被指派担任辩护人。其身份如何理解？","options":["当然已成为丙唯一的辩护人","只要提供帮助就成为法官","依法提供值班法律帮助，身份应与正式辩护人区分","不得对案件处理提出任何意见"],"answer":[2],"explanation":"值班律师可以提供法律咨询、程序选择建议、申请变更强制措施等帮助，但不能把法律帮助与正式辩护身份无条件画等号。","optionAnalysis":["值班法律帮助不自动产生委托或指派辩护关系。","法律帮助人员不行使审判权。","是否成为辩护人取决于相应法律手续。","值班律师依法可以提出相应意见。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第36条"}],"difficulty":"基础","tags":["CRP-02"],"reviewStatus":"source-checked"},{"id":"CRP-0008","subject":7,"chapter":"CRP-02","type":"multiple","prompt":"下列哪些属于值班律师依法可以提供的法律帮助？","options":["提供法律咨询","提供程序选择建议","申请变更强制措施","代替人民法院作出有罪判决"],"answer":[0,1,2],"explanation":"值班律师发挥程序帮助和权利保障功能，不能自行行使侦查、起诉、裁判等国家专属权力。","optionAnalysis":["刑诉法明确列举该项职能。","值班法律帮助包括程序选择建议。","该项属于值班律师法定帮助范围。","值班律师不具有审判权。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第36条"}],"difficulty":"基础","tags":["CRP-02"],"reviewStatus":"source-checked"},{"id":"CRP-0009","subject":7,"chapter":"CRP-02","type":"single","prompt":"丁自愿认罪认罚，但关键证据明显矛盾。下列处理哪项正确？","options":["仅凭具结书即可直接定罪","仍须查清矛盾并按法定证明标准判断","所有辩解均因认罪而当然失效","只需统计公众支持人数"],"answer":[1],"explanation":"认罪认罚具有程序和实体上的从宽意义，但不能将自愿供述与事实真实混为一谈。证据矛盾仍须按法定方法解决。","optionAnalysis":["认罪认罚不替代犯罪事实的证明。","从宽制度不降低定罪证明要求。","无罪罪轻材料仍须依法审查。","舆论数量不是定罪证据。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第15、52、55条"}],"difficulty":"基础","tags":["CRP-02"],"reviewStatus":"source-checked"},{"id":"CRP-0010","subject":7,"chapter":"CRP-02","type":"multiple","prompt":"戊签署认罪认罚具结书后，侦查机关决定销毁已收集的不在场证据。下列说法哪些正确？","options":["认罪认罚不免除收集、审查无罪罪轻证据的义务","被追诉人的认罪当然证明所有指控属实","不在场证据可能直接影响是否实施犯罪，应依法审查","具结书可以代替法庭对证据的审查判断"],"answer":[0,2],"explanation":"法律要求同时收集、审查有罪无罪、罪重罪轻证据。具结不使不利于指控的证据失去法律意义，更不能成为毁弃证据的理由。","optionAnalysis":["全面客观取证义务持续存在。","供述仍需与其他证据共同审查。","具有实质关联的无罪证据不能任意排除。","具结不是裁判机关免于审查的依据。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第15、52、55条"}],"difficulty":"基础","tags":["CRP-02"],"reviewStatus":"source-checked"},{"id":"CRP-0011","subject":7,"chapter":"CRP-03","type":"single","prompt":"甲涉嫌普通盗窃，题干明确不涉及法定特别管辖。公安机关、法院的职能应怎样区分？","options":["法院直接受理所有盗窃侦查","公安依法侦查，法院依法审判","公安侦查结束后可以自行定罪判刑","检察院公诉后公安即可代替法院判刑"],"answer":[1],"explanation":"普通盗窃的立案侦查与法院审判应区分；公诉、侦查和审判不能因案件事实相同而合并为一个机关的职权。","optionAnalysis":["普通公诉案件侦查一般不由法院承担。","立案侦查和审判分属不同程序职权。","侦查终结不能产生判决效力。","公诉不转移审判权。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第3、19条"}],"difficulty":"基础","tags":["CRP-03"],"reviewStatus":"source-checked"},{"id":"CRP-0012","subject":7,"chapter":"CRP-03","type":"multiple","prompt":"下列案件中，刑诉法明确列入中级人民法院第一审管辖范围的有哪些？","options":["危害国家安全案件","恐怖活动案件","可能判处无期徒刑、死刑的案件","所有涉及外国人的轻微普通刑事案件"],"answer":[0,1,2],"explanation":"级别管辖应依据现行法列举条件，不能继续沿用涉外案件一律中院一审的旧式记忆。","optionAnalysis":["刑诉法第21条明定中院一审管辖。","该类案件属于法定中院一审范围。","可能刑罚达到法定范围时适用相应级别管辖。","涉外身份本身不当然使一切案件由中院一审。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第21条"}],"difficulty":"基础","tags":["CRP-03"],"reviewStatus":"source-checked"},{"id":"CRP-0013","subject":7,"chapter":"CRP-03","type":"single","prompt":"甲在A地犯罪后居住于B地。关于地域管辖，哪项正确？","options":["只能由B地法院管辖","犯罪地法院原则上管辖；居住地审判更适宜时，可由居住地法院管辖","被告人可以无条件任选全国法院","被害人开户银行所在地总有排他管辖"],"answer":[1],"explanation":"需要先排除专门、级别等规则，再根据犯罪地原则及居住地更适宜这一法定条件判断，不能把两个地点当成完全任意选择。","optionAnalysis":["犯罪地是基本地域连接点，居住地并非唯一。","符合刑诉法地域管辖规则。","地域管辖不由被告人任意创设。","题干未具备此类特别管辖规则。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第25条"}],"difficulty":"基础","tags":["CRP-03"],"reviewStatus":"source-checked"},{"id":"CRP-0014","subject":7,"chapter":"CRP-03","type":"multiple","prompt":"数个同级法院均有地域管辖权，关于受理次序和移送，下列哪些正确？","options":["通常由最初受理的法院审判","必要时可移送主要犯罪地法院审判","只要多地有权，案件就永远不能审理","法院可不顾级别管辖，任意交由基层法庭判死刑"],"answer":[0,1],"explanation":"多个连接点并不意味着无管辖机关。最初受理和主要犯罪地移送规则须在有管辖权的法院之间依法使用。","optionAnalysis":["法律以最初受理作为通常协调规则。","这是法定允许的处理方式。","存在协调和移送规则，不会当然阻断诉讼。","地域协调不能突破级别和审判组织规则。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第26条"}],"difficulty":"基础","tags":["CRP-03"],"reviewStatus":"source-checked"},{"id":"CRP-0015","subject":7,"chapter":"CRP-03","type":"single","prompt":"基层法院认为其管辖的第一审刑事案件重大、复杂，需要上级法院审判，应如何处理？","options":["依法请求移送上一级法院审判","直接把案卷放在上级法院门口即完成移送","请公安机关决定由哪一级法院最终审判","仅因案情复杂就宣布案件永久终止"],"answer":[0],"explanation":"提级审判有法定程序。下级法院不能以复杂为由拒绝履职，也不能把审判管辖处理转给无权决定的其他机关。","optionAnalysis":["须履行法定请求移送程序。","移送须按法定程序办理。","审判管辖不能由公安取代法院依法确定。","复杂不构成当然终止审理事由。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第24条"}],"difficulty":"基础","tags":["CRP-03"],"reviewStatus":"source-checked"},{"id":"CRP-0016","subject":7,"chapter":"CRP-03","type":"multiple","prompt":"下列关于检察机关侦查职权的判断，哪些正确？","options":["不能笼统认定一切职务犯罪均由检察机关侦查","检察院在诉讼监督中发现的司法工作人员法定侵权、损害司法公正犯罪，可依法立案侦查","检察机关侦查职权不受任何案件范围限制","是否自行侦查应核查案件类型及法定决定程序"],"answer":[0,1,3],"explanation":"职务属性不直接决定立案机关，必须核查监察调查、检察侦查和公安侦查的具体配置及程序条件。","optionAnalysis":["监察体制及刑诉法专门规定已区分不同职权。","应符合刑诉法明确条件。","法定职权不得任意扩张。","不能仅凭社会影响判断。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第19条"}],"difficulty":"基础","tags":["CRP-03"],"reviewStatus":"source-checked"},{"id":"CRP-0017","subject":7,"chapter":"CRP-04","type":"single","prompt":"审判员甲是本案被告人的姐姐，即使尚未发现偏袒行为，应怎样处理？","options":["无实际偏袒证据就绝不能回避","应依法回避","只要被告人愿意就可豁免所有回避规则","改由甲的配偶旁听即可消除冲突"],"answer":[1],"explanation":"法定回避事由着眼于可能影响公正的关系。近亲属关系成立后，不需要先证明实际偏袒或发生错误裁判。","optionAnalysis":["近亲属关系本身构成法定回避事由。","回避制度防范客观利益冲突，不以已证明徇私为前提。","当事人同意不能任意排除法定中立要求。","旁听安排不能消除审判员的法定身份关系。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第29条"}],"difficulty":"基础","tags":["CRP-04"],"reviewStatus":"source-checked"},{"id":"CRP-0018","subject":7,"chapter":"CRP-04","type":"multiple","prompt":"下列哪些人员在符合条件时适用刑诉法回避规定？","options":["审判人员","检察人员","侦查人员","鉴定人、翻译人员、书记员"],"answer":[0,1,2,3],"explanation":"回避不限于最终作出判决的法官。鉴定、翻译、记录等环节同样可能影响事实和权利保障，故有相应适用规定。","optionAnalysis":["属于回避制度的主要适用对象。","法律明确要求相应检察人员依法回避。","侦查中的中立和权利保障同样受回避制度约束。","刑诉法规定对这些人员适用有关回避规定。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第29—32条"}],"difficulty":"基础","tags":["CRP-04"],"reviewStatus":"source-checked"},{"id":"CRP-0019","subject":7,"chapter":"CRP-04","type":"single","prompt":"某法院院长本人担任审判人员，存在法定回避事由。其回避应由谁依法决定？","options":["该院院长本人最终决定","该院审判委员会","被害人单方决定","任意书记员决定"],"answer":[1],"explanation":"决定主体须区分普通审判人员与院长本人：普通情形由院长决定，院长的回避由审判委员会决定。","optionAnalysis":["院长本人不能以通常院长决定规则处理自己的回避。","刑诉法对院长回避规定了特别决定主体。","当事人可申请，但不行使法定决定权。","书记员无此决定权限。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第31条"}],"difficulty":"基础","tags":["CRP-04"],"reviewStatus":"source-checked"},{"id":"CRP-0020","subject":7,"chapter":"CRP-04","type":"single","prompt":"对驳回回避申请的决定，申请人可以依法采取哪种救济？","options":["申请复议一次","无限次就同一理由申请相同复议","直接以该决定替代最终刑事判决上诉","自行宣布有关办案人员永久丧失公职"],"answer":[0],"explanation":"回避程序中的复议是对回避决定的法定救济，不等于对最终裁判上诉，也不赋予申请人对办案人员的处分权。","optionAnalysis":["刑诉法明定一次复议权。","法定复议次数不能任意扩张。","回避复议与实体判决上诉不是同一程序。","申请人不享有此种人事处分权。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第31条"}],"difficulty":"基础","tags":["CRP-04"],"reviewStatus":"source-checked"},{"id":"CRP-0021","subject":7,"chapter":"CRP-04","type":"multiple","prompt":"侦查人员被申请回避，在回避决定作出前，下列哪些认识正确？","options":["不能仅因回避申请而停止案件侦查","该规则意味着回避申请无须受理","应由法定有权主体依法作出回避决定","可据此永远不作回避决定"],"answer":[0,2],"explanation":"不停止侦查解决的是调查连续性；申请处理、决定主体及相关行为效力仍须依法审查，不能借此取消回避权。","optionAnalysis":["刑诉法规定了侦查连续性要求。","侦查继续与依法处理申请是不同问题。","程序不中断不消灭决定义务。","不能借持续侦查架空回避制度。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第31条"}],"difficulty":"基础","tags":["CRP-04"],"reviewStatus":"source-checked"},{"id":"CRP-0022","subject":7,"chapter":"CRP-04","type":"single","prompt":"甲先作为本案证人提供关键证言，后被安排担任本案审判人员。下列哪项正确？","options":["只要证言真实就不必回避","应依法回避","只要被害人同意即可当然合法","只有证人与被告人有亲属关系才需回避"],"answer":[1],"explanation":"曾任本案证人与一般认识当事人不同，法律已将该经历列为回避原因，不以证言虚假或另有亲属关系为条件。","optionAnalysis":["曾担任本案证人属于法定回避关系。","证人与审判判断身份冲突，法律要求程序中立。","单方同意不能消除法定身份冲突。","曾任本案证人本身就是法定事由。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第29条"}],"difficulty":"基础","tags":["CRP-04"],"reviewStatus":"source-checked"},{"id":"CRP-0023","subject":7,"chapter":"CRP-05","type":"single","prompt":"甲在侦查阶段第一次被讯问后委托其未取得律师资格的朋友担任辩护人。哪项正确？","options":["侦查期间只能委托律师作为辩护人","侦查阶段任何朋友均能以辩护人身份全面阅卷","只有起诉后才可以第一次委托律师","未委托律师就当然丧失全部诉讼权利"],"answer":[0],"explanation":"一般可担任辩护人的人员范围，与侦查期间只能委托律师的特别规则应分开。委托起点也早于审查起诉。","optionAnalysis":["刑诉法对侦查阶段受托辩护人作了特别限定。","既违反人员限制，也误解阅卷起点。","第一次讯问或采取强制措施起即有相应委托权。","诉讼权利并不因未委托律师而消灭。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第34条"}],"difficulty":"基础","tags":["CRP-05"],"reviewStatus":"source-checked"},{"id":"CRP-0024","subject":7,"chapter":"CRP-05","type":"multiple","prompt":"犯罪嫌疑人自侦查机关第一次讯问或者采取强制措施之日起，可以依法享有哪些权利？","options":["委托辩护人","侦查期间依法委托律师担任辩护人","要求律师立即全面复制所有侦查案卷","因委托律师而自动获得不起诉"],"answer":[0,1],"explanation":"委托时间、人员资格、具体阅卷权限和案件实体结果是不同问题，应分别依据条文判断。","optionAnalysis":["这是刑诉法规定的介入起点。","该阶段受托人员限律师。","全面阅卷通常从审查起诉起，不能提前泛化。","委托与案件处理结果没有当然关系。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第34、40条"}],"difficulty":"基础","tags":["CRP-05"],"reviewStatus":"source-checked"},{"id":"CRP-0025","subject":7,"chapter":"CRP-05","type":"single","prompt":"普通盗窃案侦查期间，辩护律师持法定证件申请会见在押嫌疑人，看守所称所有刑事案件均须侦查机关许可。哪项正确？","options":["该要求可适用于所有刑事案件","普通盗窃案不属于该法定许可例外，应依法安排","只要侦查机关不同意，律师永远不得会见","只有作出判决后才可会见"],"answer":[1],"explanation":"危害国家安全、恐怖活动等法定案件侦查阶段有特别规则，普通盗窃不能仅因仍在侦查就被要求先许可。","optionAnalysis":["会见许可仅在法律规定的特别案件、阶段适用。","不得将特别限制扩张至一般案件。","法定会见权不能被一般性同意条件架空。","法律在侦查阶段即保障相应会见权。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第39条"}],"difficulty":"基础","tags":["CRP-05"],"reviewStatus":"source-checked"},{"id":"CRP-0026","subject":7,"chapter":"CRP-05","type":"multiple","prompt":"关于辩护律师会见在押犯罪嫌疑人、被告人的保障，下列哪些正确？","options":["应依法及时安排","依法会见不被监听","可因案件重大就任意扩大监听范围","会见权和全面阅卷权的法定起点不必相同"],"answer":[0,1,3],"explanation":"会见不是随意行政恩准，也不能因提供法律帮助而被监听；阅卷仍须按审查起诉阶段等具体规则审查。","optionAnalysis":["会见权应受法定时间保障。","刑诉法明确保护律师会见的独立性。","重大案件不构成任意监听的授权。","两种权利适用规则分别规定。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第39—40条"}],"difficulty":"基础","tags":["CRP-05"],"reviewStatus":"source-checked"},{"id":"CRP-0027","subject":7,"chapter":"CRP-05","type":"single","prompt":"甲已进入审查起诉阶段，受托辩护律师申请查阅、摘抄、复制本案案卷材料。哪项正确？","options":["只能在判决生效后阅卷","律师可依法行使阅卷权","只允许记住内容，绝对禁止摘抄复制","只有被害人同意才产生阅卷权"],"answer":[1],"explanation":"阅卷权包括三种法定方式，不能通过仅许查看不许记录的笼统规则任意限缩，涉及特别依法保密管理的要求仍应遵守。","optionAnalysis":["阅卷起点通常为审查起诉之日。","符合刑诉法规定的人员和阶段条件。","法律明确规定可查阅、摘抄、复制。","辩护律师的法定阅卷权不以被害人同意为条件。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第40条"}],"difficulty":"基础","tags":["CRP-05"],"reviewStatus":"source-checked"},{"id":"CRP-0028","subject":7,"chapter":"CRP-05","type":"multiple","prompt":"下列哪些情形应注意依法通知法律援助机构指派律师提供辩护？","options":["可能被判处无期徒刑、死刑且未委托辩护人","盲、聋、哑且未委托辩护人","尚未完全丧失辨认或者控制自己行为能力的精神病人且未委托辩护人","所有不愿付费的单位均可指定任意人员取代律师辩护"],"answer":[0,1,2],"explanation":"法定通知辩护与依申请、经济困难等法律援助路径应区分。题干所列特殊对象体现强制性程序保障。","optionAnalysis":["属于法律明定的通知辩护情形。","应依刑诉法通知法律援助。","属于法定特殊保障对象。","该项既不符通知辩护规则，也错误扩大人员范围。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第35条"}],"difficulty":"基础","tags":["CRP-05"],"reviewStatus":"source-checked"},{"id":"CRP-0029","subject":7,"chapter":"CRP-05","type":"single","prompt":"被害人在公诉案件中委托律师维护其权益，该律师原则上属于什么身份？","options":["诉讼代理人","犯罪嫌疑人的辩护人","公诉人","当然成为人民陪审员"],"answer":[0],"explanation":"律师是职业资格，诉讼代理人和辩护人是案件中的程序身份。应以受托维护何方权利及法定程序关系判断。","optionAnalysis":["被害人一方依法委托的是诉讼代理人。","辩护针对被追诉人，被害人的委托不产生该身份。","私人委托不能赋予国家公诉权。","律师代理身份不产生陪审资格和任命效果。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第46条"}],"difficulty":"基础","tags":["CRP-05"],"reviewStatus":"source-checked"},{"id":"CRP-0030","subject":7,"chapter":"CRP-05","type":"multiple","prompt":"辩护律师申请调取侦查机关已收集但未随案移送的无罪、罪轻证据，下列哪些认识正确？","options":["可以依法申请检察院、法院调取","因证据有利于嫌疑人就不属于刑事证据","办案机关应依法审查处理，而非以有利于辩方为由拒绝","只要辩护人提出申请就当然证明案件无罪"],"answer":[0,2],"explanation":"辩方申请调取权是保障无罪罪轻材料进入审查的程序工具，既不能被无理由排斥，也不预先决定实体裁判。","optionAnalysis":["法律为相关证据移送和调取提供保障。","有利与不利证据均可能具有证明意义。","全面客观审查要求不能被单向取证替代。","调取申请不能替代证据真实性、关联性和全案判断。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第41条"}],"difficulty":"基础","tags":["CRP-05"],"reviewStatus":"source-checked"},{"id":"CIP-0001","subject":17,"chapter":"CIP-01","type":"single","prompt":"甲起诉乙返还借款，法院认为甲目前证据尚不足以证明交付，遂以必败为由拒绝登记立案。下列评价正确的是？","options":["符合起诉条件仍应受理，实体证明问题在审理中判断","法院可直接用胜诉可能性替代法定起诉条件","只有乙承认借款才可立案","凡证据存在争议均不属民事诉讼"],"answer":[0],"explanation":"起诉条件与实体胜诉条件不同。登记立案并不预断债权成立，不能以初步证据可能不足为由剥夺符合条件的起诉权。","optionAnalysis":["正确：正确：程序入口不能提前等同实体裁判。","错误：错误：胜诉判断不是法定立案条件。","错误：错误：被告自认不是启动诉讼的必要条件。","错误：错误：证据争议恰需依法审理解决。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第3条、第122条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["民事诉讼基本原则与在线诉讼","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0002","subject":17,"chapter":"CIP-01","type":"multiple","prompt":"甲乙为逃避甲的真实债权人，虚构买卖欠款并共同请求法院出具调解书。哪些说法正确？","options":["法院不得仅因双方一致陈述便当然认定事实","处分原则能够使任何双方自愿安排都合法","诚信原则约束双方的起诉与举证行为","法院可依法审查是否属于恶意串通虚假诉讼"],"answer":[0,2,3],"explanation":"民事处分仅能在法律范围内进行，诚信原则防止当事人利用诉讼损害他人利益。法院调解仍须审查合法性，不能成为虚构执行依据的工具。","optionAnalysis":["正确：正确：一致陈述不是免除合法审查的通行证。","错误：错误：自愿处分不能对抗法律禁止性要求及他人权益。","正确：正确：诚信要求贯穿诉讼行为。","正确：正确：虚假诉讼线索应依法核查处理。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第13条","effectiveDate":"2024-01-01"}],"difficulty":"进阶","tags":["民事诉讼基本原则与在线诉讼","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0003","subject":17,"chapter":"CIP-01","type":"single","prompt":"乙不懂受诉法院当地通用的民族语言，法院认为可让乙自行放弃辩论以节约翻译成本。如何处理？","options":["应依法提供翻译并保障其诉讼权利","只要甲懂当地语言便无须翻译","法院可因乙不懂语言直接判其败诉","乙只能撤诉另找懂其语言的法院"],"answer":[0],"explanation":"诉讼参与人依法享有使用本民族语言文字的权利，对不通晓当地通用语言文字的应提供翻译；语言障碍不能成为剥夺辩论和诉权的理由。","optionAnalysis":["正确：正确：翻译保障与辩论权应同时落实。","错误：错误：原告语言能力不能代替被告的程序保障。","错误：错误：语言不通不是实体败诉理由。","错误：错误：法院不能强迫其以撤诉解决翻译问题。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第11—12条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["民事诉讼基本原则与在线诉讼","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0004","subject":17,"chapter":"CIP-01","type":"multiple","prompt":"某社会组织依法支持受损害消费者起诉。仅根据支持起诉这一事实，可得出哪些结论？","options":["支持起诉不当然使社会组织成为原告","社会组织当然取得处分消费者全部请求的权力","消费者的原告地位不会仅因获支持而消失","法院仍应独立审查起诉及请求是否合法"],"answer":[0,2,3],"explanation":"支持起诉是协助受害主体行使诉权的制度。是否具有公益诉讼资格、代理权限等需要另外的法律根据，不能由支持行为自动推出。","optionAnalysis":["正确：正确：支持者与当事人概念不同。","错误：错误：支持起诉本身不产生特别代理或实体处分权。","正确：正确：受害主体仍依法行使自己的诉讼权利。","正确：正确：支持不免除法院依法审查职责。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第15条","effectiveDate":"2024-01-01"}],"difficulty":"进阶","tags":["民事诉讼基本原则与在线诉讼","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0005","subject":17,"chapter":"CIP-01","type":"single","prompt":"法院拟将甲乙案件全程转为在线诉讼，乙明确不同意。仅依民事诉讼法一般规定，下列说法正确的是？","options":["在线诉讼须依法取得当事人同意，不能仅为方便强制适用","使用互联网的法院可以一律取消线下渠道","拒绝在线当然等于被告放弃答辩","在线完成的诉讼活动一律无效"],"answer":[0],"explanation":"民诉法允许经当事人同意开展在线诉讼，并赋予依法在线诉讼活动与线下同等效力；便利性不能代替同意和程序权利保障。","optionAnalysis":["正确：正确：适用前提与效力应分开判断。","错误：错误：技术便利不构成剥夺线下权利的依据。","错误：错误：不同意方式不等于放弃实体与程序权利。","错误：错误：依法在线活动具有同等效力。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第16条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["民事诉讼基本原则与在线诉讼","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0006","subject":17,"chapter":"CIP-01","type":"indefinite","prompt":"甲在诉讼中依法减少自己请求的利息数额；乙要求法院即使违法也必须依原约定全额判给甲。下列判断正确的有？","options":["甲可在法律范围内处分民事和诉讼权利","乙有权强迫甲维持其不愿主张的全部请求","法院不能以处分原则为名确认违法内容","当事人任何诉讼行为都不受诚信原则限制"],"answer":[0,2],"explanation":"处分原则承认当事人依法决定请求范围，但法院不得把当事人意愿置于法律之上。诚信原则与处分原则同时适用，不能相互取代。","optionAnalysis":["正确：正确：减少请求属于依法处分的可能形式。","错误：错误：对方不能强迫请求权人主张全部利益。","正确：正确：处分受合法性边界约束。","错误：错误：诉讼活动明确受诚信原则约束。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第13条","effectiveDate":"2024-01-01"}],"difficulty":"进阶","tags":["民事诉讼基本原则与在线诉讼","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0007","subject":17,"chapter":"CIP-02","type":"single","prompt":"自然人乙的户籍住所为A区，已在B区连续稳定居住且构成经常居住地。甲就普通借款纠纷起诉乙，无其他特别规则时应由何地法院管辖？","options":["B区有相应级别管辖权的法院","只能由A区法院","甲任意选择的全国法院","必须由乙出生地法院"],"answer":[0],"explanation":"对自然人提起一般民事诉讼，住所与经常居住地不一致时，由经常居住地法院管辖；须先确认该居住事实确实满足法定经常居住地条件。","optionAnalysis":["正确：正确：经常居住地在本题优先。","错误：错误：忽视住所与经常居住地不一致的特别处理。","错误：错误：一般规则不是全国任意选择。","错误：错误：出生地不是本题法定连接点。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第22条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["级别地域协议与专属管辖","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0008","subject":17,"chapter":"CIP-02","type":"multiple","prompt":"甲乙两个被告在同一共同诉讼中，住所分别位于A区和B区。没有专属、协议等特别管辖。哪些说法正确？","options":["A区与B区有相应级别权限的法院均可能有管辖权","原告只能选择被告中年龄较大者住所地","原告可依法向其中一个有管辖权法院起诉","若向两个有权法院均起诉，应比较最先立案而非最先寄件"],"answer":[0,2,3],"explanation":"同一诉讼数个被告分处不同辖区时，各该法院具有地域管辖连接点。存在共同管辖时适用选择及最先立案规则，但必须满足同一诉讼且各法院本来有权等前提。","optionAnalysis":["正确：正确：数个被告住所地可分别形成连接点。","错误：错误：年龄不是法定管辖标准。","正确：正确：共同管辖允许原告依法选择。","正确：正确：法定比较节点是立案。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第22条、第36条","effectiveDate":"2024-01-01"}],"difficulty":"进阶","tags":["级别地域协议与专属管辖","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0009","subject":17,"chapter":"CIP-02","type":"single","prompt":"普通货物买卖合同争议不存在有效管辖协议。甲拟起诉乙请求货款，按法定合同纠纷地域规则可以选择？","options":["被告住所地或者合同履行地法院","只有合同打印地法院","只有原告出生地法院","任何经过货物的车站法院"],"answer":[0],"explanation":"合同纠纷的一般特别地域管辖连接点是被告住所地与合同履行地。履行地的认定还须结合约定和相关司法解释，不能凭打印、过境等偶然事实确定。","optionAnalysis":["正确：正确：符合法定连接点。","错误：错误：合同打印地不是独立法定依据。","错误：错误：原告出生地无此当然权限。","错误：错误：货物过境站不当然是履行地。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第24条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["级别地域协议与专属管辖","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0010","subject":17,"chapter":"CIP-02","type":"single","prompt":"甲对A市房屋的所有权提出确认之诉，与乙约定交由B市法院管辖。B市与争议有实际联系但房屋不在B市。如何判断？","options":["不动产专属管辖优先，约定不得违反","只要双方同意，专属管辖一律失效","凡有实际联系就必须按协议处理","B市先收诉状即可取得专属管辖"],"answer":[0],"explanation":"不动产所有权争议适用不动产所在地专属管辖。协议须同时满足实际联系及不违反级别、专属管辖，任何一个条件都不能替代其他条件。","optionAnalysis":["正确：正确：协议不得突破专属管辖。","错误：错误：当事人不能任意排除法定专属权限。","错误：错误：实际联系不是唯一有效条件。","错误：错误：收状先后不创设管辖权。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第34—35条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["级别地域协议与专属管辖","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0011","subject":17,"chapter":"CIP-02","type":"multiple","prompt":"关于合同及其他财产权益纠纷的书面管辖协议，哪些说法正确？","options":["可依法选择与争议有实际联系的地点法院","可以任意约定由最高法院作为所有小额案件一审法院","不得违反法定专属管辖","协议管辖不是婚姻身份关系诉讼的一般自由选择规则"],"answer":[0,2,3],"explanation":"协议管辖受纠纷类型、书面形式、实际联系、级别及专属管辖限制。法条列举地点不是脱离实际联系的万能菜单，身份诉讼也不能当然套用财产纠纷规则。","optionAnalysis":["正确：正确：实际联系是重要有效条件。","错误：错误：协议不能突破级别管辖。","正确：正确：专属管辖构成法定边界。","正确：正确：身份关系纠纷不属于本条一般适用对象。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第35条","effectiveDate":"2024-01-01"}],"difficulty":"进阶","tags":["级别地域协议与专属管辖","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0012","subject":17,"chapter":"CIP-02","type":"single","prompt":"A法院将案件移送B法院，B法院认为自己也无管辖权。B法院正确的处理方式是？","options":["依法报请上级法院指定管辖，不得自行再移送","自行移送C法院并要求C不得拒绝","立即终审判原告败诉","将案件永久退回当事人且不得再诉"],"answer":[0],"explanation":"为避免法院之间循环移送，受移送法院认为不属于自己管辖的，应按法定程序报请指定，不得再自行移送。管辖争议不等于实体请求不成立。","optionAnalysis":["正确：正确：符合法定防止循环移送机制。","错误：错误：受移送法院不得自行再移送。","错误：错误：管辖判断不是实体终审依据。","错误：错误：无权以内部管辖争议永久剥夺诉权。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第37条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["级别地域协议与专属管辖","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0013","subject":17,"chapter":"CIP-02","type":"single","prompt":"下列哪一项必然属于民诉法列明的中级法院一审管辖范围，而不是仅因出现外国因素就当然成立？","options":["重大涉外案件","任何一方曾出国旅游的案件","合同写有一个外文词的案件","任何外国人购买生活用品引起的争议"],"answer":[0],"explanation":"中院法定范围包括重大涉外案件。涉外因素的存在与是否重大分属不同判断，不能把所有涉外或与出境有偶然联系的案件都归中院。","optionAnalysis":["正确：正确：法条明确列举重大涉外案件。","错误：错误：旅游经历不决定案件性质和级别。","错误：错误：外文词不当然构成重大涉外。","错误：错误：外国当事人不等于案件必然重大。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第19条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["级别地域协议与专属管辖","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0014","subject":17,"chapter":"CIP-02","type":"multiple","prompt":"甲在港口装卸作业中与乙发生争议，合同约定由甲住所地法院管辖，甲住所并非港口所在地。哪些判断正确？","options":["应注意港口作业纠纷的专属管辖","当事人可用合同排除港口所在地专属管辖","不能仅因合同性质就忽略法定专属规则","有关级别与专门法院权限仍应另行审查"],"answer":[0,2,3],"explanation":"港口作业纠纷适用法定专属连接点，不能被合同协议任意排除。地域连接点确定后仍要核对专门法院和级别管辖等规定，避免以一项规则包办全部管辖。","optionAnalysis":["正确：正确：港口作业被法条专门列明。","错误：错误：协议管辖不得违反专属管辖。","正确：正确：专属规则优先于普通合同规则。","正确：正确：地域、级别及专门管辖需结合判断。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第34—35条","effectiveDate":"2024-01-01"}],"difficulty":"进阶","tags":["级别地域协议与专属管辖","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0015","subject":17,"chapter":"CIP-03","type":"single","prompt":"基层法院审理事实清楚、权利义务明确的一审案件，依法采用普通程序独任审理。仅因其属于普通程序，能否认定组织违法？","options":["不能，法律允许符合法定条件的普通程序独任","能，普通程序永远必须五人合议","能，凡独任均仅能处理刑事案件","不能，但独任法官可因此免除回避义务"],"answer":[0],"explanation":"民诉法对基层法院特定一审普通程序案件允许独任，程序类型与审判组织并非一一对应。是否违法仍需核对不得独任等限制，独任不免除回避。","optionAnalysis":["正确：正确：普通程序并非一律合议。","错误：错误：法律既未固定五人，也未绝对排除独任。","错误：错误：民事独任有明确法定依据。","错误：错误：独任同样必须遵守回避制度。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第40—43条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["审判组织与回避","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0016","subject":17,"chapter":"CIP-03","type":"single","prompt":"某民事二审合议庭拟由两名审判员和一名人民陪审员组成。下列评价正确的是？","options":["二审应由审判员组成，不能这样安排人民陪审员","只要合计三人就当然合法","陪审员可以替代二审任何审判员","只要双方认可就可以排除法定组织要求"],"answer":[0],"explanation":"二审合议庭由审判员组成，人数为单数只是组织合法性的一个条件，不能用总人数正确掩盖成员资格违法。","optionAnalysis":["正确：正确：二审成员资格有专门要求。","错误：错误：人数条件不能替代成员条件。","错误：错误：陪审员不能任意替代二审审判员。","错误：错误：当事人同意不能一般排除强制组织规范。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第41条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["审判组织与回避","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0017","subject":17,"chapter":"CIP-03","type":"multiple","prompt":"审判员甲的近亲属担任本案一方诉讼代理人。哪些说法正确？","options":["存在依法应回避的事由","甲自称绝对公正即可当然排除回避","当事人可依法申请回避","回避制度适用不以实际查明甲已经偏袒为前提"],"answer":[0,2,3],"explanation":"回避以法定关系和可能影响公正等事由保障程序中立，不必等到实际偏袒发生才启动。主观保证不能替代法定审查和决定程序。","optionAnalysis":["正确：正确：代理人与审判员的法定近亲属关系触发回避审查。","错误：错误：自我评价不能排除客观法定事由。","正确：正确：申请回避是当事人的程序权利。","正确：正确：回避具有预防程序风险的功能。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第47—50条","effectiveDate":"2024-01-01"}],"difficulty":"进阶","tags":["审判组织与回避","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0018","subject":17,"chapter":"CIP-03","type":"single","prompt":"甲在庭审开始时不知道回避事由，庭审调查中才发现。甲应如何行使申请权？","options":["依法在知道后、法庭辩论终结前提出","因开庭后才知道所以永远不得申请","只能在裁判生效五年后提出","必须先证明法官已经收受贿赂"],"answer":[0],"explanation":"回避申请通常在案件开始审理时提出，事由在开始审理后才知道的，可在法庭辩论终结前提出。不能把最初不知情等同放弃权利。","optionAnalysis":["正确：正确：符合法定后来知悉事由的时间规则。","错误：错误：法律专门保留后知悉情形的申请机会。","错误：错误：没有此一般五年后申请规则。","错误：错误：法定关系等事由不都要求证明贿赂。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第48条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["审判组织与回避","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0019","subject":17,"chapter":"CIP-04","type":"single","prompt":"甲公司在诉讼期间更换法定代表人，实体主体仍为原公司。诉讼当事人通常如何确定？","options":["公司仍是当事人，代表人更换不当然改变主体","原代表人自动变成债权债务承担人","法院必须将新代表人个人列为被告","公司一切诉权因换人而消灭"],"answer":[0],"explanation":"法人与法定代表人法律地位不同。代表人依法代表法人诉讼，其变更通常只影响代表资格及手续，不当然转移法人实体权利义务。","optionAnalysis":["正确：正确：当事人与其代表人应区分。","错误：错误：职位变化不当然产生个人债务承担。","错误：错误：公司债务不当然改由新代表人个人被诉。","错误：错误：法人存续时诉权不因更换代表人消灭。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第51条及法人诉讼代表规则","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["诉讼主体与共同诉讼","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0020","subject":17,"chapter":"CIP-04","type":"multiple","prompt":"多名债权人对同一被告享有分别成立、互不依赖的普通借款债权。下列判断正确的有？","options":["同一被告不当然使案件成为必要共同诉讼","只要原告超过两人就必须合一判决","是否可合并应按普通共同诉讼等法定条件判断","各债权可能需要分别审查交付、清偿等事实"],"answer":[0,2,3],"explanation":"必要共同诉讼要求相应的实体或程序合一基础，人数和被告相同不足以成立。独立债权的证据和抗辩可能不同，不能机械合并作一个不可分结论。","optionAnalysis":["正确：正确：共同诉讼性质不是单看被告数量。","错误：错误：人数多不等于法定合一确定。","正确：正确：可否合并与必须合并不同。","正确：正确：独立请求各有构成事实和抗辩。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第55条","effectiveDate":"2024-01-01"}],"difficulty":"进阶","tags":["诉讼主体与共同诉讼","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0021","subject":17,"chapter":"CIP-04","type":"single","prompt":"诉讼代表人未经被代表人依法同意，欲和解并放弃大量请求。仅凭代表人身份能否当然处分？","options":["不能，应遵守涉及重大处分的同意要求","能，代表人身份等于实体权利全部转让","能，只要代表人年长即可","不能，但其可改由对方代理人代为处分"],"answer":[0],"explanation":"诉讼代表制度提高人数众多案件的处理效率，但代表人变更、放弃请求，承认对方请求和和解须依法取得被代表人同意，并非无限授权。","optionAnalysis":["正确：正确：代表行为受法定处分边界限制。","错误：错误：程序代表不是实体权利转让。","错误：错误：年龄不产生特别处分权限。","错误：错误：不能用对方代理代替被代表人的同意。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第56—57条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["诉讼主体与共同诉讼","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0022","subject":17,"chapter":"CIP-05","type":"single","prompt":"甲乙争夺一台设备所有权，丙主张设备实际上属于自己并要求返还。丙最符合何种参加方式？","options":["有独立请求权第三人依法起诉参加","只可作为无权表达请求的旁听者","当然必须作为鉴定人","只能成为乙的诉讼代理人"],"answer":[0],"explanation":"丙对原被告争议标的提出独立实体请求，应依法以有独立请求权第三人方式参加，而非只有证明案件事实的证人身份。","optionAnalysis":["正确：正确：请求直接针对争议设备且具有独立性。","错误：错误：独立请求主体可以依法起诉。","错误：错误：权利争议主体不因主张权利成为鉴定人。","错误：错误：独立请求并非代理一方利益。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第59条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["第三人与诉讼参加","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0023","subject":17,"chapter":"CIP-05","type":"multiple","prompt":"关于第三人参加诉讼，哪些说法正确？","options":["有独立请求权者对争议标的提出自己的请求","只要担心新闻影响商誉就必然有第三人资格","无独立请求权者需要法律上利害关系等条件","第三人制度不能只凭与一方是亲属便自动适用"],"answer":[0,2,3],"explanation":"第三人资格取决于独立请求或法定法律上利害关系，经济、情感、新闻等一般联系不足以当然成立。判断须看裁判将如何影响具体民事权利义务。","optionAnalysis":["正确：正确：独立请求是其核心特征。","错误：错误：一般声誉担忧不等于裁判上的法律关系。","正确：正确：无独立请求权也须有法定参加基础。","正确：正确：亲属事实本身不是自动参加依据。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第59条","effectiveDate":"2024-01-01"}],"difficulty":"进阶","tags":["第三人与诉讼参加","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0024","subject":17,"chapter":"CIP-06","type":"single","prompt":"甲委托律师参加庭审和代收文书，授权书未写明和解或放弃请求。律师拟代甲放弃全部本金。何者正确？","options":["该处分须特别授权，不能仅凭一般代理办理","受聘律师当然可以处分全部本金","代收文书必然包含放弃一切实体权利","只要对方同意即可代替甲的特别授权"],"answer":[0],"explanation":"承认、放弃、变更诉讼请求及和解等重大处分，需要委托人特别授权。一般庭审和收文权限不能被无限扩张，对方同意也不能取代委托授权。","optionAnalysis":["正确：正确：放弃本金请求属于特别授权事项。","错误：错误：律师职业身份不自动产生特别处分权。","错误：错误：文书接收权与实体处分权不同。","错误：错误：授权来自委托人而非对方。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第62条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["诉讼代理与特别授权","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0025","subject":17,"chapter":"CIP-06","type":"multiple","prompt":"关于委托诉讼代理，哪些说法正确？","options":["当事人可以依法委托一至二名诉讼代理人","任何网上认识的陌生人都可不受条件限制充任代理人","授权委托书应载明委托事项和权限","提起反诉或上诉等法定事项需要特别授权"],"answer":[0,2,3],"explanation":"代理人数、主体资格、授权形式及权限分别有法定要求。是否为律师或符合其他可代理主体范围需具体审查，不能认为任何人仅凭当事人愿意就当然合格。","optionAnalysis":["正确：正确：法定通常人数是一至二人。","错误：错误：代理资格有法定范围与证明要求。","正确：正确：委托事项及权限应具体明确。","正确：正确：反诉、上诉等列于特别授权事项。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第61—62条","effectiveDate":"2024-01-01"}],"difficulty":"进阶","tags":["诉讼代理与特别授权","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0026","subject":17,"chapter":"CIP-06","type":"single","prompt":"离婚案件的当事人有完整意思表达能力，已委托律师。没有特殊不能出庭情形时，本人是否原则上仍需出庭？","options":["仍应出庭，委托代理不当然免除本人出庭","一律不得本人出庭","只要律师收了费本人即可永不出庭","法院只能书面审理所有离婚案件"],"answer":[0],"explanation":"离婚涉及身份关系和当事人真实意思，法律对本人出庭有特别要求。确有特殊情况不能出庭的，应按规定向法院提交书面意见。","optionAnalysis":["正确：正确：离婚的本人出庭规则不同于普通财产案件。","错误：错误：法律原则上要求本人参加而非禁止。","错误：错误：付费代理不改变法定特别要求。","错误：错误：并无一律书面审理的规则。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第65条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["诉讼代理与特别授权","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0027","subject":17,"chapter":"CIP-07","type":"single","prompt":"甲主张向乙交付过现金借款，审理后该交付事实仍真伪不明，无法律特别分配时应如何判断证明风险？","options":["甲原则上承担交付这一请求基础事实证明不足的不利后果","乙不能证明从未收款就当然败诉","法院必须抽签决定谁承担","谁经济条件更好谁当然败诉"],"answer":[0],"explanation":"结果意义证明责任决定真伪不明时的败诉风险。借款实际交付是返还请求的重要基础事实，原则上由提出该请求的甲证明，而非要求乙证明普遍否定事实。","optionAnalysis":["正确：正确：应对应实体请求构成事实分配风险。","错误：错误：否认不当然导致证明责任倒置。","错误：错误：证明风险依法分配，不可抽签。","错误：错误：经济能力不是一般证明责任标准。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第67条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["证据种类与证明责任","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0028","subject":17,"chapter":"CIP-07","type":"multiple","prompt":"下列关于证据种类与证明力的说法，正确的有？","options":["微信聊天记录可能属于电子数据","所有带纸质载体的材料都必须作为物证","证据须经查证属实方能作为认定事实根据","鉴定意见的名称不使其当然具有排除一切相反证据的效力"],"answer":[0,2,3],"explanation":"证据分类看信息形成、存储和证明机理，不能只看载体。法定证据种类不形成机械不变的证明力排名，真实性、关联性及合法性等均需审查。","optionAnalysis":["正确：正确：电子生成存储的信息可属电子数据。","错误：错误：纸张可承载书证等不同类型信息。","正确：正确：这是证据作为裁判依据的基础要求。","正确：正确：鉴定意见仍须依法审查和质证。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第66条、第74条","effectiveDate":"2024-01-01"}],"difficulty":"进阶","tags":["证据种类与证明责任","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0029","subject":17,"chapter":"CIP-07","type":"indefinite","prompt":"法院收到当事人在举证期限后提交的关键证据。下列哪些判断正确？","options":["应依法责令其说明逾期理由","逾期证据无论任何原因一律销毁","应按不同法定情形决定采纳及训诫罚款等处理","采纳证据便意味着无需再保障对方质证"],"answer":[0,2],"explanation":"逾期举证并非所有情形一律失权。法院应要求说明理由并按法定情况处理，采纳与制裁可以并存；采纳也不免除对方质证等程序保障。","optionAnalysis":["正确：正确：说明理由是处理逾期的法定环节。","错误：错误：法律规定分类处理，不是无条件销毁。","正确：正确：采纳与程序制裁可按不同情形结合。","错误：错误：质证保障不会因一方迟交证据而消失。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第68条、第71条","effectiveDate":"2024-01-01"}],"difficulty":"进阶","tags":["证据种类与证明责任","规则适用"],"reviewStatus":"source-checked"},{"id":"CIP-0030","subject":17,"chapter":"CIP-08","type":"single","prompt":"甲提交公证文书证明某事实，乙提供了足以推翻公证证明的相反证据。法院应如何处理？","options":["依法审查，不因公证而拒绝考虑足够相反证据","公证一律绝对不可反驳","只有公证机关口头同意才能审查","有公证文书就必须取消法庭质证"],"answer":[0],"explanation":"公证证明的法律事实和文书具有法定证明效力，但法律明确保留足以推翻的相反证据例外，不能将证明效力误读为绝对终局。","optionAnalysis":["正确：正确：应适用法定反证例外。","错误：错误：法律允许足够相反证据推翻。","错误：错误：法院依法审查不以口头许可为前提。","错误：错误：公证不意味着可无条件剥夺质证。"],"basis":[{"title":"中华人民共和国民事诉讼法（2023修正）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636","article":"第72条","effectiveDate":"2024-01-01"}],"difficulty":"基础","tags":["质证证人鉴定与证据保全","规则适用"],"reviewStatus":"source-checked"},{"id":"IPR-0001","subject":10,"chapter":"IPR-01","type":"single","prompt":"甲把公开的海拔数值按时间顺序列成没有独创编排的表格，乙自行使用同组数据绘图。甲仅以数据采集花费高额资金主张著作权。正确的是？","options":["采集投入足以使海拔事实本身成为作品","必须先取得甲对每个数值的许可","应审查表达和编排独创性，事实本身不因投入高而受著作权垄断","乙绘图必须把甲列为共同作者"],"answer":[2],"explanation":"著作权保护独创表达，不以付出成本作为事实信息专有化标准；题干已排除独创编排。","optionAnalysis":["投入大小不能替代作品要件。","数值事实不当然成为许可对象。","区分事实与独创表达，结论正确。","提供事实不等于参加绘图创作。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第3、5条"}],"difficulty":"基础","tags":["IPR-01"],"reviewStatus":"source-checked"},{"id":"IPR-0002","subject":10,"chapter":"IPR-01","type":"single","prompt":"画家乙将油画原件卖给甲，未另行约定著作权。甲在展览馆公开陈列该原件。下列判断正确的是？","options":["甲因取得原件而取得全部著作权","原件展览权依法由原件所有人享有","甲只能在私人住宅陈列","乙的署名权随原件所有权一并消灭"],"answer":[1],"explanation":"美术原件所有权与著作权原则上分离，但法律特别规定原件展览权由原件所有人享有。","optionAnalysis":["出售原件不当然转让著作权。","符合法定展览权归属规则。","法律并未把合法展览限于私人住宅。","作者署名权不因出售原件消灭。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第20条"}],"difficulty":"基础","tags":["IPR-01"],"reviewStatus":"source-checked"},{"id":"IPR-0003","subject":10,"chapter":"IPR-01","type":"single","prompt":"甲未经作者许可，把小说扫描成电子文件，并上传供用户随时下载。对相关行为的评价，正确的是？","options":["扫描与点播上传均只涉及发行权","上传行为一律不涉及任何著作权","只要扫描质量低就不构成复制","扫描涉及复制，按需提供下载涉及信息网络传播"],"answer":[3],"explanation":"应拆解制作数字复制件与向公众提供按需获取的两个行为，分别定位权利。","optionAnalysis":["发行主要控制有形原件或复制件流通，不能概括本案全部行为。","网络提供作品同样可能受控制。","复制不以高画质为构成前提。","两个独立利用环节对应的权利判断正确。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第10条第5、12项"}],"difficulty":"基础","tags":["IPR-01"],"reviewStatus":"source-checked"},{"id":"IPR-0004","subject":10,"chapter":"IPR-01","type":"single","prompt":"出版社直接照排法律条文及其官方正式译文，主张任何人不得再复制同样法律文本。应如何评价？","options":["法律及其官方正式译文不因出版社排印而成为其专有著作权客体","只要出版社收费就获得法律文本全部著作权","只有中文法律不受保护，官方译文必然受保护","排印法律文本可以禁止他人援引法条"],"answer":[0],"explanation":"法律法规及官方正式译文被排除于著作权法适用范围；编辑新增独创评论与原法律文本须分开。","optionAnalysis":["针对原法律文本的判断正确。","收费与作品客体资格不是一回事。","官方正式译文也在排除范围。","不得以排印形成对法条本身的垄断。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第5条"}],"difficulty":"基础","tags":["IPR-01"],"reviewStatus":"source-checked"},{"id":"IPR-0005","subject":10,"chapter":"IPR-01","type":"single","prompt":"摄影师甲对古桥选择特殊光线、角度与构图拍摄。乙到同一古桥独立拍出不同照片。下列说法正确的是？","options":["甲可以排斥任何人拍摄同一古桥","独立拍摄必然侵犯甲的摄影作品权利","古桥题材不能被甲垄断，是否侵权仍应比较受保护表达","两张照片题材相同就当然属于合作作品"],"answer":[2],"explanation":"作品题材和拍摄对象与具体表达不同；共同题材不当然证明复制。","optionAnalysis":["著作权不垄断客观拍摄对象。","乙可能独立形成表达，不能直接推定侵权。","区分公有题材与独创表达是正确路径。","缺少共同创作意思与贡献事实。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第3条"}],"difficulty":"基础","tags":["IPR-01"],"reviewStatus":"source-checked"},{"id":"IPR-0006","subject":10,"chapter":"IPR-02","type":"single","prompt":"甲公司付费委托自由设计师乙绘制插画，合同没有约定著作权归属。著作权原则上归谁？","options":["一律归付费的甲公司","原则上归乙，具体使用范围仍须结合合同目的判断","自动归甲乙各半共有","归首先在网络上发布作品的平台"],"answer":[1],"explanation":"委托作品权属优先依合同，合同未明确约定或未订立合同的，著作权属于受托人。","optionAnalysis":["付款不能代替权属约定。","符合法定默认归属。","法律没有默认按费用形成共有的规则。","平台发布不是创作或受让事实。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第19条"}],"difficulty":"基础","tags":["IPR-02"],"reviewStatus":"source-checked"},{"id":"IPR-0007","subject":10,"chapter":"IPR-02","type":"single","prompt":"甲构思剧情，乙仅投资并安排会议，丙按甲的完整故事独立创作电影配乐。关于乙的地位，正确的是？","options":["乙当然是所有作品的共同作者","只要有投资风险就取得署名权","提供资金本身不能证明乙对作品作出了作者意义上的创作贡献","乙因为组织会议而自动成为配乐作者"],"answer":[2],"explanation":"作者判断以法律规定的创作及特定归属规则为依据，不能将资金、行政辅助直接当作创作贡献。","optionAnalysis":["投资与共同作者身份之间没有必然对应。","资金风险不当然产生作者署名权。","对辅助贡献和创作贡献作了正确区分。","组织会议不能替代配乐创作。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第11、14条"}],"difficulty":"基础","tags":["IPR-02"],"reviewStatus":"source-checked"},{"id":"IPR-0008","subject":10,"chapter":"IPR-02","type":"single","prompt":"工程师执行单位任务，主要利用单位物质技术条件并由单位承担责任绘制产品设计图。无相反特别约定。正确的是？","options":["全部权利必然归员工，与法定特殊规则无关","单位享有署名权，员工仅可领取工资","员工离职后法律自动重新分配全部著作权","作者享有署名权，其他著作权依法由单位享有"],"answer":[3],"explanation":"题干对应特殊职务作品的法定结构，应保留作者署名并区分财产权归属。","optionAnalysis":["忽略特殊职务作品规则。","自然人作者署名不能简单归单位替代。","离职不是法定自动重新分配事由。","署名和其他著作权的分配符合规则。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第18条"}],"difficulty":"基础","tags":["IPR-02"],"reviewStatus":"source-checked"},{"id":"IPR-0009","subject":10,"chapter":"IPR-02","type":"single","prompt":"甲乙共同创作可以分割使用的两篇章节，乙将自己独立章节用于另一文集且不妨碍整体合作作品。下列正确的是？","options":["可依法单独行使自己创作部分的著作权，但不得侵犯整体合作作品权利","乙必须放弃作者身份才能单独使用","可以借此转让甲创作章节的全部权利","乙的独立部分因合作关系而不再受保护"],"answer":[0],"explanation":"可分割合作作品允许作者单独行使各自部分权利，同时受整体权利边界约束。","optionAnalysis":["符合可分割合作作品的行使边界。","不需以放弃作者身份为条件。","乙无权当然处分甲的独立创作。","合作不消灭可分割部分的保护。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第14条"}],"difficulty":"基础","tags":["IPR-02"],"reviewStatus":"source-checked"},{"id":"IPR-0010","subject":10,"chapter":"IPR-02","type":"single","prompt":"甲挑选与编排公有领域古诗，形成有独创性结构的选本。甲能主张的保护范围是？","options":["所有被收录古诗的永久专有权","选本具有独创性的选择或者编排，不得据此垄断公有古诗","任何引用古诗者均须支付甲稿酬","仅享有纸张所有权，独创编排绝不受保护"],"answer":[1],"explanation":"汇编作品保护其独创选择编排，不扩张原材料自身的著作权状态。","optionAnalysis":["新增编排不使古诗重新产生永久垄断。","对象和边界均正确。","引用公有文本不当然需要汇编者许可。","独创选择编排可以受著作权保护。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第15条"}],"difficulty":"基础","tags":["IPR-02"],"reviewStatus":"source-checked"},{"id":"IPR-0011","subject":10,"chapter":"IPR-03","type":"single","prompt":"教师为分析一首已发表歌曲，在课堂上节选播放并指明作者和作品名称，使用范围合理。最准确的判断是？","options":["凡学校使用一律免责，不必审查范围","只有商业使用才可能受著作权控制","应按课堂教学具体类型和一般限制条件审查，可能构成合理使用","必须因未支付全部商业授权费而认定侵权"],"answer":[2],"explanation":"合理使用需对法定类型、目的、范围及一般条件作具体审查；课堂合理节选可能符合。","optionAnalysis":["学校身份不是无条件免责通行证。","非商业使用也可能超出法定限制。","保留必要条件，判断正确。","符合合理使用时并非必须取得通常商业许可。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第24条"}],"difficulty":"基础","tags":["IPR-03"],"reviewStatus":"source-checked"},{"id":"IPR-0012","subject":10,"chapter":"IPR-03","type":"single","prompt":"一家商业培训机构将整本仍受保护的教材扫描后对社会长期提供免费下载，以此吸引付费课程客户。正确的是？","options":["不收费下载就当然合理使用","有教育名称即不需审查","整本扫描只能由行政机关处理，与作者无关","应审查法定限制与市场替代影响，免费不当然使整本传播合法"],"answer":[3],"explanation":"是否收费不是唯一标准，面向公众完整提供教材可能替代正常市场利用，不能直接套用课堂教学限制。","optionAnalysis":["免费不是著作权一般免责事由。","用途标签不能代替法定要件。","作者民事权利并未因此消灭。","正确要求具体审查使用边界。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第24条"}],"difficulty":"基础","tags":["IPR-03"],"reviewStatus":"source-checked"},{"id":"IPR-0013","subject":10,"chapter":"IPR-03","type":"single","prompt":"乙为评论甲的文章适当引用部分内容并注明来源。随后丙直接复制甲文章全文，称自己也是评论者。正确的是？","options":["丙只要自称评论即可引用全文","引用是否适当要结合介绍评论等目的与作品利用边界，丙不能仅靠自称评论免责","乙的适当引用使甲全文进入公有领域","引用署名后数量不再受任何限制"],"answer":[1],"explanation":"适当引用要求与介绍评论或说明问题相联系，并满足一般限制，署名与数量目的应共同审查。","optionAnalysis":["行为人标签不足以证明适当。","正确区分引用目的和范围。","个别合法引用不消灭原权利。","注明来源不能取消适当性要求。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第24条第2项"}],"difficulty":"基础","tags":["IPR-03"],"reviewStatus":"source-checked"},{"id":"IPR-0014","subject":10,"chapter":"IPR-03","type":"single","prompt":"作者甲去世后，其子乙依法继承尚存保护期的著作权财产权。乙主张从继承日起重新计算五十年。正确的是？","options":["财产权保护期不因继承重新起算","每次继承都产生新的五十年","由继承人自由决定保护期","只要有继承人，财产权永不届满"],"answer":[0],"explanation":"继受取得的是尚存的权利及剩余期间，不是重新创设一轮法定保护期。","optionAnalysis":["继承不改变原法定期限计算规则。","反复继承不能无限延长法定期限。","期限是法定制度。","有人继承不构成永久财产权保护。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第21、23条"}],"difficulty":"基础","tags":["IPR-03"],"reviewStatus":"source-checked"},{"id":"IPR-0015","subject":10,"chapter":"IPR-03","type":"single","prompt":"作品财产权保护期届满，甲重新出版时将原作者姓名改成自己的姓名。下列正确的是？","options":["财产权届满后任何人可虚称作者","版权到期使一切作者人身利益同时消灭","署名权等保护不受通常财产权期限限制，不能据届满假冒作者","购买印刷设备即可取得原作者身份"],"answer":[2],"explanation":"署名权、修改权、保护作品完整权的保护期不受限制；应与已届满财产权分别判断。","optionAnalysis":["公有利用不等于冒名创作。","混淆不同权利保护期间。","符合人身权与财产权分别处理规则。","设备物权与作者身份没有这种对应。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第22条"}],"difficulty":"基础","tags":["IPR-03"],"reviewStatus":"source-checked"},{"id":"IPR-0016","subject":10,"chapter":"IPR-01","type":"multiple","prompt":"关于作品客体与信息，下列哪些判断正确？","options":["独创的新闻评论可能受著作权保护","报道中的单纯事实消息不因报道而由记者独占","法律的官方正式译文当然属于翻译者私人垄断作品","机械抄录公历日期就必然创作新作品"],"answer":[0,1],"explanation":"评论表达与新闻事实须区分；法定排除和独创性要求不能被机械劳动取代。","optionAnalysis":["评论可包含独创表达。","单纯事实消息依法排除。","官方正式译文在排除范围。","历法、机械抄录不当然满足作品要件。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第3、5条"}],"difficulty":"进阶","tags":["IPR-01"],"reviewStatus":"source-checked"},{"id":"IPR-0017","subject":10,"chapter":"IPR-01","type":"multiple","prompt":"甲购买摄影作品原件后，拟开展下列行为。哪些判断正确？","options":["取得原件不当然取得信息网络传播权","署名权因原件交易当然转让给甲","合法原件所有人的展览权有法定依据","批量制作复制件必须另行审查著作权依据"],"answer":[0,2,3],"explanation":"物权与著作权分离，同时承认法律对原件展览权的特别安排。","optionAnalysis":["网络传播权不由购买原件当然取得。","作者署名并不随物权当然转移。","摄影原件展览权由原件所有人享有。","复制需要授权或法定依据。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第10、20条"}],"difficulty":"进阶","tags":["IPR-01"],"reviewStatus":"source-checked"},{"id":"IPR-0018","subject":10,"chapter":"IPR-01","type":"multiple","prompt":"甲将他人有独创性的小说改成舞台剧，乙打算演出该剧。哪些说法正确？","options":["甲新增的独创表达可能构成改编作品","存在改编作品即意味着原小说不再受保护","利用改编作品时仍可能需要取得原作品权利人的许可","只许可改编就必然已经许可任何形式演出"],"answer":[0,2],"explanation":"改编新增权利与原作品权利并存，许可的权利种类与范围需分别审查。","optionAnalysis":["改编者可就新增独创内容享有权利。","改编不消灭原作品权利。","利用不得侵犯原作品著作权。","不同财产权许可不应当然合并。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第10、13、16条"}],"difficulty":"进阶","tags":["IPR-01"],"reviewStatus":"source-checked"},{"id":"IPR-0019","subject":10,"chapter":"IPR-02","type":"multiple","prompt":"判断合作作者身份时，哪些事实具有法律意义？","options":["参与者是否具有共同创作意思","是否在作品表达中作出实质创作贡献","是否仅提供资金或联络场地等辅助工作","只要付出时间最多就必须成为唯一作者"],"answer":[0,1,2],"explanation":"合作作者需结合作品创作事实辨认，辅助劳动可以说明其不当然构成作者；时间长短不是唯一或决定标准。","optionAnalysis":["共同创作意思是重要判断线索。","实质创作贡献影响作者身份。","区分辅助与创作正是审查内容。","不能以工时替代法律上的创作判断。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第11、14条"}],"difficulty":"进阶","tags":["IPR-02"],"reviewStatus":"source-checked"},{"id":"IPR-0020","subject":10,"chapter":"IPR-02","type":"multiple","prompt":"关于委托绘制海报，下列哪些判断正确？","options":["权属有明确有效约定的，优先审查约定","未约定权属时委托人因付款自动获得全部著作权","权属与特定用途使用范围是需要区分的问题","委托人不能把未取得的他人权利当然转授权给第三人"],"answer":[0,2,3],"explanation":"委托作品先看权属约定，默认归受托人；归属、许可范围和转授权权限不是同一问题。","optionAnalysis":["符合约定优先的权属规则。","付款并不替代法定默认归属。","拥有权利和获特定使用许可不同。","处分权限不得超出自己取得的范围。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第19、26、29条"}],"difficulty":"进阶","tags":["IPR-02"],"reviewStatus":"source-checked"},{"id":"IPR-0021","subject":10,"chapter":"IPR-02","type":"multiple","prompt":"关于职务作品，下列哪些说法正确？","options":["一般职务作品与特殊职务作品的权属规则不同","在公司电脑上写出的任何文字都必然由公司享有全部著作权","特殊职务作品仍须注意作者署名权","应核对工作任务、物质技术条件、作品类型及责任承担等事实"],"answer":[0,2,3],"explanation":"职务作品不能只凭雇员身份或使用设备一项事实简单判断，需要按法定类别细化。","optionAnalysis":["法律设置不同归属结构。","忽略类型与其他法定条件。","特殊归属仍保留作者署名。","这些事实直接关系规则适用。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第18条"}],"difficulty":"进阶","tags":["IPR-02"],"reviewStatus":"source-checked"},{"id":"IPR-0022","subject":10,"chapter":"IPR-02","type":"multiple","prompt":"关于汇编与合作，下列哪些判断正确？","options":["有独创性的选择编排可以形成汇编作品","汇编者因此取得所有被汇编作品原本的全部权利","可分割合作作品的作者行使个人部分权利应避免侵犯整体权利","单纯校对错字就当然获得整部作品共同作者身份"],"answer":[0,2],"explanation":"新增编排权利不吞并原作品权利，辅助劳动也不能直接等同共同创作。","optionAnalysis":["独创选择编排是汇编保护基础。","汇编不当然转移原作品权利。","符合合作作品权利行使边界。","机械校对不当然构成实质创作。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第14、15条"}],"difficulty":"进阶","tags":["IPR-02"],"reviewStatus":"source-checked"},{"id":"IPR-0023","subject":10,"chapter":"IPR-03","type":"multiple","prompt":"对合理使用，下列哪些审查事项正确？","options":["是否落入法定使用类型","是否满足指明作者和作品名称等适用要求","是否影响作品正常使用并不合理损害权利人合法利益","只要使用人不收费即可跳过上述审查"],"answer":[0,1,2],"explanation":"合理使用需要类型要件及一般限制共同成立，非营利不是无条件免责。","optionAnalysis":["法定类型是首层审查。","署名等要求不能遗漏。","一般利益平衡限制必须考虑。","免费不能代替法定条件。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第24条"}],"difficulty":"进阶","tags":["IPR-03"],"reviewStatus":"source-checked"},{"id":"IPR-0024","subject":10,"chapter":"IPR-03","type":"multiple","prompt":"关于作者去世后的权利保护，下列哪些说法正确？","options":["财产权可依法继承剩余保护利益","继承一发生就重置五十年期限","署名权保护不受通常财产权期限限制","保护期限应区分权利种类与作品主体"],"answer":[0,2,3],"explanation":"继承不延长原法定期间；财产权期限与部分人身权保护应分别分析。","optionAnalysis":["继受取得剩余期间内的财产权利益。","不存在因继承自动重置期限的一般规则。","法律对署名等权利另作不受限制规定。","不同主体、作品与权利可能适用不同计算结构。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第21至23条"}],"difficulty":"进阶","tags":["IPR-03"],"reviewStatus":"source-checked"},{"id":"IPR-0025","subject":10,"chapter":"IPR-03","type":"multiple","prompt":"出版社拟使用受保护作品，下列哪些理解正确？","options":["法定许可与合理使用在是否需付酬上不能混同","注明出处通常不是任意全文商业复制的充分条件","所有未经许可使用都必然适用惩罚性赔偿","应分别判断停止侵害、赔偿及其他救济的条件"],"answer":[0,1,3],"explanation":"使用依据与责任种类均需细分，不能以单一标签决定全部法律效果。","optionAnalysis":["免许可不等于一定免报酬。","署名不代替复制传播许可或法定限制。","惩罚性赔偿有故意、情节严重等专门条件。","各类请求应按具体规则判断。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第24、25、52至54条"}],"difficulty":"进阶","tags":["IPR-03"],"reviewStatus":"source-checked"},{"id":"IPR-0026","subject":10,"chapter":"IPR-01","type":"multiple","prompt":"甲把同一段视频分别用于按需点播、影院投影及电视传播。哪些判断正确？","options":["不同利用方式可能对应不同著作权财产权","凡使用屏幕一律只涉及展览权","按需获取属于信息网络传播权典型分析对象","有形复制品发行与网络提供不能不加区分"],"answer":[0,2,3],"explanation":"权利分类以利用行为实质为据，不以是否看见屏幕或作品相同一概合并。","optionAnalysis":["利用行为拆分有助于分别定位权利。","展览权不能概括所有屏幕呈现。","公众自主选择时地获取符合该权利特征。","两种传播路径存在法定区分。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第10条"}],"difficulty":"进阶","tags":["IPR-01"],"reviewStatus":"source-checked"},{"id":"IPR-0027","subject":10,"chapter":"IPR-02","type":"multiple","prompt":"在广告委托项目中，客户、广告公司与设计员工的关系，哪些审查方法正确？","options":["先审查员工与公司之间的创作归属，再审查公司与客户的约定","客户付钱即可消灭员工依法保有的署名权","公司只能在自己依法取得的权限内处分相应权利","应避免把载体交付与著作权转让混为一谈"],"answer":[0,2,3],"explanation":"多层合同关系应逐层判断，支付费用与交付载体并不当然解决全部著作权归属。","optionAnalysis":["有助于防止跳过上游权属链。","付款不能当然消灭法定作者人身权。","处分权限受自身权利范围限制。","载体物权与著作权具有不同对象。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第18至20、26至29条"}],"difficulty":"进阶","tags":["IPR-02"],"reviewStatus":"source-checked"},{"id":"IPR-0028","subject":10,"chapter":"IPR-01","type":"indefinite","prompt":"某数字展览同时展示公有领域名画、仍受保护照片、客观地理数据。主办者声称买了服务器便取得全部内容权利。下列哪些结论可成立？","options":["服务器所有权不能直接决定内容著作权","各类内容必须分别识别保护状态","一切地理事实均因存储而成为服务器买受人的作品","仍受保护照片的网络使用须审查授权或法定限制"],"answer":[0,1,3],"explanation":"本题综合考查载体与内容分离，以及不同客体、不同利用方式的独立审查。","optionAnalysis":["设备物权不等于内容著作权。","不能用统一所有权标签覆盖不同客体。","事实不会因存储行为当然私有化。","对受保护表达仍需合法利用依据。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第3、5、10条"}],"difficulty":"进阶","tags":["IPR-01"],"reviewStatus":"source-checked"},{"id":"IPR-0029","subject":10,"chapter":"IPR-02","type":"indefinite","prompt":"甲乙署名共同创作教案，丙仅提供会议室。出版社又对教案进行独创性选择编排。根据已给事实，哪些说法成立？","options":["丙因提供场所当然是共同作者","甲乙是否为作者仍应结合实际创作事实判断","出版社新增编排可以受保护但不能吞并原教案权利","署名可以作为权属判断线索但不排除相反证明"],"answer":[1,2,3],"explanation":"署名推定、实质创作与汇编新增权利应结合，辅助贡献不当然产生作者资格。","optionAnalysis":["场所提供只是辅助事实。","署名不能替代对争议创作事实的审查。","汇编保护边界不扩张为原作品全部权利。","符合法定署名推定及可反证结构。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第11、12、14、15条"}],"difficulty":"进阶","tags":["IPR-02"],"reviewStatus":"source-checked"},{"id":"IPR-0030","subject":10,"chapter":"IPR-03","type":"indefinite","prompt":"甲为了评述已发表纪录片，在论文中适当节选并署名；乙把同一纪录片整部提供社会公众下载，称二人都在研究。哪些判断正确？","options":["使用目的与范围须分别审查","甲的合法引用当然授权乙提供整部影片","乙不收费即可不再考虑市场替代影响","甲可能符合适当引用条件，乙不能仅凭研究标签免责"],"answer":[0,3],"explanation":"同一作品的不同使用行为不共享一个当然免责结论，需分别审查法定类型及一般限制。","optionAnalysis":["主体目的、规模与行为各不相同。","甲的引用依据不能转为乙的全面授权。","是否收费不是全部判断标准。","同时保留条件与行为区别，结论正确。"],"basis":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第24条"}],"difficulty":"进阶","tags":["IPR-03"],"reviewStatus":"source-checked"},{"id":"XFT-0001","subject":0,"chapter":"XFT-01","type":"single","prompt":"2026年学习小组沿用2020年会议形成的记忆卡，直接把“当前核心要义只能概括为十一个坚持”列为标准答案。最恰当的处理是？","options":["该结论永远正确，不能更新","按理论发展更新为当前十二个坚持，同时保留2020年历史语境","删除所有2020年资料，视为不存在历史价值","改用网络投票决定标准答案"],"answer":[1],"explanation":"A：错误。2025年会议对核心要义已有发展，不能冻结历史表述。\nB：正确。当前表述和历史会议表述应分别标注，避免时间混同。\nC：错误。理论发展不意味着历史材料失去研究价值。\nD：错误。学习标准应核对权威材料，不由投票代替。","optionAnalysis":["错误。2025年会议对核心要义已有发展，不能冻结历史表述。","正确。当前表述和历史会议表述应分别标注，避免时间混同。","错误。理论发展不意味着历史材料失去研究价值。","错误。学习标准应核对权威材料，不由投票代替。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"进阶","tags":["理论形成与现行核心要义"],"reviewStatus":"source-checked"},{"id":"XFT-0002","subject":0,"chapter":"XFT-01","type":"single","prompt":"复习题专门问“2020年11月中央全面依法治国工作会议如何概括核心要义”，考生应选择哪种答题方法？","options":["一律用2026年表述替换历史会议原有表述","只要表述更新，历史题即无答案","先锁定会议时间，再采用该时点的权威表述","仅比较选项字数"],"answer":[2],"explanation":"A：错误。历史题应尊重其时间限定，不能用后续发展改写过去事实。\nB：错误。可以依据相应历史材料作答。\nC：正确。时间坐标是理论发展类题目的必要前提。\nD：错误。字数与理论正确性没有必然关系。","optionAnalysis":["错误。历史题应尊重其时间限定，不能用后续发展改写过去事实。","错误。可以依据相应历史材料作答。","正确。时间坐标是理论发展类题目的必要前提。","错误。字数与理论正确性没有必然关系。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["理论形成与现行核心要义"],"reviewStatus":"source-checked"},{"id":"XFT-0003","subject":0,"chapter":"XFT-01","type":"multiple","prompt":"关于习近平法治思想的形成与发展，下列认识哪些正确？","options":["它回应全面依法治国的重大理论和实践问题","理论发展只表现为数量变化，没有内容拓展","学习现行表述应同时理解其历史发展脉络","权威学习材料中的新发展应在知识库中注明时间"],"answer":[0,2,3],"explanation":"A：正确。理论体系与全面依法治国实践问题相联系。\nB：错误。2025年的发展包含具体任务表述和内容的拓展。\nC：正确。历史脉络有助于理解理论内涵及题目时间限定。\nD：正确。标注时间可以防止旧资料与现行表述混用。","optionAnalysis":["正确。理论体系与全面依法治国实践问题相联系。","错误。2025年的发展包含具体任务表述和内容的拓展。","正确。历史脉络有助于理解理论内涵及题目时间限定。","正确。标注时间可以防止旧资料与现行表述混用。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["理论形成与现行核心要义"],"reviewStatus":"source-checked"},{"id":"XFT-0004","subject":0,"chapter":"XFT-01","type":"single","prompt":"某复习笔记把“坚持依法治国和依规治党有机统一”写成2025年新发展的核心要义之一。下列评价正确的是？","options":["该表述与2026年权威阐释相符","依规治党意味着党内法规自动成为对所有公民直接处罚的依据","依法治国与依规治党应当相互割裂","新增核心要义意味着宪法最高法律效力改变"],"answer":[0],"explanation":"A：正确。2026年人大专题讲座明确说明2025年会议增加该核心要义。\nB：错误。有机统一不消除国家法律和党内法规的适用对象及效力区别。\nC：错误。现行理论强调有机统一而非相互割裂。\nD：错误。理论发展没有改变宪法作为国家根本法的地位。","optionAnalysis":["正确。2026年人大专题讲座明确说明2025年会议增加该核心要义。","错误。有机统一不消除国家法律和党内法规的适用对象及效力区别。","错误。现行理论强调有机统一而非相互割裂。","错误。理论发展没有改变宪法作为国家根本法的地位。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"进阶","tags":["理论形成与现行核心要义"],"reviewStatus":"source-checked"},{"id":"XFT-0005","subject":0,"chapter":"XFT-02","type":"single","prompt":"某干部认为“党的领导要求执法机关不再审查领导口头指示是否合法”。下列哪项回应最符合依法治国要求？","options":["任何口头指示都当然具有法律效力","党的领导与依法履职应统一，具体措施仍须有法定权限和依据","只要社会效果好就可以不遵守程序","行政机关可以自行暂停宪法适用"],"answer":[1],"explanation":"A：错误。个别人的口头指示不能替代法律授权。\nB：正确。领导与法治相统一，不能把个人意志混同为法律依据。\nC：错误。社会效果不能消除权限与程序要求。\nD：错误。行政机关无权自行暂停宪法适用。","optionAnalysis":["错误。个别人的口头指示不能替代法律授权。","正确。领导与法治相统一，不能把个人意志混同为法律依据。","错误。社会效果不能消除权限与程序要求。","错误。行政机关无权自行暂停宪法适用。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["党的领导与依宪治国"],"reviewStatus":"source-checked"},{"id":"XFT-0006","subject":0,"chapter":"XFT-02","type":"multiple","prompt":"某地要落实重大改革部署，措施与现行法律具体条款不一致。下列做法哪些妥当？","options":["识别具体冲突及所涉权限","由项目负责人宣布该法在当地失效","依法寻求修改法律或取得试点授权","对授权的范围、期限与实施效果进行监督"],"answer":[0,2,3],"explanation":"A：正确。先确定冲突内容，才能选择合法的衔接机制。\nB：错误。项目负责人无权使法律失效。\nC：正确。依法改革应通过有权机关的法定程序解决规范冲突。\nD：正确。授权并非无限许可，需要受范围、期限和监督约束。","optionAnalysis":["正确。先确定冲突内容，才能选择合法的衔接机制。","错误。项目负责人无权使法律失效。","正确。依法改革应通过有权机关的法定程序解决规范冲突。","正确。授权并非无限许可，需要受范围、期限和监督约束。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["党的领导与依宪治国"],"reviewStatus":"source-checked"},{"id":"XFT-0007","subject":0,"chapter":"XFT-02","type":"single","prompt":"某机关把内部会议纪要当作创设限制人身自由处罚的依据，其核心问题是什么？","options":["会议纪要没有装订成册","只有处罚数额过高才存在问题","正当目标不能代替法律保留事项的法定依据","只要多数参会人同意就没有问题"],"answer":[2],"explanation":"A：错误。装订形式并非本案关键。\nB：错误。涉及限制人身自由的处罚，应首先审查立法权限。\nC：正确。措施需要符合法律保留和法定权限要求。\nD：错误。内部表决不能创设法律保留事项的权限。","optionAnalysis":["错误。装订形式并非本案关键。","错误。涉及限制人身自由的处罚，应首先审查立法权限。","正确。措施需要符合法律保留和法定权限要求。","错误。内部表决不能创设法律保留事项的权限。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"进阶","tags":["党的领导与依宪治国"],"reviewStatus":"source-checked"},{"id":"XFT-0008","subject":0,"chapter":"XFT-02","type":"multiple","prompt":"关于依宪治国、依宪执政，下列判断哪些正确？","options":["宪法是国家根本法","党和国家活动应在宪法法律范围内开展","宪法权威只对普通公民有约束力","重大政治主张转化为国家法律需要法定程序"],"answer":[0,1,3],"explanation":"A：正确。宪法规定国家根本制度、任务并具有最高法律效力。\nB：正确。坚持宪法法律权威包括约束公权力活动。\nC：错误。宪法同样约束国家机关、政党和其他组织。\nD：正确。法定程序是将主张转化为国家意志的重要机制。","optionAnalysis":["正确。宪法规定国家根本制度、任务并具有最高法律效力。","正确。坚持宪法法律权威包括约束公权力活动。","错误。宪法同样约束国家机关、政党和其他组织。","正确。法定程序是将主张转化为国家意志的重要机制。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["党的领导与依宪治国"],"reviewStatus":"source-checked"},{"id":"XFT-0009","subject":0,"chapter":"XFT-03","type":"single","prompt":"某社区有多数居民要求处罚一名摊贩，机关据此省去事实调查。最恰当的评价是？","options":["多数支持可以替代违法事实证明","群众意见应听取，但不能替代法定事实认定和程序","以人民为中心意味着任何多数请求都应立即执行","只要摊贩收入较高即可免予调查"],"answer":[1],"explanation":"A：错误。支持人数不等于违法事实得到证明。\nB：正确。回应诉求与依法调查、保障权利需要同时落实。\nC：错误。群众诉求仍应在宪法法律框架中处理。\nD：错误。经济情况不能替代事实调查。","optionAnalysis":["错误。支持人数不等于违法事实得到证明。","正确。回应诉求与依法调查、保障权利需要同时落实。","错误。群众诉求仍应在宪法法律框架中处理。","错误。经济情况不能替代事实调查。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["以人民为中心与公平正义"],"reviewStatus":"source-checked"},{"id":"XFT-0010","subject":0,"chapter":"XFT-03","type":"indefinite","prompt":"立法机关就无障碍设施规定听取残疾人代表、运营单位和普通使用者意见。这主要体现哪些要求？","options":["人民参与立法","科学评估利益关系与实施条件","由任何一个群体单独决定法律效力","保护具体群体合法权益与整体公共利益相协调"],"answer":[0,1,3],"explanation":"A：正确。听取不同主体意见有助于依法保障公众参与。\nB：正确。多方意见能够揭示制度实施中的现实条件。\nC：错误。公众参与不代替有权机关依法审议决定。\nD：正确。法治建设应兼顾具体权利保障和合理公共利益。","optionAnalysis":["正确。听取不同主体意见有助于依法保障公众参与。","正确。多方意见能够揭示制度实施中的现实条件。","错误。公众参与不代替有权机关依法审议决定。","正确。法治建设应兼顾具体权利保障和合理公共利益。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"进阶","tags":["以人民为中心与公平正义"],"reviewStatus":"source-checked"},{"id":"XFT-0011","subject":0,"chapter":"XFT-03","type":"single","prompt":"某法院承办法官为了迎合舆论，准备忽略对被告有利的合法证据。以下哪项正确？","options":["网络热度可以替代证据规则","保护被告程序权利必然背离人民立场","应依法全面审查证据，不能把一时舆论等同于公正","只要结案快就可不论证"],"answer":[2],"explanation":"A：错误。舆论不是替代证据规则的法律依据。\nB：错误。保障诉讼参与人的合法权利同样体现人民立场。\nC：正确。司法应依法认定事实并保障程序权利。\nD：错误。效率不能消除裁判论证和合法审理要求。","optionAnalysis":["错误。舆论不是替代证据规则的法律依据。","错误。保障诉讼参与人的合法权利同样体现人民立场。","正确。司法应依法认定事实并保障程序权利。","错误。效率不能消除裁判论证和合法审理要求。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["以人民为中心与公平正义"],"reviewStatus":"source-checked"},{"id":"XFT-0012","subject":0,"chapter":"XFT-03","type":"single","prompt":"某公共法律服务站增加老年人线下咨询窗口，同时保留数字渠道。其合理性主要体现为？","options":["用服务可及性回应实际法律需求","取消法律专业判断","把法律援助范围无限扩大","以年龄决定案件实体输赢"],"answer":[0],"explanation":"A：正确。兼顾不同群体能力和需求能够提高公共法律服务可及性。\nB：错误。改善窗口不意味着不需要专业判断。\nC：错误。援助条件仍须依具体法律制度确定。\nD：错误。服务便利与实体裁判结果属于不同问题。","optionAnalysis":["正确。兼顾不同群体能力和需求能够提高公共法律服务可及性。","错误。改善窗口不意味着不需要专业判断。","错误。援助条件仍须依具体法律制度确定。","错误。服务便利与实体裁判结果属于不同问题。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["以人民为中心与公平正义"],"reviewStatus":"source-checked"},{"id":"XFT-0013","subject":0,"chapter":"XFT-04","type":"single","prompt":"某市以一年新增规范性文件数量作为唯一法治建设评价指标。下列判断正确的是？","options":["文件越多越能证明法治水平高","该指标可反映部分规范供给，但不能替代实施、监督与保障评价","法治体系只由文件数量组成","法律实施效果与法治建设无关"],"answer":[1],"explanation":"A：错误。规范数量不等于规范质量和实施效果。\nB：正确。体系评价需要从多个制度环节综合考察。\nC：错误。法治体系范围宽于法律文本集合。\nD：错误。实施效果直接关系法治建设成效。","optionAnalysis":["错误。规范数量不等于规范质量和实施效果。","正确。体系评价需要从多个制度环节综合考察。","错误。法治体系范围宽于法律文本集合。","错误。实施效果直接关系法治建设成效。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"进阶","tags":["法治体系与法律体系"],"reviewStatus":"source-checked"},{"id":"XFT-0014","subject":0,"chapter":"XFT-04","type":"multiple","prompt":"关于法治体系与法律体系，下列哪些说法恰当？","options":["法律规范体系是法治体系的重要组成部分","法律体系与法治体系完全同义","法律实施和监督不能因重视立法而被忽略","法治建设需要相应组织、人员与制度保障"],"answer":[0,2,3],"explanation":"A：正确。规范供给是法治体系的重要基础。\nB：错误。法治体系还涉及实施、监督、保障等层面。\nC：正确。重视立法不意味着可以轻视规范落实和纠错。\nD：正确。没有保障，规范可能难以有效实施。","optionAnalysis":["正确。规范供给是法治体系的重要基础。","错误。法治体系还涉及实施、监督、保障等层面。","正确。重视立法不意味着可以轻视规范落实和纠错。","正确。没有保障，规范可能难以有效实施。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["法治体系与法律体系"],"reviewStatus":"source-checked"},{"id":"XFT-0015","subject":0,"chapter":"XFT-04","type":"single","prompt":"某领域已有完备规范，但执行机关长期不履职、救济渠道实际无法使用。由此能得出的结论是？","options":["存在法律文本就等于法治目标全部实现","法治建设仍需改进实施与救济机制","应停止一切立法活动","应由私人自行行使国家强制权"],"answer":[1],"explanation":"A：错误。文本完备不能直接证明实施和救济有效。\nB：正确。事实表明制度落实及权利保障仍有缺口。\nC：错误。不能由执行不足推出任何立法都不必要。\nD：错误。私人不能因机关不履职就任意替代国家强制权。","optionAnalysis":["错误。文本完备不能直接证明实施和救济有效。","正确。事实表明制度落实及权利保障仍有缺口。","错误。不能由执行不足推出任何立法都不必要。","错误。私人不能因机关不履职就任意替代国家强制权。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["法治体系与法律体系"],"reviewStatus":"source-checked"},{"id":"XFT-0016","subject":0,"chapter":"XFT-04","type":"single","prompt":"以下哪项最适合用来检验法治建设是否只重文件、不重落实？","options":["核查违法决定能否经法定程序纠正","只统计文件印刷页数","只计算会议时长","只比较机关宣传口号字数"],"answer":[0],"explanation":"A：正确。纠错渠道及其实际效果反映监督和救济是否运作。\nB：错误。页数无法直接反映制度实效。\nC：错误。会议时间不等于规范实施质量。\nD：错误。口号字数与法治实效没有直接对应关系。","optionAnalysis":["正确。纠错渠道及其实际效果反映监督和救济是否运作。","错误。页数无法直接反映制度实效。","错误。会议时间不等于规范实施质量。","错误。口号字数与法治实效没有直接对应关系。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"进阶","tags":["法治体系与法律体系"],"reviewStatus":"source-checked"},{"id":"XFT-0017","subject":0,"chapter":"XFT-05","type":"single","prompt":"某地发展社会调解后宣布不再受理依法应受理的行政复议申请。以下哪项正确？","options":["社会调解可以当然代替法定救济","多元纠纷解决应衔接法定救济，不能成为拒绝履职的理由","一体建设意味着任何主体可互换职权","只要调解免费，取消复议即可接受"],"answer":[1],"explanation":"A：错误。调解不能当然排除依法享有的救济途径。\nB：正确。协同建设需要保留各制度的法定功能。\nC：错误。协同并不改变法定职权配置。\nD：错误。是否收费不能决定法定职责能否取消。","optionAnalysis":["错误。调解不能当然排除依法享有的救济途径。","正确。协同建设需要保留各制度的法定功能。","错误。协同并不改变法定职权配置。","错误。是否收费不能决定法定职责能否取消。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["共同推进与一体建设"],"reviewStatus":"source-checked"},{"id":"XFT-0018","subject":0,"chapter":"XFT-05","type":"multiple","prompt":"对“共同推进、一体建设”的理解，下列哪些正确？","options":["依法行政是行政权运行的法治化要求","法治社会建设可以解除国家机关的全部职责","法治政府建设需要社会参与和监督","不同环节应相互支持，而不是任意替代"],"answer":[0,2,3],"explanation":"A：正确。依法行政强调行政机关依法律规范履职。\nB：错误。社会治理发展不消灭国家机关法定职责。\nC：正确。政府法治化与社会参与、监督相互联系。\nD：正确。协同的前提是尊重各环节功能和权责分工。","optionAnalysis":["正确。依法行政强调行政机关依法律规范履职。","错误。社会治理发展不消灭国家机关法定职责。","正确。政府法治化与社会参与、监督相互联系。","正确。协同的前提是尊重各环节功能和权责分工。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["共同推进与一体建设"],"reviewStatus":"source-checked"},{"id":"XFT-0019","subject":0,"chapter":"XFT-05","type":"single","prompt":"某机关认为全民守法要求公民不得就行政行为申请复议。该观点的错误在于？","options":["把依法监督和依法维权误作不守法","没有要求申请人先捐款","没有要求所有人参与诉讼","只要案件复杂就应拒绝救济"],"answer":[0],"explanation":"A：正确。依法申请救济是法律允许和保障的行为，不应被污名化为不守法。\nB：错误。捐款不是享有法定救济的条件。\nC：错误。全民守法不要求人人参加诉讼。\nD：错误。案件复杂不能成为任意排除法定救济的理由。","optionAnalysis":["正确。依法申请救济是法律允许和保障的行为，不应被污名化为不守法。","错误。捐款不是享有法定救济的条件。","错误。全民守法不要求人人参加诉讼。","错误。案件复杂不能成为任意排除法定救济的理由。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"进阶","tags":["共同推进与一体建设"],"reviewStatus":"source-checked"},{"id":"XFT-0020","subject":0,"chapter":"XFT-05","type":"indefinite","prompt":"某单位把法治社会建设理解为“公权力越少受约束越有效率”。最合适的评价是？","options":["该观点体现法治社会的基本要求","法治社会与公权力依法运行无关","社会治理仍需以权责规范和权利保障为基础","效率可以自动免除程序义务"],"answer":[2],"explanation":"A：错误。法治社会并非放任公权力。\nB：错误。社会治理与政府依法履职紧密相关。\nC：正确。规则、权责与救济是法治治理的重要条件。\nD：错误。效率不能自动使法定程序失效。","optionAnalysis":["错误。法治社会并非放任公权力。","错误。社会治理与政府依法履职紧密相关。","正确。规则、权责与救济是法治治理的重要条件。","错误。效率不能自动使法定程序失效。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["共同推进与一体建设"],"reviewStatus":"source-checked"},{"id":"XFT-0021","subject":0,"chapter":"XFT-06","type":"single","prompt":"行政机关要求所有轻微违法一律顶格罚款，并以此体现严格执法。该做法的问题是？","options":["严格执法被误解为一律从重，忽略法定裁量与过罚相当","所有轻微违法均永远不受法律调整","只要罚款收入用于公益就当然合法","处罚轻重只能由媒体决定"],"answer":[0],"explanation":"A：正确。严格执法要落实法定条件及裁量规则，而非机械顶格。\nB：错误。轻微违法仍受规范调整，只是处理需依法分类。\nC：错误。款项用途不能补正处罚依据与裁量违法。\nD：错误。处罚需依法决定，不能以媒体意见代替。","optionAnalysis":["正确。严格执法要落实法定条件及裁量规则，而非机械顶格。","错误。轻微违法仍受规范调整，只是处理需依法分类。","错误。款项用途不能补正处罚依据与裁量违法。","错误。处罚需依法决定，不能以媒体意见代替。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["立法执法司法守法的全过程"],"reviewStatus":"source-checked"},{"id":"XFT-0022","subject":0,"chapter":"XFT-06","type":"multiple","prompt":"科学立法过程中，下列措施哪些合理？","options":["评估规范实施成本和执法条件","不论本地情况直接复制外地条文","公开征求利益相关者意见","对与现行上位法的衔接进行审查"],"answer":[0,2,3],"explanation":"A：正确。可执行性与实施条件是科学立法的重要考量。\nB：错误。移植需要结合实际并核对权限和体系。\nC：正确。公众参与有助于发现问题和完善制度。\nD：正确。维护法制统一需要合宪性合法性及衔接审查。","optionAnalysis":["正确。可执行性与实施条件是科学立法的重要考量。","错误。移植需要结合实际并核对权限和体系。","正确。公众参与有助于发现问题和完善制度。","正确。维护法制统一需要合宪性合法性及衔接审查。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"进阶","tags":["立法执法司法守法的全过程"],"reviewStatus":"source-checked"},{"id":"XFT-0023","subject":0,"chapter":"XFT-06","type":"single","prompt":"法官依法应给予当事人质证机会，却以结案考核紧迫为由省略。以下哪项最恰当？","options":["提高效率可以不受程序约束","公正司法要求实体与程序并重，不能用考核替代法律","只要一方同意，所有法定程序均可取消","办案时限从不具有法律意义"],"answer":[1],"explanation":"A：错误。效率应在合法程序内提高。\nB：正确。考核目标不能成为剥夺法定程序权利的依据。\nC：错误。程序能否处分需依具体规则，不能概括取消。\nD：错误。法定时限与程序同样应受到尊重。","optionAnalysis":["错误。效率应在合法程序内提高。","正确。考核目标不能成为剥夺法定程序权利的依据。","错误。程序能否处分需依具体规则，不能概括取消。","错误。法定时限与程序同样应受到尊重。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["立法执法司法守法的全过程"],"reviewStatus":"source-checked"},{"id":"XFT-0024","subject":0,"chapter":"XFT-06","type":"multiple","prompt":"关于全民守法，下列哪些理解正确？","options":["公民应依法行使权利、履行义务","国家机关及工作人员也应遵守宪法法律","依法提出检举、申诉可以体现法治参与","守法仅指普通公民服从，公权力无须受法约束"],"answer":[0,1,2],"explanation":"A：正确。守法同时包含正确行权与依法履责。\nB：正确。宪法法律对国家机关同样有约束力。\nC：正确。合法监督和救济是法治实践的一部分。\nD：错误。公权力依法运行是法治的重要要求。","optionAnalysis":["正确。守法同时包含正确行权与依法履责。","正确。宪法法律对国家机关同样有约束力。","正确。合法监督和救济是法治实践的一部分。","错误。公权力依法运行是法治的重要要求。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["立法执法司法守法的全过程"],"reviewStatus":"source-checked"},{"id":"XFT-0025","subject":0,"chapter":"XFT-07","type":"single","prompt":"某涉外纠纷处理人员认为“涉外法治就是只适用外国法”。最恰当的纠正是？","options":["涉外法治涉及国内涉外制度、国际规则及执法司法服务等多方面","所有涉外案件都适用同一外国法","涉外法治排除维护国家利益","涉外案件不得考虑程序保障"],"answer":[0],"explanation":"A：正确。涉外法治是广泛的制度与能力建设，不等于单一外国法适用。\nB：错误。具体适用法须依案件性质与冲突规则等确定。\nC：错误。依法维护国家利益是涉外法治的重要方面。\nD：错误。涉外程序仍需要合法、公正和权利保障。","optionAnalysis":["正确。涉外法治是广泛的制度与能力建设，不等于单一外国法适用。","错误。具体适用法须依案件性质与冲突规则等确定。","错误。依法维护国家利益是涉外法治的重要方面。","错误。涉外程序仍需要合法、公正和权利保障。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"进阶","tags":["国内法治与涉外法治"],"reviewStatus":"source-checked"},{"id":"XFT-0026","subject":0,"chapter":"XFT-07","type":"multiple","prompt":"企业遭遇境外歧视性措施，依法维护权益时宜考虑哪些工作？","options":["识别可适用国内规则及相关国际规则","不保留任何证据而仅依口头抗议","评估可用的争端解决渠道","审查法律服务能力、执行与合规风险"],"answer":[0,2,3],"explanation":"A：正确。法律依据的识别是行动前提。\nB：错误。证据和事实材料是有效维权的重要基础。\nC：正确。程序选择关系救济实现。\nD：正确。法律策略需要考虑能力和实际执行条件。","optionAnalysis":["正确。法律依据的识别是行动前提。","错误。证据和事实材料是有效维权的重要基础。","正确。程序选择关系救济实现。","正确。法律策略需要考虑能力和实际执行条件。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["国内法治与涉外法治"],"reviewStatus":"source-checked"},{"id":"XFT-0027","subject":0,"chapter":"XFT-07","type":"single","prompt":"面对跨境纠纷，下列哪项最符合法治方法？","options":["先判定涉外因素、管辖及适用规则，再评估救济","仅凭对方国籍决定实体责任","放弃研究任何条约义务","认为维护国家利益就不需要法律依据"],"answer":[0],"explanation":"A：正确。分层识别有助于把原则落实为可执行法律方案。\nB：错误。国籍不是任意决定实体责任的依据。\nC：错误。有关条约规则可能影响权利义务及程序。\nD：错误。依法维护利益应使用规则和程序。","optionAnalysis":["正确。分层识别有助于把原则落实为可执行法律方案。","错误。国籍不是任意决定实体责任的依据。","错误。有关条约规则可能影响权利义务及程序。","错误。依法维护利益应使用规则和程序。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["国内法治与涉外法治"],"reviewStatus":"source-checked"},{"id":"XFT-0028","subject":0,"chapter":"XFT-08","type":"multiple","prompt":"关于依法治国与以德治国相结合，下列哪些说法正确？","options":["道德教化可以支持守法习惯形成","道德谴责可以直接替代犯罪构成要件","法律制度可以体现正当价值追求","不能仅因某行为不道德就凭空创设刑罚"],"answer":[0,2,3],"explanation":"A：正确。道德与法律可以相互支持。\nB：错误。定罪仍需满足法定构成和证据要求。\nC：正确。法律并非与价值完全隔绝。\nD：正确。罪刑法定不能因道德愤怒而突破。","optionAnalysis":["正确。道德与法律可以相互支持。","错误。定罪仍需满足法定构成和证据要求。","正确。法律并非与价值完全隔绝。","正确。罪刑法定不能因道德愤怒而突破。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"进阶","tags":["改革德治与领导干部责任"],"reviewStatus":"source-checked"},{"id":"XFT-0029","subject":0,"chapter":"XFT-08","type":"single","prompt":"某地试点依据有权机关授权展开，授权只涵盖特定区域和两年期限。负责人拟扩至其他区域并无限期实施。以下哪项正确？","options":["授权既然存在，范围和期限均无意义","应受授权事项、范围和期限约束，必要时依法申请调整","负责人可以自行扩大授权","只要群众支持就无需监督"],"answer":[1],"explanation":"A：错误。范围与期限是授权边界的重要内容。\nB：正确。依法改革必须遵守授权限定和相应程序。\nC：错误。受权机关或负责人不能任意改写授权。\nD：错误。社会支持不取消依法监督。","optionAnalysis":["错误。范围与期限是授权边界的重要内容。","正确。依法改革必须遵守授权限定和相应程序。","错误。受权机关或负责人不能任意改写授权。","错误。社会支持不取消依法监督。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["改革德治与领导干部责任"],"reviewStatus":"source-checked"},{"id":"XFT-0030","subject":0,"chapter":"XFT-08","type":"indefinite","prompt":"建设高素质法治工作队伍并抓住领导干部这个关键少数，应当落实哪些要求？","options":["领导干部带头尊法学法守法用法","专业能力与政治素质、职业操守相结合","只有基层工作人员需要学法","用权受到权限、程序和责任约束"],"answer":[0,1,3],"explanation":"A：正确。示范履责是关键少数要求的具体体现。\nB：正确。法治队伍建设需要德才兼备。\nC：错误。领导干部也须增强法治意识和能力。\nD：正确。法治要求把权力纳入规范和责任体系。","optionAnalysis":["正确。示范履责是关键少数要求的具体体现。","正确。法治队伍建设需要德才兼备。","错误。领导干部也须增强法治意识和能力。","正确。法治要求把权力纳入规范和责任体系。"],"basis":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18"}],"difficulty":"基础","tags":["改革德治与领导干部责任"],"reviewStatus":"source-checked"},{"id":"CON-0001","subject":2,"chapter":"CON-01","type":"single","prompt":"下列关于我国国家性质与根本制度的表述，正确的是哪项？","options":["人民代表大会制度是宪法第一条所说的根本制度","社会主义制度是我国根本制度","全国人大常委会可以通过普通决议改变社会主义制度","人民民主专政排除工农联盟作为基础"],"answer":[1],"optionAnalysis":["人民代表大会制度是根本政治制度，此项混淆概念。","第一条明确规定社会主义制度是根本制度。","根本制度受宪法保障，普通决议不能改变。","第一条明确以工农联盟为基础。"],"explanation":"A：人民代表大会制度是根本政治制度，此项混淆概念。 B：第一条明确规定社会主义制度是根本制度。 C：根本制度受宪法保障，普通决议不能改变。 D：第一条明确以工农联盟为基础。","basis":[{"title":"中华人民共和国宪法（2018年修正）","url":"https://www.court.gov.cn/zixun/xiangqing/87342.html","article":"第1条","effectiveDate":"2018-03-11"}],"difficulty":2,"tags":["CON-01","宪法基础"],"reviewStatus":"source-checked"},{"id":"CON-0002","subject":2,"chapter":"CON-01","type":"single","prompt":"某教材将政协列为人民行使国家权力的机关。对这一说法应作何判断？","options":["正确，政协与全国人大共同立法","正确，政协产生国务院","错误，宪法规定全国人大和地方各级人大是人民行使国家权力的机关","错误，因为政协不属于统一战线组织"],"answer":[2],"optionAnalysis":["政协不是国家立法机关。","国务院由全国人大产生而非政协产生。","第二条明确规定了人民行使国家权力的机关。","政协是有广泛代表性的统一战线组织。"],"explanation":"A：政协不是国家立法机关。 B：国务院由全国人大产生而非政协产生。 C：第二条明确规定了人民行使国家权力的机关。 D：政协是有广泛代表性的统一战线组织。","basis":[{"title":"中华人民共和国宪法（2018年修正）","url":"https://www.court.gov.cn/zixun/xiangqing/87342.html","article":"序言、第2条","effectiveDate":"2018-03-11"}],"difficulty":2,"tags":["CON-01","宪法基础"],"reviewStatus":"source-checked"},{"id":"CON-0003","subject":2,"chapter":"CON-01","type":"multiple","prompt":"依照民主集中制原则，下列哪些表述正确？","options":["各级人大由民主选举产生","行政机关、监察机关、审判机关、检察机关由人大产生","中央地方职权划分必须排除地方积极性","国家机关应对产生它的人大负责并受监督"],"answer":[0,1,3],"optionAnalysis":["第三条规定人大由民主选举产生。","第三条规定上述机关由人大产生。","宪法要求中央统一领导下发挥地方主动性积极性。","这是第三条规定的产生、负责和监督关系。"],"explanation":"A：第三条规定人大由民主选举产生。 B：第三条规定上述机关由人大产生。 C：宪法要求中央统一领导下发挥地方主动性积极性。 D：这是第三条规定的产生、负责和监督关系。","basis":[{"title":"中华人民共和国宪法（2018年修正）","url":"https://www.court.gov.cn/zixun/xiangqing/87342.html","article":"第3条","effectiveDate":"2018-03-11"}],"difficulty":2,"tags":["CON-01","宪法基础"],"reviewStatus":"source-checked"},{"id":"CON-0004","subject":2,"chapter":"CON-01","type":"single","prompt":"某企业章程声称，出资额超过特定数额的投资人可不受宪法和法律约束。下列判断正确的是哪项？","options":["公司自治允许设定法律特权","只要全体股东同意便有效","仅国有企业须遵守宪法法律","任何组织或者个人都不得有超越宪法法律的特权"],"answer":[3],"optionAnalysis":["公司自治不能创设超法律特权。","股东合意不能排除强制性宪法法律约束。","宪法第五条涵盖各企业事业组织。","第五条确立普遍遵法与禁止特权。"],"explanation":"A：公司自治不能创设超法律特权。 B：股东合意不能排除强制性宪法法律约束。 C：宪法第五条涵盖各企业事业组织。 D：第五条确立普遍遵法与禁止特权。","basis":[{"title":"中华人民共和国宪法（2018年修正）","url":"https://www.court.gov.cn/zixun/xiangqing/87342.html","article":"第5条","effectiveDate":"2018-03-11"}],"difficulty":2,"tags":["CON-01","宪法基础"],"reviewStatus":"source-checked"},{"id":"CON-0005","subject":2,"chapter":"CON-02","type":"multiple","prompt":"关于社会主义经济制度，下列哪些判断符合宪法？","options":["国有经济是国民经济中的主导力量","非公有制经济是社会主义市场经济的重要组成部分","公有制为主体意味着禁止个体经济","我国坚持按劳分配为主体、多种分配方式并存"],"answer":[0,1,3],"optionAnalysis":["第七条确认国有经济主导地位。","第十一条作出此定位。","第六条与第十一条共同确认多种所有制经济。","第六条规定了该分配制度。"],"explanation":"A：第七条确认国有经济主导地位。 B：第十一条作出此定位。 C：第六条与第十一条共同确认多种所有制经济。 D：第六条规定了该分配制度。","basis":[{"title":"中华人民共和国宪法（2018年修正）","url":"https://www.court.gov.cn/zixun/xiangqing/87342.html","article":"第6、7、11条","effectiveDate":"2018-03-11"}],"difficulty":2,"tags":["CON-02","宪法基础"],"reviewStatus":"source-checked"},{"id":"CON-0006","subject":2,"chapter":"CON-02","type":"single","prompt":"某村集体拟将村域内矿藏认定为集体所有。仅依宪法，该认识错在哪里？","options":["矿藏原则上属于农户个人","矿藏属于国家所有，不在集体所有例外之列","一切自然资源均不得存在集体所有","村集体可以通过多数决改变矿藏归属"],"answer":[1],"optionAnalysis":["矿藏不是农户个人所有。","第九条的集体所有例外不包括矿藏和水流。","森林、山岭、草原、荒地、滩涂存在法律规定的集体所有例外。","集体决议不能改变宪法确立的所有权。"],"explanation":"A：矿藏不是农户个人所有。 B：第九条的集体所有例外不包括矿藏和水流。 C：森林、山岭、草原、荒地、滩涂存在法律规定的集体所有例外。 D：集体决议不能改变宪法确立的所有权。","basis":[{"title":"中华人民共和国宪法（2018年修正）","url":"https://www.court.gov.cn/zixun/xiangqing/87342.html","article":"第9条","effectiveDate":"2018-03-11"}],"difficulty":2,"tags":["CON-02","宪法基础"],"reviewStatus":"source-checked"},{"id":"CON-0007","subject":2,"chapter":"CON-02","type":"multiple","prompt":"关于土地制度，哪些说法正确？","options":["城市土地属于国家所有","宅基地属于集体所有","土地使用权可以依照法律规定转让","农村土地一律属于国家所有"],"answer":[0,1,2],"optionAnalysis":["第十条明确城市土地国有。","宅基地、自留地、自留山归集体所有。","宪法禁止非法转让土地，但允许依法转让使用权。","农村和郊区土地原则集体所有，法律规定国有的除外。"],"explanation":"A：第十条明确城市土地国有。 B：宅基地、自留地、自留山归集体所有。 C：宪法禁止非法转让土地，但允许依法转让使用权。 D：农村和郊区土地原则集体所有，法律规定国有的除外。","basis":[{"title":"中华人民共和国宪法（2018年修正）","url":"https://www.court.gov.cn/zixun/xiangqing/87342.html","article":"第10条","effectiveDate":"2018-03-11"}],"difficulty":2,"tags":["CON-02","宪法基础"],"reviewStatus":"source-checked"},{"id":"CON-0008","subject":2,"chapter":"CON-02","type":"single","prompt":"某部门为一般内部创收征用公民合法私产，声称补偿即可。其主张忽略了哪项宪法条件？","options":["只要补偿，不需要公共利益","公共利益需要与依法进行均是条件","宪法完全禁止私产征用","部门可自行决定无需依据法律"],"answer":[1],"optionAnalysis":["补偿不能代替公共利益和法律依据。","第十三条要求公共利益、依法、给予补偿。","宪法允许符合法定条件的征收或者征用。","必须依照法律规定，不能仅凭部门意愿。"],"explanation":"A：补偿不能代替公共利益和法律依据。 B：第十三条要求公共利益、依法、给予补偿。 C：宪法允许符合法定条件的征收或者征用。 D：必须依照法律规定，不能仅凭部门意愿。","basis":[{"title":"中华人民共和国宪法（2018年修正）","url":"https://www.court.gov.cn/zixun/xiangqing/87342.html","article":"第13条","effectiveDate":"2018-03-11"}],"difficulty":2,"tags":["CON-02","宪法基础"],"reviewStatus":"source-checked"},{"id":"CON-0009","subject":2,"chapter":"CON-03","type":"single","prompt":"关于我国公民资格，下列正确的是哪项？","options":["具有中华人民共和国国籍的人都是中华人民共和国公民","常住中国的外国人自动取得公民资格","达到十八周岁才成为公民","只有依法享有选举权的人才是公民"],"answer":[0],"optionAnalysis":["第三十三条以国籍界定公民。","住所不等于国籍。","未成年人亦可具有中国国籍并成为公民。","公民资格与具体政治权利的享有不能等同。"],"explanation":"A：第三十三条以国籍界定公民。 B：住所不等于国籍。 C：未成年人亦可具有中国国籍并成为公民。 D：公民资格与具体政治权利的享有不能等同。","basis":[{"title":"中华人民共和国宪法（2018年修正）","url":"https://www.court.gov.cn/zixun/xiangqing/87342.html","article":"第33条","effectiveDate":"2018-03-11"}],"difficulty":2,"tags":["CON-03","宪法基础"],"reviewStatus":"source-checked"},{"id":"CON-0010","subject":2,"chapter":"CON-03","type":"indefi
