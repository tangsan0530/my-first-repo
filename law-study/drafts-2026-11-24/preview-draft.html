"甲拥有对破产企业的未到期合同债权，管理人以合同期限未到为由拒绝其参加申报。","analysis":"破产受理对未到期债权有加速到期等法定效果，甲不应仅因原合同期限未届而被排除。是否真实存在、金额及优先属性仍需依法核查，申报不自动等于全部确认。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国企业破产法","url":"https://www.audit.gov.cn/n7/n34/n58/c109660/content.html","article":"第22—59条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"BUS-09","title":"破产撤销抵销取回与分配","objectives":["识别破产撤销抵销取回与分配的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"管理人可对受理前法定期间内的无偿转让、不合理价格交易、偏颇清偿等法定行为请求撤销，但应分别核对行为类型、期间和例外，不能把破产前全部交易一概撤销。债务人的无效财产行为另有返还规则。取回权以他人财产不应归入破产分配为基础，别除或担保优先权则仍是在特定财产价值上受偿，概念不同。"},{"title":"制度比较与审题重点","body":"破产抵销不是所有相互欠款都能抵销，须审查取得债权、负担债务的时间、明知状态等法定限制。破产费用与共益债务优先于一般分配，并存在财产不足时各自的处理规则；职工相关债权、社保税款与普通债权有法定顺序，担保优先、特定财产与不足部分另行判断。不得把所有职工请求都无条件置于一切担保债权之前。"}],"pitfalls":["取回与担保优先受偿不同","抵销有时间与恶意限制","清偿顺序须先区分费用共益和担保"],"caseStudy":{"facts":"企业破产后，仓库内一批由甲寄存且权属清楚的货物被管理人准备拍卖分配。甲持所有权证明请求取回。","analysis":"若货物确属甲并无法定障碍，应依取回权规则处理，不属于甲作为普通债权人分取货物价款的问题。识别所有权归属是第一步，不能只凭财物位于债务人仓库便纳入破产财产。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国企业破产法","url":"https://www.audit.gov.cn/n7/n34/n58/c109660/content.html","article":"第30—43条、第109—120条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"BUS-10","title":"重整计划和解与破产清算","objectives":["识别重整计划和解与破产清算的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"重整以企业经营价值与债务调整为核心，须依申请资格、法院裁定、经营管理方式、债权分组表决和计划批准执行等阶段判断。重整期间担保权行使可依法受限制，但担保物有损坏或价值明显减少等情况时有法定保护，不能把暂停执行误作担保权消灭。"},{"title":"制度比较与审题重点","body":"重整计划经依法批准具有约束力，但对债务人保证人和其他连带债务人的权利不能未经法定依据一并免除。和解主要由债务人依法申请，和解协议与重整计划的通过条件及担保债权地位不同。计划执行失败或和解违反法定条件时，依法可能进入清算，不能将一次计划批准理解为债务无条件永久豁免。"}],"pitfalls":["重整不是直接注销企业","表决通过与法院批准不同","对债务人减免不当然免除保证人"],"caseStudy":{"facts":"甲公司重整计划削减普通债权，保证人乙据此主张其保证责任自动同步全部免除。","analysis":"应核查重整计划对债务人及债权人的约束范围，以及法律对保证人、其他连带债务人责任的特别规定。债务人重整获减免不当然使第三人担保完全消失，不能混同主体。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国企业破产法","url":"https://www.audit.gov.cn/n7/n34/n58/c109660/content.html","article":"第70—106条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"BUS-11","title":"票据行为票据权利与抗辩","objectives":["识别票据行为票据权利与抗辩的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"票据具有要式性、文义性和一定程度的无因性，须识别汇票、本票、支票及出票、背书、承兑、保证等不同票据行为。票据债务通常依签章和文义发生，票据基础关系与票据关系相对独立，但不意味着任何违法取得都能享有票据权利。签章伪造与其他真实签章的效力应依法区分。"},{"title":"制度比较与审题重点","body":"票据抗辩包括对物与对人等分析路径，直接当事人之间的基础关系抗辩与对合法后手的抗辩限制不同。不能将票据无因性说成一切抗辩均无效，也不能仅因原交易存在争议就对任何持票人拒付。真实交易、善意取得、恶意或重大过失取得、禁止转让等问题须与法条及相关解释核查。"}],"pitfalls":["文义性不保护恶意取得","伪造签章与其他真实签章效力需分开","直接基础关系抗辩不能无条件对抗后手"],"caseStudy":{"facts":"乙为支付货款签发汇票给甲，甲背书给善意丙。乙因与甲之间发生质量争议，拟不分条件拒绝向丙承担票据责任。","analysis":"应分开基础合同争议与对后手的票据抗辩。对直接相对人的特定抗辩不当然可对抗善意后手，同时须审查票据是否有效、丙取得是否符合条件，不能只背抽象无因性。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国票据法","url":"https://www.nfra.gov.cn/cn/view/pages/ItemDetail.html?docId=879935","article":"票据法总则及背书、付款规则","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"BUS-12","title":"票据追索保全与权利救济","objectives":["识别票据追索保全与权利救济的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"票据持有人请求付款、提示承兑、追索和再追索处于不同阶段，其主体、法定期间与证明手续不同。追索通常在法定拒绝承兑、拒绝付款或其他提前追索事由发生后行使，不能将尚未出现条件的基础合同催收等同于票据追索。票据债务人之间依法可能承担连带责任，持票人选择请求与最终内部清偿顺序仍需区分。"},{"title":"制度比较与审题重点","body":"票据丧失可通过挂失止付、公示催告或普通诉讼等法定路径救济，各自适用范围、主体和条件不同。挂失止付不是最终确权裁判，也不使权利期限当然无限延长。票据权利因法定原因消灭后是否存在利益返还请求须另行审查，不可把所有实体权利与程序救济一并认定消灭。"}],"pitfalls":["挂失止付不是除权判决","追索与基础债权请求不同","权利消灭与利益返还请求区分"],"caseStudy":{"facts":"甲遗失可背书转让汇票，办理挂失止付后认为无需再通过任何法定程序，银行必须永久替其保留款项。","analysis":"挂失止付是临时止付措施，不能代替公示催告除权或实体诉讼等最终救济。应依票据种类和法定期间继续办理，避免把临时措施理解为永久权利确认。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国票据法","url":"https://www.nfra.gov.cn/cn/view/pages/ItemDetail.html?docId=879935","article":"票据法第15条及追索权章节","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"BUS-13","title":"保险利益告知义务与代位求偿","objectives":["识别保险利益告知义务与代位求偿的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"人身保险利益原则上在订约时审查，财产保险被保险人的保险利益在事故发生时审查，不能把两个时间点混用。投保人对保险人的询问承担依法如实告知义务，故意或重大过失、足以影响承保或费率等决定解除及事故责任后果；保险人解除权还有知悉后三十日和成立后二年的限制，知道未告知仍承保等情形另论。"},{"title":"制度比较与审题重点","body":"保险合同成立、生效、责任开始并非在任何题目都同一时间；免责条款应履行提示说明等法定义务。财产保险的损失填补、重复保险、保险标的转让及代位求偿要注意适用条件；人身保险通常不能套用财产保险代位规则。投保、被保险、受益三类主体可以重叠但不是同义词，死亡保险还有本人同意等特别要求。"}],"pitfalls":["人身与财产保险利益时间点不同","故意和重大过失的退费后果不同","财产保险代位不能随意用于人身保险"],"caseStudy":{"facts":"保险人明确询问健康情况，投保人故意隐瞒足以影响承保的病史；保险人在合同成立三年后首次主张按一般告知规则解除。","analysis":"应先判断违反告知的主客观要件，再审查解除权法定时间限制。不能看到故意隐瞒就跳过成立后二年的限制，也要分辨其他依法可能存在的独立规则，避免把解除权、诈骗及合同效力混同。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国保险法","url":"https://xzfy.moj.gov.cn/c/2021-01-06/487603.shtml","article":"第12—19条、第31条以下、第60条以下","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"BUS-14","title":"证券发行交易披露与投资者保护","objectives":["识别证券发行交易披露与投资者保护的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"证券公开发行须依法注册，注册不等于监管机关保证证券价值或发行人盈利。公开发行包括向不特定对象、累计超过法定人数的特定对象等情形，法定员工持股计划人数排除规则不能遗漏。非公开发行不得借广告、公开劝诱等变相公开。"},{"title":"制度比较与审题重点","body":"证券交易公平依赖信息披露和禁止内幕交易、操纵市场等规则。重大信息的内幕性、知情人或非法获取信息者身份、交易与泄露等行为应逐项分析，不能仅凭交易赚钱认定内幕交易。信息披露应真实、准确、完整、及时、公平，虚假陈述责任涉及重大性、因果关系、过错及责任主体等法定和解释规则，不能把股价下跌一律归责于发行人。"}],"pitfalls":["注册不是投资收益背书","公开发行不只看人数","交易盈利不是内幕交易全部构成条件"],"caseStudy":{"facts":"某公司以非公开发行名义在公共网站向社会广泛发布认购广告，并声称只要控制最终认购人数就不受公开发行监管。","analysis":"公开方式和对象范围本身具有法律意义，不能仅靠最后人数包装规避监管。应同时审查向不特定对象发行及公开劝诱等事实，非公开称谓不决定法律性质。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国证券法","url":"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202111/t20211124_2544351.html","article":"第2—12条及交易、信息披露、投资者保护章节","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"BUS-15","title":"海商法新旧衔接与商事综合审题","objectives":["识别海商法新旧衔接与商事综合审题的适用前提","区分一般规则、特别规则与例外","将事实逐项代入法定要件并给出程序结论"],"sections":[{"title":"规则与适用条件","body":"2025修订海商法自2026年5月1日起施行，章节覆盖船舶物权、海上货物及旅客运输、租船、拖航、碰撞、救助、共同海损、责任限制、保险、时效及涉外法律适用。学习时必须先确定法律事实时间及履行跨越新旧法等衔接，不能继续无差别引用1992年旧条号或把生效后公布页面误认为立法日期。"},{"title":"制度比较与审题重点","body":"最高法时间效力规定对一般不溯及既往与特定衔接情形作规定。船舶抵押、运输单证含电子记录、承运人责任、海事赔偿责任限制各有严格条件，不宜用一般民法口号代替海商特别法；反之，特别法未规定且可适用一般法时也不能凭海事性质拒绝一切补充规则。商事综合题还要区分主体组织、合同基础、担保财产、程序管辖及破产集体清偿层次。"}],"pitfalls":["施行时间与公布时间不同","新旧法不能按诉讼日期一刀切","专业特别法问题需逐项识别，不凭行业名称泛化"],"caseStudy":{"facts":"海上运输合同在新法施行前订立，部分履行及相关法律事实发生于施行后。承运人主张所有问题一律适用旧法，托运人主张一律适用新法。","analysis":"应先梳理每个法律事实和争议事项发生时间，再依新法及最高法时间效力规定逐项判断，不能仅以签约日或起诉日一个日期包办全部问题。具体责任限额等变化须查现行条文后再计算。"},"method":"先确定争议性质和程序阶段，再识别主体、法定条件及是否存在特别规定；将题干每一事实对应到规则，最后分别写明法院应采取的处理方式、理由及可用救济。不要把实体请求是否成立与程序是否受理混为一谈。","sourceRefs":[{"title":"中华人民共和国海商法","url":"https://cj.msa.gov.cn/xxgk/zc/zcfg/202607/t20260707_3571861.shtml","article":"海商法第310条及最高法法释〔2026〕8号","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]}]},{"id":10,"title":"知识产权法","chapters":[{"id":"IPR-01","title":"著作权客体与权利层次","objectives":["识别表达和思想","区分著作权与物权","定位不同利用行为"],"sections":[{"title":"先判断是不是作品","body":"作品保护不是对一切劳动成果授予垄断。审题先找文学、艺术、科学领域内能够以一定形式表现的独创性智力成果；创作不要求达到艺术大奖水平，但机械复制、单纯事实和抽象方法不能仅因耗费人力就成为作品。历史事件、数学公式和做菜思路可以被他人利用，具体写成的独创文章、照片和插画却可能受保护。法律法规及其官方正式译文另被排除，不能把官方法律文本收费发行后声称拥有文本著作权。"},{"title":"从使用方式定位财产权","body":"复制关注制作一份或多份；发行关注向公众出售或赠与有形原件、复制件；网络传播关注公众能在各自选择的时间地点取得作品。现场演唱、投影放映、电视播出不是同一权利。相同视频被下载保存、上传点播、在商场播放，可能分别触及不同权利。题目问的是哪项权利时，要把行为拆开，不要把一切网络行为都概括成复制或发行。"},{"title":"人身权与载体所有权","body":"作者署名与作品不受歪曲篡改，不能因画作出售而当然转让。买受人取得的是原件物权，著作权是否许可或转让需要另找法律或合同依据；美术、摄影原件的展览权依法由原件所有人享有，故不能反过来认为买画人完全没有任何展示权。改编已有作品创作新表达，新增独创部分可产生权利，但利用改编作品通常仍须处理原作品权利。"},{"title":"独创性审查的证据与论证","body":"当两个创作者都描绘同一座古桥时，桥的形状和客观比例不是某一画家的私有题材。甲的构图角度、明暗安排、线条组织和色彩搭配可以形成表达。乙从同一地点独立观察后完成不同画面，不应因题材相同就被推定侵权。若乙直接临摹甲的特殊构图并只改动少量颜色，分析对象便是受保护表达的实质使用。作答时应指出哪些元素属于公有领域、哪些元素体现个性化选择；单说“两幅画很像”缺乏法律归类，单说“题材不能垄断”又可能漏掉具体表达的复制。"},{"title":"层次化训练与反例","body":"一种常见复合题是：甲写出旅行线路构思，乙据此独立写作游记，丙复制乙的游记并署甲的名字。甲不能仅凭最初构思成为乙文章的作者；乙独立形成的文字表达可受保护；丙即便标了某个人名，也不能消除复制、发行或署名错误的问题。另一种反例是新闻稿中的事实与评论分离：赛事比分属于事实，记者对比赛节奏的独创评论和摄影作品仍须分别判断。考场上先把事实信息从作品表达剥离，再逐个主体、逐项行为匹配权利，可避免把“可以引用事实”误写成“可以整篇照搬报道”。"},{"title":"应当形成的答题结论","body":"完整结论至少包含客体、权利人、行为、规范与结果五个环节。例如应写“油画为受保护的美术作品，乙为作者；甲购得原件后依法享有原件展览权，但未取得复制发行许可，所以公开展出与制作画册应作不同评价；署名权仍由乙保有”。这样的表述说明了为何一部分合法、一部分越界，而非依赖一个总标签。遇到题干没有交代授权时，应只在题目已给事实与通常法定规则内推理，不凭空补出一份概括许可合同。"}],"pitfalls":["将勤奋劳动等同独创性","把买下原稿理解成买下全部著作权","混同点播、直播和有形复制品销售"],"caseStudy":{"facts":"甲买下乙创作的油画原件，在自家展厅展出，并把画面扫描后印成收费画册，封面删除作者姓名。","analysis":"应拆成三个行为：合法原件所有人的展览具有法定依据；批量印刷画册涉及复制、发行，不能由买画的物权当然推出授权；删除署名还涉及作者署名权。答案不能以“甲是所有人”一概肯定全部行为，也不能以“乙保留著作权”一概否定展览。"},"method":"先客体，再权属，再逐行为定位权利，最后查许可或法定限制。","sourceRefs":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第3、5、10、20条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["IPR-0001","IPR-0002","IPR-0003","IPR-0004","IPR-0005","IPR-0016","IPR-0017","IPR-0018","IPR-0026","IPR-0028"]},{"id":"IPR-02","title":"著作权归属、合作与职务成果","objectives":["区分合作与汇编","判断职务作品和委托作品","理解视听作品权属"],"sections":[{"title":"作者识别与合作作品","body":"自然人作者通常是直接创作作品者，提供资金、场地、修改意见不当然成为共同作者。合作作品要求共同创作意思与实质创作贡献；能够分割使用的，各自创作部分可以独立享有著作权，但行使不得侵犯整体。若只是按照编辑取舍编成选集，独创选择编排可能形成汇编作品，原作品权利与汇编新增权利并存。"},{"title":"职务不等于单位包揽","body":"受雇完成工作任务构成职务作品后，还须区分一般职务作品与法律列明的特殊职务作品。一般情形下作者享有著作权、单位在业务范围内有优先使用权；工程设计图、产品设计图、地图、示意图、计算机软件等在主要利用单位物质技术条件并由单位承担责任等法定条件下，作者一般只享有署名权，其他著作权由单位享有。不能只因使用一台单位电脑就机械套用特殊规则。"},{"title":"合同约定与法律默认","body":"委托作品先查合同权属约定，约定不明时原则上由受托创作者享有著作权，付款不等于全部权利转移。电影、电视剧作品与其他视听作品须分别适用法律规则，导演、编剧等作者的署名和报酬权，与制作者享有的著作权可以并存。审题必须先识别作品种类，再找约定，不能统一套用“出钱者所有”。"},{"title":"共同作品的行使与保护","body":"合作作者之间不能因为无法达成一致就任由一方剥夺另一方作者身份。对不可分割的合作作品，法律对行使方式有专门安排，任何一方无正当理由不得阻止他方依法行使相应权利，收益也须合理分配；但转让、专有许可、出质等涉及重大处分的事项与一般使用不能混同。能够分割使用的章节、乐曲等，则需审查单独行使是否影响整体合作作品。若甲只是校正错别字、提供资料或作行政管理，不能把此种辅助劳动等同于独创创作贡献，考点是作者身份而不是劳动量大小。"},{"title":"职务与委托关系的交叉","body":"同一个项目可能同时存在公司与员工的劳动关系，以及公司与客户的委托关系。应先判断员工完成的成果在内部归谁，再判断公司向客户承诺转让了哪些权利。客户支付设计费，不会自动改变员工与公司之间的法定署名安排；公司也不能转让自己并未取得的权利。题干若明确成果在单位主持、代表单位意志创作并由单位承担责任，还要与法人作品制度作区分，不能直接把“单位组织创作”和“员工职务作品”当成完全同义。"},{"title":"合同审查的落点","body":"实务式题目常以“全案交付”“买断设计”“可用于宣传”等模糊表述作为干扰。需要区分作品载体交付、特定目的使用许可、专有许可和著作权财产权转让。许可范围未明确的部分不能当然认定已经授予；作者人身权也不能简单用买断字样排除。答题不是让考生替当事人补全合同，而是先说明条款存在什么归属或使用范围争点，再依据默认规则与已给目的作有限判断。"}],"pitfalls":["把出资、组织劳动直接算共同创作","把全部职务作品都认定单位享有","委托合同沉默时默认委托人所有"],"caseStudy":{"facts":"广告公司付费委托自由插画师制作海报，合同只写交付时间和价格，未约定著作权。公司后来将海报授权其他商户印刷。","analysis":"委托费用解决履行报酬，不当然解决著作权归属。未明确约定权属时，应按受托人享有规则判断，再审查委托目的范围内的使用及另行授权是否越界；不能仅因公司付款就认定可以任意转授权。"},"method":"列清贡献者、雇佣或委托关系、作品类型、合同条款，分别归属。","sourceRefs":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第11至19条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["IPR-0006","IPR-0007","IPR-0008","IPR-0009","IPR-0010","IPR-0019","IPR-0020","IPR-0021","IPR-0022","IPR-0027","IPR-0029"]},{"id":"IPR-03","title":"著作权限制、期限与救济","objectives":["区分合理使用与法定许可","掌握期限起算","分析侵权责任条件"],"sections":[{"title":"限制规则需要逐项对应","body":"合理使用不是“公益”标签。应落到个人学习、适当引用、课堂教学等具体类型，还须满足署名等一般要求，不影响作品正常使用、不不合理损害权利人合法利益。学校把整本畅销教材扫描给全校长期免费下载，不能仅因不收费就认定课堂教学合理使用。法定许可则常允许免许可但须支付报酬，不能与免费使用混淆。"},{"title":"期限按权利和主体分别计算","body":"自然人作品财产权及发表权通常以作者终生及死亡后五十年为基本结构，合作作品关注最后死亡作者。署名、修改和保护完整等权利保护不受通常财产权期限限制。法人或非法人组织作品、视听作品等另有起算规则，不可统一按创作日加五十年。著作权法修订对摄影作品等还有过渡规定，跨期题应先确定时间点。"},{"title":"责任与免责要分层","body":"判断侵权先看权利和利用行为，再审查授权与限制。停止侵害与赔偿的条件不能混为一谈。发行者主张合法来源、网络平台主张技术服务免责，都应核实其承担的证明义务、知道或应当知道状况及收到通知后的措施，不能认为凡是平台或购买者就当然免责。恶意且情节严重等条件可能影响惩罚性赔偿，不能把所有侵权都按倍数赔偿。"},{"title":"合理使用的三层审查","body":"第一层是法定类型：主体、用途、作品发表状态、数量或范围是否符合条文；第二层是署名、作品名称等一般义务；第三层是不得影响作品正常使用并不得不合理损害权利人的合法利益。任何一层不符都不能只靠“公益”补正。课堂播放的范围、供多少人使用、是否上传到公众平台，是会改变结论的关键事实。适当引用也要服务于介绍、评论或说明问题，若引用部分成为作品主体，或以引用名义替代购买原作，应进一步否定其适当性。"},{"title":"保护期限与继受取得","body":"买受人、继承人或受让人取得财产权，不意味着产生一轮新的保护期间。作者死亡后，继承财产权的家属只能在剩余法定期间内行使，而不是自继承日起重新计算五十年。不同权利分别讨论也十分必要：财产权届满不意味着可以伪称自己是作者，保护作品完整等人身利益不能按同一时点全部归零。题目如同时给出生、创作、发表、转让、死亡日期，应先标注每个日期在何种权利计算中有意义，不能机械挑最大的日期往后加年限。"},{"title":"损害赔偿的答题方法","body":"一旦题目进入损害赔偿，应查清权利人实际损失、侵权人违法所得、许可使用费参考及法定赔偿等不同路径适用条件，不能跳过事实直接报最高金额。惩罚性赔偿还涉及故意与情节严重等专门要件，停止侵害、赔偿损失、消除影响、赔礼道歉也不是每案必然同时适用。对未成年人课堂使用、平台中立技术服务、善意发行合法来源等事实，需定位具体责任规则，不能将一般合同免责条款直接用来对抗不在合同内的权利人。"}],"pitfalls":["不收费必然合理使用","五十年保护期从购买日算","法定许可无需付酬","所有侵权均惩罚性赔偿"],"caseStudy":{"facts":"教师在课堂上展示数段已发表纪录片分析拍摄方法，注明作品与作者；随后出版社把整部纪录片二维码作为收费培训套餐卖点。","analysis":"前一行为应按课堂教学的具体范围和一般限制要求审查；后一行为面向社会商业传播，不能直接继承课堂教学的限制事由。使用目的、规模和市场替代效果发生变化，应分别判断，不能共享一个“教育用途”结论。"},"method":"分行为、分权利、分时间、分责任项目审查，避免将一种免责扩张到所有请求。","sourceRefs":[{"title":"中华人民共和国著作权法（2020年修正）","url":"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html","effectiveDate":"2021-06-01","article":"第22至25、52至54条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":["IPR-0011","IPR-0012","IPR-0013","IPR-0014","IPR-0015","IPR-0023","IPR-0024","IPR-0025","IPR-0030"]},{"id":"IPR-04","title":"专利客体、授权条件与申请","objectives":["区分三种专利","分析新颖创造实用","掌握申请与权属"],"sections":[{"title":"三种客体不是同一技术标准","body":"发明可以针对产品、方法及其改进；实用新型针对产品的形状、构造或其结合提出适于实用的新技术方案；外观设计保护富有美感并适于工业应用的整体或局部设计。纯粹经营规则、科学发现、疾病诊断和治疗方法等具有法定排除，不能把一切新想法都包装成专利。对用药制造方法与对人直接治疗的方法，要分别判断。"},{"title":"申请日与现有技术","body":"新颖性需要将每项技术方案与申请日前公开的现有技术比较。创造性还须分析区别特征及显而易见性；实用性不是市场销量保证。发明与实用新型创造性要求存在法定差别。保密内部资料不当然构成已向公众公开，但在先申请在后公开可能构成抵触申请，不能只查公开日而漏掉申请日。"},{"title":"职务发明与披露","body":"执行单位任务或主要利用单位物质技术条件完成的发明创造，申请权、专利权通常归单位，并依法保障发明人、设计人的署名及奖励报酬。利用单位物质技术条件另有约定时要审查约定。中国完成的发明或实用新型向外国申请，可能涉及事先保密审查；在境外递交不是逃避保密义务的方法。"},{"title":"公开、优先权与宽限例外","body":"申请日前公开是新颖性审查的重要分界，但并非凡申请人自己公开就没有任何补救。法律对法定展会、规定的学术会议、他人未经同意泄露等情形设置条件严格的不丧失新颖性期间，应核对公开类型、期间和证明要求；不能把任何网店发布都视为法定展会。优先权则是在法律或条约条件下援用在先申请时间，其功能与公开宽限不同。考生应分别写出最早申请、主张优先权、对外公开和后申请的顺序，而不是以“有六个月或十二个月”一语代替全部条件。"},{"title":"同日申请的特殊处理","body":"同样发明创造通常只能授予一项专利权。实务上同一申请人同日就同样成果同时申请发明与实用新型，有法定衔接安排，但不是可以长期保有两项重叠权利并重复索赔。要核对同日、同一申请人、在先获得的实用新型尚未终止，以及放弃声明等条件。两位不同申请人独立完成相同技术时，创造先后本身并不当然决定授权顺位，申请先后及相关法定规则才是重要判断基础，不能把著作权的独立创作逻辑直接搬来处理专利排他权。"},{"title":"方法与产品的例题拆解","body":"例如甲提出一种治疗流程并设计配套机器，不能以“与治病有关”为由把整项成果全部排除，也不能把直接作用于人体的诊断治疗步骤作为普通方法发明当然授权。配套装置可能属于产品技术方案，制药方法与药品也有独立审查路径。再如只描述提高经营收入的抽象规则，若没有构成符合专利法要求的技术方案，不能仅因写成软件流程图就跨过客体门槛。授权审查要先解决能否进入专利保护，再讨论是否满足新颖性等条件。"}],"pitfalls":["实用新型保护任何新方法","产品获奖等于具有新颖性","专利申请权归属与发明人署名混同"],"caseStudy":{"facts":"研发人员在公司安排的项目中完成新阀门构造，公司申请实用新型。员工认为方案由自己想出，拒绝把自己列为发明人之外的任何权利安排。","analysis":"应把创造者身份与财产权属拆开。职务发明符合条件时申请权可归公司，员工仍享有发明人署名并涉及法定奖励报酬。若争议是公司拿了成果却不署名，不能据此否认公司本来可能享有的申请权。"},"method":"先识别专利类型与排除事由，再画时间轴判断公开，最后处理申请权和保密。","sourceRefs":[{"title":"中华人民共和国专利法（2020年修正）","url":"https://www.cnipa.gov.cn/art/2020/11/23/art_524_171347.html","effectiveDate":"2021-06-01","article":"第2、6、16、19、22、25条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"IPR-05","title":"专利权范围、期限与不侵权抗辩","objectives":["从权利要求判断技术范围","分清侵权与无效","掌握法定不侵权情形"],"sections":[{"title":"范围由权利要求而非商品外观宣传决定","body":"发明与实用新型保护范围以权利要求内容为准，说明书及附图可用于解释。对方产品是否包含全部必要技术特征，应逐项比对；功能相同不必然侵权，名称不同也不必然不侵权。外观设计则以图片或照片展示的设计为准，简要说明可用于解释。不能拿专利摘要替代权利要求。"},{"title":"期限与效力路径","body":"发明二十年、实用新型十年、外观设计十五年的法定期限均从申请日起计算，但授权公告后才产生相应专利权效力，发明申请公布后的临时保护另论。部分发明可能依法获得期限补偿。被告认为专利不应授权，应走无效宣告等法定路径，不能仅因自己认为缺乏创造性就当然获得实施许可。"},{"title":"抗辩按事实精确适用","body":"权利用尽关注经专利权人或许可者合法售出的具体产品；先用权关注申请日前已制造或作好必要准备且限原有范围；实验例外不是把工业生产都叫测试。现有技术、合法来源等抗辩各有条件，合法来源一般影响赔偿责任而不当然免除停止销售等所有责任。为提供药品医疗器械审批信息而实施的法定例外，也不能扩张到无关商业销售。"},{"title":"从技术比对到行为类型","body":"即使被诉产品落入保护范围，还需确认被告实施的是制造、使用、许诺销售、销售或进口等受专利法控制的生产经营行为。个人非生产经营目的使用与商业制造的评价不能混同；外观设计专利的控制行为又与发明、实用新型存在文本区别。对专利方法直接获得的产品，也应审查方法与产品之间的联系，不可见到同类成品就推定使用相同方法。权利要求有多个技术特征时，应逐项展示对应关系，而不是拿核心零件“很接近”代替全部必要技术特征判断。"},{"title":"在先实施与既有产品流转","body":"先用权的时间要求在申请日前，且须已有制造、使用或必要准备，并受原有范围限制；在申请日后才开始模仿，即使尚未收到警告，也不是先用权。权利用尽针对获得合法授权进入流通的特定产品，不赋予购买者再制造一批相同产品的权利。经许可出售的机器可以依法继续转售，与拆解后按图批量造新机器应分开。题目常用“我已经买了”“我早就在计划”偷换依法出售与必要准备的事实，必须逐一拆穿。"},{"title":"程序、实体与赔偿抗辩的并行","body":"被告提出专利应当无效，与证明实施方案属于现有技术，处于不同论证路径。前者针对权利本身的授权合法性，后者可以在侵权争议中依法作为抗辩；合法来源则通常围绕特定主体的损害赔偿责任展开。遇到多种抗辩，不要只写“专利不稳定所以不侵权”，而应分别列出主管程序、举证对象和法律效果。案件中有诉前行为保全、证据保全或临时措施时，还应独立审查紧迫性、损害风险与担保等条件，不能由存在专利证书直接推出一切临时请求均应支持。"}],"pitfalls":["授权日才开始计算二十年","合法来源可以永远继续销售","先用权可以任意扩大产能","摘要就是保护范围"],"caseStudy":{"facts":"经销商持正规发票购入后来被认定侵权的设备，能证明不知道侵权且来源合法；收到权利人通知后仍继续销售库存。","analysis":"先审查其合法来源与善意证明是否成立。即使依法可免赔偿，也不能因此推导获得继续销售许可；停止侵害及后续明知销售责任仍需分别审查。其对上游的合同追偿与专利权人请求也属不同法律关系。"},"method":"按权利要求比对，再逐一审查不侵权、赔偿免责与无效程序，不把三条路径混用。","sourceRefs":[{"title":"中华人民共和国专利法（2020年修正）","url":"https://www.cnipa.gov.cn/art/2020/11/23/art_524_171347.html","effectiveDate":"2021-06-01","article":"第42、59、67、75、77条","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]},{"id":"IPR-06","title":"商标、商业秘密与版本衔接","objectives":["识别显著性与禁用","区分注册使用侵权","把握商业秘密及新旧法"],"sections":[{"title":"注册与正当使用","body":"现行商标制度强调识别来源的显著性，通用名称、直接描述商品特点的标志原则上不能独占，但取得显著特征等条件需具体审查。相同商品上使用相同注册商标，与近似标志、类似商品上的混淆判断，适用条件不同。注册标志含通用或描述部分时，权利人不得禁止他人正当使用这些部分；驰名商标保护按事实需要个案认定，不是企业可以永久印在包装上的荣誉称号。"},{"title":"续展、许可与在先使用","body":"现行2019修正版下，注册商标十年有效，届满前十二个月申请续展，另有六个月宽展期。许可未经备案不得对抗善意第三人，不能简化成许可合同一律无效。具有一定影响的在先使用者在法定条件下可在原有范围继续使用，但注册人可以要求附加适当区别标识；继续使用不是任意扩张经营范围的通行证。"},{"title":"秘密保护与时间效力","body":"商业秘密要求非公知、商业价值和相应保密措施同时具备。客户名单不是自动秘密，反向工程与独立研发也不能仅因结果相似就定侵权；但以不正当手段先取得秘密后再辩称能够自行研发，不能当然免责。2025反不正当竞争法已经施行；2026商标修订虽已公布，但2027年1月1日才施行。本课程以2026年11月24日现行法为基准，未来法内容必须显著标明。"},{"title":"商标保护强度与商品联系","body":"未注册驰名商标在相同或类似商品上的保护，与已注册驰名商标跨类保护的要件不能合并。驰名状态是案件中根据保护需要认定的事实，还需关注复制、摹仿、翻译、误导公众和利益可能受损等条件。普通注册商标跨越不相类似商品时也不能仅凭注册就得到一切行业排他权。描述性使用、指示性事实与作为来源标志的使用应先区分，再审查是否落入专用权控制范围。商标制度不意味着可以把普通词汇从语言中永久拿走。"},{"title":"商业秘密案件的证明顺序","body":"权利人应先明确主张保密的信息具体内容，而不是笼统要求对方对一整座工厂保密；再说明信息未公开、具有商业价值，以及采取了与信息性质相适应的保护措施。访问权限、保密协议、加密管理、文件标识等可以成为证明线索，但一份保密协议也不使公开常识变成秘密。涉嫌侵权方的获取途径、接触机会和信息相同或实质相同，是进一步分析的事实。独立研发、从公开产品合法反向工程等合法来源，与盗取秘密后补做研发记录，不能得到相同评价。"},{"title":"新旧法学习的时间轴","body":"2026年修订商标法的公布日和施行日必须分别记忆。本批以2026年11月24日为观察点，现行实体规则仍需适用2019修正版；未来法不能用于提前否定当前行为。2025反不正当竞争法则已经进入现行规范，混淆、网络竞争、商业贿赂等条号应按新文本核对。做跨期题时先问行为何时发生、争议涉及何种法律关系、有没有特别过渡条款，再判断适用版本，不能把“最新网页上排在最前”的法条直接当成一切案件的依据。"}],"pitfalls":["把2026修订商标法当成当前已施行法","商标许可未备案必然无效","客户名单一律是商业秘密","驰名认定是永久商业荣誉"],"caseStudy":{"facts":"公司从公开行业名录整理客户电话，未做访问控制；离职员工又盗取公司加密文件中的客户独特采购偏好并用于竞争。","analysis":"公开名录中的一般信息与经营中形成、非公开且具有价值并受保护的独特交易信息要分别判断。前者不因整理成本高就变秘密，后者须结合保密措施与获取手段审查。不能以同一文件夹名叫“客户资料”一概认定或否认。"},"method":"先锁定适用日期，再区分商标注册、使用、许可及秘密保护的不同构成要件。","sourceRefs":[{"title":"中华人民共和国商标法（2019年修正，现行）","url":"https://www.cnipa.gov.cn/art/2019/6/25/art_104_67808.html","effectiveDate":"2019-11-01","article":"第11、13、14、39、40、43、57、59条","checkedAt":"2026-11-24","status":"source-checked"},{"title":"中华人民共和国商标法（2026年修订，尚未施行）","url":"https://www.cnipa.gov.cn/art/2026/6/26/art_95_206942.html","effectiveDate":"2027-01-01","article":"第87条（未来施行）","checkedAt":"2026-11-24","status":"source-checked"},{"title":"中华人民共和国反不正当竞争法（2025年修订）","url":"https://ipc.court.gov.cn/zh-cn/news/view-6249.html","effectiveDate":"2025-10-15","article":"商业秘密规则","checkedAt":"2026-11-24","status":"source-checked"}],"quizIds":[]}]},{"id":0,"title":"习近平法治思想","chapters":[{"id":"XFT-01","title":"理论形成与现行核心要义","objectives":["把时间线与理论内涵分开记忆"],"sections":[{"title":"基本原理与制度逻辑","body":"学习这一科要先建立时间坐标。2020年中央全面依法治国工作会议正式提出习近平法治思想，并以十一个方面概括其核心要义；2025年会议又增加依法治国与依规治党有机统一，并拓展法治轨道上现代化建设的表述。2026年学习材料采用十二个坚持。"},{"title":"适用方法与边界","body":"题目如果问某次历史会议，应按当时表述判断；如果问当前核心要义，不能把旧版数量机械当成现行结论。理论发展表现为政治方向、价值立场、实践任务与制度保障的体系化，不能只背数量而忽略内在联系。"}],"pitfalls":["把历史阶段数量当永恒结论","把更新理解成过去理论完全错误"],"caseStudy":{"facts":"学习小组拿2021年教材断言当前核心要义只能有十一个，另一同学认为旧教材全部失效。","analysis":"两种说法均过度。旧教材可用来理解历史阶段，但当前表述需以2025年会议及2026权威阐释更新；应给知识卡加上适用时间，而不是抹去发展脉络。"},"method":"先找题干时间，再找问题指向，最后核对现行权威表述","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0001","XFT-0002","XFT-0003","XFT-0004"],"completionStatus":"draft-needs-expansion-to-1200-characters"},{"id":"XFT-02","title":"党的领导与依宪治国","objectives":["理解领导、法定程序与国家意志的关系"],"sections":[{"title":"基本原理与制度逻辑","body":"党的领导是全面依法治国的根本保证；依宪治国、依宪执政强调宪法作为国家根本法的最高权威。二者不是择一关系。党的主张应通过法定程序转化为国家意志，国家机关依照宪法法律行使职权。"},{"title":"适用方法与边界","body":"解题不能把党的领导等同于个别干部随意指令，更不能以贯彻政策为由跳过法定权限与程序。政策部署推动立法和治理，但具体行政强制、处罚、裁判仍需相应法律依据，涉及改革试点的，应依法取得授权。"}],"pitfalls":["领导与个人意志混同","把政策文件当成任何强制权的直接来源"],"caseStudy":{"facts":"某地负责人要求立即用内部会议纪要设立限制人身自由的处罚，理由是落实上级工作部署。","analysis":"落实部署不产生超越法律保留的权限。应先区分政策目标与实施手段，限制人身自由的处罚须有法律依据，内部纪要不能替代法律。"},"method":"目标正当性、机关权限、措施依据、程序保障四步判断","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0005","XFT-0006","XFT-0007","XFT-0008"],"completionStatus":"draft-needs-expansion-to-1200-characters"},{"id":"XFT-03","title":"以人民为中心与公平正义","objectives":["区分群众需求、程序权利与简单多数"],"sections":[{"title":"基本原理与制度逻辑","body":"以人民为中心要求法治建设为了人民、依靠人民、造福人民、保护人民。它体现于立法听取意见、执法维护合法权益、司法提供有效救济及公共法律服务。"},{"title":"适用方法与边界","body":"人民满意不能被简化为一时舆论赞成率。多数人的诉求也需在宪法法律框架中实现，少数人的合法权利与程序参与不能因社会压力而被取消。评价措施既要看是否回应真实问题，也要看是否通过合法、平等、可救济的方式解决问题。"}],"pitfalls":["把民意直接当作事实证据","用多数赞成排除少数者权利"],"caseStudy":{"facts":"小区多数业主要求行政机关不经调查就处罚少数经营者，机关以支持率高为由省去告知申辩。","analysis":"广泛意见应被听取，但事实认定、处罚依据和程序保障仍必须满足。以人民为中心同时包含保护被处理者的合法权益，不能用多数意见替代法定程序。"},"method":"分别审查公众参与、个体权利和法定程序是否落实","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0009","XFT-0010","XFT-0011","XFT-0012"],"completionStatus":"draft-needs-expansion-to-1200-characters"},{"id":"XFT-04","title":"法治体系与法律体系","objectives":["识别总抓手与五个体系的层次"],"sections":[{"title":"基本原理与制度逻辑","body":"中国特色社会主义法治体系是全面依法治国的总抓手，范围宽于由法律规范组成的法律体系。学习时应把规范供给、法律实施、监督制约、制度保障及党内法规建设放进同一结构。"},{"title":"适用方法与边界","body":"法律规范制定出来只是起点。没有执行、监督和保障，文本无法稳定转化为治理效果；反过来，强调实施也不意味着可以不补充完善立法。考题常用以其中一部分替代整体的方式设错，如把法治体系缩成单纯增加法条数量。"}],"pitfalls":["把法律体系与法治体系视为同义词","重数量轻实施"],"caseStudy":{"facts":"某市把年度法治建设考核仅设为新增规范性文件数量，不考查执行、救济和监督。","analysis":"文件数量只能反映部分规范供给，无法独立评价法治体系建设。还应检查规范质量、实施效果、权力监督、救济可及性及相应保障。"},"method":"先辨问题问规范集合还是治理体系，再检验选项是否以偏概全","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0013","XFT-0014","XFT-0015","XFT-0016"],"completionStatus":"draft-needs-expansion-to-1200-characters"},{"id":"XFT-05","title":"共同推进与一体建设","objectives":["掌握主体维度和形态维度"],"sections":[{"title":"基本原理与制度逻辑","body":"依法治国、依法执政、依法行政共同推进，分别观察国家治理总体、执政活动和行政权运行的法治化；法治国家、法治政府、法治社会一体建设，则从整体制度、行政实践及社会秩序等方面构成协同。"},{"title":"适用方法与边界","body":"共同推进不等于各环节互相替代。行政执法改进离不开立法、监督和社会守法，社会调解发展也不能成为行政机关不履职或法院拒绝依法受案的理由。考题应辨清它讨论的是谁如何活动，还是法治建设的不同组成。"}],"pitfalls":["把协同建设理解为功能互换","用社会自治免除国家职责"],"caseStudy":{"facts":"某地认为只要发展社会调解组织，就可暂停行政复议窗口，统一让居民自行协商。","analysis":"多元化纠纷解决与法定救济应衔接而非相互取消。法治社会建设不能解除行政机关受理复议等法定职责，应保留法定渠道并提供分流指引。"},"method":"先定位环节，再判断协同措施是否保留其他环节的法定功能","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0017","XFT-0018","XFT-0019","XFT-0020"],"completionStatus":"draft-needs-expansion-to-1200-characters"},{"id":"XFT-06","title":"立法执法司法守法的全过程","objectives":["理解四个环节及其质量要求"],"sections":[{"title":"基本原理与制度逻辑","body":"科学立法着重规范设计与现实需要相适应、具有可执行性；严格执法要求行政权在法定权限、依据和程序内运行；公正司法同时关注实体与程序；全民守法包含自觉守法和依法维权。"},{"title":"适用方法与边界","body":"任何一环都不能只追求形式指标。科学立法不是简单移植外地规则，严格执法不是一律从重，公正司法不是按网络热度裁判，全民守法也不排除公民依法监督公权力。各环节共同服务于公平正义与权利保障。"}],"pitfalls":["严格等于严厉","公正等于结果合意","守法等于不提出异议"],"caseStudy":{"facts":"执法机关要求轻微违法全部适用最高罚款，以此证明严格执法。","analysis":"严格执法强调依法履职和规范裁量，不等同于处罚越重越好。应适用具体法律关于不予、从轻、减轻处罚以及过罚相当的规定。"},"method":"把抽象口号转化为权限、依据、程序、裁量和救济的具体要求","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0021","XFT-0022","XFT-0023","XFT-0024"],"completionStatus":"draft-needs-expansion-to-1200-characters"},{"id":"XFT-07","title":"国内法治与涉外法治","objectives":["掌握统筹的双向要求"],"sections":[{"title":"基本原理与制度逻辑","body":"统筹国内法治和涉外法治，要求在维护国家主权、安全和发展利益的同时，依法保护各类主体合法权益，善用国内法与国际法规则。涉外法治既包括国内涉外法律制度建设，也包括国际规则参与、涉外执法司法和法律服务能力。"},{"title":"适用方法与边界","body":"统筹不是遇到涉外关系就放弃国内法，也不是不研究国际规则而一律依直觉处理。具体案件仍需审查管辖、法律适用、条约义务和程序保障，区别立场原则与操作规则。"}],"pitfalls":["涉外法治仅等于国际法","维护利益可以跳过法律程序"],"caseStudy":{"facts":"企业遭遇境外歧视性措施，负责人主张不用研究任何规则，只以商业报复应对。","analysis":"依法维护权益需要识别可用的国内反制规则、争端解决渠道和适用国际规则，同时评估证据及执行风险。原则立场与专业法律工具应结合。"},"method":"先认涉外因素和权利风险，再定位国内法、条约与争端机制","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0025","XFT-0026","XFT-0027"],"completionStatus":"draft-needs-expansion-to-1200-characters"},{"id":"XFT-08","title":"改革德治与领导干部责任","objectives":["理解依法改革及法治保障"],"sections":[{"title":"基本原理与制度逻辑","body":"改革与法治应相互促进，在法治下推进改革，在改革中完善法治。现行法律不能满足试点需要时，应依法通过修改、授权暂时调整或停止适用等方式衔接，而不是先违法再补手续。"},{"title":"适用方法与边界","body":"依法治国与以德治国相结合，意味着法律规范与道德教化各有作用、相互支持；道德评价不能直接替代定罪处罚依据。领导干部是关键少数，应带头尊法学法守法用法，把公权力受约束的要求转化为实际决策和履职习惯。"}],"pitfalls":["改革必要性代替授权","道德谴责代替法律责任"],"caseStudy":{"facts":"试点负责人认为创新项目没有旧法经验，可以先停止执行现行法律，待成功后申请授权。","analysis":"创新必要性不能自行产生暂停法律的权限。应识别具体冲突条款并通过法定授权或修法渠道解决，确保改革措施有依据、范围和期限。"},"method":"先查现行规范，再查试点授权的主体、范围、期限和监督","sourceRefs":[{"title":"全国人大常委会专题讲座：深入学习贯彻习近平法治思想","url":"https://www.bjrd.gov.cn/xwzx/fzlt/202603/t20260331_4570577.html","article":"2026年3月31日全文；十二个坚持","effectiveDate":"2025-11-18","checkedAt":"2026-11-24","status":"primary-text-opened"}],"quizIds":["XFT-0028","XFT-0029","XFT-0030"],"completionStatus":"draft-needs-expansion-to-1200-characters"}]},{"id":1,"title":"法理学","chapters":[{"id":"JUR-01","title":"法的特征与规范结构","objectives":["区分规范性、国家性和社会调整功能"],"sections":[{"title":"基本原理与制度逻辑","body":"法通过一般规则调整社会关系，并由国家权力确认、实施和保障。国家强制性体现为最终保障机制，不意味着每次守法都必须警察介入。法律规范要结合条件、行为模式、法律后果理解，条文与完整规范并非一一对应。"},{"title":"适用方法与边界","body":"同一条文可能容纳多项规范，一项规范也可能分散在实体法、定义条款和责任条款中。题目给出孤立条文时，应先补齐适用条件，再判断它授权、禁止或要求什么。"}],"pitfalls":["法条数量等于规范数量","国家保障等于任何纠纷都强制执行"],"caseStudy":{"facts":"某规则规定经营者符合条件可申请许可，另一条规定骗取许可的责任，学员认为两条完全无联系。","analysis":"申请资格与法律后果可共同构成制度链条。应把主体、行为条件、行政机关权限和违法后果联系起来，而非按条数机械数规范。"},"method":"拆出主体、条件、行为模式和后果，核对各要素来源","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters"},{"id":"JUR-02","title":"法律规则原则与概念","objectives":["识别规则优先和原则的补充功能"],"sections":[{"title":"基本原理与制度逻辑","body":"规则通常给出较明确的条件和后果；原则提供基础价值和解释方向；法律概念则提供制度表达工具。三者共同构成规范体系，但功能不同。"},{"title":"适用方法与边界","body":"明确规则能够适用时，不能仅因裁判者不喜欢结果就跳过规则，以抽象公平直接改判。原则适用需要说明规则解释、法律漏洞或规范冲突等理由，并提供可被讨论的论证，避免以原则之名任意裁量。"}],"pitfalls":["原则总比规则优先","概念只能按日常含义解释"],"caseStudy":{"facts":"合同纠纷存在明确的法定无效规则，裁判者只以个人认为结果公平为由宣告有效。","analysis":"公平等原则要在体系中适用，不能任意架空明确强制规则。首先解释规则的适用条件，再审查是否确有例外或规范冲突。"},"method":"先识别规范类型，再判断规则能否直接适用及原则介入理由","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters"},{"id":"JUR-03","title":"法律渊源与效力层级","objectives":["区分制定主体、名称和效力"],"sections":[{"title":"基本原理与制度逻辑","body":"判断规范位阶要先看制定主体和法定形式。国家法律、行政法规、地方性法规、规章分属不同层级或权限范围，不能只凭文件名中有条例、办法就定性。"},{"title":"适用方法与边界","body":"上位法优于下位法的规则首先要求规范之间确有适用冲突。地方性法规与部门规章等关系还可能需有权机关裁决，不能一律理解为名称听起来更大者优先。规范性文件也不能自行取得法律保留事项的创设权。"}],"pitfalls":["看标题不看主体","所有冲突都能简单用特别法解决"],"caseStudy":{"facts":"某省人大常委会制定条例，某国务院部门制定同名条例，学员按标题相同判断效力相同。","analysis":"前者可属于地方性法规，后者需依主体与程序判断为部门规章等，名称相同不决定法律形式与效力。发生冲突应依立法法具体机制处理。"},"method":"主体、形式、事项、位阶、冲突解决机制依次判断","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters"},{"id":"JUR-04","title":"法律关系与法律事实","objectives":["区分关系要素和变动原因"],"sections":[{"title":"基本原理与制度逻辑","body":"法律关系由主体、内容和客体构成。权利与义务是关系内容，标的物、行为等可作为关系客体；主体资格与行为能力需依具体部门法判断。法律事实是引起关系产生、变更或消灭的事实，通常区分行为和事件。"},{"title":"适用方法与边界","body":"自然灾害不因与人的经济利益有关就成为法律行为，订约也不因最终无效就当然不属于人的行为。先做事实分类，再按实体规则确定是否及如何产生法律效果。"}],"pitfalls":["法律事实必然合法","自然事件不产生法律效果"],"caseStudy":{"facts":"租赁房屋因雷击毁损，双方签订解除协议。","analysis":"雷击通常属于事件，订立解除协议属于行为；二者均可能与租赁关系消灭或责任分配有关，但法律效果需要分别依据合同和风险负担规则判断。"},"method":"列出关系主体、权利义务、客体，再为每个变化寻找法律事实","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters"},{"id":"JUR-05","title":"法律责任与法律制裁","objectives":["理解归责条件及责任竞合"],"sections":[{"title":"基本原理与制度逻辑","body":"法律责任是违法、违约等事实依法引发的不利后果，责任是否成立要看该责任类型的法定构成要件。民事、行政和刑事责任可以因同一事实并存，并不因有一种责任就当然排除另一种。"},{"title":"适用方法与边界","body":"归责原则并非一律过错责任，实体法可能规定无过错责任、推定过错或特别抗辩。法律责任与道德谴责、法律制裁概念也不完全重合，应结合规范和程序分析。"}],"pitfalls":["承担刑责后当然免民责","所有责任均必须证明故意"],"caseStudy":{"facts":"企业违法排污同时造成居民损害，被行政罚款后主张不必赔偿。","analysis":"行政处罚与民事赔偿保护不同法益、承担不同功能，不能以已经罚款当然免除赔偿；是否涉嫌犯罪还需另行依刑法判断。"},"method":"先分责任类型，再逐项审查构成、抗辩、并存与承担方式","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters"},{"id":"JUR-06","title":"法律解释与法律推理","objectives":["掌握文义体系目的及论证边界"],"sections":[{"title":"基本原理与制度逻辑","body":"法律解释应结合文字、上下文、制度结构、立法目的和相关材料。文义解释关注法律语言的可能含义，体系解释强调同一规范与其他规范协调，目的解释讨论制度意旨。"},{"title":"适用方法与边界","body":"解释方法可能互相支持，也可能导向不同结论，应说明取舍理由。类推、扩大解释等应区分，尤其刑事领域不能以类推方式创设犯罪和刑罚。案件结论需要大前提、事实小前提和涵摄过程支持。"}],"pitfalls":["目的解释允许完全脱离文字","类推与扩大解释无区别"],"caseStudy":{"facts":"裁判者只因某行为在道德上接近犯罪，就用相似罪名处罚，未说明是否落入法条文义。","analysis":"这是以相似性替代入罪依据的危险做法。应先确定构成要件可能文义，再结合体系和目的解释，不得通过不利类推突破罪刑法定。"},"method":"分清待解释语词、事实要素和推理步骤，检查结论是否越界","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters"},{"id":"JUR-07","title":"法的制定实施与监督","objectives":["区分立法执法司法守法的制度角色"],"sections":[{"title":"基本原理与制度逻辑","body":"法的实施包括规范在社会生活中的落实，执法与司法各有法定主体和程序，守法则涉及所有受规范约束主体。法律监督既包括国家机关依法实施的监督，也包括社会依法进行的监督。"},{"title":"适用方法与边界","body":"监督的存在不意味着监督者可以绕过职权分工直接替代被监督机关决定。立法质量、实施能力和监督救济共同影响规范实效，不能只凭有法可依就认定法治目标已实现。"}],"pitfalls":["监督与替代决定混同","违法规范只能靠个人拒绝解决"],"caseStudy":{"facts":"社会组织发现行政处罚违法，主张自己的监督意见可直接撤销处罚。","analysis":"社会监督可以提出批评建议、举报并推动法定救济，但撤销处罚须由有权机关依程序作出，不能把监督权泛化成行政或司法决定权。"},"method":"辨监督主体、方式与法律效力，再定位法定纠错渠道","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters"},{"id":"JUR-08","title":"法与道德政策科技","objectives":["理解规范协调与法治方法"],"sections":[{"title":"基本原理与制度逻辑","body":"法律、道德和政策共同参与社会治理，但形成方式、调整范围、实施机制不同。道德要求可以支持立法与守法，政策可以引导制度改革，却不能任意替代具体法律依据。技术工具能够辅助事实整理和风险识别，其结果仍需受到法律程序、证据规则和权利保障约束。"},{"title":"适用方法与边界","body":"法治思维要求公开说明依据、尊重权限和程序，并允许救济；不能把算法准确率当作自动免除法律审查的理由。"}],"pitfalls":["科技结果当然等同于法律结论","政策目标可排除程序"],"caseStudy":{"facts":"机关以算法标记风险为唯一依据直接处罚，不向当事人说明认定理由。","analysis":"技术提示可以成为核查线索，但不能替代违法事实认定及法定程序。应审查数据可靠性、适用规则、告知申辩及可争议机制。"},"method":"把工具输出与法律认定分开，逐项检验依据和救济","sourceRefs":[{"title":"中华人民共和国立法法（2023年修正）","url":"https://hubca.miit.gov.cn/zwgk/zcwj/flfg/art/2023/art_617433c825534c34a1104d67a6254ba2.html","article":"立法权限、程序、适用与备案审查","effectiveDate":"2023-03-15","checkedAt":"2026-11-24","status":"primary-text-opened-concept-review-pending"}],"quizIds":[],"completionStatus":"draft-needs-expansion-to-1200-characters"}]},{"id":2,"title":"宪法","chapters":[]},{"id":3,"title":"中国法律史","chapters":[]},{"id":5,"title":"司法制度和法律职业道德","chapters":[]}],"questions":[{"id":"CIV-0001","subject":9,"chapter":"CIV-02","type":"single","prompt":"甲十七岁，在外独立工作，工资足以支付其主要生活开支。甲未经父母同意购买工作所需的电脑。仅就行为能力，下列正确的是？","options":["甲视为完全民事行为能力人，可以独立实施该购买行为","甲虽有收入仍一律为无民事行为能力人","只要未满十八岁，任何购买合同均须父母追认","甲只有接受赠与的能力，没有订约能力"],"answer":[0],"explanation":"十六周岁以上且以自己的劳动收入为主要生活来源的未成年人，依法视为完全民事行为能力人。题干已给出全部条件，不能只看是否满十八岁。","optionAnalysis":["年龄和主要生活来源共同满足拟制完全能力条件","不满八岁才通常属于无行为能力，不能由未满十八岁直接推出","法律设有十六岁以上劳动收入例外","完全行为能力并非仅限纯获利益行为"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第18条"}],"difficulty":"基础","tags":["自然人的权利能力与行为能力"],"reviewStatus":"source-checked"},{"id":"CIV-0002","subject":9,"chapter":"CIV-02","type":"single","prompt":"乙十二岁，用零花钱购买与其年龄相适应的普通文具。父亲以未经自己同意为由要求认定合同不生效。下列正确的是？","options":["合同须等乙满十八岁才生效","该交易可由乙独立有效实施","合同当然无效","店主必须申请指定监护人才能交付"],"answer":[1],"explanation":"限制民事行为能力人可以独立实施与其年龄、智力相适应的行为。通常生活文具交易已被题干限定在这一范围内，不以父亲另行追认为必要。","optionAnalysis":["能力规则不要求一律等到成年","年龄智力适应的交易属于可独立实施范围","适应范围内行为并非无效","监护指定不是普通文具交易的前置程序"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第19、145条"}],"difficulty":"基础","tags":["自然人的权利能力与行为能力"],"reviewStatus":"source-checked"},{"id":"CIV-0003","subject":9,"chapter":"CIV-02","type":"single","prompt":"六岁丙未经代理独自签署高额有偿培训合同。培训机构认为只要丙签了姓名，合同即有效。下列正确的是？","options":["丙的签字使其获得完全行为能力","合同一律属于可撤销行为","丙独自实施的该民事法律行为无效","培训机构可以单方替丙指定自己为监护人"],"answer":[2],"explanation":"不满八周岁的未成年人为无民事行为能力人，其自行实施的民事法律行为依法无效。该结论与限制行为能力人超出适应范围的行为有区别，不能一概适用待追认规则。","optionAnalysis":["签字事实不改变年龄和行为能力","无行为能力行为与重大误解等可撤销行为性质不同","无行为能力人自行订立题示合同适用无效规则","监护关系不能由交易相对人任意设定"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第20、144条"}],"difficulty":"基础","tags":["自然人的权利能力与行为能力"],"reviewStatus":"source-checked"},{"id":"CIV-0004","subject":9,"chapter":"CIV-02","type":"multiple","prompt":"丁十三岁，下列行为中，依法可以独立实施的有哪些？","options":["无附加负担接受祖母赠送的书籍","购买与年龄智力相适应的普通午餐","以接受房屋赠与为条件承诺独自承担巨额债务","无偿处分其名下全部贵重收藏品"],"answer":[0,1],"explanation":"纯获利益与年龄智力相适应的行为分别属于法定独立实施范围。附带巨额债务的赠与不是纯获利益；处分全部贵重财产明显不能仅凭未成年人签字排除代理或追认要求。","optionAnalysis":["无负担受赠是纯获利益","通常午餐是年龄智力适应的生活交易","附加巨额债务改变纯获利益性质","重大贵重财产无偿处分并非题示年龄可当然独立实施"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第19、145条"}],"difficulty":"进阶","tags":["自然人的权利能力与行为能力"],"reviewStatus":"source-checked"},{"id":"CIV-0005","subject":9,"chapter":"CIV-02","type":"multiple","prompt":"关于胎儿利益保护，下列判断正确的有哪些？","options":["涉及遗产继承利益时，法律可将胎儿视为具有民事权利能力","胎儿娩出时为死体的，其拟制的权利能力自始不存在","胎儿因此可以亲自作出有法律效力的合同承诺","胎儿拟制意味着自然人一般权利能力均从受孕开始"],"answer":[0,1],"explanation":"民法典对继承、接受赠与等特定利益作有限拟制，并未修改自然人一般权利能力始于出生的规则，更没有赋予胎儿亲自实施意思表示的行为能力。","optionAnalysis":["继承利益属于条文明确保护领域","死体娩出的法定后果是自始不存在","权利能力与亲自订约的行为能力必须区分","特定拟制不能扩大为所有自然人的一般起点"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第13、16条"}],"difficulty":"进阶","tags":["自然人的权利能力与行为能力"],"reviewStatus":"source-checked"},{"id":"CIV-0006","subject":9,"chapter":"CIV-02","type":"indefinite","prompt":"戊为限制民事行为能力人，独自订立明显超出其适应范围的有偿合同。相对人善意并依法催告其法定代理人追认。下列正确的有哪些？","options":["代理人自收到催告通知起三十日内未作表示，视为拒绝追认","善意相对人在追认前可依法通知撤销","代理人沉默一律视为同意","该行为与无行为能力人行为适用完全相同的当然无效规则"],"answer":[0,1],"explanation":"限制行为能力人超出独立实施范围的行为，依法须经同意或追认。催告后的沉默是拒绝追认，而不是默示同意；善意相对人依法享有追认前的撤销保护。","optionAnalysis":["法定三十日催告期间届满沉默视为拒绝","撤销权以善意且追认前为条件并应通知","与条文规定的沉默效果相反","应区分限制能力人的待追认与无能力人的无效"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第145条"}],"difficulty":"进阶","tags":["自然人的权利能力与行为能力"],"reviewStatus":"source-checked"},{"id":"CIV-0007","subject":9,"chapter":"CIV-03","type":"single","prompt":"监护人为偿还自己的个人投资债务，拟出售被监护人的房屋。下列正确的是？","options":["只要具有监护身份就可以任意出售","以监护人自身利益处分财产不符合监护职责","只要房屋价高就无需审查用途","监护人因此直接取得房屋所有权"],"answer":[1],"explanation":"监护人除为维护被监护人利益外，不得处分其财产。监护资格是保护性职权，并非所有权；高价与否不能替代最有利于被监护人利益的目的审查。","optionAnalysis":["监护权不是任意处分授权","题示出售目的仅为监护人个人债务，不符合原则","处分价格合理仍须满足保护被监护人利益","监护身份不改变财产归属"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第35条"}],"difficulty":"基础","tags":["监护、失踪与死亡宣告"],"reviewStatus":"source-checked"},{"id":"CIV-0008","subject":9,"chapter":"CIV-03","type":"single","prompt":"甲具有完全民事行为能力，担心未来失能，欲与愿意照护自己的乙预先确定监护安排。下列正确的是？","options":["只能由甲死亡后遗嘱指定","任何口头约定都当然满足意定监护形式","可协商以书面形式确定，并在甲丧失或部分丧失行为能力时履职","必须现在立即宣布甲为无行为能力人"],"answer":[2],"explanation":"意定监护可由具有完全行为能力的成年人事先协商，以书面形式确定愿意担任监护人的个人或组织，在法定能力变化后履职。不应将其误作继承或提前宣告失能制度。","optionAnalysis":["意定监护不是死后继承安排","法律明确要求书面形式","题示方式与启动条件符合法定规则","预先安排本身不以现在丧失能力为条件"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第33条"}],"difficulty":"基础","tags":["监护、失踪与死亡宣告"],"reviewStatus":"source-checked"},{"id":"CIV-0009","subject":9,"chapter":"CIV-03","type":"multiple","prompt":"甲被宣告失踪后，其财产代管人乙履职。下列正确的有哪些？","options":["乙应妥善管理甲财产、维护甲财产权益","甲应付税款和债务可依法从甲财产中支付","乙因故意或重大过失造成甲财产损失应承担赔偿责任","乙取得代管资格后自动取得甲财产所有权"],"answer":[0,1,2],"explanation":"财产代管服务于维护失踪人权益，并应依法处理其债务费用。法律特别规定代管人故意、重大过失损害财产时的赔偿责任；代管不产生所有权转移。","optionAnalysis":["符合代管职责的核心要求","法定费用与债务由失踪人财产支付","条文明定故意或重大过失损害责任","代管是管理安排，不是所有权取得方式"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第43条"}],"difficulty":"进阶","tags":["监护、失踪与死亡宣告"],"reviewStatus":"source-checked"},{"id":"CIV-0010","subject":9,"chapter":"CIV-03","type":"single","prompt":"同一失联自然人已符合宣告死亡条件，部分利害关系人申请失踪宣告，另有利害关系人申请死亡宣告。法院依法应怎样处理？","options":["必须先宣告失踪再等待四年","以申请人数多的一方为准","符合死亡宣告条件的，应当宣告死亡","只能由配偶的意见决定"],"answer":[2],"explanation":"同一人存在两种申请且符合法定宣告死亡条件的，民法典明确优先作出死亡宣告，不以先宣告失踪或多数申请为条件。","optionAnalysis":["死亡宣告不以失踪宣告为必经前置","申请人数不是法定判断标准","符合法定条件时适用明文的协调规则","配偶身份不产生排除其他法定申请人的决定权"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第47条"}],"difficulty":"基础","tags":["监护、失踪与死亡宣告"],"reviewStatus":"source-checked"},{"id":"CIV-0011","subject":9,"chapter":"CIV-03","type":"multiple","prompt":"甲被宣告死亡后实际仍在异地生活，并以本人身份实施正常交易。后来死亡宣告被撤销。下列正确的有哪些？","options":["其实际存活期间的交易，不因死亡宣告本身当然无效","其配偶已再婚的，原婚姻关系不因撤销死亡宣告当然恢复","其子女已被依法收养的，甲不能仅以未经本人同意主张收养无效","死亡宣告被撤销必然使期间内全部法律关系自始消失"],"answer":[0,1,2],"explanation":"死亡宣告不同于实际死亡，对实际存活者的行为效力及婚姻、收养恢复存在分别保护交易和身份稳定的规则，应逐项判断，不能笼统追溯否定一切。","optionAnalysis":["法律明确不因死亡宣告影响实际存活者行为效力","配偶再婚属于婚姻不自行恢复的例外","合法收养有身份稳定保护","题示绝对化结论违反多个特别恢复规则"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第49、51、52条"}],"difficulty":"进阶","tags":["监护、失踪与死亡宣告"],"reviewStatus":"source-checked"},{"id":"CIV-0012","subject":9,"chapter":"CIV-04","type":"single","prompt":"公司法定代表人以公司名义订立普通采购合同，未违反特别法；相对人善意，不知公司章程中的内部交易限额。下列正确的是？","options":["内部限额一律使合同对公司无效","合同后果原则上由公司承受，内部权限限制不得对抗善意相对人","相对人必须自愿承担公司全部债务","合同必然转为法定代表人与相对人之间的个人合同"],"answer":[1],"explanation":"法定代表人以法人名义从事民事活动的后果原则上由法人承受；章程或权力机构对代表权限的内部限制不得对抗善意相对人。题干已排除担保等特别法问题。","optionAnalysis":["忽略不得对抗善意相对人的规则","名义、身份和善意条件均已满足题示规则","相对人不因此承担法人的其他债务","代表行为不因内部限额自动转化为个人交易"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第61条"}],"difficulty":"基础","tags":["法人、非法人组织与职务行为"],"reviewStatus":"source-checked"},{"id":"CIV-0013","subject":9,"chapter":"CIV-04","type":"multiple","prompt":"关于法人主体资格，下列正确的有哪些？","options":["法人民事权利能力和行为能力通常从成立时产生","法人原则上以其全部财产独立承担责任","被吊销营业执照必然在当日无须清算即终止法人资格","法人依法终止通常应结合清算、注销等要件判断"],"answer":[0,1,3],"explanation":"应区分解散事由与法人终止。吊销营业执照可能构成解散原因，但清算和注销等终止程序不能因此被跳过。法人独立责任是一般规则，法定例外另论。","optionAnalysis":["符合法人能力的起止规则","全部财产独立承担责任为基本规则","吊销不等于立即完成法定终止程序","终止应综合法定程序与特别批准要求"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第59、60、68至72条"}],"difficulty":"进阶","tags":["法人、非法人组织与职务行为"],"reviewStatus":"source-checked"},{"id":"CIV-0014","subject":9,"chapter":"CIV-05","type":"single","prompt":"甲乙通谋签订虚假的买卖合同，实际旨在实施赠与。下列正确的是？","options":["虚假买卖表示无效，隐藏赠与另依有关规则判断","虚假买卖有效，因为双方意思一致","隐藏赠与必然无效，不需另行审查","只要合同有签章，虚假表示也不得否定"],"answer":[0],"explanation":"民法典区分虚假表示与其隐藏的真实行为：虚假表示无效，隐藏行为效力依有关法律规定独立处理。意思一致不等于表示真实，也不排除法定效力审查。","optionAnalysis":["正确完成表层与隐藏行为的两次效力判断","通谋一致恰是虚假表示问题，不使其有效","隐藏行为仍可能依法有效","形式真实性不能取代意思表示真实性"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第146条"}],"difficulty":"基础","tags":["意思表示与民事法律行为效力"],"reviewStatus":"source-checked"},{"id":"CIV-0015","subject":9,"chapter":"CIV-05","type":"single","prompt":"甲因重大误解实施民事法律行为。甲可以向何者请求撤销？","options":["仅能要求相对人自行确认无效","人民法院或者仲裁机构","只能由行政机关撤销所有相关交易","只能等待该行为自然无效"],"answer":[1],"explanation":"重大误解产生依法请求撤销的权利，应由法定机构依申请处理，不等同于行为自始当然无效。撤销权还须在法定期间内行使。","optionAnalysis":["相对人同意不是唯一法定撤销路径","法院或仲裁机构是条文规定的请求对象","普通民事撤销不由行政机关概括决定","可撤销行为不能与当然无效混同"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第147、152条"}],"difficulty":"基础","tags":["意思表示与民事法律行为效力"],"reviewStatus":"source-checked"},{"id":"CIV-0016","subject":9,"chapter":"CIV-05","type":"multiple","prompt":"关于第三人实施欺诈、胁迫，下列判断正确的有哪些？","options":["第三人欺诈通常还须审查相对人知道或应当知道，才能依相应规则撤销","第三人胁迫的撤销规则不以相对人知道胁迫为统一必要条件","只要第三人欺诈，任何善意相对人均当然承担与欺诈者同样责任","欺诈和胁迫都当然使行为绝对无效，无须行使撤销权"],"answer":[0,1],"explanation":"第三人欺诈与第三人胁迫的撤销条件存在区别。欺诈规则保护善意相对人的交易信赖；胁迫规则更直接保护受胁迫者的意思自由。两者通常属于可撤销问题。","optionAnalysis":["该知道或应当知道要求见第三人欺诈条款","胁迫条款没有题示统一知情要求","善意相对人不因第三人欺诈当然与其同责","可撤销与无效应区分"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第149、150条"}],"difficulty":"进阶","tags":["意思表示与民事法律行为效力"],"reviewStatus":"source-checked"},{"id":"CIV-0017","subject":9,"chapter":"CIV-05","type":"multiple","prompt":"甲乙恶意串通，通过交易损害丙合法权益。下列正确的有哪些？","options":["该民事法律行为依法无效","由此取得的财产依法应返还，不能或无必要返还时可折价补偿","因行为无效，任何一方都不可能再承担损失赔偿","双方均有过错时，依法各自承担相应责任"],"answer":[0,1,3],"explanation":"恶意串通损害他人合法权益属于法定无效情形。无效并不意味着免除财产返还与过错赔偿；后果应依无效行为返还及责任分配规则分别处理。","optionAnalysis":["题示恶意串通与损害条件满足无效规则","法定返还和折价处理仍适用","无效不能作为免赔理由","依各方过错依法分担损失"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第154至157条"}],"difficulty":"进阶","tags":["意思表示与民事法律行为效力"],"reviewStatus":"source-checked"},{"id":"CIV-0018","subject":9,"chapter":"CIV-05","type":"single","prompt":"甲为使自己免除付款义务，不正当地阻止合同所附生效条件成就。下列正确的是？","options":["甲可因自己阻止条件而当然免责","条件一律永远不能成就","依法视为条件已经成就","应由甲单方重新指定生效日期"],"answer":[2],"explanation":"为自己的利益不正当地阻止条件成就，依法拟制条件已成就，防止当事人通过操控条件破坏诚信。该规则与正当影响条件的情形不能混同。","optionAnalysis":["不得从自己不诚信行为获益","条文设置成就拟制以纠正阻止行为","题干完全满足不当阻止条件","当事人无单方重定期限的权利"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第159条"}],"difficulty":"基础","tags":["意思表示与民事法律行为效力"],"reviewStatus":"source-checked"},{"id":"CIV-0019","subject":9,"chapter":"CIV-06","type":"single","prompt":"甲无乙的授权，却以乙名义订约。丙善意，依法催告乙收到通知后三十日内追认，乙始终沉默。下列正确的是？","options":["沉默视为追认","沉默视为拒绝追认","丙因催告而丧失一切救济","甲自动成为乙的法定代表人"],"answer":[1],"explanation":"无权代理催告后的法定沉默效果是拒绝追认。善意相对人对行为人的履行或损害赔偿等救济应另依规则审查，不会因催告而全部消灭。","optionAnalysis":["法定沉默效果并非同意","三十日期间后的不表示依法视为拒绝","未追认时仍有法定相对人保护规则","代理权限与法定代表身份不能由沉默取得"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第171条"}],"difficulty":"基础","tags":["代理与无权代理"],"reviewStatus":"source-checked"},{"id":"CIV-0020","subject":9,"chapter":"CIV-06","type":"multiple","prompt":"关于无权代理责任，下列正确的有哪些？","options":["未经追认的行为原则上对被代理人不发生效力","善意相对人在追认前可依法通知撤销","明知无权代理的相对人与行为人依各自过错承担责任","善意相对人的损害赔偿可以无上限超过追认时可得利益"],"answer":[0,1,2],"explanation":"应区分对被代理人的效力、相对人的撤销权和未追认时行为人责任。善意相对人的赔偿保护受法定利益上限约束，恶意相对人则适用过错分担。","optionAnalysis":["这是无权代理对本人的一般效力规则","法律为善意相对人提供追认前退出权","知道或应当知道无权代理适用过错责任分配","赔偿不得超过被追认时相对人所能获得的利益"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第171条"}],"difficulty":"进阶","tags":["代理与无权代理"],"reviewStatus":"source-checked"},{"id":"CIV-0021","subject":9,"chapter":"CIV-06","type":"single","prompt":"甲已经知道乙的代理权被撤销，仍与乙以被代理人名义订立合同。甲仅凭旧授权书主张表见代理。下列正确的是？","options":["旧授权书存在即必然构成表见代理","甲明知授权终止，不能仅凭旧外观主张合理信赖","代理权一旦产生永远不能终止","甲可通过单方声明恢复乙的代理权"],"answer":[1],"explanation":"表见代理的交易安全保护建立在有理由相信代理权存在的基础上。明知权利终止的相对人缺乏受保护的信赖，旧授权文件不能推翻其实际知情。","optionAnalysis":["外观并非不问相对人知情状态的充分条件","明知终止使合理信赖基础欠缺","法定终止情形明确存在","代理权不能由相对人单方恢复"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第172、173条"}],"difficulty":"基础","tags":["代理与无权代理"],"reviewStatus":"source-checked"},{"id":"CIV-0022","subject":9,"chapter":"CIV-06","type":"multiple","prompt":"代理人甲受乙委托出售设备，同时打算自己买下该设备。下列正确的有哪些？","options":["原则上属于须受限制的自己代理情形","经乙同意或追认的，适用法定例外","只要甲愿意支付价款就无需审查利益冲突","代理人无论何种情形均绝对不得与本人交易"],"answer":[0,1],"explanation":"自己代理可能导致利益冲突，民法典原则限制，但允许被代理人同意或追认的例外。价款给付不替代同意追认，绝对禁止的表述也不准确。","optionAnalysis":["代理人同时作为相对人符合自己代理结构","法定例外保护被代理人的自主决定","付款并不当然消除利益冲突","存在同意或追认例外，非绝对禁止"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第168条"}],"difficulty":"进阶","tags":["代理与无权代理"],"reviewStatus":"source-checked"},{"id":"CIV-0023","subject":9,"chapter":"CIV-07","type":"single","prompt":"甲诉乙偿还借款，乙没有提出诉讼时效抗辩。法院认为可能已经超过时效，准备主动以此驳回请求。下列正确的是？","options":["法院可当然主动适用时效","法院不得主动适用诉讼时效规定","时效经过自动使法院丧失审判权","法院须将债权直接没收"],"answer":[1],"explanation":"时效届满赋予义务人抗辩，法院不得主动适用。实体请求、抗辩权和司法审判权不能相互混淆，是否超过时效仍应按法定抗辩结构处理。","optionAnalysis":["与禁止法院主动适用的明文规定相反","应由义务人依法主张时效抗辩","时效并不消灭法院对案件的审判职权","债权不因时效而归国家所有"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第192、193条"}],"difficulty":"基础","tags":["诉讼时效与期间计算"],"reviewStatus":"source-checked"},{"id":"CIV-0024","subject":9,"chapter":"CIV-07","type":"single","prompt":"乙在诉讼时效届满后明知情况仍自愿偿还甲的债务，事后仅以时效届满要求甲返还。下列正确的是？","options":["应返还，因为债务已自动消灭","不得仅依时效届满请求返还","甲只能保留一半款项","付款当然转化为行政罚款"],"answer":[1],"explanation":"时效届满不使债权当然消灭，已经自愿履行的，法律明确不得请求返还。应注意题干排除了欺诈、错误支付等其他独立返还原因。","optionAnalysis":["时效是抗辩规则，不是债权自动消灭规则","自愿履行后不得依时效要求返还","没有保留一半的法定依据","民事履行不会自动转成行政处罚"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第192条"}],"difficulty":"基础","tags":["诉讼时效与期间计算"],"reviewStatus":"source-checked"},{"id":"CIV-0025","subject":9,"chapter":"CIV-07","type":"multiple","prompt":"关于诉讼时效起算，下列正确的有哪些？","options":["同一债务约定分期履行的，自最后一期履行期限届满之日起计算","未成年人遭性侵害的损害赔偿请求权，自其年满十八周岁之日起计算","无行为能力人对法定代理人的请求权一律自侵害发生当天起算，绝无特别规则","普通时效起算通常需要知道或应当知道权利受损以及义务人"],"answer":[0,1,3],"explanation":"普通起算与法定特别起算应并行掌握。对法定代理人的请求权，存在法定代理终止后的特别起算；不能将普通知情标准机械覆盖全部受保护主体。","optionAnalysis":["同一债务分期履行适用最后一期规则","未成年人性侵赔偿有成年起算的特别保护","法定代理关系请求权存在代理终止时起算的特别规则","这是一般起算的基本结构"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第188至191条"}],"difficulty":"进阶","tags":["诉讼时效与期间计算"],"reviewStatus":"source-checked"},{"id":"CIV-0026","subject":9,"chapter":"CIV-07","type":"multiple","prompt":"下列关于诉讼时效抗辩和期间的判断，正确的有哪些？","options":["当事人约定普通诉讼时效为十年，该约定依法无效","当事人预先放弃诉讼时效利益，依法无效","义务人时效届满后同意履行的，可再以该时效届满拒绝履行","时效期间、计算方法及中止中断事由原则上由法律规定"],"answer":[0,1,3],"explanation":"诉讼时效具有法定性，约定改变法定期间及预先放弃时效利益受限制。届满后同意履行也产生法律规定的抗辩限制，不能任意反悔。","optionAnalysis":["违反时效期间法定规则","法律禁止预先放弃时效利益","届满后同意履行不得再据此抗辩","体现法定期间与法定事由原则"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第192、197条"}],"difficulty":"进阶","tags":["诉讼时效与期间计算"],"reviewStatus":"source-checked"},{"id":"CIV-0027","subject":9,"chapter":"CIV-08","type":"single","prompt":"甲乙依法订立普通房屋买卖合同，但尚未办理过户登记，且无其他效力瑕疵。仅因未登记，下列正确的是？","options":["买卖合同当然无效","不影响买卖合同效力，但所有权是否转移另依登记规则判断","甲已经付款就必然取得所有权","合同和物权效力完全不能区分"],"answer":[1],"explanation":"民法典明确区分原因行为与不动产物权变动。未办理登记不影响合同效力的一般规则，不等于已经完成所有权移转；题干排除特别生效约定和法定例外。","optionAnalysis":["未登记不当然否定合同效力","正确区分合同与物权两个层次","普通房屋交易付款不替代登记","法典明确要求分别审查"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第209、214、215条"}],"difficulty":"基础","tags":["物权变动与物权保护"],"reviewStatus":"source-checked"},{"id":"CIV-0028","subject":9,"chapter":"CIV-08","type":"multiple","prompt":"甲的房屋权属证书记载与登记簿不一致。下列判断正确的有哪些？","options":["不动产登记簿是物权归属和内容的根据","除有证据证明登记簿确有错误外，以登记簿为准","权属证书任何时候均绝对优先于登记簿","有证据证明登记簿错误的，不能仍机械坚持其绝对正确"],"answer":[0,1,3],"explanation":"登记簿具有法定权利推定基础，权属证书是权利证明。两者不一致时原则上以登记簿为准，但登记簿可由充分证据推翻，不能把推定效力误作绝对不可反驳。","optionAnalysis":["这是登记簿的法定地位","符合证书与登记簿不一致的处理规则","证书记载不是绝对优先","推定规则承认足以证明错误的证据例外"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第216、217条"}],"difficulty":"进阶","tags":["物权变动与物权保护"],"reviewStatus":"source-checked"},{"id":"CIV-0029","subject":9,"chapter":"CIV-05","type":"indefinite","prompt":"合同某个条款违反法律导致无效，但该条款可与其余约定分离，其余约定没有其他效力障碍。下列正确的有哪些？","options":["其余部分可以继续有效","无效部分必然使整个合同一律无效","应审查部分无效是否影响其他部分","各方签字后即不得审查任何条款效力"],"answer":[0,2],"explanation":"部分无效应审查可分性与对其余部分的影响。题干已明确无效条款可以分离且其余无障碍，因此不能机械推导整体无效；签字也不排除法定效力审查。","optionAnalysis":["题示可分离且无其他障碍，支持其余有效","绝对整体无效与部分无效规则不符","影响判断是适用部分无效规则的关键","签字不排除无效规范适用"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第156条"}],"difficulty":"进阶","tags":["意思表示与民事法律行为效力"],"reviewStatus":"source-checked"},{"id":"CIV-0030","subject":9,"chapter":"CIV-06","type":"indefinite","prompt":"乙死亡前委托甲代为办理特定事务，甲在不知道且不应当知道乙死亡的情况下继续实施原代理行为。仅就死亡对代理的影响，下列正确的有哪些？","options":["该情形下代理行为可依特别规定有效","只要乙死亡，一切代理行为无任何例外均无效","应审查代理人是否知道且应当知道死亡事实","有效与否只能由相对人是否支付双倍价格决定"],"answer":[0,2],"explanation":"委托代理一般因本人死亡终止，但民法典规定代理人不知道且不应当知道死亡等例外。考试应先写原则，再核对例外，而不是使用无条件绝对结论。","optionAnalysis":["满足法定死亡后代理有效例外","死亡终止原则存在明文例外","知情与应知状态直接关联本项例外","价款倍数与该法定例外无关"],"basis":[{"title":"中华人民共和国民法典","url":"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html","effectiveDate":"2021-01-01","article":"第173、174条"}],"difficulty":"进阶","tags":["代理与无权代理"],"reviewStatus":"source-checked"},{"id":"CRI-0001","subject":6,"chapter":"CRI-01","type":"single","prompt":"行为实施时法律没有规定为犯罪，之后新法才将其入罪。原则上应如何处理？","options":["不能仅按新法追溯定罪","直接适用新法定罪","民意要求时可以定罪","比照最相似罪名定罪"],"answer":[0],"explanation":"法律未明文规定为犯罪的不得定罪；对行为时不构成犯罪的行为，不能以后法入罪作不利追溯。","optionAnalysis":["正确。该项表述为“不能仅按新法追溯定罪”。判断依据：法律未明文规定为犯罪的不得定罪；对行为时不构成犯罪的行为，不能以后法入罪作不利追溯。","错误。该项表述为“直接适用新法定罪”。判断依据：法律未明文规定为犯罪的不得定罪；对行为时不构成犯罪的行为，不能以后法入罪作不利追溯。","错误。该项表述为“民意要求时可以定罪”。判断依据：法律未明文规定为犯罪的不得定罪；对行为时不构成犯罪的行为，不能以后法入罪作不利追溯。","错误。该项表述为“比照最相似罪名定罪”。判断依据：法律未明文规定为犯罪的不得定罪；对行为时不构成犯罪的行为，不能以后法入罪作不利追溯。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第3、12条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"基础","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0002","subject":6,"chapter":"CRI-01","type":"single","prompt":"法官认为被告人特别可恶，拟判超过法定最高刑的刑罚。哪项评价准确？","options":["情绪强烈即可突破法定刑","被害人同意即可任意加刑","社会影响大即可自行创设刑罚","裁量仍须受法定刑限制"],"answer":[3],"explanation":"定罪量刑须有法律依据；犯罪事实、责任和危害是法定范围内裁量的根据，个人好恶与舆论不能创设刑罚。","optionAnalysis":["错误。该项表述为“情绪强烈即可突破法定刑”。判断依据：定罪量刑须有法律依据；犯罪事实、责任和危害是法定范围内裁量的根据，个人好恶与舆论不能创设刑罚。","错误。该项表述为“被害人同意即可任意加刑”。判断依据：定罪量刑须有法律依据；犯罪事实、责任和危害是法定范围内裁量的根据，个人好恶与舆论不能创设刑罚。","错误。该项表述为“社会影响大即可自行创设刑罚”。判断依据：定罪量刑须有法律依据；犯罪事实、责任和危害是法定范围内裁量的根据，个人好恶与舆论不能创设刑罚。","正确。该项表述为“裁量仍须受法定刑限制”。判断依据：定罪量刑须有法律依据；犯罪事实、责任和危害是法定范围内裁量的根据，个人好恶与舆论不能创设刑罚。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第3、5、61条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"基础","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0003","subject":6,"chapter":"CRI-02","type":"single","prompt":"境外甲远程诈骗，使境内乙处分财产并在境内发生损失。我国首先可检验哪项管辖依据？","options":["绝无管辖","必须甲具有中国国籍","属地管辖","只能普遍管辖"],"answer":[2],"explanation":"犯罪行为或者结果一项发生在我国领域内即可构成属地连接点，不以行为人入境或中国国籍为必要。","optionAnalysis":["错误。该项表述为“绝无管辖”。判断依据：犯罪行为或者结果一项发生在我国领域内即可构成属地连接点，不以行为人入境或中国国籍为必要。","错误。该项表述为“必须甲具有中国国籍”。判断依据：犯罪行为或者结果一项发生在我国领域内即可构成属地连接点，不以行为人入境或中国国籍为必要。","正确。该项表述为“属地管辖”。判断依据：犯罪行为或者结果一项发生在我国领域内即可构成属地连接点，不以行为人入境或中国国籍为必要。","错误。该项表述为“只能普遍管辖”。判断依据：犯罪行为或者结果一项发生在我国领域内即可构成属地连接点，不以行为人入境或中国国籍为必要。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第6条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"基础","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0004","subject":6,"chapter":"CRI-02","type":"single","prompt":"中国普通公民在境外犯我国刑法之罪，法定最高刑为三年有期徒刑。哪项表述准确？","options":["外国没处罚就自动免责","可以不予追究","必须一律不追究","境外行为一律不适用中国刑法"],"answer":[1],"explanation":"中国公民境外犯罪原则适用中国刑法；一般公民所犯罪最高刑三年以下的可以不予追究，不是必须不追究。","optionAnalysis":["错误。该项表述为“外国没处罚就自动免责”。判断依据：中国公民境外犯罪原则适用中国刑法；一般公民所犯罪最高刑三年以下的可以不予追究，不是必须不追究。","正确。该项表述为“可以不予追究”。判断依据：中国公民境外犯罪原则适用中国刑法；一般公民所犯罪最高刑三年以下的可以不予追究，不是必须不追究。","错误。该项表述为“必须一律不追究”。判断依据：中国公民境外犯罪原则适用中国刑法；一般公民所犯罪最高刑三年以下的可以不予追究，不是必须不追究。","错误。该项表述为“境外行为一律不适用中国刑法”。判断依据：中国公民境外犯罪原则适用中国刑法；一般公民所犯罪最高刑三年以下的可以不予追究，不是必须不追究。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第7条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"基础","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0005","subject":6,"chapter":"CRI-03","type":"single","prompt":"某损害完全源于行为人不能预见的原因，且不存在故意过失。依法如何评价？","options":["不构成犯罪","结果出现就成立过失犯罪","一律故意犯罪","先判刑再减轻"],"answer":[0],"explanation":"刑法第十六条要求同时审查有无故意过失及不可抗拒、不能预见原因，客观损害本身不足以认定犯罪。","optionAnalysis":["正确。该项表述为“不构成犯罪”。判断依据：刑法第十六条要求同时审查有无故意过失及不可抗拒、不能预见原因，客观损害本身不足以认定犯罪。","错误。该项表述为“结果出现就成立过失犯罪”。判断依据：刑法第十六条要求同时审查有无故意过失及不可抗拒、不能预见原因，客观损害本身不足以认定犯罪。","错误。该项表述为“一律故意犯罪”。判断依据：刑法第十六条要求同时审查有无故意过失及不可抗拒、不能预见原因，客观损害本身不足以认定犯罪。","错误。该项表述为“先判刑再减轻”。判断依据：刑法第十六条要求同时审查有无故意过失及不可抗拒、不能预见原因，客观损害本身不足以认定犯罪。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第16条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"基础","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0006","subject":6,"chapter":"CRI-04","type":"single","prompt":"十五岁甲仅实施普通盗窃，不涉及其他法定严重犯罪。哪项判断准确？","options":["满十四岁即对一切犯罪负责","数额特别大即可绕过年龄规定","监护人同意即可追责","不能仅以盗窃罪追究刑责"],"answer":[3],"explanation":"十四至十六周岁追责范围由第十七条列举限定，普通盗窃不在其中，数额和监护人意见不能替代法定年龄条件。","optionAnalysis":["错误。该项表述为“满十四岁即对一切犯罪负责”。判断依据：十四至十六周岁追责范围由第十七条列举限定，普通盗窃不在其中，数额和监护人意见不能替代法定年龄条件。","错误。该项表述为“数额特别大即可绕过年龄规定”。判断依据：十四至十六周岁追责范围由第十七条列举限定，普通盗窃不在其中，数额和监护人意见不能替代法定年龄条件。","错误。该项表述为“监护人同意即可追责”。判断依据：十四至十六周岁追责范围由第十七条列举限定，普通盗窃不在其中，数额和监护人意见不能替代法定年龄条件。","正确。该项表述为“不能仅以盗窃罪追究刑责”。判断依据：十四至十六周岁追责范围由第十七条列举限定，普通盗窃不在其中，数额和监护人意见不能替代法定年龄条件。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第17条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"基础","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0007","subject":6,"chapter":"CRI-04","type":"single","prompt":"十三岁甲故意杀人致人死亡且情节恶劣。追责还必须具备什么特别程序？","options":["家属同意即可","学校评价即可","最高人民检察院核准追诉","县公安局批准即可"],"answer":[2],"explanation":"十二至十四周岁特例须满足特定罪名、严重结果或手段、情节恶劣并经最高人民检察院核准追诉。","optionAnalysis":["错误。该项表述为“家属同意即可”。判断依据：十二至十四周岁特例须满足特定罪名、严重结果或手段、情节恶劣并经最高人民检察院核准追诉。","错误。该项表述为“学校评价即可”。判断依据：十二至十四周岁特例须满足特定罪名、严重结果或手段、情节恶劣并经最高人民检察院核准追诉。","正确。该项表述为“最高人民检察院核准追诉”。判断依据：十二至十四周岁特例须满足特定罪名、严重结果或手段、情节恶劣并经最高人民检察院核准追诉。","错误。该项表述为“县公安局批准即可”。判断依据：十二至十四周岁特例须满足特定罪名、严重结果或手段、情节恶劣并经最高人民检察院核准追诉。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第17条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"基础","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0008","subject":6,"chapter":"CRI-04","type":"single","prompt":"间歇性精神病人甲在精神正常时犯罪。应如何处理？","options":["由亲属自行确定责任","应负刑事责任","有病史就当然免责","必须免除刑罚"],"answer":[1],"explanation":"刑事责任能力以行为时的辨认和控制能力为核心；间歇性精神病人在精神正常时犯罪应当负责。","optionAnalysis":["错误。该项表述为“由亲属自行确定责任”。判断依据：刑事责任能力以行为时的辨认和控制能力为核心；间歇性精神病人在精神正常时犯罪应当负责。","正确。该项表述为“应负刑事责任”。判断依据：刑事责任能力以行为时的辨认和控制能力为核心；间歇性精神病人在精神正常时犯罪应当负责。","错误。该项表述为“有病史就当然免责”。判断依据：刑事责任能力以行为时的辨认和控制能力为核心；间歇性精神病人在精神正常时犯罪应当负责。","错误。该项表述为“必须免除刑罚”。判断依据：刑事责任能力以行为时的辨认和控制能力为核心；间歇性精神病人在精神正常时犯罪应当负责。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第18条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"基础","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0009","subject":6,"chapter":"CRI-05","type":"single","prompt":"甲预见他人可能死亡，仍抱着死亡也无所谓的态度继续行为并致人死亡，通常体现什么罪过？","options":["间接故意","疏忽大意过失","意外事件","无任何罪过"],"answer":[0],"explanation":"认识危害结果可能发生并予放任可成立间接故意；疏忽大意是应预见而未预见，意外则不具有故意过失。","optionAnalysis":["正确。该项表述为“间接故意”。判断依据：认识危害结果可能发生并予放任可成立间接故意；疏忽大意是应预见而未预见，意外则不具有故意过失。","错误。该项表述为“疏忽大意过失”。判断依据：认识危害结果可能发生并予放任可成立间接故意；疏忽大意是应预见而未预见，意外则不具有故意过失。","错误。该项表述为“意外事件”。判断依据：认识危害结果可能发生并予放任可成立间接故意；疏忽大意是应预见而未预见，意外则不具有故意过失。","错误。该项表述为“无任何罪过”。判断依据：认识危害结果可能发生并予放任可成立间接故意；疏忽大意是应预见而未预见，意外则不具有故意过失。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第14—16条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"基础","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0010","subject":6,"chapter":"CRI-06","type":"single","prompt":"乙正在持刀刺甲要害，甲为制止严重危及人身安全的暴力侵害反击致乙死亡。哪项准确？","options":["造成死亡就必须过当","只有枪械侵害才能反击","甲须先被刺成重伤","符合条件可适用特殊防卫，不因死亡当然过当"],"answer":[3],"explanation":"严重危及人身安全的特定正在进行的暴力犯罪，可适用特殊防卫；既不以防卫人先受重伤为前提，也不以死亡结果一概认定过当。","optionAnalysis":["错误。该项表述为“造成死亡就必须过当”。判断依据：严重危及人身安全的特定正在进行的暴力犯罪，可适用特殊防卫；既不以防卫人先受重伤为前提，也不以死亡结果一概认定过当。","错误。该项表述为“只有枪械侵害才能反击”。判断依据：严重危及人身安全的特定正在进行的暴力犯罪，可适用特殊防卫；既不以防卫人先受重伤为前提，也不以死亡结果一概认定过当。","错误。该项表述为“甲须先被刺成重伤”。判断依据：严重危及人身安全的特定正在进行的暴力犯罪，可适用特殊防卫；既不以防卫人先受重伤为前提，也不以死亡结果一概认定过当。","正确。该项表述为“符合条件可适用特殊防卫，不因死亡当然过当”。判断依据：严重危及人身安全的特定正在进行的暴力犯罪，可适用特殊防卫；既不以防卫人先受重伤为前提，也不以死亡结果一概认定过当。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第20条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"基础","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0011","subject":6,"chapter":"CRI-07","type":"single","prompt":"甲有安全可行的替代方法，却为保护一般财产利益毁坏无关第三人的重大财产。能否仅凭避险目的认定正当？","options":["第三人未受伤即合法","财产利益一律不需要衡量","不能，还须审查不得已和限度","自称避险即合法"],"answer":[2],"explanation":"紧急避险须针对正在发生的危险且属于不得已，并受必要限度约束；存在可行替代方式时不能省略必要性审查。","optionAnalysis":["错误。该项表述为“第三人未受伤即合法”。判断依据：紧急避险须针对正在发生的危险且属于不得已，并受必要限度约束；存在可行替代方式时不能省略必要性审查。","错误。该项表述为“财产利益一律不需要衡量”。判断依据：紧急避险须针对正在发生的危险且属于不得已，并受必要限度约束；存在可行替代方式时不能省略必要性审查。","正确。该项表述为“不能，还须审查不得已和限度”。判断依据：紧急避险须针对正在发生的危险且属于不得已，并受必要限度约束；存在可行替代方式时不能省略必要性审查。","错误。该项表述为“自称避险即合法”。判断依据：紧急避险须针对正在发生的危险且属于不得已，并受必要限度约束；存在可行替代方式时不能省略必要性审查。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第21条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"基础","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0012","subject":6,"chapter":"CRI-08","type":"single","prompt":"甲已经着手杀乙，因枪械意外故障而未得逞，其他条件具备。属于何种形态？","options":["当然无罪","犯罪未遂","犯罪中止","犯罪预备"],"answer":[1],"explanation":"已着手但因意志以外原因未得逞属于未遂；器械故障并非自动放弃，已经着手也不同于准备工具。","optionAnalysis":["错误。该项表述为“当然无罪”。判断依据：已着手但因意志以外原因未得逞属于未遂；器械故障并非自动放弃，已经着手也不同于准备工具。","正确。该项表述为“犯罪未遂”。判断依据：已着手但因意志以外原因未得逞属于未遂；器械故障并非自动放弃，已经着手也不同于准备工具。","错误。该项表述为“犯罪中止”。判断依据：已着手但因意志以外原因未得逞属于未遂；器械故障并非自动放弃，已经着手也不同于准备工具。","错误。该项表述为“犯罪预备”。判断依据：已着手但因意志以外原因未得逞属于未遂；器械故障并非自动放弃，已经着手也不同于准备工具。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第23条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"基础","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0013","subject":6,"chapter":"CRI-08","type":"single","prompt":"甲自动有效救回被其投毒的乙，杀人行为成立中止，但已造成身体损害。依法应怎样处罚？","options":["应当减轻处罚","必须免除处罚","必须从重处罚","一律按既遂处罚"],"answer":[0],"explanation":"中止没有造成损害的应当免除，造成损害的应当减轻；阻止死亡不等于没有造成任何损害。","optionAnalysis":["正确。该项表述为“应当减轻处罚”。判断依据：中止没有造成损害的应当免除，造成损害的应当减轻；阻止死亡不等于没有造成任何损害。","错误。该项表述为“必须免除处罚”。判断依据：中止没有造成损害的应当免除，造成损害的应当减轻；阻止死亡不等于没有造成任何损害。","错误。该项表述为“必须从重处罚”。判断依据：中止没有造成损害的应当免除，造成损害的应当减轻；阻止死亡不等于没有造成任何损害。","错误。该项表述为“一律按既遂处罚”。判断依据：中止没有造成损害的应当免除，造成损害的应当减轻；阻止死亡不等于没有造成任何损害。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第24条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"基础","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0014","subject":6,"chapter":"CRI-09","type":"single","prompt":"共同犯罪中甲仅起次要辅助作用，依法认定为从犯。法定处罚规则是？","options":["可以无视从犯因素","必须一律免刑","只能从轻，不能减轻","应当从轻、减轻或免除"],"answer":[3],"explanation":"第27条对从犯规定应当从宽，三种方式为从轻、减轻或者免除，不是每一从犯都必然免刑。","optionAnalysis":["错误。该项表述为“可以无视从犯因素”。判断依据：第27条对从犯规定应当从宽，三种方式为从轻、减轻或者免除，不是每一从犯都必然免刑。","错误。该项表述为“必须一律免刑”。判断依据：第27条对从犯规定应当从宽，三种方式为从轻、减轻或者免除，不是每一从犯都必然免刑。","错误。该项表述为“只能从轻，不能减轻”。判断依据：第27条对从犯规定应当从宽，三种方式为从轻、减轻或者免除，不是每一从犯都必然免刑。","正确。该项表述为“应当从轻、减轻或免除”。判断依据：第27条对从犯规定应当从宽，三种方式为从轻、减轻或者免除，不是每一从犯都必然免刑。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第27条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"基础","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0015","subject":6,"chapter":"CRI-10","type":"single","prompt":"某罪法律未规定单位犯罪形态。能否仅以行为使用公司名义追究公司刑责？","options":["有公章即当然构成","员工多即当然构成","不能，须有单位犯罪明文依据","所有罪均可构成单位犯罪"],"answer":[2],"explanation":"单位犯罪须有法律明文依据，单位名义、公章和员工人数不能取代法定入罪条件。","optionAnalysis":["错误。该项表述为“有公章即当然构成”。判断依据：单位犯罪须有法律明文依据，单位名义、公章和员工人数不能取代法定入罪条件。","错误。该项表述为“员工多即当然构成”。判断依据：单位犯罪须有法律明文依据，单位名义、公章和员工人数不能取代法定入罪条件。","正确。该项表述为“不能，须有单位犯罪明文依据”。判断依据：单位犯罪须有法律明文依据，单位名义、公章和员工人数不能取代法定入罪条件。","错误。该项表述为“所有罪均可构成单位犯罪”。判断依据：单位犯罪须有法律明文依据，单位名义、公章和员工人数不能取代法定入罪条件。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第30条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"基础","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0016","subject":6,"chapter":"CRI-02","type":"multiple","prompt":"关于刑法空间效力，哪些说法正确？","options":["经外国审判后我国一律不得追责","行为或结果一项在境内可构成属地连接","我国船舶内犯罪也适用我国刑法","外交豁免人员一律由普通地方法院直接处理"],"answer":[1,2],"explanation":"第六条规定属地与船舶航空器规则；第十条允许在外国审判后依法追责并考虑已受刑罚；第十一条规定外交途径。","optionAnalysis":["错误。该项表述为“经外国审判后我国一律不得追责”。判断依据：第六条规定属地与船舶航空器规则；第十条允许在外国审判后依法追责并考虑已受刑罚；第十一条规定外交途径。","正确。该项表述为“行为或结果一项在境内可构成属地连接”。判断依据：第六条规定属地与船舶航空器规则；第十条允许在外国审判后依法追责并考虑已受刑罚；第十一条规定外交途径。","正确。该项表述为“我国船舶内犯罪也适用我国刑法”。判断依据：第六条规定属地与船舶航空器规则；第十条允许在外国审判后依法追责并考虑已受刑罚；第十一条规定外交途径。","错误。该项表述为“外交豁免人员一律由普通地方法院直接处理”。判断依据：第六条规定属地与船舶航空器规则；第十条允许在外国审判后依法追责并考虑已受刑罚；第十一条规定外交途径。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第6、10、11条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"进阶","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0017","subject":6,"chapter":"CRI-04","type":"multiple","prompt":"哪些特殊人群规则准确？","options":["醉酒犯罪应负刑责","尚未完全丧失辨认控制能力者可以从轻或减轻","又聋又哑者犯罪一律无罪","盲人犯罪必须免除处罚"],"answer":[0,1],"explanation":"第十八条区分醉酒与限制责任能力；第十九条对又聋又哑或盲人规定可以从轻、减轻或者免除，不是当然无罪或必须免刑。","optionAnalysis":["正确。该项表述为“醉酒犯罪应负刑责”。判断依据：第十八条区分醉酒与限制责任能力；第十九条对又聋又哑或盲人规定可以从轻、减轻或者免除，不是当然无罪或必须免刑。","正确。该项表述为“尚未完全丧失辨认控制能力者可以从轻或减轻”。判断依据：第十八条区分醉酒与限制责任能力；第十九条对又聋又哑或盲人规定可以从轻、减轻或者免除，不是当然无罪或必须免刑。","错误。该项表述为“又聋又哑者犯罪一律无罪”。判断依据：第十八条区分醉酒与限制责任能力；第十九条对又聋又哑或盲人规定可以从轻、减轻或者免除，不是当然无罪或必须免刑。","错误。该项表述为“盲人犯罪必须免除处罚”。判断依据：第十八条区分醉酒与限制责任能力；第十九条对又聋又哑或盲人规定可以从轻、减轻或者免除，不是当然无罪或必须免刑。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第18、19条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"进阶","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0018","subject":6,"chapter":"CRI-04","type":"multiple","prompt":"已满七十五周岁者犯罪，哪些说法准确？","options":["过失犯罪应当从轻或减轻","故意犯罪一律免责","过失犯罪只能从重","故意犯罪可以从轻或减轻"],"answer":[0,3],"explanation":"第十七条之一对故意犯罪使用可以从宽，对过失犯罪使用应当从宽；均不能改写为一律不成立犯罪。","optionAnalysis":["正确。该项表述为“过失犯罪应当从轻或减轻”。判断依据：第十七条之一对故意犯罪使用可以从宽，对过失犯罪使用应当从宽；均不能改写为一律不成立犯罪。","错误。该项表述为“故意犯罪一律免责”。判断依据：第十七条之一对故意犯罪使用可以从宽，对过失犯罪使用应当从宽；均不能改写为一律不成立犯罪。","错误。该项表述为“过失犯罪只能从重”。判断依据：第十七条之一对故意犯罪使用可以从宽，对过失犯罪使用应当从宽；均不能改写为一律不成立犯罪。","正确。该项表述为“故意犯罪可以从轻或减轻”。判断依据：第十七条之一对故意犯罪使用可以从宽，对过失犯罪使用应当从宽；均不能改写为一律不成立犯罪。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第17条之一条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"进阶","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0019","subject":6,"chapter":"CRI-06","type":"multiple","prompt":"认定普通防卫过当，哪些要素不能省略？","options":["侵害人一受伤就当然成立","防卫人事前准备工具就当然成立","明显超过必要限度","造成重大损害"],"answer":[2,3],"explanation":"普通防卫过当要求明显超过必要限度并造成重大损害；一般受伤或事先准备工具不能单独决定过当。","optionAnalysis":["错误。该项表述为“侵害人一受伤就当然成立”。判断依据：普通防卫过当要求明显超过必要限度并造成重大损害；一般受伤或事先准备工具不能单独决定过当。","错误。该项表述为“防卫人事前准备工具就当然成立”。判断依据：普通防卫过当要求明显超过必要限度并造成重大损害；一般受伤或事先准备工具不能单独决定过当。","正确。该项表述为“明显超过必要限度”。判断依据：普通防卫过当要求明显超过必要限度并造成重大损害；一般受伤或事先准备工具不能单独决定过当。","正确。该项表述为“造成重大损害”。判断依据：普通防卫过当要求明显超过必要限度并造成重大损害；一般受伤或事先准备工具不能单独决定过当。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第20条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"进阶","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0020","subject":6,"chapter":"CRI-07","type":"multiple","prompt":"关于紧急避险的明文条件，哪些准确？","options":["超限后一律禁止减免处罚","危险正在发生","不得已采取避险行为","特定职责人员避免本人危险一律无任何限制"],"answer":[1,2],"explanation":"第21条规定现实危险、不得已和必要限度，并对特定职责人员避免本人危险设限制；超限依法应减轻或免除。","optionAnalysis":["错误。该项表述为“超限后一律禁止减免处罚”。判断依据：第21条规定现实危险、不得已和必要限度，并对特定职责人员避免本人危险设限制；超限依法应减轻或免除。","正确。该项表述为“危险正在发生”。判断依据：第21条规定现实危险、不得已和必要限度，并对特定职责人员避免本人危险设限制；超限依法应减轻或免除。","正确。该项表述为“不得已采取避险行为”。判断依据：第21条规定现实危险、不得已和必要限度，并对特定职责人员避免本人危险设限制；超限依法应减轻或免除。","错误。该项表述为“特定职责人员避免本人危险一律无任何限制”。判断依据：第21条规定现实危险、不得已和必要限度，并对特定职责人员避免本人危险设限制；超限依法应减轻或免除。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第21条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"进阶","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0021","subject":6,"chapter":"CRI-08","type":"multiple","prompt":"哪些犯罪阶段处罚表述准确？","options":["预备犯可以比照既遂免除处罚","未遂犯可以比照既遂从轻或减轻","未遂只要没得逞一律免刑","中止未造成损害应当免除"],"answer":[0,1,3],"explanation":"第22至24条分别规定预备、未遂、中止从宽规则，未遂一般法定方式不包括仅因未遂即一律免刑。","optionAnalysis":["正确。该项表述为“预备犯可以比照既遂免除处罚”。判断依据：第22至24条分别规定预备、未遂、中止从宽规则，未遂一般法定方式不包括仅因未遂即一律免刑。","正确。该项表述为“未遂犯可以比照既遂从轻或减轻”。判断依据：第22至24条分别规定预备、未遂、中止从宽规则，未遂一般法定方式不包括仅因未遂即一律免刑。","错误。该项表述为“未遂只要没得逞一律免刑”。判断依据：第22至24条分别规定预备、未遂、中止从宽规则，未遂一般法定方式不包括仅因未遂即一律免刑。","正确。该项表述为“中止未造成损害应当免除”。判断依据：第22至24条分别规定预备、未遂、中止从宽规则，未遂一般法定方式不包括仅因未遂即一律免刑。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第22—24条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"进阶","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0022","subject":6,"chapter":"CRI-09","type":"multiple","prompt":"关于共同犯罪，哪些准确？","options":["共同过失不以共同犯罪论处","同时在场必然是共犯","各人必须亲自实施全部实行行为","以共同故意为基础"],"answer":[0,3],"explanation":"共同犯罪要求共同故意；共同过失分别按各自罪行处罚。分工可以包括教唆、帮助，不以每人亲手实施全部行为为必要。","optionAnalysis":["正确。该项表述为“共同过失不以共同犯罪论处”。判断依据：共同犯罪要求共同故意；共同过失分别按各自罪行处罚。分工可以包括教唆、帮助，不以每人亲手实施全部行为为必要。","错误。该项表述为“同时在场必然是共犯”。判断依据：共同犯罪要求共同故意；共同过失分别按各自罪行处罚。分工可以包括教唆、帮助，不以每人亲手实施全部行为为必要。","错误。该项表述为“各人必须亲自实施全部实行行为”。判断依据：共同犯罪要求共同故意；共同过失分别按各自罪行处罚。分工可以包括教唆、帮助，不以每人亲手实施全部行为为必要。","正确。该项表述为“以共同故意为基础”。判断依据：共同犯罪要求共同故意；共同过失分别按各自罪行处罚。分工可以包括教唆、帮助，不以每人亲手实施全部行为为必要。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第25—29条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"进阶","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0023","subject":6,"chapter":"CRI-09","type":"multiple","prompt":"关于教唆犯，哪些准确？","options":["被教唆人未犯该罪，教唆者一律无罪","没到犯罪现场就绝不负责","按其所起作用处罚","教唆不满十八周岁者犯罪应从重"],"answer":[2,3],"explanation":"第29条明确作用评价与教唆未成年人从重；被教唆者未犯该罪时教唆者可以从轻或减轻，不是当然无罪。","optionAnalysis":["错误。该项表述为“被教唆人未犯该罪，教唆者一律无罪”。判断依据：第29条明确作用评价与教唆未成年人从重；被教唆者未犯该罪时教唆者可以从轻或减轻，不是当然无罪。","错误。该项表述为“没到犯罪现场就绝不负责”。判断依据：第29条明确作用评价与教唆未成年人从重；被教唆者未犯该罪时教唆者可以从轻或减轻，不是当然无罪。","正确。该项表述为“按其所起作用处罚”。判断依据：第29条明确作用评价与教唆未成年人从重；被教唆者未犯该罪时教唆者可以从轻或减轻，不是当然无罪。","正确。该项表述为“教唆不满十八周岁者犯罪应从重”。判断依据：第29条明确作用评价与教唆未成年人从重；被教唆者未犯该罪时教唆者可以从轻或减轻，不是当然无罪。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第29条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"进阶","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0024","subject":6,"chapter":"CRI-10","type":"multiple","prompt":"单位犯罪的通常处罚结构有哪些？","options":["有特别规定时应核对特别规定","对单位判罚金","处罚直接负责主管人员和其他直接责任人员","只处罚普通员工"],"answer":[0,1,2],"explanation":"第31条通常采用单位罚金加责任人员刑罚的结构，并明确特别规定从其规定；不是对所有员工一概追责。","optionAnalysis":["正确。该项表述为“有特别规定时应核对特别规定”。判断依据：第31条通常采用单位罚金加责任人员刑罚的结构，并明确特别规定从其规定；不是对所有员工一概追责。","正确。该项表述为“对单位判罚金”。判断依据：第31条通常采用单位罚金加责任人员刑罚的结构，并明确特别规定从其规定；不是对所有员工一概追责。","正确。该项表述为“处罚直接负责主管人员和其他直接责任人员”。判断依据：第31条通常采用单位罚金加责任人员刑罚的结构，并明确特别规定从其规定；不是对所有员工一概追责。","错误。该项表述为“只处罚普通员工”。判断依据：第31条通常采用单位罚金加责任人员刑罚的结构，并明确特别规定从其规定；不是对所有员工一概追责。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第31条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"进阶","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0025","subject":6,"chapter":"CRI-01","type":"multiple","prompt":"关于平等适用与罪责刑相适应，哪些准确？","options":["任何人不得有超越法律的特权","刑罚轻重须与罪行和责任相适应","所有故意犯罪须判相同刑期","地位高就无需审查构成要件"],"answer":[0,1],"explanation":"第4、5条要求平等与责任相适应；依法考虑不同犯罪和责任情节，不是任意特权，也不是机械相同刑期。","optionAnalysis":["正确。该项表述为“任何人不得有超越法律的特权”。判断依据：第4、5条要求平等与责任相适应；依法考虑不同犯罪和责任情节，不是任意特权，也不是机械相同刑期。","正确。该项表述为“刑罚轻重须与罪行和责任相适应”。判断依据：第4、5条要求平等与责任相适应；依法考虑不同犯罪和责任情节，不是任意特权，也不是机械相同刑期。","错误。该项表述为“所有故意犯罪须判相同刑期”。判断依据：第4、5条要求平等与责任相适应；依法考虑不同犯罪和责任情节，不是任意特权，也不是机械相同刑期。","错误。该项表述为“地位高就无需审查构成要件”。判断依据：第4、5条要求平等与责任相适应；依法考虑不同犯罪和责任情节，不是任意特权，也不是机械相同刑期。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第4、5条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"进阶","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0026","subject":6,"chapter":"CRI-03","type":"multiple","prompt":"关于犯罪概念与主观罪过，哪些准确？","options":["过失犯罪须法律有明文规定","有损害结果就必定犯罪","所有情节轻微案件都不构成犯罪","显著轻微危害不大的不认为犯罪"],"answer":[0,3],"explanation":"第13条但书要求显著轻微且危害不大；第15条限制过失犯罪，客观损害不能代替罪过，普通情节轻微不等于不成立犯罪。","optionAnalysis":["正确。该项表述为“过失犯罪须法律有明文规定”。判断依据：第13条但书要求显著轻微且危害不大；第15条限制过失犯罪，客观损害不能代替罪过，普通情节轻微不等于不成立犯罪。","错误。该项表述为“有损害结果就必定犯罪”。判断依据：第13条但书要求显著轻微且危害不大；第15条限制过失犯罪，客观损害不能代替罪过，普通情节轻微不等于不成立犯罪。","错误。该项表述为“所有情节轻微案件都不构成犯罪”。判断依据：第13条但书要求显著轻微且危害不大；第15条限制过失犯罪，客观损害不能代替罪过，普通情节轻微不等于不成立犯罪。","正确。该项表述为“显著轻微危害不大的不认为犯罪”。判断依据：第13条但书要求显著轻微且危害不大；第15条限制过失犯罪，客观损害不能代替罪过，普通情节轻微不等于不成立犯罪。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第13—16条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"进阶","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0027","subject":6,"chapter":"CRI-05","type":"multiple","prompt":"关于罪过的判断，哪些准确？","options":["预见结果就绝不可能属于过失","疏忽大意过失是应预见而未预见","希望结果发生可属故意","放任结果发生可属故意"],"answer":[1,2,3],"explanation":"故意包含希望、放任；过于自信过失属于已预见而轻信避免，故不能仅凭是否预见划界。","optionAnalysis":["错误。该项表述为“预见结果就绝不可能属于过失”。判断依据：故意包含希望、放任；过于自信过失属于已预见而轻信避免，故不能仅凭是否预见划界。","正确。该项表述为“疏忽大意过失是应预见而未预见”。判断依据：故意包含希望、放任；过于自信过失属于已预见而轻信避免，故不能仅凭是否预见划界。","正确。该项表述为“希望结果发生可属故意”。判断依据：故意包含希望、放任；过于自信过失属于已预见而轻信避免，故不能仅凭是否预见划界。","正确。该项表述为“放任结果发生可属故意”。判断依据：故意包含希望、放任；过于自信过失属于已预见而轻信避免，故不能仅凭是否预见划界。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第14、15条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"进阶","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0028","subject":6,"chapter":"CRI-08","type":"indefinite","prompt":"甲为杀乙购买毒药，尚未投毒即因警方查获而停止。按题设哪些判断成立？","options":["警方制止当然属于自动中止","应先从犯罪预备方向审查","尚未着手不符合未遂的着手条件","未死亡就必然无罪"],"answer":[1,2],"explanation":"购买毒药准备犯罪可属预备，未遂需已着手，外力制止不等于自动放弃；最终责任仍须结合具体犯罪条件。","optionAnalysis":["错误。该项表述为“警方制止当然属于自动中止”。判断依据：购买毒药准备犯罪可属预备，未遂需已着手，外力制止不等于自动放弃；最终责任仍须结合具体犯罪条件。","正确。该项表述为“应先从犯罪预备方向审查”。判断依据：购买毒药准备犯罪可属预备，未遂需已着手，外力制止不等于自动放弃；最终责任仍须结合具体犯罪条件。","正确。该项表述为“尚未着手不符合未遂的着手条件”。判断依据：购买毒药准备犯罪可属预备，未遂需已着手，外力制止不等于自动放弃；最终责任仍须结合具体犯罪条件。","错误。该项表述为“未死亡就必然无罪”。判断依据：购买毒药准备犯罪可属预备，未遂需已着手，外力制止不等于自动放弃；最终责任仍须结合具体犯罪条件。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第22—24条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"进阶","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0029","subject":6,"chapter":"CRI-06","type":"indefinite","prompt":"乙已被缴械并牢固控制，明显失去继续侵害能力，甲为报复另行刺杀乙。哪些判断成立？","options":["后段报复须独立审查","不能凭此前受侵害就认定全程防卫","最初受侵害后任何加害都合法","侵害结束后仍可无限制特殊防卫"],"answer":[0,1],"explanation":"防卫要求侵害正在进行且目的在制止；明确结束后为报复另行加害，应分段评价，而不能无限延长防卫权。","optionAnalysis":["正确。该项表述为“后段报复须独立审查”。判断依据：防卫要求侵害正在进行且目的在制止；明确结束后为报复另行加害，应分段评价，而不能无限延长防卫权。","正确。该项表述为“不能凭此前受侵害就认定全程防卫”。判断依据：防卫要求侵害正在进行且目的在制止；明确结束后为报复另行加害，应分段评价，而不能无限延长防卫权。","错误。该项表述为“最初受侵害后任何加害都合法”。判断依据：防卫要求侵害正在进行且目的在制止；明确结束后为报复另行加害，应分段评价，而不能无限延长防卫权。","错误。该项表述为“侵害结束后仍可无限制特殊防卫”。判断依据：防卫要求侵害正在进行且目的在制止；明确结束后为报复另行加害，应分段评价，而不能无限延长防卫权。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第20条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"进阶","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRI-0030","subject":6,"chapter":"CRI-10","type":"indefinite","prompt":"单位犯罪中公司受罚金，甲依法被认定为直接负责主管人员。哪些说法准确？","options":["单位受罚不当然免除甲责任","公司受罚后所有员工必定有罪","甲的直接责任仍须依法证明","可同时追究单位和直接负责人员"],"answer":[0,2,3],"explanation":"第31条允许通常双罚，但人员责任仍须证明其职责、参与和犯罪构成，不能对所有员工推定有罪。","optionAnalysis":["正确。该项表述为“单位受罚不当然免除甲责任”。判断依据：第31条允许通常双罚，但人员责任仍须证明其职责、参与和犯罪构成，不能对所有员工推定有罪。","错误。该项表述为“公司受罚后所有员工必定有罪”。判断依据：第31条允许通常双罚，但人员责任仍须证明其职责、参与和犯罪构成，不能对所有员工推定有罪。","正确。该项表述为“甲的直接责任仍须依法证明”。判断依据：第31条允许通常双罚，但人员责任仍须证明其职责、参与和犯罪构成，不能对所有员工推定有罪。","正确。该项表述为“可同时追究单位和直接负责人员”。判断依据：第31条允许通常双罚，但人员责任仍须证明其职责、参与和犯罪构成，不能对所有员工推定有罪。"],"basis":[{"title":"中华人民共和国刑法","url":"https://fgk.chinatax.gov.cn/zcfgk/c100009/c5212248/content.html","article":"第30、31条","effectiveDate":"2024-03-01（修正案十二相关条文）"}],"difficulty":"进阶","tags":["刑法总则","要件审查"],"reviewStatus":"source-checked"},{"id":"CRP-0001","subject":7,"chapter":"CRP-01","type":"single","prompt":"公安机关侦查结束并宣布“已抓获真凶”，但法院尚未判决。关于甲的诉讼地位，下列哪项正确？","options":["公安的宣布已产生有罪裁判效力","逮捕等于法院确认甲构成犯罪","未经法院依法判决，不得确定甲有罪","甲必须先证明无罪才能获得辩护"],"answer":[2],"explanation":"追诉机关的判断、强制措施和司法定罪是三个不同层次。即便侦查证据较多，仍须经过法定审判，由法院依法判决。","optionAnalysis":["侦查结论和新闻表述不具有定罪裁判效力。","逮捕只是诉讼强制措施，不能替代定罪。","刑诉法将最终定罪权配置给法院依法行使。","辩护权不以证明自己无罪为前提。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第12条"}],"difficulty":"基础","tags":["CRP-01"],"reviewStatus":"source-checked"},{"id":"CRP-0002","subject":7,"chapter":"CRP-01","type":"single","prompt":"县政府要求法院按政府协调会结论判处乙有罪。法院应如何处理？","options":["按协调会结论直接宣判","依法独立行使审判权，审查事实和法律","请县政府代为签发判决书","只要乙认罪就无需审查证据"],"answer":[1],"explanation":"法院独立行使审判权是机关依法履职的要求。协调机制不能突破法定职权，更不能将实体裁判交给行政机关决定。","optionAnalysis":["行政机关的意见不能代替法院依法审判。","刑诉法第5条排除行政机关对依法审判的干涉。","判决权属于法院而非县政府。","认罪不免除查明事实和审查证据的义务。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第5、55条"}],"difficulty":"基础","tags":["CRP-01"],"reviewStatus":"source-checked"},{"id":"CRP-0003","subject":7,"chapter":"CRP-01","type":"multiple","prompt":"下列关于公检法职权的表述，哪些正确？","options":["公安机关依法负责一般刑事案件侦查","检察院依法履行批准逮捕和提起公诉职能","法院依法负责刑事审判","任何行政部门均可自行签发刑事判决"],"answer":[0,1,2],"explanation":"刑事职权实行法定配置。应区分批准、决定与执行，也应保留国家安全机关等法律特别规定的职能。","optionAnalysis":["这是刑诉法规定的基本分工，法律特别规定除外。","批准逮捕、公诉属于检察机关法定职能。","审判权由法院依法行使。","行政机关不享有刑事审判权。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第3条"}],"difficulty":"基础","tags":["CRP-01"],"reviewStatus":"source-checked"},{"id":"CRP-0004","subject":7,"chapter":"CRP-01","type":"multiple","prompt":"检察院审查发现被追诉行为情节显著轻微、危害不大，不认为是犯罪。下列认识哪些正确？","options":["属于法定不追究刑事责任情形","可以只为保持立案结论而继续起诉","应结合审查起诉阶段依法作出相应处理","必须等待法院先判处有期徒刑再处理"],"answer":[0,2],"explanation":"显著轻微不认为犯罪不同于犯罪成立但情节轻微可以酌定不起诉。前者是法定不追诉，应依诉讼阶段处理。","optionAnalysis":["符合刑诉法第16条第一项。","既有立案或侦查结论不能消灭法定不追诉义务。","程序出口须与发现阶段对应。","法定不追诉不能以先判刑为条件。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2025/art_48b3b0c3f954448e996602a71fc6f878.html","effectiveDate":"2018-10-26","article":"第16条"}],"difficulty":"基础","tags":["CRP-01"],"reviewStatus":"source-checked"},{"id":"CRP-0005","subject":7,"chapter":"CRP-01","type":"single","prompt":"对于已经过追诉时效、依法不再追诉的案件，下列哪项错误？","options":["属于法定不追究刑事责任情形","发现阶段不同，程序处理方式可能不同","可以仅因舆论关注而不适用追诉时效","应核对有无刑法关于时效的特别规定"],"answer":[2],"explanation":"题干已明确依法不再追诉，因此不能以舆论强烈恢复追诉。真实案件还需先判断时效起算、中断及不受限制等实体规则。","optionAnalysis":["刑诉法第16条列明追诉时效届满情形。","撤案、不起诉、终止审理等要依法匹配。","舆论热度不是突破法定时效规则的理由。","是否超过时效须按刑法规则准确判断。"],"basis":[{"title":"中华人民共和国刑事诉讼法（2018年修正）","url":"https://www.samr
